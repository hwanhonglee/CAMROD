# Inflation cost-grid parameters are grouped as:
#   1) output topic and frames, 2) grid geometry and window,
#   3) cost model, 4) runtime, 5) input topics and staleness.
/sensing/inflation_cost_grid:
  ros__parameters:
    # =========================================================================
    # 1. OUTPUT TOPIC AND FRAMES
    # =========================================================================
    output_topic: "/planning/cost_grid/inflation"
    base_frame_id: "robot_center_link"
    output_frame_id: "map"

    # =========================================================================
    # 2. GRID GEOMETRY AND WINDOW
    # =========================================================================
    # HH_260702 - Keep the output map-axis aligned for Nav2/gate consumers, but
    # preserve enough forward dynamic cost for early avoidance release checks.
    resolution: 0.10
    width: 180
    height: 180
    origin_x: -9.0
    origin_y: -9.0
    enable_robot_frame_window: true
    forward_extent_m: 8.0
    rear_extent_m: 1.5
    side_extent_m: 2.2

    # =========================================================================
    # 3. COST MODEL
    # =========================================================================
    # Cost model
    free_value: 0
    # HH_260703 - Static guide costs are cleared inside the footprint, but live
    # radar costs stay visible so side/rear safety stops are not erased.
    ego_clear_radius_m: 0.50

    # =========================================================================
    # 4. RUNTIME
    # =========================================================================
    # Runtime
    # HH_260618: Match Nav2 local-costmap cadence; 10 Hz was redundant for a 6 Hz consumer.
    publish_rate_hz: 6.0
    # HH_260707: Reuse cached merged grids for small pose changes.
    # 0.0 republishes cached output every timer tick, preserving diagnostic Hz.
    rebuild_min_pose_delta_m: 0.05
    rebuild_min_yaw_delta_rad: 0.03
    cached_republish_period_s: 0.0

    # =========================================================================
    # 5. INPUT TOPICS AND STALENESS
    # =========================================================================
    # HH_260424: Inputs merged cell-wise (max). Order doesn't matter.
    #   lanelet:      lanelet centerline gradient (0=center, 35=in-lane, 99=off-lane)
    #   radar:        sensor obstacle costs (0=free, up to 95=obstacle)
    #   global_path:  route-strip bias (low on active path ~10-40, high outside ~80)
    # HH_260807 - LiDAR is intentionally not an input to the production cost
    # grid. Camera perception remains diagnostic; radar owns near-field cost.
    input_topics:
      - "/map/cost_grid/lanelet"
      - "/sensing/cost_grid/radar"
      - "/planning/cost_grid/global_path"

    # HH_260422: Per-input staleness limit. lanelet/global_path update slowly;
    #   sensor grids update at ~10-20 Hz. Must match order of input_topics above.
    input_max_ages_s:
      - 5.0    # lanelet: static map, rarely changes
      - 0.50   # radar cost_grid
      - 10.0   # global_path: infrequent replanning
    max_message_age_s: 1.50
