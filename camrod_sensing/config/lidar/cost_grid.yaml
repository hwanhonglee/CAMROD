/sensing/lidar/lidar_cost_grid:
  ros__parameters:
    # HH_260723 - Raw/preprocessed LiDAR points do not directly
    # create cost. Keep this compatibility grid topic as the rasterizer for
    # camera+LiDAR perception results only; radar remains a separate input.
    input_topic: "/perception/obstacles"
    input_topics:
      - "/perception/obstacles"
    # HH_260723 - Set this explicit switch true and restart to add the two filtered
    # LiDAR clouds below without changing perception or radar cost inputs.
    raw_lidar_cost_enabled: false
    raw_lidar_input_topics:
      - "/sensing/lidar/points_filtered"
      - "/sensing/lidar/filtered_cloud"
    perception_marker_topics:
      - "/perception/camera_lidar/markers"
    output_topic: "/sensing/cost_grid/lidar"
    base_frame_id: "robot_base_link"
    output_frame_id: "map"

    # Grid geometry
    # HH_260702 - Keep dynamic obstacles visible far enough ahead for route
    # replanning before cmd_vel hard-stop range. 18 m square at 0.10 m keeps
    # the CPU cost close to the previous 150x150@0.08 profile while extending
    # reliable forward coverage beyond the obstacle monitor lookahead.
    resolution: 0.10
    width: 180
    height: 180
    origin_x: -9.0
    origin_y: -9.0

    # Cost model
    free_value: 0
    unknown_value: -1
    # HH_260702 - LiDAR cells should be visible to Nav2/replan across the full
    # lookahead, while cmd_vel hard-stop still uses the higher 85+ threshold.
    min_cost: 65
    max_cost: 95
    cost_range_min_m: 0.4
    cost_range_max_m: 9.0
    obstacle_radius_m: 0.20
    # HH_260707 - Reject road-level fallback points; vehicle/body returns above
    # this height still become dynamic cost.
    cloud_min_z_m: -0.55
    cloud_max_z_m: 1.00
    perception_marker_cost: 90
    # HH_260707 - Keep camera/LiDAR object cost visible to planning without
    # restoring the oversized lane-wide marker disks seen during field tests.
    perception_marker_min_radius_m: 0.35
    perception_marker_max_radius_m: 0.75
    perception_marker_radius_scale: 0.35
    # HH_260630: Keep ego clearing close to the vehicle half-width so side/rear
    # LiDAR obstacles just outside the body are not erased before safety gating.
    ego_clear_radius_m: 0.55

    # HH_260720 - Keep dynamic cost only inside the active route lanelets plus
    # this metric margin. Fail open during startup and intentional off-route maneuvers.
    route_lanelet_filter_enable: true
    route_lanelet_mask_topic: "/map/cost_grid/route_lanelet_mask"
    route_lanelet_margin_m: 0.35
    route_lanelet_allowed_max_cost: 50
    route_lanelet_mask_max_age_s: 2.5
    route_lanelet_filter_fail_open_when_robot_outside: true

    # Runtime
    # HH_260702 - Keep LiDAR/perception objects alive through brief CPU-load
    # stalls so the grid does not flicker empty between 6 Hz filtered frames.
    max_message_age_s: 1.50
    publish_rate_hz: 10.0
    # HH_260707: Keep the 10 Hz output fresh, but reuse the last built grid
    # while inputs and rolling-grid origin remain effectively unchanged.
    rebuild_min_pose_delta_m: 0.05
    publish_lidar_status: false
    lidar_status_topic: "/sensing/lidar/status"
