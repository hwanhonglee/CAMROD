/sensing/lidar_preprocessor:
  ros__parameters:
    # Topics
    input_topic: "/sensing/lidar/vanjee/points_raw"
    filtered_topic: "/sensing/lidar/points_filtered"
    lidar_status_topic: "/sensing/lidar/status"
    publish_lidar_status: false

    # Range and height limits
    min_range: 0.3
    max_range: 35.0
    min_z: -1.0
    max_z: 2.0

    # HH_260513: Corrected param names to match code (ground_filter_mode → method, etc.).
    # Mismatched names caused code to fall back to default "ransac" → PCL RANSAC errors.
    method: "z"
    z_min: -0.25
    z_max: 0.25

    # Output stamping and frame
    stamp_with_now: true
    frame_id_override: "lidar_link"
    publish_filtered: true
