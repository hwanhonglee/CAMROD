common:
  msg_source: 1                                   # 0: not use lidar
                                                  # 1: online lidar
                                                  # 2: pcap replay
  send_point_cloud_ros: true                      # publish PointCloud2 to ROS
  send_imu_packet_ros: false                      # not used on 750
  send_packet_ros: false                          # raw packet forwarding (unused)
lidar:
  - driver:
      lidar_type: vanjee_750                        # WLR-750C model (750C uses vanjee_750 driver type with 750C calibration CSVs)
      connect_type: 1                               # 1: UDP
      host_msop_port: 3002                          # host receive port (750 uses 3002, 722 used 3001)
      lidar_msop_port: 3333                         # lidar send port
      start_angle: 280                              # FOV start angle
      end_angle: 80                                 # FOV end angle
      wait_for_difop: false                         # 750 does not require difop calibration wait
      min_distance: 0.01                            # min point distance (m)
      max_distance: 30                              # max point distance (m)
      # HH_260415: Use host ROS clock to avoid TF extrapolation caused by sensor-clock skew.
      # HH_260527: use_lidar_clock options:
      #   true: use LiDAR device clock for message stamp
      #   false: use host ROS clock (recommended for TF sync stability)
      use_lidar_clock: false
      pcap_path:
      pcap_repeat: true
      pcap_rate: 1
      # 750C requires calibration CSV files for accurate point cloud geometry.
      # angle_path_ver/hor are resolved at launch time from vanjee_lidar_sdk share directory.
      # See lidar_driver.launch.py — do not edit paths here directly.
      config_from_file: true
      angle_path_ver: "/home/nvidia/camrod_peception_val_ws/install/vanjee_lidar_sdk/share/vanjee_lidar_sdk/param/Vanjee_750C_VA.csv"
      angle_path_hor: "/home/nvidia/camrod_peception_val_ws/install/vanjee_lidar_sdk/share/vanjee_lidar_sdk/param/Vanjee_750C_HA.csv"
      imu_param_path:
      dense_points: false
      ts_first_point: true
      # HH_260527: use_offset_timestamp options:
      #   true: per-point timestamp is relative offset from packet/header time
      #   false: per-point timestamp uses absolute UTC/device time
      use_offset_timestamp: true
      publish_mode: 0                               # 0: first return only
      group_address: 0.0.0.0
      host_address: 192.168.10.100                  # host IP (match your network setup)
      lidar_address: 192.168.10.13                  # lidar IP (match your network setup)
      x: 0
      y: 0
      z: 0
      roll: 0
      pitch: 0
      yaw: 0
    # HH_260527: use_vlan options:
    #   true: parse VLAN tag in captured packets
    #   false: parse packets without VLAN header (default)
    use_vlan: false
    ros:
      ros_frame_id: lidar_link
      # HH_260415: Keep topic names relative so launch namespace decides final absolute topic.
      ros_send_point_cloud_topic: points_raw
      ros_send_imu_packet_topic: imu_packets
      ros_packet_topic: /vanjee_lidar_packet
