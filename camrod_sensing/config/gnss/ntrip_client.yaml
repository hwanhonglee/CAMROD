# HH_260722 - Keep the canonical CNJU mountpoint synchronized with bringup.
# HH_260722 - Python ntrip_ros.py feeds the rover in single mode and the
# moving_base_rtcm_writer in the production dual-antenna mode.
# Server: gnssdata.or.kr:2101, mountpoint CNJU-RTCM32.

/**:
  ros__parameters:
    # ── Server connection ─────────────────────────────────────────────────────
    host: gnssdata.or.kr
    port: 2101
    # HH_260723 - Use the field-selected JECH RTCM 3.2 stream in both package and bringup mirrors.
    mountpoint: "JECH-RTCM32"
    # Inactive legacy alternative: mountpoint: "CNJU-RTCM32"
    username: "hwanhong57@gmail.com"
    password: "gnss"

    # HH_260722 - Label the shared client role for both supported GNSS modes.
    # ── Python ntrip_ros.py (single rover / dual moving-base writer) ──────────
    authenticate: true
    rtcm_message_package: rtcm_msgs
    # HH_260327: Accept slightly longer GGA strings to avoid reconnect churn.
    nmea_max_length: 96
    # HH_260722 - Keep /rtcm as the node-level fallback. gnss.launch.py overrides
    # it with namespace-relative rtcm in single mode and isolated
    # ntrip_client/rtcm in dual mode for the moving-base writer.
    rtcm_topic: /rtcm
    ntrip_version: "None"
    ssl: false
    cert: "None"
    key: "None"
    ca_cert: "None"
    rtcm_frame_id: "gps"
    # HH_260327: Relax timeout/retry cadence for unstable RTCM network periods.
    rtcm_timeout_seconds: 10
    reconnect_attempt_max: 10
    reconnect_attempt_wait_seconds: 8
