/**:
  ros__parameters:
    host: www.gnssdata.or.kr
    port: 2101
    # mountpoint: CNJU-RTCM32  # 청주 (C-track)
    mountpoint: JECH-RTCM32   # 제천 (국립공원)
    authenticate: true
    username: hwanhong57@gmail.com
    password: gnss

    # Force rtcm_msgs (avoid mavros_msgs dependency)
    rtcm_message_package: rtcm_msgs
    # HH_260327: Accept slightly longer GGA strings generated at runtime
    # to avoid dropping valid NMEA and triggering avoidable reconnect churn.
    nmea_max_length: 96

    # Ensure topic name (some versions use 'rtcm_topic')
    rtcm_topic: /rtcm
    
    ntrip_version: "None"
    ssl: false
    cert: "None"
    key: "None"
    ca_cert: "None"

    rtcm_frame_id: "gps"
    # HH_260327: Relax timeout/retry cadence for unstable RTCM network periods.
    rtcm_timeout_seconds: 10
    reconnect_attempt_max: 10
    reconnect_attempt_wait_seconds: 8
