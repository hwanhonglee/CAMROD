# HH_260727 - Keep both physical GNSS ports in this one deployment profile.
# Node-specific wildcard selectors let the same file work under /gnss and
# /sensing/gnss without exposing the rover USB port to the RTCM writer.
/**/ublox_gps_node:
  ros__parameters:
    # HH_260708 - Use the operator-verified ttyACM port for the field harness.
    # Do not switch GNSS to by-id; USB role checks are done against ttyACM*.
    device: /dev/ttyACM0
    frame_id: gps
    # HH_260722 - Keep this rover-side topic isolated from NTRIP in dual mode.
    # External CORS goes to the Lite moving base through FTDI DN03DF8V
    # by its stable by-id path; only the corrected moving-base stream reaches
    # this receiver through UART2, regardless of ttyUSB enumeration.
    rtcm_topic: rtcm
    debug: 1 # 4 is logging data

    # HH_260330: Avoid startup abort on some F9P units reporting
    # "Failed to read the GNSS config" during CFG polling.
    # Keep receiver running even if runtime CFG read/write is flaky.
    config_on_startup: false
    # HH_260611: Keep the base YAML single-antenna safe; launch files enable these for simpleRTK2B Heading.
    dual_antenna: false
    dual_antenna.configure_usb: false
    # HH_260722 - Keep rover USB RTCM disabled in the dual field topology.
    # Launch may turn it on only for the direct-injection diagnostic fallback.
    dual_antenna.usb_rtcm_in: false
    dual_antenna.configure_navigation: false
    # HH_260722 - Apply this filter only to diagnostic ROS/USB RTCM. It cannot
    # separate two complete reference streams, so production leaves USB RTCM off.
    dual_antenna.block_rtcm_ids: [4072]

    # HH_260326: Increase GNSS fix rate for localization consistency validation.
    # HH_260722 - Keep this shared single-antenna profile at 10 Hz. The dual
    # launch overlay sets 1 Hz so moving-base and rover navigation epochs match.
    rate: 10.0
    nav_rate: 1
    # Rover mode: disable TMODE3 (Survey-In / Base Station mode)
    # - tmode3=1 is for Survey-In (base/reference station)
    # - tmode3=0 is for normal rover operation (vehicle receiver) # Rover mode
    tmode3: 0

    # If you use only USB (ttyACM*), you typically don't need UART settings.
    # Keeping UART blocks can cause unnecessary configuration attempts.
    # uart1:
    #   baudrate: 9600

    # Publish only what we need to reduce CFG-MSG configuration and avoid NACKs.
    # NAV-PVT is the key message for:
    # - lat/lon/height
    # - fix type
    # - RTK status (carrSoln: none/float/fix)
    # - accuracy estimates (hAcc/vAcc)
    publish:
      all: false

      # Keep NMEA ON only if you want quick RTK status via GGA fix quality
      nmea: true

      nav:
        all: false
        pvt: true          # Publish UBX-NAV-PVT (position/velocity/time + RTK state)
        relposned: false   # Enable only for dual-F9P moving-baseline heading
        heading: true      # Publish heading-related output (often COG-based unless moving-baseline is used)
      rxm:
        all: false
        rtcm: true         # publish /rxmrtcm so you can confirm RTCM is being received

    # Optional: disable printing all INF messages to keep logs clean
    inf:
      all: false

/**/moving_base_rtcm_writer:
  ros__parameters:
    # POWER+XBEE FTDI connected to the Lite moving-base UART1.
    # Use this stable identity because the Quectel modem shares ttyUSB indices
    # and must not receive RTCM.
    device: /dev/serial/by-id/usb-FTDI_FT230X_Basic_UART_DN03DF8V-if00-port0
    baud: 115200
