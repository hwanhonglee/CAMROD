# ============================================================
# sensing_params.yaml
# Common fallback / monolithic parameters aligned to /sensing/*
# Actual detailed sensor configs still come from:
#   - lidar/preprocessor.yaml
#   - camera/preprocessor.yaml
#   - imu/platform_velocity_converter.yaml
#   - radar/sen0592_radar.yaml
#   - radar/cost_grid.yaml
#   - gnss/zed_f9p_rover.yaml
# ============================================================

/sensing/lidar/lidar_preprocessor:
  ros__parameters:
    input_topic: "/sensing/lidar/vanjee/points_raw"
    filtered_topic: "/sensing/lidar/points_filtered"
    lidar_status_topic: "/sensing/lidar/status"
    publish_lidar_status: false

    min_range: 0.3
    max_range: 35.0
    min_z: -1.0
    max_z: 2.0

    ground_filter_mode: "z"
    ground_z_min: -0.25
    ground_z_max: 0.25

    stamp_with_now: true
    frame_id_override: "lidar_link"
    publish_filtered: true

/sensing/camera/camera_preprocessor:
  ros__parameters:
    input_image_topic: "/sensing/camera/image_raw"
    input_camera_info_topic: "/sensing/camera/camera_info"
    output_image_topic: "/sensing/camera/processed/image"
    output_camera_info_topic: "/sensing/camera/processed/camera_info"

    camera_status_topic: "/sensing/camera/status"
    publish_camera_status: false

    # HH_260326: Use camera_link as the canonical camera TF frame.
    frame_id_override: "camera_link"
    require_camera_info: false

/sensing/imu/platform_velocity_converter:
  ros__parameters:
    velocity_topic: "/platform/status/velocity"
    imu_topic: "/sensing/imu/data"
    # HH_260410: Keep output topic aligned with dedicated
    # config/imu/platform_velocity_converter.yaml and system diagnostics checker.
    output_topic: "/sensing/platform_velocity_converter/twist_with_covariance"

    imu_status_topic: "/sensing/imu/status"
    publish_imu_status: false
    require_imu: true

    linear_variance: [0.05, 0.05, 0.1]
    angular_variance: [0.2, 0.2, 0.2]

/sensing/radar/sen0592_radar_node:
  ros__parameters:
    baud: 115200
    slave_id: 1

    poll_period_s: 0.06
    response_deadline_s: 0.20
    inter_frame_sleep_s: 0.003

    use_range_msg: true
    min_range_m: 0.02
    max_range_m: 4.50
    field_of_view_rad: 0.26

    publish_radar_status: false
    radar_status_topic: "/sensing/radar/status"

    sensor_names: ["REAR", "LEFT2", "LEFT1", "RIGHT2", "RIGHT1", "FRONT"]
    frame_ids:
      - "radar_rear_link"
      - "radar_left2_link"
      - "radar_left1_link"
      - "radar_right2_link"
      - "radar_right1_link"
      - "radar_front_link"

    ports:
      - "/dev/ttyCH9344USB2"
      - "/dev/ttyCH9344USB3"
      - "/dev/ttyCH9344USB4"
      - "/dev/ttyCH9344USB5"
      - "/dev/ttyCH9344USB6"
      - "/dev/ttyCH9344USB7"

    topics:
      - "/sensing/radar/rear/range"
      - "/sensing/radar/left2/range"
      - "/sensing/radar/left1/range"
      - "/sensing/radar/right2/range"
      - "/sensing/radar/right1/range"
      - "/sensing/radar/front/range"

/sensing/radar/radar_cost_grid:
  ros__parameters:
    input_topics:
      - "/sensing/radar/front/range"
      - "/sensing/radar/right1/range"
      - "/sensing/radar/right2/range"
      - "/sensing/radar/left1/range"
      - "/sensing/radar/left2/range"
      - "/sensing/radar/rear/range"
    output_topic: "/sensing/radar/near_cost_grid"
