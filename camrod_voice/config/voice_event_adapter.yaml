# Voice event adapter parameters are grouped into numbered sections:
#   1) audio enables and thresholds, 2) topics, 3) readiness and mission.
/voice/voice_event_adapter:
  ros__parameters:
    # =========================================================================
    # 1. AUDIO ENABLES AND THRESHOLDS
    # =========================================================================
    startup_delay_s: 3.0
    enable_nav_audio: true
    enable_estop_audio: true
    enable_battery_audio: true
    # HH_260720 - Announce charging from the unified /platform/status message.
    enable_charging_audio: true
    # HH_260813 - Announce the drop-zone docking run and its outcome.
    enable_docking_audio: true

    # HH_260812 - Music bed runs for the whole trip; speech ducks it.
    enable_bgm: true
    enable_travel_announce: true
    # First reminder well after the departure cue, then once per period.
    travel_announce_initial_delay_s: 30.0
    travel_announce_period_s: 90.0
    # Standing explanation repeated while a hold keeps the route blocked.
    obstacle_repeat_period_s: 20.0

    battery_low_threshold: 0.20
    # Charge-complete cue repeats until the charger is removed.
    battery_full_threshold: 0.99
    battery_full_repeat_period_s: 60.0

    # =========================================================================
    # 2. TOPICS
    # =========================================================================
    platform_status_topic: "/platform/status"
    system_status_topic: "/system/status"
    localization_mode_topic: "/localization/mode"
    control_gate_status_topic: "/control/cmd_vel_safety_gate/status"
    planning_engaged_topic: "/control/planning_engaged"
    navigate_to_pose_action: "/planning/navigate_to_pose"
    # Only the parking controller selected by the control launch publishes here.
    parking_status_topics:
      - "/parking/reverse_parking_controller/status"
      - "/parking/apriltag_parking_controller/status"

    # =========================================================================
    # 3. READINESS AND MISSION
    # =========================================================================
    readiness_required_modules:
      - map
      - sensing
      - localization
      - planning
      - control
      - platform
      - system
    readiness_map_frame: "map"
    # HH_260803 - Readiness follows the canonical axle-midpoint navigation frame.
    readiness_base_frame: "robot_center_link"
    readiness_check_period_s: 0.5

    # NORMAL=0. DEGRADED/DR_ONLY/INVALID are not mission-ready.
    max_ready_localization_mode: 0

    return_mission_key: "drop_zone"
