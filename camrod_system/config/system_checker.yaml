# HH_260112 Default system checker configuration.
/system/system_checker:
  ros__parameters:
    check_period_s: 1.0
    required_nodes:
      # lanelet cost-grid publisher node in camrod_map/launch/cost_grid.launch.py
      - /map/lanelet_boundary_cost_grid
      - /planning/goal_snapper
      - /planning/planner_server
      - /planning/controller_server
      - /planning/bt_navigator
      # Filter node name varies by filter_type (ekf_filter/eskf).
      # pose_selector is always launched for both EKF and ESKF.
      - /localization/pose_selector
    required_topics:
      - /localization/pose
      - /sensing/imu/data
      - /sensing/gnss/ublox_gps_node/fix
      # HH_260410: Unified wheel odometry topic required for localization readiness.
      - /platform/status/wheel_odometry
      # HH_260527: Primary-only selector default. Track selected odometry stream.
      - /localization/odometry/filtered
      - /map/cost_grid/lanelet
