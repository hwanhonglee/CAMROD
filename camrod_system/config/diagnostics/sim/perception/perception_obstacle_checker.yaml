# HH_260630: Sim bringup is LiDAR-only; YOLO/camera detections are disabled.
/system/perception_obstacle_checker:
  ros__parameters:
    # --- Publish rate and monitored streams ---
    publish_rate_hz: 1.0
    obstacle_names: ["fused_obstacles"]

    # --- Per-stream block: fused_obstacles ---
    fused_obstacles:
      topic: "/perception/obstacles"
      type: "PointCloud2"
      # Rate thresholds
      expected_hz: 10.0
      hz_warn_ratio: 0.7
      hz_error_ratio: 0.4
      stale_timeout_s: 2.0
      # Count limits
      min_count: 0
      max_count: 0
