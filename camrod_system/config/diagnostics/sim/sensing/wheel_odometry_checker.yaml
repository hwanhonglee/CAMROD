# HH_260630: Sim wheel odometry is generated by fake_sensor_publisher at the
# simulation tick rate. Hardware Ranger cadence remains in the default profile.
/system/wheel_odometry_checker:
  ros__parameters:
    publish_rate_hz: 1.0
    wheel_names: ["main"]

    main:
      topic: "/localization/input/wheel_odometry"
      expected_hz: 10.0
      hz_warn_ratio: 0.7
      hz_error_ratio: 0.4
      stale_timeout_s: 2.0
      max_speed_warn_ms: 3.0
      max_speed_error_ms: 5.0
