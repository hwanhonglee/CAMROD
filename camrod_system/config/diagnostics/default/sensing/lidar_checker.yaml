# LiDAR checker configuration.

lidar_checker:
  ros__parameters:
    publish_rate_hz: 1.0

    # Each name below becomes a /sensor/lidar/<name> diagnostic entry.
    lidar_names: ["main", "filtered"]

    main:
      # HH_260630 - Raw Vanjee output used by lidar_preprocessor_node.
      # HH_260702 - Raw frames can contain vendor NaN placeholders, so this
      # entry checks raw freshness/rate only. Motion quality is judged after
      # preprocessing via the filtered entry below.
      topic: "/sensing/lidar/vanjee/points_raw"
      expected_hz: 10.0
      hz_warn_ratio: 0.5
      hz_error_ratio: 0.2
      stale_timeout_s: 3.0
      min_point_count: 100
      max_point_count: 0
      max_nan_ratio: 0.0

    filtered:
      topic: "/sensing/lidar/points_filtered"
      # HH_260701 - ground_segmentation is the intentional bottleneck after
      # 10 Hz preprocessor output; 6 Hz is the profiled stable planning input.
      # HH_260702 - This entry is the motion-relevant LiDAR health check:
      # freshness/rate must stay alive and filtered NaN/Inf should be nearly zero.
      expected_hz: 6.0
      hz_warn_ratio: 0.5
      hz_error_ratio: 0.25
      stale_timeout_s: 3.0
      # HH_260701 - This is obstacle-only output; 0 points is normal when the
      # LiDAR ROI is clear, so freshness/rate are the safety checks here.
      min_point_count: 0
      max_point_count: 0
      max_nan_ratio: 0.001
