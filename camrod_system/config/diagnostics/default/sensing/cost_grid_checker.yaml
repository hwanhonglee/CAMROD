# Cost grid checker configuration, organized as:
#   1) general, 2) thresholds, 3) per-grid settings.
cost_grid_checker:
  ros__parameters:
    # =========================================================================
    # 1. GENERAL
    # =========================================================================
    publish_rate_hz: 1.0

    # HH_260630 - Monitor raw sensor-derived grids and the merged inflation grid.
    grid_names: ["lidar", "radar", "inflation"]

    # =========================================================================
    # 2. THRESHOLDS
    # =========================================================================
    hz_warn_ratio: 0.7
    hz_error_ratio: 0.4
    stale_timeout_s: 2.0
    # HH_260703 - Sensor cost grids use unknown cells as sparse "no obstacle"
    # background, so freshness/rate are the health signals. Keep unknown ratio
    # visible in diagnostics but do not promote 100% unknown to ERROR.
    unknown_ratio_warn: 1.01
    unknown_ratio_error: 1.01

    # =========================================================================
    # 3. PER-GRID SETTINGS
    # =========================================================================
    lidar:
      diagnostic_name: "/sensing/cost_grid/lidar"
      output_topic: "/sensing/cost_grid/lidar"
      expected_hz: 10.0
      stale_timeout_s: 2.0

    radar:
      diagnostic_name: "/sensing/cost_grid/radar"
      output_topic: "/sensing/cost_grid/radar"
      expected_hz: 10.0
      stale_timeout_s: 2.0

    inflation:
      diagnostic_name: "/planning/cost_grid/inflation"
      output_topic: "/planning/cost_grid/inflation"
      expected_hz: 6.0
      stale_timeout_s: 2.0
