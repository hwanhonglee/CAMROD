# GNSS checker configuration.
# Sensor-level check: receiver freshness, fix validity, and receive rate.

gnss_checker:
  ros__parameters:
    # --- Publish rate ---
    publish_rate_hz: 1.0

    # --- Monitored GNSS sources ---
    gnss_names: ["main"]

    # --- Per-source settings: main ---
    main:
      # HH_260617 - ublox_gps_node publishes NavSatFix as a private topic under its node name.
      topic: "/sensing/gnss/ublox_gps_node/fix"
      # HH_260729 - A fresh true heartbeat marks intentionally substituted
      # integration-test data. The checker reports explicit DUMMY DATA WARN;
      # false/stale heartbeat restores the normal physical-sensor diagnosis.
      dummy_active_topic: "/sensing/gnss/dummy_active"
      dummy_active_timeout_s: 1.0
      # HH_260807 - The current physical GNSS validation profile uses a 200 ms
      # receiver epoch. Diagnose that intentional 5 Hz stream instead of
      # reporting every healthy test run as critically slow.
      expected_hz: 5.0
      hz_warn_ratio: 0.8
      hz_error_ratio: 0.5
      stale_timeout_s: 2.0

    # Additional GNSS source example:
    # sub:
    #   topic: "/sensing/gnss/sub/navsatfix"
    #   expected_hz: 1.0
    #   hz_warn_ratio: 0.8
    #   hz_error_ratio: 0.5
    #   stale_timeout_s: 2.0
