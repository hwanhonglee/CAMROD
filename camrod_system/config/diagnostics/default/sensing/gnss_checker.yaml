# GNSS checker configuration.
# Sensor-level check: receiver freshness, fix validity, and receive rate.

gnss_checker:
  ros__parameters:
    publish_rate_hz: 1.0

    gnss_names: ["main"]

    main:
      # HH_260617 - ublox_gps_node publishes NavSatFix as a private topic under its node name.
      topic: "/sensing/gnss/ublox_gps_node/fix"
      # HH_260703 - Field ZED-F9P currently publishes NavSatFix at 1 Hz even
      # with the driver rate parameter set higher. Keep freshness/fix checks
      # active without forcing ERROR_STOP from this stable field rate.
      expected_hz: 1.0
      hz_warn_ratio: 0.8
      hz_error_ratio: 0.5
      stale_timeout_s: 2.0

    # Additional GNSS source example:
    # sub:
    #   topic: "/sensing/gnss/sub/navsatfix"
    #   expected_hz: 1.0
    #   hz_warn_ratio: 0.8
    #   hz_error_ratio: 0.5
    #   stale_timeout_s: 2.0
