# Camera Checker 설정 파일
# HH_260528: Updated for dual econ cameras.
# camera_front_publisher_node publishes image_rect/compressed (NOT image_raw).
# camera_rear_publisher_node publishes image_raw/compressed (NOT image_rect).

camera_checker:
  ros__parameters:
    publish_rate_hz: 1.0

    camera_names: ["econ_front", "econ_rear"]

    econ_front:
      image_topic: "/sensing/camera/econ_front/image_rect/compressed"
      camera_info_topic: "/sensing/camera/econ_front/camera_info"
      expected_fps: 10.0
      fps_warn_ratio: 0.8
      fps_error_ratio: 0.5
      stale_timeout_s: 3.0
      expected_width: 0
      expected_height: 0
      expected_encoding: ""

    econ_rear:
      image_topic: "/sensing/camera/econ_rear/image_raw/compressed"
      camera_info_topic: "/sensing/camera/econ_rear/camera_info"
      expected_fps: 10.0
      fps_warn_ratio: 0.8
      fps_error_ratio: 0.5
      stale_timeout_s: 3.0
      expected_width: 0
      expected_height: 0
      expected_encoding: ""
