map_cost_grid_checker:
  ros__parameters:
    publish_rate_hz: 1.0

    cost_grid_topic: "/map/cost_grid/lanelet"

    # 이벤트 기반 발행 (pose/path 갱신 시 재생성) → 낮은 임계값
    expected_hz:    1.0    # 로봇 이동 중 기대 재생성 주기
    hz_warn_ratio:  0.4    # actual/expected < 이 값 → WARN
    hz_error_ratio: 0.1    # actual/expected < 이 값 → ERROR

    stale_timeout_s:  3.0    # 이 시간(초) 이상 메시지 없으면 STALE
                           # → 맵 로드 실패 또는 pose/path 입력 없음

    # unknown(-1) 셀 비율 임계값
    # 맵 커버리지 밖이거나 경로가 없으면 unknown 비율이 높아짐
    unknown_ratio_warn:  0.8    # 80% unknown → WARN
    unknown_ratio_error: 0.98   # 98% unknown → ERROR (사실상 빈 격자)
