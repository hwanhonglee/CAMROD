# HH_260720 - Describe the current localization monitor contract with its explicit node name.
# Localization mode checker exposes monitor mode, confidence, and sensor health as diagnostics.

localization_mode_checker:
  ros__parameters:
    # --- Publish rate ---
    publish_rate_hz: 1.0                        # 진단 발행 주기 (Hz)

    # --- Monitored topics ---
    status_topic: "/localization/status"     # AvgLocalizationStatus 토픽
    health_topic: "/localization/state"      # HH_260623 - std_msgs/Bool health state from localization monitor

    # --- Staleness ---
    stale_timeout_s: 2.0                       # 이 시간(초) 이상 status 없으면 STALE

    # 신뢰도 임계값
    conf_warn:  0.6                          # confidence < 이 값 → WARN
    conf_error: 0.3                          # confidence < 이 값 → ERROR

    # --- Innovation thresholds ---
    # HH_260720 - Keep innovation thresholds aligned with localization_monitor_node.
    innov_warn:  3.0                         # GNSS/Wheel innovation norm > 이 값 → WARN
    innov_error: 6.0                         # GNSS/Wheel innovation norm > 이 값 → ERROR
