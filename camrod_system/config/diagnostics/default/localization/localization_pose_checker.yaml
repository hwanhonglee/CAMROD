# HH_260720 - Check final selected localization output independently of filter backend.
# Localization pose checker configuration.
# (GNSS 입력 품질은 robot_gnss_quality_checker 가 담당)

localization_pose_checker:
  ros__parameters:
    publish_rate_hz: 1.0                                    # 진단 발행 주기 (Hz)

    pose_topic: "/localization/pose_with_covariance"     # 구독 토픽

    # HH_260625: EKF is configured at 10Hz in localization/filter/ekf.yaml.
    expected_hz: 10.0
    hz_warn_ratio: 0.7         # actual_hz / expected_hz 비율이 이 값 미만이면 WARN
    hz_error_ratio: 0.4        # actual_hz / expected_hz 비율이 이 값 미만이면 ERROR
    stale_timeout_s: 1.0         # 이 시간(초) 이상 메시지 없으면 STALE

    # XY 위치 공분산 trace 임계값 (출력 불확실도)
    # trace = var_x + var_y = cov[0] + cov[7]
    cov_warn_threshold:  1.0   # trace > 이 값 → WARN  (σ ≈ 0.7m)
    cov_error_threshold: 9.0   # trace > 이 값 → ERROR (σ ≈ 2.1m)

    # 연속 프레임 간 최대 허용 위치 점프
    max_jump_m: 2.0            # XY 변화량 > 이 값 (m) → ERROR
