localization_init_checker:
  ros__parameters:
    publish_rate_hz: 1.0

    ok_topic:       "/localization/initial_match_ok"
    distance_topic: "/localization/initial_match_distance"
    id_topic:       "/localization/initial_match_id"

    stale_timeout_s:    5.0    # 이 시간(초) 이상 메시지 없으면 STALE
    grace_period_s: 30.0   # 시동 후 이 시간 이내 미매칭 → WARN (이후 → ERROR)
    dist_warn_m:      3.0    # 거리 > 이 값 → WARN
    dist_error_m:     8.0    # 거리 > 이 값 → ERROR
