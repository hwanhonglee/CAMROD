# Localization GNSS checker configuration.
# Localization-level check: GNSS pose freshness, rate, covariance, and jumps.

localization_gnss_checker:
  ros__parameters:
    publish_rate_hz: 1.0

    gnss_names: ["main"]

    main:
      topic: "/sensing/gnss/pose_with_covariance"
      # HH_260703 - The field GNSS pose topic is stable at 1 Hz. Treat stale,
      # high covariance, or large jumps as faults, not this measured base rate.
      expected_hz: 1.0
      hz_warn_ratio: 0.8
      hz_error_ratio: 0.5
      stale_timeout_s: 2.0
      cov_warn_threshold: 4.0
      cov_error_threshold: 25.0
      max_jump_m: 5.0
