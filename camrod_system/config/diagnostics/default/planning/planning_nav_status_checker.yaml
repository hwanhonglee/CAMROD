planning_nav_status_checker:
  ros__parameters:
    publish_rate_hz: 1.0

    nav_status_topic: "/planning/navigate_to_pose/_action/status"
    # HH_260702 - Action status freshness is advisory. Path/state/lifecycle
    # checkers are the motion-health authority, so a quiet status topic must
    # not raise SYSTEM ERROR while the robot is driving normally.
    # 0.0 disables freshness timeout; abort frequency is still checked.
    stale_timeout_s: 0.0
    idle_ok_without_status: true
    terminal_status_stale_ok: true
    abort_warn: 2
    abort_error: 5
