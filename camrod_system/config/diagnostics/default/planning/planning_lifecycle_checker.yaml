# HH_260331 - Monitor the lifecycle state of the four core Nav2 planning servers.
planning_lifecycle_checker:
  ros__parameters:
    # --- Rates and stale threshold ---
    publish_rate_hz: 1.0           # HH_260425 - Publish diagnostics at 1 Hz.
    poll_rate_hz: 2.0              # HH_260425 - Poll lifecycle get_state at 2 Hz.
    stale_timeout_s: 5.0          # HH_260425 - Report ERROR after 5 seconds without a response.

    # --- Monitored lifecycle nodes ---
    node_names:
      - "/planning/planner_server"
      - "/planning/controller_server"
      - "/planning/bt_navigator"
      - "/planning/behavior_server"
