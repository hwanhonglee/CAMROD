# Perception Obstacle Checker 설정 파일
#
# 장애물 감지 파이프라인의 출력 토픽들을 통합 모니터링한다.
#
# obstacle_names 목록에 이름을 추가하고, 같은 이름의 섹션을 추가한다.
# type: "Detection2DArray"  → vision_msgs/Detection2DArray
# type: "PointCloud2"       → sensor_msgs/PointCloud2 (기본값)

perception_obstacle_checker:
  ros__parameters:
    publish_rate: 1.0          # 진단 발행 주기 (Hz)

    obstacle_names:
      - "camera_detections"
      - "fused_obstacles"

    camera_detections:
      topic: "/perception/camera/detections_2d"
      type: "Detection2DArray"
      expected_hz: 10.0        # 기대 발행 속도 (Hz)
      hz_warn_ratio: 0.8       # actual_hz / expected_hz 비율이 이 값 미만이면 WARN
      hz_error_ratio: 0.5      # actual_hz / expected_hz 비율이 이 값 미만이면 ERROR
      stale_timeout: 2.0       # 이 시간(초) 이상 메시지 없으면 STALE
      min_count: 0             # 0 = 체크 안 함 (프레임당 최소 검출 수)
      max_count: 0             # 0 = 체크 안 함 (프레임당 최대 검출 수)

    fused_obstacles:
      topic: "/perception/obstacles"
      type: "PointCloud2"
      expected_hz: 10.0        # 기대 발행 속도 (Hz)
      hz_warn_ratio: 0.8       # actual_hz / expected_hz 비율이 이 값 미만이면 WARN
      hz_error_ratio: 0.5      # actual_hz / expected_hz 비율이 이 값 미만이면 ERROR
      stale_timeout: 2.0       # 이 시간(초) 이상 메시지 없으면 STALE
      min_count: 0             # 0 = 체크 안 함 (스캔당 최소 포인트 수)
      max_count: 0             # 0 = 체크 안 함 (스캔당 최대 포인트 수)
