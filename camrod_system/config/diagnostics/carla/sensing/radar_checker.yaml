      hz_warn_ratio: 0.7
      hz_error_ratio: 0.4
      stale_timeout_s: 3.0
      min_range_m: 0.02
      max_range_m: 0.8
    LEFT2:
      topic: "/sensing/radar/left2/range"
      location: "left_rear"
      frame_id: "radar_left2_link"
      port: "CARLA:/carla/ego_vehicle/radar_left2"
