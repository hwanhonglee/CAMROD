# The raw stream proves that the CARLA ray-cast sensor itself is alive and
# non-empty.  The filtered stream is an obstacle-only result, so zero points is
# a valid clear-scene measurement; its publication rate/staleness checks still
# detect a stopped processing chain.
/system/lidar_checker:
  ros__parameters:
    publish_rate_hz: 1.0
    lidar_names: ["main", "filtered"]
    main:
      topic: "/sensing/lidar/vanjee/points_raw"
      expected_hz: 2.0
      hz_warn_ratio: 0.7
      hz_error_ratio: 0.4
      stale_timeout_s: 3.0
      min_point_count: 1
      max_point_count: 0
      max_nan_ratio: 0.0
    filtered:
      topic: "/sensing/lidar/points_filtered"
      expected_hz: 2.0
      hz_warn_ratio: 0.7
      hz_error_ratio: 0.4
      stale_timeout_s: 3.0
      min_point_count: 0
      max_point_count: 0
      max_nan_ratio: 0.0
