# Cost Grid Checker 설정 파일
#
# 진단 태스크 이름: "cost_grid_checker: /perception/lidar/cost_grid"
#
# unknown_ratio: OccupancyGrid 에서 unknown(-1) 셀의 비율
#   - 입력 PointCloud2 가 오지 않으면 그리드가 모두 unknown 으로 초기화된 상태로 발행됨
#   - TF 변환 실패 시에도 동일하게 unknown 상태 유지
#   → 90% 이상이면 파이프라인 입력 문제 의심

cost_grid_checker:
  ros__parameters:
    publish_rate: 1.0

    output_topic:        "/sensing/lidar/near_cost_grid"
    expected_hz:         10.0
    hz_warn_ratio:       0.7     # 7 Hz 미만이면 WARN
    hz_error_ratio:      0.4     # 4 Hz 미만이면 ERROR
    stale_timeout:       2.0
    unknown_ratio_warn:  0.9     # unknown 90% 이상 → WARN  (입력 부족 의심)
    unknown_ratio_error: 1.0     # unknown 100%     → ERROR (입력 없음 또는 TF 실패)
