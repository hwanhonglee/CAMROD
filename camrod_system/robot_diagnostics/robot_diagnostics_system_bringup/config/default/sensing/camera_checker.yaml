# Camera Checker 설정 파일

camera_checker:
  ros__parameters:
    publish_rate: 1.0          # 진단 발행 주기 (Hz)

    # 모니터링할 카메라 이름 목록
    # 각 이름은 아래 섹션의 키로 사용됩니다.
    camera_names: ["front", "processed"]

    front:
      image_topic: "/sensing/camera/front/image_raw"
      camera_info_topic: "/sensing/camera/front/camera_info"
      expected_fps: 30.0         # 기대 FPS
      fps_warn_ratio: 0.8        # actual/expected 비율이 이 값 미만이면 WARN
      fps_error_ratio: 0.5       # actual/expected 비율이 이 값 미만이면 ERROR
      stale_timeout: 2.0         # 이 시간(초) 이상 메시지 없으면 STALE
      expected_width: 0          # 0 = 체크 안 함
      expected_height: 0         # 0 = 체크 안 함
      expected_encoding: ""      # "" = 체크 안 함  (예: "rgb8", "bgr8")

    processed:
      image_topic: "/sensing/camera/processed/image"
      camera_info_topic: "/sensing/camera/processed/camera_info"
      expected_fps: 30.0
      fps_warn_ratio: 0.8
      fps_error_ratio: 0.5
      stale_timeout: 2.0
      expected_width: 0
      expected_height: 0
      expected_encoding: ""

    # 카메라 추가 예시:
    # rear:
    #   image_topic: "/sensing/camera/rear/image_raw"
    #   camera_info_topic: "/sensing/camera/rear/camera_info"
    #   expected_fps: 15.0
    #   fps_warn_ratio: 0.8
    #   fps_error_ratio: 0.5
    #   stale_timeout: 2.0
    #   expected_width: 1280
    #   expected_height: 720
    #   expected_encoding: "rgb8"
