# HH_260410: Apply parameters regardless of runtime namespace (`/parking/docking/docking_server` etc.).
# Without wildcard root, namespaced launch can miss this file and docking_server fails with
# "Charging dock plugins not given!".
/**:
  ros__parameters:
    controller_frequency: 20.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 2.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.10
    max_retries: 3

    base_frame: "robot_base_link"
    fixed_frame: "odom"

    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    dock_plugins: ["apriltag_dock"]
    # HH_260410: Launch overrides this with package-share path to avoid user-home hardcoding.
    dock_database: "/home/nvidia/camrod_ws/src/camrod_parking/config/docks.yaml"
    # HH_260410: Docking navigator uses planning NavigateToPose with this BT.
    navigator_bt_xml: "/home/nvidia/camrod_ws/src/camrod_planning/config/bt/navigate_to_pose_w_planner_selector_grid.xml"

    apriltag_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.70
      staging_yaw_offset: 0.0

      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0

      external_detection_translation_x: 0.0
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: 0.0
      external_detection_rotation_pitch: 0.0
      external_detection_rotation_yaw: 0.0

      filter_coef: 0.1

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.05
      v_linear_max: 0.15
      use_collision_detection: true
      # HH_260410: Docking collision checker should consume active Nav2 planning costmap.
      costmap_topic: /planning/local_costmap/costmap_raw
      footprint_topic: /planning/local_costmap/published_footprint
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_time_step: 0.1
      dock_collision_threshold: 0.3
