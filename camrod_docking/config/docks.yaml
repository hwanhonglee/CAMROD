# 도킹 스테이션 위치 DB
#
# pose: [x, y, yaw_rad] — 도킹 스테이션(AprilTag 마커/접촉점) "자체"의 위치.
#   staging(로봇 진입 대기) 위치가 아님. opennav_docking 이 이 pose 에서
#   docking_server.yaml 의 staging_x_offset(-0.7m) 만큼 뒤로 뺀 지점을 Nav2 목표로 자동 계산.
#   (검증: opennav_docking SimpleChargingDock::getStagingPose)
#
# frame:
#   - "odom": Phase 2 단독 테스트 (navigate_to_staging_pose:false, pose 미사용)
#   - "map" : Phase 1 (Nav2 staging) — docking_server.yaml 의 fixed_frame(map)과 일치시킬 것
#
# YH_260702 (Stage 1-2, 구조만): frame 을 map 기준으로 전환.
# 현재 pose 는 sim 테스트용 임의 좌표 (RViz 2D Goal Pose 로 지정).
# TODO(실측): 실차에서는 로봇을 스테이션에 밀착 후 /localization/pose(map) 를 읽어 접촉점 기준 좌표로 교체.
docks:
  home_dock:
    type: apriltag_dock
    frame: map
    # 캠핑장(park) 맵 전환: dock 을 park 맵의 drop-zone area(dz_area_1353 = camping_site_1) 중심으로 이동.
    #   camping_sites.yaml(park) 의 camping_site_1 = (37.1358, -47.4945, yaw_deg 23.7451 = 0.4145 rad).
    #   staging = dock + staging_x_offset(-0.7m) 로 area 안 → snap 예상. 첫 실행 시 라우팅 검증 필요.
    pose: [37.1358, -47.4945, 0.4145]  # [x, y, yaw_rad] park camping_site_1 area 중심, yaw=23.745°
    # 이전값(백업): c_track camping_site_1 = [25.51, -5.24, 0.4145]  /  [-0.947, 31.128, -1.1943]

  # ── (주석) c_track 맵 주차장 dock — c_track 맵으로 되돌릴 때 아래 주석 해제 ──────
  #   map_info.yaml 을 c_track(copy_c_track)으로 되돌린 뒤 사용할 것.
  #   좌표 출처: lanelet2_maps_(c_track_test_moved).osm 의 parking_space(way 33941) 중심.
  #   주차 구역 centroid ≈ (-13.03, -84.23), 대표 스톨 중심 (-10.01, -88.94), stall-line yaw≈0.
  #   ※ yaw(도킹 진입 방향)와 lanelet snap(라우팅)은 활성화 시 RViz 로 검증 후 미세조정 필요.
