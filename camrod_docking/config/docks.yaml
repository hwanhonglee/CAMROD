# 도킹 스테이션 위치 DB
#
# pose: [x, y, yaw_rad] — 도킹 스테이션(AprilTag 마커/접촉점) "자체"의 위치.
#   staging(로봇 진입 대기) 위치가 아님. opennav_docking 이 이 pose 에서
#   docking_server.yaml 의 staging_x_offset(-0.7m) 만큼 뒤로 뺀 지점을 Nav2 목표로 자동 계산.
#   (검증: opennav_docking SimpleChargingDock::getStagingPose)
#
# frame:
#   - "odom": Phase 2 단독 테스트 (navigate_to_staging_pose:false, pose 미사용)
#   - "map" : Phase 1 (Nav2 staging) — docking_server.yaml 의 fixed_frame(map)과 일치시킬 것
#
# YH_260702 (Stage 1-2, 구조만): frame 을 map 기준으로 전환.
# 현재 pose 는 sim 테스트용 임의 좌표 (RViz 2D Goal Pose 로 지정).
# TODO(실측): 실차에서는 로봇을 스테이션에 밀착 후 /localization/pose(map) 를 읽어 접촉점 기준 좌표로 교체.
docks:
  home_dock:
    type: apriltag_dock
    frame: map
    # YH_260703 (Phase1 sim 검증): dock 을 drop-zone area(dz_area_1353 = camping_site_1) 안으로 이동.
    #   이전 좌표 (-0.947, 31.128) 는 lanelet 네트워크에서 8m 이상 떨어져 LaneletRoute 가
    #   "could not snap goal to lanelet" 로 Phase1 을 즉시 실패(error 903)시켰다.
    #   camping_site_1 중심 (25.51, -5.24) 는 lanelet 8m 이내로 실측 라우팅 확인됨.
    #   staging = dock + staging_x_offset(-0.7m) ≈ (24.87, -5.52) 로 여전히 area 안 → snap OK.
    pose: [25.51, -5.24, 0.4145]  # [x, y, yaw_rad] camping_site_1 area 중심, yaw=23.745°
    # 이전값(백업): [-0.947, 31.128, -1.1943]
