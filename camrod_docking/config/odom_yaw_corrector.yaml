/odom_yaw_corrector:
  ros__parameters:

    # TODO(dock-integration-v2): 아래 기본값은 develop에서 RMP401 섀시 실측 기준으로
    # 튜닝된 값이다(odom_input_topic=/rmp401/odom, invert_position_y=true).
    # rmp401 패키지는 이번 통합에서 제외했으므로 v2.0.0의 실제 타겟 섀시(Ranger 등)에
    # 맞는지 확인/재조정이 필요함 — 후속 별도 작업으로 처리 예정.

    # ── 구독 토픽 ────────────────────────────────────────────────────────────────
    # Ranger: "/odom"  (ranger_base CAN 출력, ranger.launch.py 하드코딩)
    # RMP401: "/rmp401/odom"
    odom_input_topic: "/rmp401/odom"

    # ── 동작 모드 ───────────────────────────────────────────────────────────────
    # true  : 펌웨어 euler_z 직접 사용 (정상 섀시 — 높은 주파수 내부 적분, 장기 정확)
    # false : angular.z 자체 적분 + 드리프트 보정 (rmp401 등 비정상 odom 섀시)
    use_firmware_yaw: true

    # ── position.y 부호 보정 ────────────────────────────────────────────────────
    # Ranger 정상 오도메트리: false
    # rmp401 펌웨어 버그 섀시: true
    invert_position_y: true

    # ── 드리프트 보정 계수 (use_firmware_yaw: false 일 때만 유효) ───────────────
    # Ranger 정상 섀시: 0.0 (보정 불필요)
    yaw_drift_coeff: 0.0

    # ── 외부 IMU 방향 소스 (선택) ────────────────────────────────────────────
    # 설정 시 섀시 odom의 orientation 대신 이 IMU의 orientation(quaternion)을 yaw 소스로 사용
    # 풀스택: "/sensing/imu/data"  /  단독 테스트: "/imu/data"  /  미사용: ""
    imu_topic: "/sensing/imu/data"

    # ── IMU 전용 모드 ────────────────────────────────────────────────────────
    # true : 첫 IMU 메시지 수신 전까지 TF 발행 보류 (섀시 펌웨어 orientation 완전 미사용)
    # false: IMU 미수신 구간에 섀시 펌웨어 orientation 폴백 허용 (기존 동작)
    require_imu: true
