/odom_yaw_corrector:
  ros__parameters:

    # ── 구독 토픽 ────────────────────────────────────────────────────────────────
    # Ranger: "/odom"  (ranger_base CAN 출력, ranger.launch.py 하드코딩)
    # RMP401: "/rmp401/odom"
    odom_input_topic: "/odom"

    # ── 동작 모드 ───────────────────────────────────────────────────────────────
    # true  : 펌웨어 euler_z 직접 사용 (정상 섀시 — 높은 주파수 내부 적분, 장기 정확)
    # false : angular.z 자체 적분 + 드리프트 보정 (rmp401 등 비정상 odom 섀시)
    use_firmware_yaw: true

    # ── position.y 부호 보정 ────────────────────────────────────────────────────
    # Ranger 정상 오도메트리: false
    # rmp401 펌웨어 버그 섀시: true
    invert_position_y: false

    # ── 드리프트 보정 계수 (use_firmware_yaw: false 일 때만 유효) ───────────────
    # Ranger 정상 섀시: 0.0 (보정 불필요)
    yaw_drift_coeff: 0.0
