/docking/docking_server:
  ros__parameters:

    # ── DockingServer 전역 설정 ────────────────────────────────────────────────
    controller_frequency: 30.0          # 30Hz로 설정 (이전 40Hz / 50Hz → TF extrapolation 오류 원인)
    initial_perception_timeout: 10.0
    wait_charge_timeout: 10.0
    dock_approach_timeout: 120.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.10
    max_retries: 3

    base_frame: "base_link"
    # YH_260702 (Stage 1-1): Phase 1(Nav2 staging) 활성화를 위해 map 으로 변경.
    #   Nav2 는 map 프레임 기준으로 staging pose 를 계산·추종하며,
    #   odom 사용 시 ESKF 리셋에 따른 좌표 드리프트 위험이 있음.
    #   map→odom TF 는 localization(ESKF/EKF)이 발행 → 풀스택 실행 필요.
    fixed_frame: "map"
    cmd_vel_topic: "/platform/cmd_vel"

    dock_backwards: true
    dock_prestaging_tolerance: 0.5

    dock_plugins: ["apriltag_dock"]
    dock_database: ""  # launch 시 get_package_share_directory 로 주입

    # ── SimpleChargingDock 플러그인 ───────────────────────────────────────────
    # Nova Carter 패턴: use_external_detection_pose=true
    # bridge 가 camera frame PoseStamped 발행 → 플러그인이 TF 변환 + EMA 처리
    apriltag_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      use_external_detection_pose: true
      use_battery_status: false         # 충전 하드웨어 연동 후 true 로 변경

      # 실측 캘리브레이션값 (docking_calibration_record.py 밀착 측정, 5회 평균 σ≈0)
      external_detection_translation_x: 0.215   # base_link→접촉점 오프셋 (밀착 재측정 5회 평균 σ≈0, 회전오차 -2.8°)
      external_detection_translation_y: 0.027   # 측방 오프셋

      # optical frame → robot nav 2D 좌표 변환 보정
      # pitch 부호: 캘리브레이션 스크립트 검증 결과 +1.5708 (yaw 오차 23.9° → 반전)
      external_detection_rotation_roll: -1.5708
      external_detection_rotation_pitch: 1.5708
      external_detection_rotation_yaw: 0.0

      docking_threshold: 0.08           # 도킹 완료 판정 거리 (사용자 지정값)
      staging_x_offset: -0.7            # 로봇을 dock 1.5m 앞에 배치 후 시작
      staging_yaw_offset: 0.0
      external_detection_timeout: 1.0
      filter_coef: 0.1                  # EMA 필터 (Nova Carter 기준값)
