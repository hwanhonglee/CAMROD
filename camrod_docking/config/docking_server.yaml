/docking/docking_server:
  ros__parameters:

    # ── DockingServer 전역 설정 ────────────────────────────────────────────────
    controller_frequency: 40.0          # odom 40Hz와 맞춤 (이전 50Hz → TF extrapolation 오류 원인)
    initial_perception_timeout: 5.0
    wait_charge_timeout: 10.0
    dock_approach_timeout: 120.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.10
    max_retries: 3

    base_frame: "base_link"
    fixed_frame: "odom"
    cmd_vel_topic: "/platform/cmd_vel"

    dock_backwards: true
    dock_prestaging_tolerance: 0.3

    rotate_to_dock: false
    rotate_to_dock_timeout: 10.0
    rotation_angular_tolerance: 0.05    # 선회 완료 기준 (rad, ≈3°)

    dock_plugins: ["apriltag_dock"]
    dock_database: ""  # launch 시 get_package_share_directory 로 주입

    # ── SimpleChargingDock 플러그인 ───────────────────────────────────────────
    # Nova Carter 패턴: use_external_detection_pose=true
    # bridge 가 camera frame PoseStamped 발행 → 플러그인이 TF 변환 + EMA 처리
    apriltag_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      use_external_detection_pose: true
      use_battery_status: false         # 충전 하드웨어 연동 후 true 로 변경

      # 실측 캘리브레이션값 (docking_calibration_record.py 로 측정)
      external_detection_translation_x: 0.0    # 태그 위치 = 접촉점 (물리적 오프셋은 별도 측정 필요)
      external_detection_translation_y: 0.0

      # optical frame → robot nav 2D 좌표 변환 보정
      # pitch 부호: 캘리브레이션 스크립트 검증 결과 +1.5708 (yaw 오차 23.9° → 반전)
      external_detection_rotation_roll: -1.5708
      external_detection_rotation_pitch: 1.5708
      external_detection_rotation_yaw: 0.0

      docking_threshold: 0.5            # 도킹 완료 판정 거리
      staging_x_offset: -1.5            # 로봇을 dock 1.5m 앞에 배치 후 시작
      staging_yaw_offset: 0.0
      external_detection_timeout: 3.0
      filter_coef: 0.3                  # EMA 응답성 향상 (이전 0.1 → 느린 수렴, 나선 원인 중 하나)
