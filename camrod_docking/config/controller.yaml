/docking/docking_server:
  ros__parameters:
    # ── EgoPolar (SmoothControlLaw) 게인 ──────────────────────────────────────
    # opennav_docking SmoothControlLaw: ρ(거리) / φ(heading error) / δ(cross-track) 제어
    controller:
      k_phi: 3.0 # heading error 수렴 게인 — Nova Carter 기준 (비정렬 시작 시 헤딩 정렬 강화)
      k_delta: 2.0 # cross-track error 수렴 게인 — Nova Carter 기준
      beta: 0.2 # 속도 감쇠 계수 (거리에 따른 감속 형태)
      lambda: 2.0 # cross-track 가중치

      # ── 속도 제한 ───────────────────────────────────────────────────────────
      v_linear_min: 0.08 # 최소 선속도 (정지 방지)
      v_linear_max: 0.15 # 최대 선속도 [m/s]
      v_angular_max: 0.8 # 최대 각속도 [rad/s] — 이전: 0.3 (선회 반경 제약)
      slowdown_radius: 0.005 # 이 거리 이내 진입 시 선속도 감속 시작 [m]

      # ── 충돌 감지 (Nav2 costmap 미사용 시 비활성화) ─────────────────────────
      use_collision_detection: false
      costmap_topic: /planning/local_costmap/costmap_raw
      footprint_topic: /planning/local_costmap/published_footprint
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_time_step: 0.1
      dock_collision_threshold: 0.3
