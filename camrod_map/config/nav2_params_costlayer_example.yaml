# Example Nav2 parameter file snippet for enabling lanelet_cost_layer.
local_costmap:
  local_costmap:
    ros__parameters:
      # Plugin order for local layered costmap.
      plugins: [obstacle_layer, inflation_layer, lanelet_cost_layer]
      # Vehicle footprint polygon in base_link frame (meters).
      footprint: [[0.9, 0.4], [0.9, -0.4], [-0.9, -0.4], [-0.9, 0.4]]
      # Radius fallback when footprint is not configured.
      robot_radius: 0.0
      # Local costmap resolution (meters/cell).
      resolution: 0.25
      # Local costmap width (meters).
      width: 50.0
      # Local costmap height (meters).
      height: 50.0
      lanelet_cost_layer:
        # Plugin class exported by camrod_map.
        plugin: "camrod_map::cost_map::LaneletCostLayer"
        # OccupancyGrid source topic from lanelet_cost_grid_node.
        source_topic: "/map/cost_grid/lanelet"
        # Input value at or above this threshold is treated as lethal.
        lethal_threshold: 65
        # Cost value to write when source grid cell is unknown and write_unknown=true.
        unknown_value: 255

global_costmap:
  global_costmap:
    ros__parameters:
      # Plugin order for global layered costmap.
      plugins: [obstacle_layer, inflation_layer, lanelet_cost_layer]
      # Vehicle footprint polygon in base_link frame (meters).
      footprint: [[0.9, 0.4], [0.9, -0.4], [-0.9, -0.4], [-0.9, 0.4]]
      # Radius fallback when footprint is not configured.
      robot_radius: 0.0
      # Global costmap resolution (meters/cell).
      resolution: 0.5
      # Global costmap width (meters).
      width: 200.0
      # Global costmap height (meters).
      height: 200.0
      lanelet_cost_layer:
        # Plugin class exported by camrod_map.
        plugin: "camrod_map::cost_map::LaneletCostLayer"
        # OccupancyGrid source topic from lanelet_cost_grid_node.
        source_topic: "/map/cost_grid/lanelet"
        # Input value at or above this threshold is treated as lethal.
        lethal_threshold: 65
        # Cost value to write when source grid cell is unknown and write_unknown=true.
        unknown_value: 255
