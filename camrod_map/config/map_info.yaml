# Shared map reference parameters for map/localization/planning modules.
# This file is the single source of truth for map path + origin offsets.
/**:
  ros__parameters:
    # Lanelet2 OSM path.
    # Keep empty by default and let launch resolve via package-share/workspace search.
    # (bringup/map/planning launch files already provide this resolution path.)
    map_path: ""

    # WGS84 origin used by LocalCartesian/UTM projectors.
    # Keep these values aligned with the source map generation reference.

    # 52S-CF60, Park - VMB (map v8, back-calculated from all 675 OSM nodes local_x/y vs lat/lon)
    # offset_lat: 36.8436194   # v1 origin
    # offset_lon: 128.0925490
    # offset_alt: 299.425
    # offset_lat: 36.84357266  # incorrect partial average
    # offset_lon: 128.09256443
    # offset_lat: 36.84395344
    # offset_lon: 128.09243413
    # offset_alt: 293.119

    # 52S-CF0, C-track - VMB
    # offset_lat: 36.12491471
    # offset_lon: 126.77473954
    # offset_alt: 84.0

    # 52S-CF60, C-track - VMB
    # Degree LLH: 36.7292921, 127.4429577
    # UTM (meter): 52S 360965.99E 4065972.49N
    # MGRS: 52SCF6096565972
    offset_lat: 36.7292921
    offset_lon: 127.4429577
    offset_alt: 84.0

    # Optional UTM-origin metadata for downstream tools that prefer metric origin fields.
    offset_utm_easting: 360965.99
    offset_utm_northing: 4065972.49
    offset_utm_alt: 84.0

    # Optional map yaw correction (degrees).
    # If enabled, lat/lon->xy conversion can be rotated by this offset.
    yaw_offset_deg: 0.0
    rotate_latlon_xy_by_yaw_offset: true

    # Canonical frame IDs shared by map/localization/planning.
    world_frame_id: "world"
    map_frame_id: "map"

    # Lane-direction marker styling (RViz visualization only).
    dir_body_scale: 0.55
    dir_head_scale: 0.35
    dir_width_scale: 0.18
    # Number of centerline points skipped between arrow markers.
    dir_stride: 30
    # HH_260413: 0 keeps one-shot static marker publish (transient_local for late RViz joiners).
    # HH_260602: Set to 5.0s for reliable RViz delivery regardless of startup order.
    visualization_republish_period_s: 5.0
