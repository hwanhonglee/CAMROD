[package]
name = "autoware_adapi_v1_msgs"
version = "1.9.1"
edition = "2021"

[dependencies]
rosidl_runtime_rs = "0.6"
serde = { version = "1", optional = true, features = ["derive"] }
serde-big-array = { version = "0.5.1", optional = true }

# ROS Dependencies
geographic_msgs = "*"
shape_msgs = "*"
builtin_interfaces = "*"
geometry_msgs = "*"
std_msgs = "*"
unique_identifier_msgs = "*"

[features]
serde = ['dep:serde', 'dep:serde-big-array', 'rosidl_runtime_rs/serde', 'geographic_msgs/serde', 'shape_msgs/serde', 'builtin_interfaces/serde', 'geometry_msgs/serde', 'std_msgs/serde', 'unique_identifier_msgs/serde']

[package.metadata.rclrs]
reexport = true
