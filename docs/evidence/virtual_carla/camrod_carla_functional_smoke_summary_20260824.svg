<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">CAMROD–CARLA functional smoke result</title>
  <desc id="desc">Measured start, final, and goal positions from the successful short Nav2 run, plus bounded ACKERMANN, CRAB, and ZERO_TURN smoke measurements. This is not a camera image or a sampled trajectory.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#18283b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59d8ff"/>
    </marker>
    <clipPath id="plotClip">
      <rect x="70" y="92" width="630" height="382" rx="12"/>
    </clipPath>
  </defs>

  <rect width="960" height="600" fill="url(#background)"/>
  <text x="52" y="48" fill="#f4f8ff" font-family="sans-serif" font-size="26" font-weight="700">CAMROD → CARLA 기능 검증 요약</text>
  <text x="52" y="75" fill="#a8b8cc" font-family="sans-serif" font-size="14">2026-08-24 · NullRHI 물리 시뮬레이션 · formal acceptance 아님</text>

  <rect x="52" y="92" width="666" height="414" rx="16" fill="#0b1320" stroke="#33475f" filter="url(#shadow)"/>
  <g clip-path="url(#plotClip)">
    <path d="M 26 395 L 664 32 L 734 155 L 96 518 Z" fill="#243647" opacity="0.8"/>
    <path d="M 61 454 L 699 91" fill="none" stroke="#8398ad" stroke-width="3" stroke-dasharray="15 12"/>
    <path d="M 132 414 L 530 187" fill="none" stroke="#59d8ff" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M 530 187 L 622 135" fill="none" stroke="#ffcc66" stroke-width="3" stroke-dasharray="8 7"/>
  </g>

  <line x1="80" y1="460" x2="690" y2="460" stroke="#51667d"/>
  <line x1="80" y1="100" x2="80" y2="460" stroke="#51667d"/>
  <text x="80" y="488" fill="#7f93aa" font-family="monospace" font-size="12">x = 43.7 m</text>
  <text x="610" y="488" fill="#7f93aa" font-family="monospace" font-size="12">45.3 m</text>
  <text x="14" y="458" fill="#7f93aa" font-family="monospace" font-size="12">-24.9</text>
  <text x="14" y="110" fill="#7f93aa" font-family="monospace" font-size="12">-23.9</text>

  <circle cx="132" cy="414" r="10" fill="#79e6a8" stroke="#0b1320" stroke-width="4"/>
  <text x="148" y="407" fill="#d9fbe7" font-family="sans-serif" font-size="14" font-weight="700">START</text>
  <text x="148" y="427" fill="#9cb0c5" font-family="monospace" font-size="11">43.8377, -24.7793</text>

  <circle cx="530" cy="187" r="10" fill="#59d8ff" stroke="#0b1320" stroke-width="4"/>
  <text x="438" y="170" fill="#cdefff" font-family="sans-serif" font-size="14" font-weight="700">FINAL</text>
  <text x="400" y="190" fill="#9cb0c5" font-family="monospace" font-size="11">44.8993, -24.1824</text>

  <path d="M 622 123 L 634 135 L 622 147 L 610 135 Z" fill="#ffcc66" stroke="#0b1320" stroke-width="4"/>
  <text x="578" y="110" fill="#ffe7ad" font-family="sans-serif" font-size="14" font-weight="700">GOAL</text>
  <text x="542" y="128" fill="#9cb0c5" font-family="monospace" font-size="11">45.1450, -24.0450</text>

  <rect x="742" y="92" width="166" height="88" rx="12" fill="#132238" stroke="#315371"/>
  <text x="758" y="120" fill="#59d8ff" font-family="sans-serif" font-size="13" font-weight="700">NAV2</text>
  <text x="758" y="144" fill="#f4f8ff" font-family="sans-serif" font-size="20" font-weight="700">SUCCEEDED</text>
  <text x="758" y="164" fill="#a8b8cc" font-family="sans-serif" font-size="12">LaneletRoute / RPP</text>

  <rect x="742" y="194" width="166" height="72" rx="12" fill="#132238" stroke="#315371"/>
  <text x="758" y="220" fill="#79e6a8" font-family="sans-serif" font-size="13" font-weight="700">ACTOR 이동</text>
  <text x="758" y="250" fill="#f4f8ff" font-family="monospace" font-size="21" font-weight="700">1.218 m</text>

  <rect x="742" y="280" width="166" height="72" rx="12" fill="#132238" stroke="#315371"/>
  <text x="758" y="306" fill="#ffcc66" font-family="sans-serif" font-size="13" font-weight="700">최종 위치 오차</text>
  <text x="758" y="336" fill="#f4f8ff" font-family="monospace" font-size="21" font-weight="700">0.281 m</text>

  <rect x="742" y="366" width="166" height="140" rx="12" fill="#132238" stroke="#315371"/>
  <text x="758" y="393" fill="#c6d4e4" font-family="sans-serif" font-size="13" font-weight="700">제어 모드 실측</text>
  <text x="758" y="421" fill="#f4f8ff" font-family="sans-serif" font-size="12">ACK  이동 0.156 m</text>
  <text x="758" y="447" fill="#f4f8ff" font-family="sans-serif" font-size="12">CRAB wheel 88°</text>
  <text x="758" y="473" fill="#f4f8ff" font-family="sans-serif" font-size="12">ZERO 회전 8.592°</text>
  <text x="758" y="494" fill="#79e6a8" font-family="sans-serif" font-size="11">종료: brake + handbrake</text>

  <text x="52" y="544" fill="#a8b8cc" font-family="sans-serif" font-size="13">실선은 기록된 시작점→최종점 변위 벡터이며, 시간별 전체 궤적은 아닙니다.</text>
  <text x="52" y="568" fill="#8194aa" font-family="sans-serif" font-size="12">카메라 영상 아님 · single-anchor map 정렬 · 정렬된 1.50 m 직선 목표 1회에 한정</text>
</svg>
