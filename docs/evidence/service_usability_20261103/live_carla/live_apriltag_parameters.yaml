/parking/apriltag_parking_controller:
  ros__parameters:
    axis_full_trust_distance_m: 0.743
    axis_minimum_filter_weight: 0.05
    axis_minimum_trust_distance_m: 4.443
    base_frame_id: robot_center_link
    command_topic: /parking/private/apriltag/cmd_vel
    control_rate_hz: 30.0
    diagnostics_topic: /parking/private/apriltag/diagnostics
    docking_started_voice_key: docking.started
    docking_started_voice_timeout_s: 4.0
    enable_bounded_lateral_retry: true
    enable_docking_started_voice_gate: true
    enable_initial_clearance: true
    final_heading_tolerance_rad: 0.1
    final_insertion_speed_mps: 0.05
    final_insertion_start_distance_m: 0.993
    final_lateral_tolerance_m: 0.03
    final_yaw_angular_speed_radps: 0.2
    final_yaw_settle_hold_s: 0.8
    final_yaw_settle_max_rate_degps: 3.0
    heading_gain: 1.5
    initial_clearance_maximum_heading_error_rad: 0.1
    initial_clearance_maximum_tag_distance_m: 1.2
    initial_clearance_minimum_optical_depth_m: 0.2
    initial_clearance_reverse_parking_tolerance_m: 0.25
    invert_angular_command_while_reversing: false
    lateral_to_heading_gain: 2.7
    maximum_angular_speed_radps: 1.0
    maximum_approach_angle_rad: 0.5
    maximum_retries: 2
    minimum_approach_turn_radius_m: 0.85
    odometry_frame_id: odom
    odometry_timeout_s: 0.5
    odometry_topic: /localization/odometry
    operation_topic: /parking/private/apriltag/operation
    parked_distance_from_tag_m: 0.943
    platform_status_topic: /platform/status
    pose_filter_gain: 0.3
    publish_visualization: true
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
    require_charging_for_completion: true
    retry_forward_distance_m: 0.8
    retry_forward_speed_mps: 0.2
    retry_forward_timeout_s: 30.0
    retry_maximum_forward_exit_lateral_drift_m: 0.15
    retry_maximum_heading_error_rad: 0.35
    retry_maximum_lateral_error_m: 0.15
    retry_maximum_odometry_step_m: 0.1
    retry_maximum_tag_distance_m: 0.45
    retry_minimum_tag_distance_m: 0.35
    retry_yaw_alignment_timeout_s: 8.0
    reverse_approach_speed_mps: 0.2
    service_state_topic: /parking/private/apriltag/service_state
    slowdown_start_distance_m: 1.443
    slowdown_start_remaining_distance_m: 0.6
    slowdown_start_tag_distance_m: 0.8
    status_rate_hz: 2.0
    status_topic: /parking/private/apriltag/status
    stop_when_charging: true
    tag_pose_topic: /perception/apriltag_parking_detector/tag_pose
    tag_timeout_s: 0.5
    tag_wait_timeout_s: 60.0
    translation_stop_tag_distance_m: 0.4
    use_sim_time: false
    voice_state_topic: /voice/voice_announcer/state

