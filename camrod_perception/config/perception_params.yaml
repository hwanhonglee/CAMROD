# CAMROD v1.8 — Perception parameters (v1.7 structure, Vanjee 750C lidar)
# model_path / class_label_path are resolved at launch time by yolo.launch.py
# using get_package_share_directory — do not set absolute paths here.

/perception/obstacle_lidar:
  ros__parameters:
    input_topic: "/sensing/lidar/points_filtered"
    bbox_topic: "/perception/lidar/bboxes"
    cluster_tolerance: 0.25
    min_cluster_size: 12
    max_cluster_size: 8000
    # HH_260522: unified ROI filter selector for obstacle_lidar_node.
    #   box/enabled/on: apply ROI bounds (x/y/z min/max)
    #   disabled/off/none: skip ROI bounds
    roi_filter_mode: box
    x_min: 0.0
    x_max: 5.0
    y_min: -3.0
    y_max: 3.0
    z_min: -3.0
    z_max: 5.0
    min_size_x: 0.10
    min_size_y: 0.10
    min_size_z: 0.10
    marker_lifetime_s: 0.15
    draw_text: true

/perception/yolov9mit:
  ros__parameters:
    model_path: ""                                         # resolved by yolo.launch.py
    class_label_path: ""                                   # resolved by yolo.launch.py
    model_type: "tensorrt"
    tensorrt_device: 0
    min_confidence: 0.5
    min_iou: 0.5
    imshow: false
    input_image_topic: "/sensing/camera/econ_front/image_rect"  # HJ_260529
    transport_hint: "compressed"
    output_image_topic: "/perception/camera/yolo_image"
    output_boundingbox_topic: "/perception/camera/detections_2d"

/perception/obstacle_fusion:
  ros__parameters:
    # Topics
    input_cloud_topic:   "/sensing/lidar/points_filtered"
    detection_topic:     "/perception/camera/detections_2d"
    camera_info_topic:   "/sensing/camera/econ_front/camera_info"  # HJ_260529
    image_topic:         "/sensing/camera/econ_front/image_rect/compressed"
    bbox_topic:          "/perception/lidar/bboxes"
    output_topic:        "/perception/obstacles"
    out_image_topic:     "/perception/camera_lidar/image"
    out_det3d_topic:     "/perception/camera_lidar/detections_3d"
    out_markers_topic:   "/perception/camera_lidar/markers"
    out_euclidean_topic: "/perception/camera_lidar/euclidean_markers"
    # HHL_260623 - camera_front is the canonical optical TF frame; legacy camera_link was removed from sensor_kit.
    camera_frame: "camera_front"
    # HH_260522: unified fusion filter selector.
    #   camera_bbox/enabled/on: keep only points inside camera detections
    #   pass_through/disabled/off/none: ignore camera detections and publish projected LiDAR points
    fusion_filter_mode: "camera_bbox"
    # If true, publish pass-through points when detections are missing/empty.
    keep_lidar_when_no_detections: true
    # Extrinsic: camera position relative to LiDAR effective frame [m]
    # R (LiDAR eff→camera) is fixed by Vanjee 750 mounting: cam_X=eff_X, cam_Y=-eff_Z, cam_Z=eff_Y
    extrinsic_x: 0.0
    extrinsic_y: 0.0
    extrinsic_z: -0.075   # camera is 7.5 cm below LiDAR
    # HJ_260529: replace fusion_filter_mode with lidar_min_forward_m; points closer than this [m] are ignored.
    lidar_min_forward_m: 1.0
    # Clustering / tracking
    n_closest:     5
    min_pts_in_bbox: 3
    ema_alpha:     0.4
    assoc_dist:    1.0
    max_miss:      5
