# HH_260720 - Configure the camrod_perception parking-tag detector.
/perception/apriltag_parking_detector:
  ros__parameters:
    # --- Camera input ---
    # HH_260720 - Consume the image_proc rectified rear-camera stream.
    image_topic: "/sensing/camera/econ_rear/image_rect"
    camera_info_topic: "/sensing/camera/econ_rear/camera_info"
    camera_frame_id: "camera_rear"   # HH_260720 - Canonical sensor-kit optical frame.

    # --- Tag configuration ---
    tag_family: "tag36h11"        # tag36h11 | tagStandard41h12
    target_tag_id: 3              # Parking tag ID; -1 accepts every detected tag.
    tag_size: 0.16                # HH_260720 - Measured black-border outer size in meters.

    # --- Detector settings ---
    # HH_261028 - The rear camera now publishes 960x540, so detection already runs
    # on the pixel count this used to produce by decimating 1920x1080 by 2. Keep
    # decimation off: VIC bilinear downscaling is sharper than apriltag's own
    # subsampling, so tag range is preserved rather than traded away.
    quad_decimate: 1.0
    n_threads: 2

    # --- ROI tracking and reacquisition ---
    # HH_260720 - Track a local ROI and periodically search the full frame for reacquisition.
    roi_scale: 3.0
    roi_full_search_interval: 60
    max_reproj_error_px: 2.0

    # --- Outputs ---
    publish_tf: true
    publish_debug_image: true     # HH_260720 - Disable after field calibration to reduce CPU load.
    debug_jpeg_quality: 80
