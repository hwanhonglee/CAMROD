/**:
  ros__parameters:
    camera_name: "camera"
    camera_frame_id: "camera_frame"
    device_path: "/dev/video0"
    # Camera natively supports these resolutions at 30fps
    # Use 1920x1080 for best performance
    image_width: 1920
    image_height: 1080
    fps: 10
  
    # Exposure time in microseconds (manual mode).
    # ISX031 AE converges to 33000us (= 30fps period), causing periodic fps drops.
    # 25000us leaves 8ms margin for sensor overhead, ensuring stable 30fps.
    # Increase for darker environments (max ~25000 for 30fps stability).
    exposure_time_us: 25000

    # JPEG quality: 80=default, 90=high, 95=very high
    # NVJPEG encodes on GPU so quality has minimal CPU impact
    jpeg_quality: 90

    use_custom_intrinsics: true

    # Calibrated 2026-04-27 (OpenCV, reprojection error: 0.0634)
    # K = [fx,  0, cx]
    #     [ 0, fy, cy]
    #     [ 0,  0,  1]
    camera_matrix: [
      867.8957073616848, 0.0,               911.8892022281101,
      0.0,               870.7794114485896, 561.7588674259021,
      0.0,               0.0,               1.0
    ]

    # equidistant (fisheye): [k1, k2, k3, k4]
    distortion_coefficients: [
      -0.02571812099473933,
      -0.008561500059412931,
       0.0027446870144155,
      -0.00161184746781962
    ]
