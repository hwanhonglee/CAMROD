# Yaw alignment zones for planning_cmd_vel_gate.
#
# Purpose:
# - At specific map keypoints, force heading alignment before continuing route.
# - Coordinates/yaw should be lanelet2-derived values (map frame).
#
# Enable with:
# - planning launch arg: cmd_vel_gate_yaw_alignment_enable:=true
# - or bringup launch_defaults.yaml: planning.cmd_vel_gate_yaw_alignment_enable: true
#
# Notes:
# - If yaw_deg is omitted, next_x/next_y can define tangent heading.
# - position_tolerance_m + yaw_tolerance_deg + hold_s act as triple safety checks.

yaw_alignment_zones:
  # Frame used for zone coordinates.
  frame_id: "map"

  zones:
    - id: "drop_zone_exit_align"
      # Zone center position in map frame (lanelet keypoint).
      x: 16.8676
      y: -117.408
      z: -97.794

      # Target heading at zone center.
      yaw_deg: -0.41903
      # Alternative (optional):
      # next_x: 17.5
      # next_y: -116.9

      # Outer activation radius; zone tracking starts here.
      activation_radius_m: 1.2
      # Inner lock radius; yaw enforcement starts in this radius.
      lock_radius_m: 0.7

      # Position gate condition.
      position_tolerance_m: 0.35
      # Base heading gate condition.
      yaw_tolerance_deg: 8.0
      # Position-error aware tolerance relaxation (deg per meter).
      yaw_tolerance_per_meter_deg: 4.0
      # Condition hold time before unlock.
      hold_s: 0.5

      # Yaw correction command.
      angular_kp: 1.8
      max_angular_z: 0.8
      # Max |linear.x| allowed while approaching center during alignment.
      max_approach_linear_x: 0.25

    - id: "camping_site_1_align"
      x: -13.1858
      y: -93.0608
      z: -96.9358
      yaw_deg: -179.992
      activation_radius_m: 1.2
      lock_radius_m: 0.7
      position_tolerance_m: 0.35
      yaw_tolerance_deg: 8.0
      yaw_tolerance_per_meter_deg: 4.0
      hold_s: 0.5
      angular_kp: 1.8
      max_angular_z: 0.8
      max_approach_linear_x: 0.20
