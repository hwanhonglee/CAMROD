# Layout: 1) input topics and QoS, 2) output topics, 3) publish timing,
# 4) path slicing, 5) goal completion, 6) timeouts and clearing, 7) smoothing.
/planning/local_path_extractor:
  ros__parameters:
    enabled: true
    frame_id: "map"

    # =========================================================================
    # 1. INPUT TOPICS AND QOS
    # =========================================================================
    # HH_260619 - Use planner_server's published route as the source of truth.
    # Nav2 SmoothPath keeps its path on the BT blackboard and does not publish a
    # stable /planning/plan_smoothed topic in this stack.
    global_path_topic: "/planning/global_path"
    # HH_260720 - Canonical generated CAMROD mirror for non-Nav2 consumers.
    global_path_avg_topic: "/planning/global_path_avg"
    fallback_global_path_topic: ""
    preferred_path_hold_s: 1.0
    # HH_260702 - Use the latest global route slice as the operator/safety path.
    # Controller debug paths are not consumed here because they can remain stale
    # while Nav2 replans around a curb.
    # HH_260629 - Planner publishes /planning/global_path as transient_local.
    # Match it so a restarted local_path_extractor immediately receives the
    # current route instead of waiting for the next goal.
    global_path_qos_transient_local: true
    # HH_260702 - Use fused localization pose as the anchor for global-route slicing.
    pose_topic: "/localization/pose"

    # =========================================================================
    # 2. OUTPUT TOPICS
    # =========================================================================
    output_topic: "/planning/local_path"
    # HH_260720 - Standard nav_msgs mirror for RViz and ROS-native tools only.
    output_topic_ros: "/planning/local_path_ros"

    # =========================================================================
    # 3. PUBLISH TIMING
    # =========================================================================
    # Local path is an explicit slice of the current global route.
    # HH_260806 - Match the 20 Hz localization/controller cadence. Pose callbacks
    # still refresh immediately; this timer is the fallback heartbeat.
    publish_rate_hz: 20.0
    # HH_260513: Publish immediately on new global path so path updates snap
    # to current robot position right after new goal, not at next timer tick.
    publish_on_input_update: true

    # =========================================================================
    # 4. PATH SLICING
    # =========================================================================
    # Slice current global path around closest pose.
    lookahead_distance_m: 30.0
    # HH_260619 - Keep only a short tail behind the robot. A long look-behind
    # makes RViz show stale route geometry near the start while the robot turns.
    lookbehind_distance_m: 0.2
    min_points: 12
    max_points: 320
    # Keep local path anchored near the previous closest index so
    # looped lanelets do not jump to another branch that happens to be nearby.
    nearest_search_window: 180
    nearest_backtrack_window: 16
    # Keep full reacquire conservative to avoid jumping to nearby parallel branches.
    full_reacquire_distance_m: 4.0
    full_reacquire_heading_deg: 85.0
    # Cut local-path output at discontinuous jumps to avoid
    # straight bridge artifacts when upstream path has transient discontinuity.
    max_segment_jump_m: 3.0

    # =========================================================================
    # 5. GOAL COMPLETION
    # =========================================================================
    # Stop local path after route completion (until next global path update).
    stop_after_goal_reached: true
    # HH_260623 - Match local path completion with center-based arrival.
    goal_reached_distance_m: 0.25
    goal_reached_index_margin: 3

    # =========================================================================
    # 6. TIMEOUTS AND CLEARING
    # =========================================================================
    # Relax timeout to tolerate brief TF/pose hiccups under load.
    pose_timeout_s: 2.5
    # HH_260702 - Clear stale local-path markers when pose/path/controller input
    # becomes invalid. A brief empty path is safer than showing the previous goal.
    publish_empty_on_invalid: true
    # HH_260702 - Also clear once on route changes so RViz does not keep the
    # previous local path while Nav2/controller are switching goals.
    clear_local_path_on_route_change: true
    empty_republish_period_s: 0.3

    # =========================================================================
    # 7. SMOOTHING
    # =========================================================================
    # HH_260626 - Apply only light fallback smoothing to sliced global paths.
    # Controller paths are already smoothed by Nav2's BT SimpleSmoother.
    smooth_window: 3
