# Combo Profile: NavFn + RotationShim
# 2026-05-21 sim 20s sweep observation: P=Y/C=Y/M=N, displacement=0.000m
# Tuning intent: recovery-biased preset (encourage initial movement on this combo).
planner_server:
  ros__parameters:
    NavFn:
      tolerance: 0.5
      use_astar: True
      allow_unknown: False

controller_server:
  ros__parameters:
    RotationShim:
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.45
      forward_sampling_distance: 0.3
      rotate_to_heading_angular_vel: 1.4
      simulate_ahead_time: 0.8
