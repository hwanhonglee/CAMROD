# Combo Profile: NavFn + DWB
# 2026-05-21 sim 20s sweep observation: P=Y/C=Y/M=Y, displacement=10.975m
# Tuning intent: keep current stable behavior for this combo.
planner_server:
  ros__parameters:
    NavFn:
      tolerance: 0.5
      use_astar: True
      allow_unknown: False

controller_server:
  ros__parameters:
    DWB:
      min_vel_x: 0.0
      min_speed_xy: 0.0
      sim_time: 1.7
      PathAlign.scale: 24.0
      GoalAlign.scale: 18.0
      PathDist.scale: 24.0
      GoalDist.scale: 18.0
      RotateToGoal.scale: 24.0
