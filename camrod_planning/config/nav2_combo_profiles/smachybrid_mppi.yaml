# Combo Profile: SmacHybrid + MPPI
# 2026-05-21 sim 20s sweep observation: P=Y/C=Y/M=N, displacement=0.000m
# Tuning intent: stabilized baseline (align with known-good MPPI defaults).
planner_server:
  ros__parameters:
    SmacHybrid:
      tolerance: 0.5
      allow_unknown: False
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 32
      minimum_turning_radius: 0.6
      max_iterations: 2000000
      # HH_260528: Faster no-path response for Smac planner combos.
      max_planning_time: 1.2
      reverse_penalty: 2.0
      non_straight_penalty: 1.1

controller_server:
  ros__parameters:
    MPPI:
      vx_min: 0.0
      vx_max: 1.4
      prune_distance: 2.0
      temperature: 0.3
      gamma: 0.015
      model_dt: 0.05
