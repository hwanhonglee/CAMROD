# Combo Profile: SmacHybrid + MPPI
# 2026-05-21 sim 20s sweep observation: P=Y/C=Y/M=N, displacement=0.000m
# Tuning intent: recovery-biased preset (encourage initial movement on this combo).
planner_server:
  ros__parameters:
    SmacHybrid:
      tolerance: 0.5
      allow_unknown: False
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 32
      minimum_turning_radius: 0.6
      max_iterations: 2000000
      max_planning_time: 3.0
      reverse_penalty: 2.0
      non_straight_penalty: 1.1

controller_server:
  ros__parameters:
    MPPI:
      vx_min: 0.05
      vx_max: 1.2
      prune_distance: 1.5
      temperature: 0.2
      gamma: 0.01
      model_dt: 0.05
