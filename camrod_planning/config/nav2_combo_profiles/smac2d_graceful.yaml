# Combo Profile: Smac2D + Graceful
# 2026-05-21 sim 20s sweep observation: P=Y/C=Y/M=N, displacement=0.000m
# Tuning intent: stabilized baseline (align with known-good Graceful defaults).
planner_server:
  ros__parameters:
    Smac2D:
      tolerance: 0.5
      allow_unknown: False
      downsample_costmap: False
      downsampling_factor: 1
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 16
      max_iterations: 2000000
      # HH_260528: Faster no-path response for Smac planner combos.
      max_planning_time: 1.2

controller_server:
  ros__parameters:
    Graceful:
      v_linear_max: 1.4
      v_linear_max_initial: 0.8
      initial_rotation: True
      initial_rotation_min_angle: 0.78
      rotation_scaling_factor: 1.0
      allow_backward: False
