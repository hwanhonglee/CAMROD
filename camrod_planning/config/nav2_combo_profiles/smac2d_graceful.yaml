# Combo Profile: Smac2D + Graceful
# 2026-05-21 sim 20s sweep observation: P=Y/C=Y/M=N, displacement=0.000m
# Tuning intent: recovery-biased preset (encourage initial movement on this combo).
planner_server:
  ros__parameters:
    Smac2D:
      tolerance: 0.5
      allow_unknown: False
      downsample_costmap: False
      downsampling_factor: 1
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 16
      max_iterations: 2000000
      max_planning_time: 3.0

controller_server:
  ros__parameters:
    Graceful:
      v_linear_max: 1.0
      v_linear_max_initial: 0.6
      initial_rotation: True
      initial_rotation_min_angle: 0.35
      rotation_scaling_factor: 0.8
      allow_backward: True
