# Combo Profile: ThetaStar + DWB
# 2026-05-21 sim 20s sweep observation: P=Y/C=Y/M=N, displacement=0.008m
# Tuning intent: recovery-biased preset (encourage initial movement on this combo).
planner_server:
  ros__parameters:
    ThetaStar:
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      allow_unknown: False

controller_server:
  ros__parameters:
    DWB:
      min_vel_x: 0.05
      min_speed_xy: 0.08
      sim_time: 1.2
      PathAlign.scale: 16.0
      GoalAlign.scale: 12.0
      PathDist.scale: 18.0
      GoalDist.scale: 12.0
      RotateToGoal.scale: 14.0
