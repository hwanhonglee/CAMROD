# Combo Profile: ThetaStar + Graceful
# 2026-05-21 sim 20s sweep observation: P=Y/C=Y/M=N, displacement=0.003m
# Tuning intent: recovery-biased preset (encourage initial movement on this combo).
planner_server:
  ros__parameters:
    ThetaStar:
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      allow_unknown: False

controller_server:
  ros__parameters:
    Graceful:
      v_linear_max: 1.0
      v_linear_max_initial: 0.6
      initial_rotation: True
      initial_rotation_min_angle: 0.35
      rotation_scaling_factor: 0.8
      allow_backward: True
