# Combo Profile: SmacLattice + RotationShim
# 2026-05-21 sim 20s sweep observation: P=Y/C=Y/M=Y, displacement=0.846m
# Tuning intent: keep current stable behavior for this combo.
planner_server:
  ros__parameters:
    SmacLattice:
      tolerance: 0.5
      allow_unknown: False
      downsample_costmap: False
      downsampling_factor: 1
      minimum_turning_radius: 0.6
      max_iterations: 2000000
      # HH_260528: Faster no-path response for Smac planner combos.
      max_planning_time: 1.2
      lattice_filepath: "/opt/ros/humble/share/nav2_smac_planner/sample_primitives/5cm_resolution/1m_turning_radius/ackermann/output.json"

controller_server:
  ros__parameters:
    RotationShim:
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 1.2
      simulate_ahead_time: 1.0
