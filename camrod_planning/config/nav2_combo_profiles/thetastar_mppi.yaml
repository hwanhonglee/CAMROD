# Combo Profile: ThetaStar + MPPI
# 2026-05-21 sim 20s sweep observation: P=Y/C=Y/M=N, displacement=0.053m
# Tuning intent: recovery-biased preset (encourage initial movement on this combo).
planner_server:
  ros__parameters:
    ThetaStar:
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      allow_unknown: False

controller_server:
  ros__parameters:
    MPPI:
      vx_min: 0.05
      vx_max: 1.2
      prune_distance: 1.5
      temperature: 0.2
      gamma: 0.01
      model_dt: 0.05
