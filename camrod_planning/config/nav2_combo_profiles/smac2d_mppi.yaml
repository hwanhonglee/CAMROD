# Combo Profile: Smac2D + MPPI
# 2026-05-21 sim 20s sweep observation: P=Y/C=Y/M=N, displacement=0.006m
# Tuning intent: recovery-biased preset (encourage initial movement on this combo).
planner_server:
  ros__parameters:
    Smac2D:
      tolerance: 0.5
      allow_unknown: False
      downsample_costmap: False
      downsampling_factor: 1
      # HH_260618: SmacPlanner2D does not expose Hybrid-A* motion/angle params.
      use_final_approach_orientation: false
      max_iterations: 2000000
      # HH_260528: Faster no-path response for Smac planner combos.
      max_planning_time: 1.2

controller_server:
  ros__parameters:
    MPPI:
      vx_min: 0.05
      vx_max: 1.2
      prune_distance: 1.5
      temperature: 0.2
      gamma: 0.01
      model_dt: 0.05
