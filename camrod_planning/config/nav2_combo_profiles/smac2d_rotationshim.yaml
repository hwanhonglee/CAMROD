# Combo Profile: Smac2D + RotationShim
# 2026-05-21 sim 20s sweep observation: P=Y/C=Y/M=N, displacement=0.000m
# Tuning intent: recovery-biased preset (encourage initial movement on this combo).
planner_server:
  ros__parameters:
    Smac2D:
      tolerance: 0.5
      allow_unknown: False
      downsample_costmap: False
      downsampling_factor: 1
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 16
      max_iterations: 2000000
      max_planning_time: 3.0

controller_server:
  ros__parameters:
    RotationShim:
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.45
      forward_sampling_distance: 0.3
      rotate_to_heading_angular_vel: 1.4
      simulate_ahead_time: 0.8
