# Combo Profile: SmacLattice + DWB
# 2026-05-21 sim 20s sweep observation: P=Y/C=Y/M=Y, displacement=10.397m
# Tuning intent: keep current stable behavior for this combo.
planner_server:
  ros__parameters:
    SmacLattice:
      tolerance: 0.5
      allow_unknown: False
      downsample_costmap: False
      downsampling_factor: 1
      # HH_260618: Match bundled 1m_turning_radius Ackermann lattice primitives.
      minimum_turning_radius: 1.0
      max_iterations: 2000000
      # HH_260528: Faster no-path response for Smac planner combos.
      max_planning_time: 1.2
      lattice_filepath: "/opt/ros/humble/share/nav2_smac_planner/sample_primitives/5cm_resolution/1m_turning_radius/ackermann/output.json"
      # HH_260619 - Keep explicit SmacLattice combo profiles aligned with the
      # base centerline-first planner tuning.
      cost_penalty: 6.0
      non_straight_penalty: 1.0
      retrospective_penalty: 0.0
      smoother:
        max_iterations: 2000
        w_data: 0.45
        w_smooth: 0.25
        tolerance: 1.0e-8
        do_refinement: true

controller_server:
  ros__parameters:
    DWB:
      min_vel_x: 0.0
      min_speed_xy: 0.0
      sim_time: 1.7
      PathAlign.scale: 24.0
      GoalAlign.scale: 18.0
      PathDist.scale: 24.0
      GoalDist.scale: 18.0
      RotateToGoal.scale: 24.0
