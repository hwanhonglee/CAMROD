# Combo Profile: SmacLattice + DWB
# 2026-05-21 sim 20s sweep observation: P=Y/C=Y/M=Y, displacement=10.397m
# Tuning intent: keep current stable behavior for this combo.
planner_server:
  ros__parameters:
    SmacLattice:
      tolerance: 0.5
      allow_unknown: False
      downsample_costmap: False
      downsampling_factor: 1
      minimum_turning_radius: 0.6
      max_iterations: 2000000
      max_planning_time: 3.0
      lattice_filepath: "/opt/ros/humble/share/nav2_smac_planner/sample_primitives/5cm_resolution/1m_turning_radius/ackermann/output.json"

controller_server:
  ros__parameters:
    DWB:
      min_vel_x: 0.0
      min_speed_xy: 0.0
      sim_time: 1.7
      PathAlign.scale: 24.0
      GoalAlign.scale: 18.0
      PathDist.scale: 24.0
      GoalDist.scale: 18.0
      RotateToGoal.scale: 24.0
