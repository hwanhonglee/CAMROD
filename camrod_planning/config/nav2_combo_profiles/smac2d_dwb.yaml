# Combo Profile: Smac2D + DWB
# 2026-05-21 sim 20s sweep observation: P=Y/C=Y/M=N, displacement=0.000m
# Tuning intent: recovery-biased preset (encourage initial movement on this combo).
planner_server:
  ros__parameters:
    Smac2D:
      tolerance: 0.5
      allow_unknown: False
      downsample_costmap: False
      downsampling_factor: 1
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 16
      max_iterations: 2000000
      max_planning_time: 3.0

controller_server:
  ros__parameters:
    DWB:
      min_vel_x: 0.05
      min_speed_xy: 0.08
      sim_time: 1.2
      PathAlign.scale: 16.0
      GoalAlign.scale: 12.0
      PathDist.scale: 18.0
      GoalDist.scale: 12.0
      RotateToGoal.scale: 14.0
