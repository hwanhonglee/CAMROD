# Combo Profile: SmacHybrid + RPP
# 2026-05-21 sim 20s sweep observation: P=Y/C=Y/M=Y, displacement=10.818m
# Tuning intent: keep current stable behavior for this combo.
planner_server:
  ros__parameters:
    SmacHybrid:
      tolerance: 0.5
      allow_unknown: False
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 32
      minimum_turning_radius: 0.6
      max_iterations: 2000000
      max_planning_time: 3.0
      reverse_penalty: 2.0
      non_straight_penalty: 1.1

controller_server:
  ros__parameters:
    RPP:
      desired_linear_vel: 1.3
      lookahead_dist: 0.8
      min_lookahead_dist: 0.4
      max_lookahead_dist: 2.0
      use_rotate_to_heading: False
      allow_reversing: False
