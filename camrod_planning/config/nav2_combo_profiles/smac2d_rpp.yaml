# Combo Profile: Smac2D + RPP
# 2026-05-21 sim 20s sweep observation: P=Y/C=Y/M=Y, displacement=10.917m
# Tuning intent: keep current stable behavior for this combo.
planner_server:
  ros__parameters:
    Smac2D:
      tolerance: 0.5
      allow_unknown: False
      downsample_costmap: False
      downsampling_factor: 1
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 16
      max_iterations: 2000000
      max_planning_time: 3.0

controller_server:
  ros__parameters:
    RPP:
      desired_linear_vel: 1.3
      lookahead_dist: 0.8
      min_lookahead_dist: 0.4
      max_lookahead_dist: 2.0
      use_rotate_to_heading: False
      allow_reversing: False
