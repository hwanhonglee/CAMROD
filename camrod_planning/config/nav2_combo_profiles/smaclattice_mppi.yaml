# Combo Profile: SmacLattice + MPPI
# 2026-05-21 sim 20s sweep observation: P=Y/C=Y/M=Y, displacement=4.794m
# Tuning intent: keep current stable behavior for this combo.
planner_server:
  ros__parameters:
    SmacLattice:
      tolerance: 0.5
      allow_unknown: False
      downsample_costmap: False
      downsampling_factor: 1
      minimum_turning_radius: 0.6
      max_iterations: 2000000
      max_planning_time: 3.0
      lattice_filepath: "/opt/ros/humble/share/nav2_smac_planner/sample_primitives/5cm_resolution/1m_turning_radius/ackermann/output.json"

controller_server:
  ros__parameters:
    MPPI:
      vx_min: 0.0
      vx_max: 1.4
      prune_distance: 2.0
      temperature: 0.3
      gamma: 0.015
      model_dt: 0.05
