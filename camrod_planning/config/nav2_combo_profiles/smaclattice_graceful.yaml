# Combo Profile: SmacLattice + Graceful
# 2026-05-21 sim 20s sweep observation: P=Y/C=Y/M=Y, displacement=1.022m
# Tuning intent: keep current stable behavior for this combo.
planner_server:
  ros__parameters:
    SmacLattice:
      tolerance: 0.5
      allow_unknown: False
      downsample_costmap: False
      downsampling_factor: 1
      minimum_turning_radius: 0.6
      max_iterations: 2000000
      max_planning_time: 3.0
      lattice_filepath: "/opt/ros/humble/share/nav2_smac_planner/sample_primitives/5cm_resolution/1m_turning_radius/ackermann/output.json"

controller_server:
  ros__parameters:
    Graceful:
      v_linear_max: 1.2
      v_linear_max_initial: 0.7
      initial_rotation: True
      initial_rotation_min_angle: 0.78
      allow_backward: False
