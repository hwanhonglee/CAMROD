# Combo Profile: NavFn + MPPI
# 2026-05-21 sim 20s sweep observation: P=N/C=Y/M=Y, displacement=3.727m
# Tuning intent: keep current stable behavior for this combo.
planner_server:
  ros__parameters:
    NavFn:
      tolerance: 0.5
      use_astar: True
      allow_unknown: False

controller_server:
  ros__parameters:
    MPPI:
      vx_min: 0.0
      vx_max: 1.4
      prune_distance: 2.0
      temperature: 0.3
      gamma: 0.015
      model_dt: 0.05
