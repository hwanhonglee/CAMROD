# Layout: 1) input topics, 2) state and scenario outputs, 3) maneuver phase
# override, 4) mission and return topics, 5) mission files and keys,
# 6) startup and error behavior, 7) auto return and mission-key matching,
# 8) goal arrival and handoff.
/planning/planning_state_machine:
  ros__parameters:
    enabled: true

    # =========================================================================
    # 1. INPUT TOPICS
    # =========================================================================
    # Consume aggregated diagnostics for module health state.
    state_status_topic: "/system/diagnostics_agg"
    # HH_260720 - Consume the generated CAMROD lanelet pose and snapped goal.
    pose_topic: "/planning/lanelet_pose"
    # HH_260721 - Keep automatic return routing synchronized with the actual
    # vehicle pose after any off-lane campsite maneuver.
    return_start_vehicle_pose_topic: "/localization/pose"
    return_start_pose_max_distance_m: 1.5
    return_start_pose_stale_timeout_s: 1.0
    # State machine tracks snapped goal stream only.
    goal_topic: "/planning/goal_pose_snapped"
    # HH_260727 - Manual RViz goals and regulated UI goals retain separate semantics.
    goal_source_topic: "/planning/goal_source"
    # HH_260727 - Route every generated mission goal through the regulated snapper.
    auto_goal_snapper_input_topic: "/planning/auto_goal_raw"

    # =========================================================================
    # 2. STATE AND SCENARIO OUTPUTS
    # =========================================================================
    state_topic: "/planning/state_machine/state"
    estop_topic: "/planning/state_machine/estop"
    # HH_260528 Scenario contract for UI integration:
    # 0=WAIT_DROP_ZONE, 1=DELIVERY_TO_SITE, 2=RETURN_TO_DROP_ZONE, 3=RECALL_TO_SITE
    scenario_id_topic: "/planning/state_machine/scenario_id"
    scenario_command_topic: "/planning/state_machine/scenario_command"

    # =========================================================================
    # 3. MANEUVER PHASE OVERRIDE
    # =========================================================================
    # HH_260720 - Validation profiles mirror maneuver phases into planning state.
    enable_maneuver_phase_state_override: true
    # HH_260721 - Consume operational progress independently from diagnostic health.
    maneuver_phase_state_topic: "/service/state"
    # HH_260720 - Maneuver phase transitions persist until an explicit mission or route change.
    maneuver_phase_override_timeout_s: 0.0

    # =========================================================================
    # 4. MISSION AND RETURN TOPICS
    # =========================================================================
    return_to_drop_zone_topic: "/planning/state_machine/return_to_drop_zone"
    # Recall request published from a camping site.
    # msg.data = camping site name (e.g. "camping_site_3"); triggers return to return_mission_key.
    camping_site_recall_topic: "/planning/state_machine/camping_site_recall"
    mission_source_topic: "/planning/state_machine/mission_source"
    # HH_260617: Use mission-key naming for semantic destination commands.
    return_mission_key: "drop_zone"
    # HH_260624 - Select the map-exported drop-zone area used for return goals.
    drop_zone_id: "drop_zone"
    # HH_260624 - RViz/debug copy of the raw station-center return target.
    drop_zone_goal_raw_topic: "/planning/drop_zone_goal_raw"
    # HH_260720 - Standard ROS mirror for RViz only.
    drop_zone_goal_raw_ros_topic: "/planning/drop_zone_goal_raw_ros"
    # HH_260727 - Apply semantic drop-zone matching only to regulated UI/mission goals.
    raw_goal_topic: "/planning/site_goal_pose_ros"
    enable_raw_drop_zone_goal_match: true
    drop_zone_raw_goal_match_distance_m: 3.0
    mission_key_topic: "/planning/mission_key"
    request_mission_service: "/planning/request_mission"
    status_stream_topic: "/status_stream"

    # =========================================================================
    # 5. MISSION FILES AND KEYS
    # =========================================================================
    # Launch passes resolved keypoints/camping YAML paths; keep defaults empty
    # to avoid host-specific absolute path hardcoding.
    keypoints_yaml: ""
    camping_sites_yaml: ""
    # HH_260617: Startup/warn keys use the same mission-key contract as UI.
    startup_mission_key: "drop_zone"
    warn_mission_key: "garage"

    # =========================================================================
    # 6. STARTUP AND ERROR BEHAVIOR
    # =========================================================================
    auto_startup_goal: true
    auto_warn_recovery_goal: true
    auto_estop_on_error: true

    # =========================================================================
    # 7. AUTO RETURN AND MISSION-KEY MATCHING
    # =========================================================================
    # Fast validation profile for auto-return tests.
    # After reaching camping_site_*, wait briefly then return to drop_zone automatically.
    enable_auto_return_on_site_goal: true
    # HH_260617: Auto-return matches semantic campsite mission keys.
    site_mission_key_prefix: "camping_site_"
    # Test-only dwell to avoid 10-minute waits during CI/dev checks.
    goal_reached_dwell_s: 15.0
    mission_key_match_distance_m: 1.5
    # HH_260618: Preserve drop_zone semantic key for return route-goal echoes
    # that are lanelet-snap poses rather than the exact station center.
    return_goal_key_preserve_distance_m: 5.0
    # HH_260618: Preserve camping_site_* semantic key for repeated snapped route-goal echoes.
    site_goal_key_preserve_distance_m: 2.0
    # HH_260619 - UI mission_key is authoritative for the immediately following
    # snapped route goal, even if stale geometry matches another keypoint.
    pending_mission_key_preserve_s: 5.0
    pending_mission_key_overrides_goal_match: true

    # =========================================================================
    # 8. GOAL ARRIVAL AND HANDOFF
    # =========================================================================
    min_goal_publish_interval_s: 1.0
    # HH_260623 - Fast auto-return tests use the same center-based arrival
    # threshold as normal bringup to prevent early test-only success.
    goal_reached_distance_m: 0.2
    # HH_260623 - Return handoff stays slightly wider for drop-zone geometry.
    return_goal_reached_distance_m: 0.3
    # HH_260720 - Hold route arrival for control alignment handoff reliability.
    reverse_parking_controller_handoff_hold_s: 1.0
    loop_rate_hz: 5.0
