# Nav2 lanelet profile: map/costmap semantics and lanelet-specific planner tuning.

planner_server:
  ros__parameters:
    Smac2D:
      # HH_260618: SmacPlanner2D runtime-declared tuning surface is intentionally
      # small: cost_travel_multiplier plus smoother settings. Hybrid-only fields
      # were removed because Humble ignores them for SmacPlanner2D.
      # 2026-02-25: Keep center bias but reduce grid-quantized "kinks" at bends.
      cost_travel_multiplier: 12.0
      smoother:
        # Keep smoothed curvature but prevent corner-cutting off centerline.
        max_iterations: 4000
        # HH_260618: Increase smoothing enough to remove visible Smac2D stair-step
        # jitter while preserving the lanelet center-cost data term.
        w_data: 0.90
        w_smooth: 0.10
        tolerance: 1.0e-8
        do_refinement: true

local_costmap:
  local_costmap:
    ros__parameters:
      # HHL_260622 - Local controllers must not collision-check against static
      # lanelet/global-path guide grids. Those grids are route guidance and
      # safety-gate inputs, not physical obstacles. Keep the local Nav2 costmap
      # dynamic-only so RPP/MPPI do not falsely report collision at lane merges
      # or on the active route boundary.
      plugins:
        - lidar_cost_layer
        - radar_cost_layer
        - inflation_layer

      lidar_cost_layer:
        plugin: "camrod_map::cost_map::LaneletCostLayer"
        source_topic: "/sensing/cost_grid/lidar"
        lethal_threshold: 85
        unknown_value: 0
        write_unknown: false
        start_current: true

      radar_cost_layer:
        plugin: "camrod_map::cost_map::LaneletCostLayer"
        source_topic: "/sensing/cost_grid/radar"
        lethal_threshold: 85
        unknown_value: 0
        write_unknown: false
        start_current: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.0
        cost_scaling_factor: 5.0

global_costmap:
  global_costmap:
    ros__parameters:
      lanelet_cost_layer_base:
        plugin: "camrod_map::cost_map::LaneletCostLayer"
        source_topic: "/map/cost_grid/lanelet"
        lethal_threshold: 100
        # Keep lanelet-boundary discipline for global planning as well.
        unknown_value: 255
        # Write unknown for base lanelet mask so non-lanelet cells
        # remain non-traversable in master costmap.
        write_unknown: true
        # HH_260528: Base lanelet layer stays strict; wait for first map cost grid.
        start_current: false

      # Do not inject /planning/cost_grid/global_path into global planner master.
      # Reason: this creates a circular dependency
      #   planner -> global_path -> global_path_cost_grid -> planner master
      # and causes intermittent no-path / oscillating replans.

      lidar_cost_layer:
        plugin: "camrod_map::cost_map::LaneletCostLayer"
        source_topic: "/sensing/cost_grid/lidar"
        # HH_260619 - LiDAR/Radar cost grids peak at 95. Use 85 so Smac2D
        # fallback replans treat persistent obstacles as blocked, not merely
        # high-cost soft penalties.
        lethal_threshold: 85
        unknown_value: 0
        # Keep no-data cells from clearing base lanelet costs.
        write_unknown: false
        # HH_260528: Sensor layer can start current and apply costs once first grid arrives.
        start_current: true

      radar_cost_layer:
        plugin: "camrod_map::cost_map::LaneletCostLayer"
        source_topic: "/sensing/cost_grid/radar"
        # HH_260619 - Match obstacle_replan_monitor threshold so global fallback
        # replans route around radar-confirmed blockage when free space exists.
        lethal_threshold: 85
        unknown_value: 0
        # Keep no-data cells from clearing base lanelet costs.
        write_unknown: false
        # HH_260528: Sensor layer can start current and apply costs once first grid arrives.
        start_current: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # HH_260513: Reduced from 1.5 → 1.0 to prevent inflation from lanelet
        # boundary cells reaching robot start position (Starting point in lethal space).
        inflation_radius: 1.0
        cost_scaling_factor: 3.0
