/planning/planning_state_machine:
  ros__parameters:
    enabled: true
    # Use isolated diagnostics topic for long synthetic scenario validation.
    # This prevents simulated checker ERROR levels from forcing ERROR_STOP.
    state_status_topic: "/system/diagnostics_agg_test"
    pose_topic: "/planning/lanelet_pose_ros"
    # State machine tracks snapped goal topic and mirrors to ROS goal output.
    goal_topic: "/planning/goal_pose_snapped_ros"
    goal_topic_ros: "/planning/goal_pose_snapped_ros"
    # HH_260623 - Auto return/drop-zone goals are raw station poses and must be
    # snapped before Nav2; campsite UI goals still use /goal_pose.
    auto_goal_snapper_input_topic: "/planning/auto_goal_raw"
    auto_goal_snapper_keys: ["drop_zone"]
    state_topic: "/planning/state_machine/state"
    estop_topic: "/planning/state_machine/estop"
    # HH_260528 Scenario contract for UI integration:
    # 0=WAIT_DROP_ZONE, 1=DELIVERY_TO_SITE, 2=RETURN_TO_DROP_ZONE, 3=RECALL_TO_SITE
    scenario_id_topic: "/planning/state_machine/scenario_id"
    scenario_command_topic: "/planning/state_machine/scenario_command"
    # HH_260622 - Sim/validation profiles mirror parking phases into planning state.
    enable_parking_phase_state_override: true
    parking_phase_state_topic: "/AMR_service_state"
    # HH_260622 - Parking phase transition events persist until an explicit mission/route change clears them.
    parking_phase_override_timeout_s: 0.0
    return_to_drop_zone_topic: "/planning/state_machine/return_to_drop_zone"
    camping_site_recall_topic: "/planning/state_machine/camping_site_recall"
    mission_source_topic: "/planning/state_machine/mission_source"
    # HH_260617: Use mission-key naming for semantic destination commands.
    return_mission_key: "drop_zone"
    # HH_260624 - Select the map-exported drop-zone area used for return goals.
    drop_zone_id: "drop_zone"
    # HH_260624 - RViz/debug copy of the raw station-center return target.
    drop_zone_goal_raw_topic: "/planning/drop_zone_goal_raw"
    # HH_260624 - Preserve manual /goal_pose drop-zone semantics before goal_snapper snaps to lanelet.
    raw_goal_topic: "/goal_pose"
    enable_raw_drop_zone_goal_match: true
    drop_zone_raw_goal_match_distance_m: 3.0
    mission_key_topic: "/planning/mission_key"
    request_mission_service: "/planning/request_mission"
    status_stream_topic: "/status_stream"

    # Launch injects absolute file paths.
    keypoints_yaml: ""
    camping_sites_yaml: ""
    # HH_260617: Startup/warn keys use the same mission-key contract as UI.
    startup_mission_key: "drop_zone"
    warn_mission_key: "garage"

    auto_startup_goal: true
    auto_warn_recovery_goal: true
    # Keep state machine running during long synthetic runs where diagnostics
    # checkers can temporarily degrade due simulated sensor dropouts.
    auto_estop_on_error: false

    # Long-run validation profile:
    # when camping_site_* is reached, wait 600s then auto-return.
    enable_auto_return_on_site_goal: true
    # HH_260617: Auto-return matches semantic campsite mission keys.
    site_mission_key_prefix: "camping_site_"
    goal_reached_dwell_s: 600.0
    mission_key_match_distance_m: 1.5
    # HH_260618: Preserve drop_zone semantic key for return route-goal echoes
    # that are lanelet-snap poses rather than the exact station center.
    return_goal_key_preserve_distance_m: 5.0
    # HH_260618: Preserve camping_site_* semantic key for repeated snapped route-goal echoes.
    site_goal_key_preserve_distance_m: 2.0
    # HH_260619 - UI mission_key is authoritative for the immediately following
    # snapped route goal, even if stale geometry matches another keypoint.
    pending_mission_key_preserve_s: 5.0
    pending_mission_key_overrides_goal_match: true
    require_docking_for_idle: false
    docking_status_topic: "/docking/is_charging"

    min_goal_publish_interval_s: 1.0
    # HH_260623 - Long auto-return tests use the same center-based arrival
    # threshold as normal bringup to prevent early test-only success.
    goal_reached_distance_m: 0.2
    # HH_260623 - Return handoff stays slightly wider for drop-zone geometry.
    return_goal_reached_distance_m: 0.3
    # HH_260623 - Hold return GOAL_REACHED for parking handoff reliability.
    drop_zone_parking_handoff_hold_s: 1.0
    loop_rate_hz: 5.0
