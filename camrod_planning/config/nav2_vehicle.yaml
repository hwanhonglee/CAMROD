      footprint: "[[0.764436, 0.500405], [0.783090, 0.477675], [0.796952, 0.451742], [0.805488, 0.423603], [0.808370, 0.394339], [0.808370, -0.394239], [0.805488, -0.423503], [0.796952, -0.451642], [0.783090, -0.477575], [0.764436, -0.500305], [0.673725, -0.591016], [0.650995, -0.609670], [0.625062, -0.623532], [0.596923, -0.632068], [0.567659, -0.634950], [-0.633230, -0.634950], [-0.690633, -0.623532], [-0.739296, -0.591016], [-0.771812, -0.542353], [-0.783230, -0.484950], [-0.783230, 0.485050], [-0.771812, 0.542453], [-0.739296, 0.591116], [-0.690633, 0.623632], [-0.633230, 0.635050], [0.567659, 0.635050], [0.596923, 0.632168], [0.625062, 0.623632], [0.650995, 0.609770], [0.673725, 0.591116]]"
