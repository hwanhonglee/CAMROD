# Nav2 base profile: framework defaults and common node wiring.
# Layout: 1) planner server, 2) controller server, 3) local costmap,
#         4) global costmap, 5) BT navigator, 6) behavior server.

# =========================================================================
# 1. PLANNER SERVER
# =========================================================================
planner_server:
  ros__parameters:
    # HH_260527: use_sim_time options:
    #   True: follow /clock (simulation/replay)
    #   False: use system ROS time (real hardware default)
    use_sim_time: False
    # Further relax planner loop target for full-stack bringup.
    # This reduces planner-loop starvation under heavy CPU load and keeps
    # replanning stable during iterative goal updates.
    # Align expected loop with practical realtime throughput to
    # reduce repeated "planner loop missed rate" warnings under full load.
    # Match practical planner throughput under full real-sensor load.
    expected_planner_frequency: 0.5
    # Prevent planner action hang when costmap current-state is delayed.
    # 0.0 = wait forever, >0 = timeout seconds.
    # Give global costmap more settle time before timeout warning.
    # Allow extra settle time for layered global costmap current-state.
    # HH_260528: Reduce costmap wait to improve plan response latency.
    # Large timeout (12s) caused slow recoveries after global-costmap clear.
    costmap_wait_timeout_sec: 2.5
    # HH_260720 - Runtime-selectable planner IDs use /planning/planner_selector_ros.
    # HH_260626: Load LaneletRoute by default so normal plans follow connected
    # lanelet successors before any grid fallback planner is tried.
    planner_plugins: ["LaneletRoute", "Smac2D", "NavFn", "ThetaStar", "SmacHybrid", "SmacLattice"]

    LaneletRoute:
      plugin: "camrod_planning::LaneletRoutePlanner"
      # HH_260626: Exact lanelet-centerline route planner. Keep lane changes
      # disabled by default to avoid adjacent-lane shortcuts on parallel lanes.
      map_path: ""
      offset_lat: 0.0
      offset_lon: 0.0
      offset_alt: 0.0
      frame_id: "map"
      routing_location: "de"
      routing_participant: "vehicle:car"
      allow_lane_changes: false
      max_snap_distance_m: 8.0
      interpolation_resolution_m: 0.20
      same_lane_forward_epsilon_m: 0.30
      # HH_260723 - Only an explicit campsite return request may use the
      # reversed outbound shortest path; ordinary goals always retain one-way routing.
      enable_reverse_lanelet_shortest_path: true
      reverse_lanelet_request_topic: "/planning/state_machine/return_to_drop_zone"
      reverse_lanelet_request_timeout_s: 10.0
      # The campsite maneuver turns about 180 degrees before requesting its route.
      reverse_lanelet_start_heading_threshold_deg: 120.0
      # HH_260707 - Keep LaneletRoute output on the 2D planning plane.
      flatten_path_z: true
      # HH_260708: Build the heavy Lanelet2 map/routing graph in the background.
      # This keeps Nav2 lifecycle bringup responsive; the first plan waits here
      # if it arrives before the route graph is ready.
      async_initialization: true
      async_initialization_plan_wait_timeout_s: 60.0
      # HH_260619: Exact route lanelet IDs feed route-aware cost grids at merge areas.
      route_lanelet_ids_topic: "/planning/route_lanelet_ids"

    NavFn:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # Keep final solve tight; goal_snapper already maps user goal into lanelet.
      tolerance: 0.5
      # HH_260527: use_astar options:
      #   True: A* search (heuristic-guided, usually faster/straighter)
      #   False: Dijkstra-style expansion
      use_astar: True
      # Enforce in-map/in-lane planning.
      # Allowing unknown made free-space shortcuts possible outside designated lanelet region.
      allow_unknown: False

    Smac2D:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      # Enforce in-map/in-lane planning.
      allow_unknown: False
      # Keep final solve tight; goal_snapper already maps user goal into lanelet.
      tolerance: 0.5
      downsample_costmap: False
      downsampling_factor: 1
      # HH_260618: Keep only parameters declared by Nav2 Humble SmacPlanner2D.
      # Hybrid-A* parameters such as motion_model_for_search and angle bins are
      # ignored by this plugin and made planner tuning hard to reason about.
      use_final_approach_orientation: false
      # HH_260513: Increase limits — lanelet map with inflation_radius 1.5m
      # requires more iterations than urban/open maps.
      max_iterations: 2000000
      max_on_approach_iterations: 1000
      # HH_260528: Cap Smac planning budget for faster failover to NavFn.
      max_planning_time: 1.2

    ThetaStar:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      allow_unknown: False

    SmacHybrid:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      allow_unknown: False
      tolerance: 0.5
      downsample_costmap: False
      downsampling_factor: 1
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 32
      minimum_turning_radius: 0.6
      analytic_expansion_ratio: 3.5
      max_iterations: 2000000
      max_on_approach_iterations: 1000
      # HH_260528: Cap Smac planning budget for faster failover to NavFn.
      max_planning_time: 1.2
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.1
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      smooth_path: True

    SmacLattice:
      plugin: "nav2_smac_planner/SmacPlannerLattice"
      allow_unknown: False
      tolerance: 0.5
      downsample_costmap: False
      downsampling_factor: 1
      # HH_260618: Match the bundled Ackermann lattice primitive file (1m_turning_radius)
      # so curved lanelet bends are planned as feasible arcs, not straight shortcuts.
      minimum_turning_radius: 1.0
      max_iterations: 2000000
      max_on_approach_iterations: 1000
      # HH_260528: Cap Smac planning budget for faster failover to NavFn.
      max_planning_time: 1.2
      lookup_table_size: 20.0
      # HH_260720 - nav2_lanelet.launch.py replaces this marker with the installed package-share path.
      lattice_filepath: "__resolved_by_nav2_lanelet_launch__"
      # HH_260619 - Make centerline cost dominate over shorter corner-cutting
      # routes. The lanelet cost grid now encodes center=low, off-center=high,
      # boundary=near-lethal, so Lattice must weight cost enough to respect it.
      cost_penalty: 6.0
      non_straight_penalty: 1.0
      retrospective_penalty: 0.0
      smoother:
        # HH_260619 - Keep enough data weight to preserve the centerline-biased
        # route while still smoothing motion-primitive stair steps.
        max_iterations: 2000
        w_data: 0.45
        w_smooth: 0.25
        tolerance: 1.0e-8
        do_refinement: true
      smooth_path: True

# =========================================================================
# 2. CONTROLLER SERVER
# =========================================================================
controller_server:
  ros__parameters:
    use_sim_time: False
    # Tune controller loop for real stack load.
    # 30Hz was repeatedly missed during full sensing/RViz operation on Orin;
    # 15Hz matches observed controller runtime and avoids abort/recovery churn.
    controller_frequency: 15.0
    # Allow longer transient control failures while local TF/costmap
    # synchronizes, so cmd_vel stream can recover instead of immediate abort.
    # Increase tolerance to avoid frequent FollowPath abort/recovery
    # loops during transient sensor/costmap jitter.
    failure_tolerance: 20.0

    # HH_260720 - Nav2 consumes the explicit nav_msgs boundary mirror.
    odom_topic: /localization/odometry_ros
    # Keep deadband thresholds permissive so low-speed commands are
    # not quantized to zero during startup alignment.
    min_x_velocity_threshold: 0.0001
    min_y_velocity_threshold: 0.0001
    min_theta_velocity_threshold: 0.0001

    # Explicit speed-limit channel for planning namespace users.
    speed_limit_topic: /planning/speed_limit

    # Restore canonical Nav2 checker parameter names.
    # Nav2 controller server reads *_checker_* keys; validator keys are ignored.
    progress_checker_plugin: "progress_checker"
    # HH_260727 - Manual RViz goals select a stricter yaw-aware arrival policy.
    goal_checker_plugins: ["goal_checker", "manual_goal_checker"]
    # HH_260720 - Controller IDs use /planning/controller_selector_ros:
    # RPP | DWB | MPPI | Graceful | RotationShim
    controller_plugins: ["RPP", "DWB", "MPPI", "Graceful", "RotationShim"]
    # HH_260625: RPP is the real-platform default; MPPI remains selectable.
    default_controller: RPP

    progress_checker:
      # HH_260720 - Pause progress timeout while control command output is disabled.
      # an operator can inspect/revise goals before explicitly engaging motion.
      plugin: "camrod_planning::EngageAwareProgressChecker"
      engaged_topic: /control/command_enabled
      default_engaged: false
      # Relax progress checks to avoid false abort during TF/costmap
      # warm-up right after new goal acceptance.
      # Further relax progress thresholds for real-sensor startup
      # where odometry progress can be intermittent.
      required_movement_radius: 0.03
      movement_time_allowance: 120.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # HH_260803 - Use the axle-midpoint robot_center_link as the arrival reference. A
      # wide 0.8 m tolerance made Nav2 succeed when only the front footprint
      # reached the marker, before the robot center reached the goal pose.
      # HH_260720 - A 0.3 m tolerance is sufficient for the lanelet snap handoff;
      # the control or parking owner performs the precise local maneuver afterward.
      # Some lanelet routes end about 0.2 m from the semantic handoff pose, so 0.15 m
      # could prevent Nav2 completion while 0.3 m remains much tighter than 0.8 m.
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 3.14
      stateful: False

    # HH_260727 - Preserve the RViz goal arrow through final arrival instead of
    # accepting any heading as the regulated lanelet handoff checker does.
    manual_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.174533
      stateful: True

    # DWB controller profile. Runtime selection is done by
    # HH_260720 - /planning/controller_selector_ros is the Nav2 std_msgs boundary.
    DWB:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False

      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 1.4
      max_vel_y: 0.0
      max_vel_theta: 1.2
      min_speed_xy: 0.0
      max_speed_xy: 1.4
      min_speed_theta: 0.0

      acc_lim_x: 1.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.0
      decel_lim_x: -1.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.0

      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 24

      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      # HH_260623 - Keep DWB fallback aligned with the center-based Nav2
      # arrival tolerance so controller selection does not change stop point.
      xy_goal_tolerance: 0.3
      trans_stopped_velocity: 0.10
      short_circuit_trajectory_evaluation: True
      stateful: True

      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # HH_260618: Keep DWB as a selectable fallback, but make obstacle cost
      # meaningful if used in narrow campground lanes.
      BaseObstacle.scale: 0.08
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 18.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 24.0
      GoalDist.scale: 18.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

    MPPI:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40
      # HH_260625: controller_frequency=15Hz gives a 0.0667s control period.
      # MPPI requires model_dt >= controller period even when RPP is selected by default.
      model_dt: 0.07
      batch_size: 600
      iteration_count: 1
      prune_distance: 2.0
      transform_tolerance: 0.2

      vx_max: 1.4
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 1.2
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      ax_max: 1.5
      ax_min: -1.5
      ay_max: 0.0
      az_max: 3.0

      temperature: 0.3
      gamma: 0.015

      motion_model: "DiffDrive"
      regenerate_noises: False
      visualize: False

      critics: [
        "ConstraintCritic",
        "CostCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic",
        "PreferForwardCritic"
      ]
      ConstraintCritic.enabled: True
      CostCritic.enabled: True
      GoalCritic.enabled: True
      GoalAngleCritic.enabled: True
      PathAlignCritic.enabled: True
      PathFollowCritic.enabled: True
      PathAngleCritic.enabled: True
      PreferForwardCritic.enabled: True

      # HH_260618: Local avoidance tuning for long-duration campground operation.
      # CostCritic must dominate path-following when the reference path is blocked.
      CostCritic.cost_weight: 8.0
      CostCritic.critical_cost: 250.0
      CostCritic.collision_cost: 1000000.0
      CostCritic.consider_footprint: True
      CostCritic.inflation_layer_name: "inflation_layer"
      CostCritic.near_goal_distance: 0.5
      # HH_260622 - Keep stronger centerline adherence in high-curvature
      # segments. A weak path-align term plus a far PathFollow target made MPPI
      # cut inside curves instead of understeering along the lane centerline.
      PathAlignCritic.cost_weight: 10.0
      PathAlignCritic.max_path_occupancy_ratio: 0.07
      PathAlignCritic.trajectory_point_step: 3
      PathAlignCritic.threshold_to_consider: 0.5
      # HH_260622 - Reduce future-point pull so local trajectories do not
      # shortcut the inside of curved lanelet centerlines.
      PathFollowCritic.cost_weight: 4.0
      PathFollowCritic.offset_from_furthest: 4
      PathFollowCritic.threshold_to_consider: 1.0
      PathAngleCritic.cost_weight: 3.0
      PathAngleCritic.forward_preference: True
      PathAngleCritic.threshold_to_consider: 0.5
      PreferForwardCritic.cost_weight: 5.0

    Graceful:
      plugin: "nav2_graceful_controller::GracefulController"
      transform_tolerance: 0.2
      k_phi: 2.0
      k_delta: 1.0
      beta: 0.4
      lambda: 2.0
      v_linear_min: 0.0
      v_linear_max: 1.4
      v_linear_max_initial: 0.8
      v_angular_max: 1.2
      v_angular_max_initial: 1.2
      slowdown_radius: 1.5
      initial_rotation: True
      initial_rotation_min_angle: 0.78
      final_rotation: True
      rotation_scaling_factor: 1.0
      allow_backward: False

    RotationShim:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # HH_260806 - Keep the shim in rotation ownership until heading error is
      # below 2 degrees instead of handing off at the previous 45 degrees.
      angular_dist_threshold: 0.0349066
      forward_sampling_distance: 0.5
      # HH_260731 - Conservative heading transition for the outdoor recovery test.
      # The final gate limits this to 0.20 rad/s.
      rotate_to_heading_angular_vel: 0.4
      max_angular_accel: 0.8
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: True
      # RotationShim owns a separate internal RPP; keep it identical to the
      # regulated 0.4 m/s source (0.20 m/s after the final gate).
      desired_linear_vel: 0.4
      # HH_260801 - Match the full-bringup-swept low-speed preview used by the
      # direct RPP selected for UI missions.
      lookahead_dist: 1.1
      min_lookahead_dist: 1.1
      max_lookahead_dist: 2.0
      lookahead_time: 1.8
      use_velocity_scaled_lookahead_dist: True
      use_interpolation: True
      allow_reversing: False
      use_rotate_to_heading: True
      rotate_to_heading_min_angle: 0.0349066
      min_approach_linear_velocity: 0.10
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: True
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: True
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.2
      use_cost_regulated_linear_velocity_scaling: True
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0

# =========================================================================
# 3. LOCAL COSTMAP
# =========================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      # Use odom for local costmap to reduce map<->odom transform
      # sensitivity in controller loop and improve FollowPath stability.
      global_frame: odom
      # Keep Nav2 base frame aligned with platform/localization TF.
      robot_base_frame: robot_center_link
      # HH_260618: Lower local costmap load; merged inflation grid now runs at 6 Hz.
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: True
      # Coarsen local rolling window grid slightly for stability.
      width: 45
      height: 45
      resolution: 0.10
      # Start from free-space master so controller is not blocked by unknown-only map state.
      track_unknown_space: False
      plugins:
        # combined_cost_layer: reads pre-merged /planning/cost_grid/inflation into master.
        # inflation_layer: Nav2 built-in — spreads lethal cells radially (safety margin).
        - combined_cost_layer
        - inflation_layer

# =========================================================================
# 4. GLOBAL COSTMAP
# =========================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: map
      # Keep Nav2 base frame aligned with platform/localization TF.
      robot_base_frame: robot_center_link
      # HH_260618: Lower global rolling-costmap load; replans still update on BT/planner events.
      update_frequency: 1.0
      publish_frequency: 0.5
      # Keep planner global costmap centered on robot to prevent
      # startup failures when localization origin drifts from fixed map bounds.
      rolling_window: True
      # Match global rolling window to lanelet cost grid source window.
      # Reason: keep planner solve horizon bounded for responsive ComputePath results.
      # 45m window was too small for practical goal distances in
      # map-frame testing, causing repeated "no valid path found".
      # Expand rolling bounds to recover stable global-path generation.
      # enlarge global rolling window margin to reduce
      # near-edge planner aborts on long map-frame goals.
      # HH_260617: 240 m rolling window keeps distant camping-site route goals inside the global planner costmap.
      width: 240
      height: 240
      resolution: 0.10
      # HH_260623 - Keep explicit origin fields for Nav2 costmap schema clarity;
      # rolling_window mode ignores them at runtime.
      origin_x: -100.0
      origin_y: -50.0
      # HH_260527: Keep unknown as unknown in global master.
      # This prevents implicit free-space shortcuts when a layer does not explicitly
      # write cells (for example outside moving source windows).
      track_unknown_space: True
      # Keep global planner master independent from
      # /planning/cost_grid/global_path guidance layer.
      # Using a path-guidance layer in the same costmap that generates that path
      # creates circular dependence and can produce intermittent no-path failures.
      plugins:
        # Enforce lanelet drivable-space constraints for global planning.
        # Without this layer, Smac can output free-space shortcuts on the wrong side.
        - lanelet_cost_layer_base
        - lidar_cost_layer
        - radar_cost_layer
        - inflation_layer

# =========================================================================
# 5. BT NAVIGATOR
# =========================================================================
bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    # Keep BT transform helpers aligned with lanelet-snapped base frame.
    robot_base_frame: robot_center_link
    # HH_260720 - Nav2 consumes the explicit nav_msgs boundary mirror.
    odom_topic: /localization/odometry_ros
    # HH_260619 - Plan from the lanelet-snapped pose so the published global/local
    # route starts on the nominal lane centerline. The real localization pose is
    # still used by control; this avoids drawing a misleading short connector
    # around the robot when the vehicle is slightly off center or yaw-biased.
    use_start_pose_override: True
    start_pose_topic: /planning/lanelet_pose_ros
    # HH_260619 - Use snapped XY but current robot yaw for the planner start.
    # This prevents opposite centerline segment headings from generating a
    # backward/S-shaped path only around the first few meters.
    # HH_260721 - Preserve the completed 180-degree return alignment so the planner selects reverse_shortest.
    start_pose_override_yaw_source: current_pose
    # Tolerate EKF/TF jitter observed during full bringup load.
    transform_tolerance: 0.5

# =========================================================================
# 6. BEHAVIOR SERVER
# =========================================================================
behavior_server:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    local_frame: odom
    # Keep recovery behaviors aligned with lanelet-snapped base frame.
    robot_base_frame: robot_center_link
    # Match Nav2 TF tolerance across BT/recovery nodes.
    transform_tolerance: 0.5
