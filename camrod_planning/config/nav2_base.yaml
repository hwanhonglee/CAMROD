# Nav2 base profile: framework defaults and common node wiring.

planner_server:
  ros__parameters:
    use_sim_time: False
    # HH_260330: Further relax planner loop target for full-stack bringup.
    # This reduces planner-loop starvation under heavy CPU load and keeps
    # replanning stable during iterative goal updates.
    expected_planner_frequency: 2.0
    planner_plugins: ["Smac2D", "GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # Keep final solve tight; goal_snapper already maps user goal into lanelet.
      tolerance: 0.5
      use_astar: True
      # HH_260327: Enforce in-map/in-lane planning.
      # Allowing unknown made free-space shortcuts possible outside designated lanelet region.
      allow_unknown: False

    Smac2D:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      # HH_260327: Enforce in-map/in-lane planning.
      allow_unknown: False
      # Keep final solve tight; goal_snapper already maps user goal into lanelet.
      tolerance: 0.5
      downsample_costmap: False
      downsampling_factor: 1
      use_astar: True
      # HH_260330: Use forward-only motion model for controller compatibility.
      # REEDS_SHEPP reverse segments were causing repeated FollowPath aborts
      # with the current pure-pursuit controller setup.
      motion_model_for_search: "DUBIN"
      # 2026-02-25: Finer heading discretization for smoother corner geometry.
      # HH_260327: Reduce heading-bin density to lower planner CPU without
      # changing topology or plugin structure.
      angle_quantization_bins: 96

controller_server:
  ros__parameters:
    use_sim_time: False
    # HH_260331: Control cmd stream target for real platform driving.
    # /planning/cmd_vel_raw and /planning/cmd_vel should follow this loop rate.
    controller_frequency: 40.0
    # HH_260330: Allow longer transient control failures while local TF/costmap
    # synchronizes, so cmd_vel stream can recover instead of immediate abort.
    failure_tolerance: 8.0
    odom_topic: /localization/odometry/filtered
    # HH_260330: Keep deadband thresholds permissive so low-speed commands are
    # not quantized to zero during startup alignment.
    min_x_velocity_threshold: 0.0001
    min_y_velocity_threshold: 0.0001
    min_theta_velocity_threshold: 0.0001
    # HH_260315-00:00 Explicit speed-limit channel for planning namespace users.
    speed_limit_topic: /planning/speed_limit
    # HH_260326: Restore canonical Nav2 checker parameter names.
    # Nav2 controller server reads *_checker_* keys; validator keys are ignored.
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    # 2026-02-25: Use a single active controller by default to avoid
    # duplicate debug topics (/planning/cost_cloud, /planning/evaluation)
    # from unused DWB plugin loading.
    controller_plugins: ["FollowPath"]
    default_controller: FollowPath

    # HH_260326: Restore Humble plugin class names required by nav2_controller.
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # HH_260330: Relax progress checks to avoid false abort during TF/costmap
      # warm-up right after new goal acceptance.
      required_movement_radius: 0.05
      movement_time_allowance: 60.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.25
      stateful: False

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      # HH_260330: Use odom for local costmap to reduce map<->odom transform
      # sensitivity in controller loop and improve FollowPath stability.
      global_frame: odom
      # Keep Nav2 base frame aligned with platform/localization TF.
      robot_base_frame: robot_base_link
      # HH_260330: Further lower local costmap rates to prevent controller loop miss.
      update_frequency: 4.0
      publish_frequency: 2.0
      rolling_window: True
      # HH_260327: Coarsen local rolling window grid slightly for stability.
      width: 45
      height: 45
      resolution: 0.10
      # HH_260326: Start from free-space master so controller is not blocked by unknown-only map state.
      track_unknown_space: False
      plugins:
        # HH_260326: Keep local planning tied to lanelet drivable region.
        # Without base lanelet layer, local/global plans can jump to wrong-side lanes.
        - lanelet_cost_layer_base
        # HH_260330: Temporarily disable local_path helper layer from controller
        # master costmap to prevent FollowPath abort loops from stale/empty
        # local-path grids during goal updates.
        - lidar_cost_layer
        - radar_cost_layer
        - inflation_layer

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: map
      # Keep Nav2 base frame aligned with platform/localization TF.
      robot_base_frame: robot_base_link
      # HH_260313-00:00 Raise global master refresh so goal updates are reflected faster.
      # HH_260327: Lower global costmap update pressure for planner stability.
      update_frequency: 4.0
      publish_frequency: 2.0
      # HH_260326: Keep planner global costmap centered on robot to prevent
      # startup failures when localization origin drifts from legacy fixed bounds.
      rolling_window: True
      # HH_260326: Match global rolling window to planning_base source window.
      # Reason: keep planner solve horizon bounded for responsive ComputePath results.
      # HH_260329: 45m window was too small for practical goal distances in
      # map-frame testing, causing repeated "no valid path found".
      # Expand rolling bounds to recover stable global-path generation.
      width: 120
      height: 120
      resolution: 0.10
      # HH_260326: origin_* retained for backward compatibility; ignored in rolling window mode.
      origin_x: -100.0
      origin_y: -50.0
      # HH_260326: Start from free-space master so planner is not blocked before map layers settle.
      track_unknown_space: False
      # HH_260316-00:00 Keep global planner master independent from
      # /planning/cost_grid/global_path guidance layer.
      # Using a path-guidance layer in the same costmap that generates that path
      # creates circular dependence and can produce intermittent no-path failures.
      plugins:
        # HH_260326: Enforce lanelet drivable-space constraints for global planning.
        # Without this layer, Smac can output free-space shortcuts on the wrong side.
        - lanelet_cost_layer_base
        - lidar_cost_layer
        - radar_cost_layer
        - inflation_layer

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    # HH_260316-00:00 Keep BT transform helpers aligned with lanelet-snapped base frame.
    robot_base_frame: robot_base_link
    odom_topic: /localization/odometry/filtered
    # HH_260330: Tolerate EKF/TF jitter observed during full bringup load.
    transform_tolerance: 0.5

behavior_server:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    local_frame: odom
    # HH_260316-00:00 Keep recovery behaviors aligned with lanelet-snapped base frame.
    robot_base_frame: robot_base_link
    # HH_260330: Match Nav2 TF tolerance across BT/recovery nodes.
    transform_tolerance: 0.5
