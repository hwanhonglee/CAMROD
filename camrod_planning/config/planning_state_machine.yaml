/planning/planning_state_machine:
  ros__parameters:
    enabled: true
    state_status_topic: "/system/diagnostics_agg"
    # HH_260720 - Consume the generated CAMROD lanelet pose and snapped goal.
    pose_topic: "/planning/lanelet_pose"
    # HH_260721 - Publish a drop-zone return route only after the lanelet snap
    # has converged to the current vehicle pose following campsite crab exit.
    return_start_vehicle_pose_topic: "/localization/pose"
    return_start_pose_max_distance_m: 1.5
    return_start_pose_stale_timeout_s: 1.0
    # HH_260617: Canonical goal naming used in logs/docs:
    #   mission_key = semantic site/key name on mission_key_topic (e.g. camping_site_1)
    #   site_goal   = raw UI/mission site-center pose on /planning/site_goal_pose_ros
    #   route_goal  = lanelet-snapped PoseStamped consumed by Nav2
    # State machine tracks the route_goal stream, not the raw site_goal.
    goal_topic: "/planning/goal_pose_snapped"
    # HH_260727 - Manual RViz goals and regulated UI goals retain separate semantics.
    goal_source_topic: "/planning/goal_source"
    # HH_260727 - Every generated mission goal uses the regulated, source-aware
    # snap path; direct Nav2 publication could inherit a prior manual selector.
    auto_goal_snapper_input_topic: "/planning/auto_goal_raw"
    state_topic: "/planning/state_machine/state"
    estop_topic: "/planning/state_machine/estop"

    # HH_260528 Scenario contract for UI integration:
    # 0=WAIT_DROP_ZONE, 1=DELIVERY_TO_SITE, 2=RETURN_TO_DROP_ZONE, 3=RECALL_TO_SITE
    scenario_id_topic: "/planning/state_machine/scenario_id"
    # HH_260617: UI/ops command topic. Send avg_msgs/PlanningScenario.
    scenario_command_topic: "/planning/state_machine/scenario_command"
    # HH_260720 - Mirror control and parking phase telemetry into
    # the central planning state output for UI/system consumers.
    enable_maneuver_phase_state_override: true
    # HH_260721 - Consume operational progress independently from diagnostic health.
    maneuver_phase_state_topic: "/service/state"
    # HH_260720 - Maneuver phase transitions persist until an explicit mission or route change.
    maneuver_phase_override_timeout_s: 0.0

    return_to_drop_zone_topic: "/planning/state_machine/return_to_drop_zone"
    # Recall request published from a camping site.
    # avg_msgs/PlanningRecallRequest.site_name = camping site name (e.g. "camping_site_3").
    # Triggers recall flow to "<site>_road" keypoint when defined.
    camping_site_recall_topic: "/planning/state_machine/camping_site_recall"
    # Publishes avg_msgs/PlanningMissionKey with the current mission key and source.
    mission_source_topic: "/planning/state_machine/mission_source"
    return_mission_key: "drop_zone"
    # HH_260624 - Select the map-exported drop-zone area used for return goals.
    drop_zone_id: "drop_zone"
    # HH_260624 - RViz/debug copy of the raw station-center return target.
    drop_zone_goal_raw_topic: "/planning/drop_zone_goal_raw"
    # HH_260720 - Standard ROS mirror for RViz only.
    drop_zone_goal_raw_ros_topic: "/planning/drop_zone_goal_raw_ros"
    # HH_260727 - Apply semantic drop-zone matching only to regulated UI/mission goals.
    raw_goal_topic: "/planning/site_goal_pose_ros"
    enable_raw_drop_zone_goal_match: true
    drop_zone_raw_goal_match_distance_m: 3.0
    mission_key_topic: "/planning/mission_key"
    # HH_260727 - UI publishes site_goal on /planning/site_goal_pose_ros. Keep the mission_key
    # topic for scenario tracking only so raw site-center goals are not injected directly
    # into /planning/goal_pose_snapped_ros before goal_snapper runs.
    mission_key_publish_route_goal: false
    request_mission_service: "/planning/request_mission"
    status_stream_topic: "/status_stream"

    # Launch resolves these to absolute paths at startup; keep empty here to
    # avoid host-specific path hardcoding in the package config.
    keypoints_yaml: ""
    camping_sites_yaml: ""
    startup_mission_key: "drop_zone"
    warn_mission_key: "garage"

    # HH_260616: Do not enqueue a Nav2 startup goal before the operator/UI chooses
    # a mission. The old startup goal kept NavigateToPose active and could swallow
    # the first UI camping-site request as a preemption race.
    auto_startup_goal: false
    # HH_260616: Diagnostics WARN at startup must not enqueue a recovery goal
    # before an operator/UI mission is selected; it races the first UI request.
    auto_warn_recovery_goal: false
    auto_estop_on_error: true
    # HH_260703 - Keep WARN diagnostics visible while still publishing the
    # GOAL_REACHED event that starts campsite/drop-zone parking handoff.
    allow_goal_reached_handoff_in_warn: true
    # HH_260625: Keep operator/system diagnostics visible without letting
    # non-motion-critical health checks force planning ERROR_STOP. Localization
    # mode, platform graph, and explicit mission/state errors still participate
    # in the state level calculation.
    state_status_ignored_names:
      - "hw_checker: /hardware/cpu"
      - "hw_checker: /hardware/cpu_temp"
      - "hw_checker: /hardware/disk"
      - "network_checker: /hardware/network/connection"
      - "network_checker: /hardware/network/signal"
      - "network_checker: /hardware/network/quality"
      - "localization_init_checker: /localization/init"
      - "planning_costmap_checker: /planning/global_costmap"
      - "planning_costmap_checker: /planning/local_costmap"
      - "planning_nav_status_checker: /planning/nav_status"
      - "planning_path_checker: /planning/path/global_path"
      - "planning_path_checker: /planning/path/local_path"
    # HH_260702 - Diagnostic names can vary slightly by namespace/install path.
    # These prefixes keep non-motion-critical monitors visible in /system/status
    # without letting them hold planning ERROR_STOP.
    state_status_ignored_prefixes:
      - "hw_checker:"
      - "gpu_checker:"
      - "network_checker:"
      - "localization_init_checker:"
      - "planning_costmap_checker:"
      - "planning_nav_status_checker:"
      - "planning_path_checker:"
      - "planning_state_checker:"
      - "planning/state_machine"
      # HH_260702 - Keep non-motion-critical map/perception health visible in
      # /system/status, but do not turn every rate warning into planning estop.
      # Live cost grids and command gates remain the motion-safety authority.
      - "map_cost_grid_checker:"
      - "perception_obstacle_checker:"
      # HH_260703 - Raw Vanjee frames contain vendor placeholder NaNs, so only
      # the raw stream is excluded from automatic ERROR_STOP. The filtered
      # obstacle stream remains motion-relevant through diagnostics.
      - "lidar_checker: /sensor/lidar/main"
      # HH_260703 - Camera health remains visible in /system/status, but brief
      # front/rear FPS drops must not toggle parking/planning auto-estop. Live
      # lidar/radar cost grids remain the motion stop authority.
      - "camera_checker:"
      - "radar_checker:"

    # When true: arriving at a camping_site_* key starts a dwell timer; after
    # goal_reached_dwell_s the robot auto-returns to return_mission_key.
    # When false: robot waits until an external return command arrives.
    enable_auto_return_on_site_goal: false
    site_mission_key_prefix: "camping_site_"
    goal_reached_dwell_s: 10.0
    # Distance tolerance for associating a manual goal with a keypoint (auto-return eligibility).
    mission_key_match_distance_m: 1.5
    # HH_260618: Preserve drop_zone semantic key for return route-goal echoes
    # that are lanelet-snap poses rather than the exact station center.
    return_goal_key_preserve_distance_m: 5.0
    # HH_260618: Preserve camping_site_* semantic key for repeated snapped route-goal echoes.
    site_goal_key_preserve_distance_m: 2.0
    # HH_260619 - UI sends mission_key before raw campsite goal. Keep that key
    # authoritative for the next snapped route goal to avoid drop_zone mis-match.
    pending_mission_key_preserve_s: 5.0
    pending_mission_key_overrides_goal_match: true

    # HH_260720 - Reaching the return pose hands ownership to drop-zone control;
    # charging completion is reported by the selected parking controller.

    min_goal_publish_interval_s: 1.0
    # HH_260623 - State handoff follows robot_base_link-center arrival, not
    # the front-footprint early stop that occurred with the old 0.8 m latch.
    goal_reached_distance_m: 0.2
    # HH_260622 - GOAL_REACHED is a parking handoff signal, so require Nav2
    # NavigateToPose terminal SUCCEEDED in addition to geometric distance.
    require_nav2_success_for_goal_reached: true
    nav_status_topic: "/planning/navigate_to_pose/_action/status"
    nav_status_goal_match_tolerance_s: 0.5
    nav_success_latch_s: 3.0
    # HH_260623 - Keep return handoff slightly wider than generic arrival for
    # lanelet-snap/drop-zone geometry, but still center-based.
    return_goal_reached_distance_m: 0.3
    # HH_260720 - Hold GOAL_REACHED/RETURN_TO_DROP_ZONE long enough for
    # control alignment to start reliably before reverse parking.
    reverse_parking_controller_handoff_hold_s: 1.0
    loop_rate_hz: 5.0
