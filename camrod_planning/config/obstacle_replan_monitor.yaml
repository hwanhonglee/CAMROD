# Layout: 1) topics and actions, 2) planner preemption, 3) timing and corridor
# sampling, 4) blockage thresholds and debounce, 5) selector and gating.
/planning/obstacle_replan_monitor:
  ros__parameters:
    enabled: true

    # =========================================================================
    # 1. TOPICS AND ACTIONS
    # =========================================================================
    # HH_260619 - Monitor only dynamic obstacle grids; lanelet/static costs are
    # handled by the route and safety gate and must not trigger false reroutes.
    dynamic_cost_grid_topics:
      - "/sensing/cost_grid/lidar"
      - "/sensing/cost_grid/radar"
    # HH_260720 - Monitor the active path checked by cmd_vel_safety_gate FRONT_PATH.
    path_topic: "/planning/local_path"
    # HH_260720 - Monitor the generated planning goal; Nav2 conversion happens at action send.
    goal_topic: "/planning/goal_pose_snapped"
    pose_topic: "/localization/pose"
    navigate_action_name: "/planning/navigate_to_pose"
    # HH_260807 - Validate a Smac path before replacing the active route goal.
    compute_path_action_name: "/planning/compute_path_to_pose"
    navigate_status_topic: "/planning/navigate_to_pose/_action/status"
    # HH_260720 - Explicit std_msgs boundary consumed by the Nav2 selector plugin.
    planner_selector_topic: "/planning/planner_selector_ros"
    status_topic: "/planning/obstacle_replan/status"
    # Static all-lane grid used only to prove that a fallback has enough width.
    lanelet_grid_topic: "/map/cost_grid/lanelet"

    # =========================================================================
    # 2. PLANNER PREEMPTION
    # =========================================================================
    # HH_260807 - Permit dynamic-obstacle fallback only after the fail-closed
    # lane-width gate and a ComputePathToPose preflight both succeed. A no-path
    # result remains stopped on LaneletRoute and is not repeatedly preempted.
    preempt_enabled: true
    fallback_planner_id: "SmacLattice"
    restore_planner_id: "LaneletRoute"
    wide_lane_replan_enabled: true
    lanelet_grid_max_age_s: 2.5
    lanelet_blocked_cost_threshold: 100
    # Deployed planning envelope is 1.170 m wide. Requiring 2.50 m leaves at
    # least one additional body-width corridor plus raster/centering allowance;
    # Smac and the control gate still perform their own footprint checks.
    minimum_replan_lane_width_m: 2.50
    minimum_side_clearance_m: 0.60
    lane_width_max_search_m: 6.0

    # =========================================================================
    # 3. TIMING AND CORRIDOR SAMPLING
    # =========================================================================
    monitor_rate_hz: 5.0
    grid_max_age_s: 0.75
    lookahead_m: 8.0
    sample_start_distance_m: 0.8
    sample_step_m: 0.25
    corridor_half_width_m: 0.55
    lateral_step_m: 0.25

    # =========================================================================
    # 4. BLOCKAGE THRESHOLDS AND DEBOUNCE
    # =========================================================================
    # HH_260630: Trigger dynamic replanning before the 85-cost hard-stop zone.
    obstacle_cost_threshold: 60
    # HH_260805 - Report obstacles immediately, but preempt LaneletRoute only
    # after 20 s of persistent blockage. The control safety gate still stops
    # immediately and independently at its dynamic-obstacle thresholds.
    min_blocked_samples: 3
    blocked_sample_ratio: 0.025
    block_hold_s: 20.0
    clear_hold_s: 1.2
    replan_cooldown_s: 3.0

    # =========================================================================
    # 5. SELECTOR AND GATING
    # =========================================================================
    selector_override_s: 3.0
    selector_publish_hz: 10.0
    require_navigation_active: true
    require_goal: true
    ignore_unknown_cells: true
