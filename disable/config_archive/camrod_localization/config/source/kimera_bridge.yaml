# 2026-02-09: Kimera CSV bridge defaults for fallback localization integration.
/localization/kimera_csv_bridge:
  ros__parameters:
    publish_abs: true
    publish_local: true
    poll_hz: 30.0

    # HH_260209: Set to zedLiveVIO CSV paths when enabling this bridge.
    abs_csv_path: ""
    local_csv_path: ""
    # HH_260422: Reject implausible jumps from Kimera CSV to prevent local pose fly-away.
    # Keep absolute stream permissive by default, but gate local stream aggressively.
    abs_enable_outlier_rejection: true
    local_enable_outlier_rejection: true
    # Re-seed gate baseline when a long gap occurs; first post-gap sample is dropped.
    outlier_reseed_gap_sec: 2.5
    # Thresholds are applied per accepted-sample interval.
    outlier_max_step_distance_m: 1.2
    outlier_max_linear_speed_mps: 1.2
    outlier_max_yaw_rate_radps: 1.0
    outlier_max_orientation_delta_rad: 0.6

    map_frame_id: "map"
    local_frame_id: "vio_local"
    base_frame_id: "robot_base_link"

    abs_pose_topic: "/localization/kimera_vio/pose"
    abs_pose_cov_topic: "/localization/kimera_vio/pose_with_covariance"
    abs_odom_topic: "/localization/kimera_vio/odometry"
    local_pose_topic: "/localization/kimera_vio/local_pose"
    local_odom_topic: "/localization/kimera_vio/local_odometry"
    source_topic: "/localization/kimera_vio/source"
    # HH_260317-00:00 Keep parameter names domain-oriented (no avg_* naming).
    publish_localization_status: false
    localization_status_topic: "/localization/status"

    # HH_260209: Fixed covariance used for bridged fallback pose.
    position_stddev_m: 0.5
    orientation_stddev_rad: 0.35
