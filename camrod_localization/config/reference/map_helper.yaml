/**:
  ros__parameters:
    publish_localization_status: false
    localization_status_topic: "/localization/status"

    # --------------------------------------------------------------------------
    # Centerline snapper
    # --------------------------------------------------------------------------
    enable_centerline_snapper: true

    centerline_input_pose_topic: "/localization/pose"
    centerline_output_pose_topic: "/localization/centerline_pose"
    # HH_260720 - Standard ROS mirror for robot_localization and RViz only.
    centerline_output_pose_ros_topic: "/localization/centerline_pose_ros"

    max_search_radius: 30.0
    longitudinal_stddev: 0.5
    lateral_stddev: 0.3
    yaw_stddev: 0.2
    # HH_260527: centerline_z_mode options:
    #   input: keep input pose Z
    #   map: use lanelet centerline Z + map_z_offset
    #   ground: force ground plane Z (0) + map_z_offset
    # HH_260623 - Keep localization helper centerline outputs on the 2D planning plane.
    centerline_z_mode: ground
    map_z_offset: 0.0
    # HH_260723 - EKF itself publishes at 10 Hz. 0.10 s aliases with normal timestamp
    # jitter and can accidentally halve the snapped-pose rate to 5 Hz.
    centerline_min_update_period_s: 0.05
    centerline_min_displacement_m: 0.08

    # --------------------------------------------------------------------------
    # Drop zone matcher
    # --------------------------------------------------------------------------
    enable_drop_zone_matcher: true
    drop_zones_yaml: ""
    drop_zone_pose_topic: "/localization/pose_with_covariance"

    match_radius: 2.0
    stable_count: 10
    publish_drop_zone_initial_pose: true
    publish_once: true
    # HH_260527: drop_zone_center_mode options:
    #   corners_mean: center = average of polygon corners
    #   yaml_center: center = zone center_x/center_y fields
    drop_zone_center_mode: corners_mean
    # HH_260527: drop_zone_yaw_source options:
    #   zone: use zone yaw_deg from YAML
    #   input: keep current input pose yaw
    drop_zone_yaw_source: zone

    drop_zone_initial_pose_topic: "/localization/drop_zone/initial_pose"
    # HH_260720 - Standard ROS mirror for RViz only.
    drop_zone_initial_pose_ros_topic: "/localization/drop_zone/initial_pose_ros"
    status_topic: "/localization/drop_zone/match_ok"
    match_id_topic: "/localization/drop_zone/match_id"
    match_distance_topic: "/localization/drop_zone/match_distance"
