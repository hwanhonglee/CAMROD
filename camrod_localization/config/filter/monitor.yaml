/**:
  ros__parameters:
    # HH_260720 - Keep the optional status stream filter-neutral; EKF default uses none.
    filter_status_topic: "/localization/filter/status"
    # filter_status_mode options:
    #   stream: subscribe/use filter status diagnostics from filter_status_topic
    #   none: run monitor without filter status diagnostics input
    # HH_260720 - robot_localization EKF has no AvgLocalizationStatusStream output.
    filter_status_mode: none

    gnss_pose_topic: "/sensing/gnss/pose"
    gnss_pose_cov_topic: "/sensing/gnss/pose_with_covariance"
    imu_topic: "/sensing/imu/data"
    # HH_260720 - Monitor the canonical generated wheel topic.
    wheel_topic: "/localization/input/wheel_odometry"

    # HH_260625: Live GNSS pose stamps can arrive ~2s behind node time while
    # RTK is otherwise healthy. Keep the monitor tolerant enough to avoid
    # false DR_ONLY->NORMAL recovery holds from timestamp jitter.
    gnss_timeout_s: 4.0
    imu_timeout_s: 1.0
    wheel_timeout_s: 1.0

    gnss_innovation_warn: 3.0
    gnss_innovation_fail: 6.0

    # HH_260625: Outdoor RTK covariance trace was observed around 0.30-0.45
    # during stable fixes. 0.3 caused repeated false GNSS_BAD transitions.
    gnss_cov_trace_fail: 1.0
    gnss_jump_fail_m: 1.0
    # HH_260511: GPS at ~1Hz; lower from 2.0 to 0.8 so gnss_rate_ok passes at 1Hz.
    gnss_min_hz: 0.8

    publish_localization_status: false
    localization_status_topic: "/localization/status"

    # HH_260507: DR timeout — stop robot if DR continues too long or covariance grows too large.
    # 0.0 disables each check independently.
    # HH_260720 - Covariance timeout applies only when filter_status_mode is stream.
    dr_max_duration_s: 30.0
    dr_max_cov_trace: 200.0

    # HH_260626: Worsening modes publish immediately; recovery to NORMAL must
    # stay stable briefly to avoid GNSS timestamp/rate jitter causing repeated
    # DR_ONLY->NORMAL recovery holds in planning.
    mode_degrade_debounce_s: 0.0
    mode_recovery_debounce_s: 1.5
