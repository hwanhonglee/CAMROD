# HH_260123 ESKF parameters (IMU prediction + GNSS + wheel).
/localization/eskf:
  ros__parameters:
    map_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "robot_base_link"
    imu_topic: "/sensing/imu/data"
    gnss_topic: "/sensing/gnss/pose_with_covariance"
    # HH_260410 Topic renamed for consistent /platform/status/* naming.
    wheel_topic: "/platform/status/wheel_odometry"
    # HH_260527: External reset topic used by GNSS reattach helper.
    set_pose_topic: "/localization/eskf/set_pose"
    # HH_260527: Publish ESKF output to PRIMARY topics; pose_selector owns /localization/* final outputs.
    pose_topic: "/localization/primary/pose"
    pose_cov_topic: "/localization/primary/pose_with_covariance"
    odom_topic: "/localization/primary/odometry"
    twist_topic: "/localization/twist"
    diag_topic: "/localization/eskf/status"
    publish_tf: true
    # HH_260415: Use ROS node time for TF stamping to avoid lidar->map extrapolation crashes.
    tf_use_node_time: true
    # Optional startup bridge for TF consumers before first GNSS initializes ESKF.
    publish_uninitialized_tf: false
    # HH_260413: IMU mount yaw -> base yaw alignment (filter math).
    # Keep this separate from platform visualization heading_yaw_offset_deg.
    # HH_260415: IMU physical mount yaw offset measured 2026-04-29 (robot facing West, offset = 180 - 171.6 deg).
    imu_to_base_yaw_deg: -32.5 # HJ_250430
    # Heading-only startup correction. Keep 0.0 for package default; bringup overrides real hardware.
    imu_yaw_init_offset_deg: 0.0

    # Optional GNSS COG heading update. Bringup enables this for real hardware.
    gnss_cog_topic: ""
    gnss_cog_yaw_offset_deg: 0.0
    gnss_cog_min_speed_mps: 0.8
    gnss_cog_noise_deg: 15.0
    gnss_cog_gate_mahalanobis: 9.0
    # HH_260416: Current platform IMU appears mirrored in runtime checks
    # (up/down and left/right opposite), so invert signs in ESKF input path.
    imu_accel_x_sign: -1.0
    imu_accel_y_sign: -1.0
    imu_gyro_z_sign: 1.0 # HJ_250430
    imu_yaw_sign: -1.0
    # HH_260527: yaw_init_source options:
    #   imu_orientation: initialize yaw from IMU orientation
    #   state: keep filter state yaw on initialization/reset
    yaw_init_source: imu_orientation

    # HH_260413: Relax GNSS gate for real-sensor jitter and temporary wheel-source uncertainty.
    # Keep GNSS correction active instead of prolonged reject-only drift.
    gnss_gate_mahalanobis: 64.0
    # HH_260527: gnss_profile_mode options:
    #   auto: switch normal/unstable by reject/accept streaks
    #   normal: force normal GNSS gate/noise profile
    #   unstable: force unstable GNSS gate/noise profile
    # HH_260413: Auto-switch GNSS profile between normal/unstable based on reject streaks.
    gnss_profile_mode: auto
    # HH_260415: Switch to unstable profile faster when consecutive GNSS rejects occur.
    gnss_profile_switch_reject_count: 2
    gnss_profile_switch_accept_count: 8
    gnss_profile_normal_gate_mahalanobis: 64.0
    gnss_profile_unstable_gate_mahalanobis: 400.0
    wheel_gate_mahalanobis: 9.0
    # HH_260527: wheel_yaw_rate_mode options:
    #   fused: use wheel angular.z (yaw-rate) + speed together
    #   speed_only: use wheel speed only (ignore wheel angular.z correction term)
    # 2026-04-22: Use wheel odometry yaw-rate (angular.z) to correct IMU yaw bias.
    # Ranger odometry already embeds steering geometry, so this stabilizes DR heading.
    wheel_yaw_rate_mode: fused
    wheel_yaw_rate_noise: 0.25
    wheel_yaw_rate_gate_mahalanobis: 9.0
    wheel_yaw_rate_min_speed_mps: 0.10
    # 2026-02-02: Reinit filter if GNSS is too far (recover from drift).
    reinit_on_gnss_reject: true
    # HH_260413: Reinitialize earlier when GNSS and state diverge in no-ranger fallback runs.
    reinit_distance_threshold: 3.0
    gyro_noise: 0.015
    accel_noise: 0.15
    gyro_bias_walk: 0.0005
    accel_bias_walk: 0.01
    # HH_260413: Increase measurement noise assumptions to reduce over-confident rejection.
    gnss_position_noise: 4.0
    gnss_profile_normal_position_noise: 4.0
    gnss_profile_unstable_position_noise: 8.0
    wheel_speed_noise: 0.35
    min_imu_dt: 0.0001
    # HH_260413: Tolerate IMU scheduling jitter without aggressive clamp.
    max_imu_dt: 0.5
    # HH_260413: Freeze yaw integration when stopped to reduce gyro drift.
    freeze_yaw_when_stopped: true
    # HH_260507: Also apply NHC/ZUPT on IMU callbacks while stop-state is active.
    apply_constraints_on_imu_when_stopped: true
    # HH_260415: At standstill, use IMU quaternion yaw so heading follows real sensor rotation.
    align_yaw_to_imu_when_stopped: false #HJ_260429: false
    # HH_260507: Relax stop detector for noisy near-zero wheel speed.
    stop_speed_threshold: 0.10
    stop_hold_s: 0.40

    # HH_260527: nhc_mode options: enabled | disabled.
    # HH_260422: Non-Holonomic Constraint — lateral body velocity ≈ 0 for wheeled robot.
    # nhc_lateral_noise > 0 allows residual slip for skid-steer (Ranger).
    nhc_mode: enabled
    nhc_lateral_noise: 0.05
    nhc_gate_mahalanobis: 9.0

    # HH_260527: zupt_mode options: enabled | disabled.
    # HH_260422: Zero Velocity Update — inject v=[0,0] when confirmed stopped.
    # Prevents IMU accel bias drift accumulating into position error at standstill.
    zupt_mode: enabled
    # HH_260507: Widen ZUPT acceptance so standstill correction keeps pulling drift back.
    zupt_vel_noise: 0.05
    zupt_gate_mahalanobis: 36.0
