[develop]
script_dir=$base/lib/camrod_ui
[install]
install_scripts=$base/lib/camrod_ui

[tool:pytest]
# HH_260730 - ROS Humble ships pytest 6 while the user-site anyio plugin targets
# a newer pytest API.  The UI policy tests do not use anyio, so block that
# unrelated auto-loaded plugin and keep ordinary `colcon test` deterministic.
addopts = -p no:anyio
