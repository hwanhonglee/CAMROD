<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CAMROD UI Panel</title>
  <style>
    body { font-family: sans-serif; margin: 1.2rem; background: #111; color: #eee; }
    .row { margin: 0.6rem 0; }
    .badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 0.3rem; background: #333; }
    button { margin-right: 0.4rem; padding: 0.4rem 0.8rem; }
    pre { background: #1b1b1b; padding: 0.8rem; border-radius: 0.4rem; overflow: auto; }
  </style>
</head>
<body>
  <h2>CAMROD UI Panel</h2>
  <div class="row">상태: <span id="mode" class="badge">-</span></div>
  <div class="row">Health: <span id="health" class="badge">-</span></div>
  <div class="row">Ready: <span id="ready" class="badge">-</span></div>
  <div class="row">Engaged: <span id="engaged" class="badge">-</span></div>
  <div class="row" id="ready_msg">ready_message: -</div>
  <div class="row">
    <button onclick="post('/ui/engage?value=true')">Engage ON</button>
    <button onclick="post('/ui/engage?value=false')">Engage OFF</button>
    <button onclick="post('/ui/auto')">AUTO</button>
    <button onclick="post('/ui/stop')">STOP</button>
  </div>
  <div class="row">
    <button onclick="post('/ui/destination?site=B1&run=true')">B1 Run</button>
    <button onclick="post('/ui/destination?site=B1&run=false')">B1 Stop</button>
  </div>
  <pre id="modules">[]</pre>
  <pre id="destination">{"site":"","run":false}</pre>

  <script>
    async function post(path) {
      const r = await fetch(path, { method: 'POST' });
      const j = await r.json();
      console.log(path, j);
      await refresh();
    }

    async function refresh() {
      try {
        const [stateRes, healthRes] = await Promise.all([
          fetch('/ui/state'),
          fetch('/ui/health'),
        ]);
        const s = await stateRes.json();
        const h = await healthRes.json();
        document.getElementById('mode').textContent = s.operation_mode;
        document.getElementById('health').textContent = String(Boolean(h.ok));
        document.getElementById('ready').textContent = String(s.ready);
        document.getElementById('engaged').textContent = String(s.engaged);
        document.getElementById('ready_msg').textContent = 'ready_message: ' + (s.ready_message || '');
        document.getElementById('modules').textContent = JSON.stringify(s.module_states, null, 2);
        document.getElementById('destination').textContent = JSON.stringify(s.destination || {}, null, 2);
      } catch (e) {
        document.getElementById('health').textContent = 'false';
        document.getElementById('ready_msg').textContent = 'backend 연결 실패: ' + e;
      }
    }

    setInterval(refresh, 1000);
    refresh();
  </script>
</body>
</html>
