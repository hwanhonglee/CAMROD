<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>국립공원 로봇 서비스</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Overlays ──────────────────────────────────────────────── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }
    .overlay.show { display: flex; }

    .overlay-card {
      background: #fff;
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .overlay-icon { font-size: 3rem; margin-bottom: 16px; line-height: 1; }
    .overlay-title {
      font-size: 1.4rem; font-weight: 700; color: #1a1a2e;
      margin-bottom: 10px;
    }
    .overlay-msg {
      color: #6b7280; font-size: 0.95rem; line-height: 1.7;
    }
    .overlay-card.locked { border-top: 5px solid #ef4444; }
    .overlay-card.grace  { border-top: 5px solid #f59e0b; }

    .grace-count {
      display: inline-block;
      margin-top: 20px;
      font-size: 2.8rem; font-weight: 800;
      color: #f59e0b;
    }
    .grace-unit { font-size: 0.88rem; color: #9ca3af; margin-top: 4px; }

    .retry-btn {
      margin-top: 24px;
      display: block; width: 100%;
      padding: 14px 0;
      background: #2d6e40; border: none; border-radius: 14px;
      color: #fff; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: background 0.15s;
    }
    .retry-btn:active { background: #1b4332; }

    /* ── Header ────────────────────────────────────────────────── */
    .app-header {
      background: linear-gradient(135deg, #1b4332 0%, #2d6e40 100%);
      padding: clamp(10px, 2.5vw, 16px) clamp(14px, 3.5vw, 24px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left {
      display: flex; align-items: center; gap: clamp(10px, 2vw, 16px);
      min-width: 0;
    }
    .logo-box {
      width: clamp(46px, 8vw, 68px);
      height: clamp(46px, 8vw, 68px);
      background: #ffffff;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.3);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      padding: 3px;
    }
    .logo-box img {
      width: 100%; height: 100%; object-fit: contain;
    }
    .header-text {
      display: flex; flex-direction: column; gap: 3px;
      min-width: 0;
    }
    .header-label {
      font-size: clamp(9px, 1.8vw, 12px);
      font-weight: 400;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.6);
      white-space: nowrap;
    }
    .header-title {
      font-size: clamp(14px, 3.2vw, 20px);
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Header badges (battery + wifi) */
    .header-badges {
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 0;
    }

    /* Battery badge */
    .battery-badge {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 6px 12px;
      color: rgba(255,255,255,0.9);
      font-size: 0.85rem; font-weight: 600;
    }
    .batt-icon {
      width: 22px; height: 11px;
      border: 2px solid currentColor; border-radius: 3px;
      position: relative; display: flex; align-items: center; padding: 1.5px;
    }
    .batt-icon::after {
      content: '';
      position: absolute; right: -5px; top: 50%;
      transform: translateY(-50%);
      width: 3px; height: 5px;
      background: currentColor; border-radius: 0 1px 1px 0;
    }
    .batt-fill {
      height: 100%; border-radius: 1px;
      transition: width 0.5s, background 0.5s;
      background: rgba(255,255,255,0.8);
    }

    /* WiFi widget — robot UI wh-wifi 동일 */
    .wh-wifi {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.15rem;
    }
    .wh-wifi-label {
      font-size: clamp(0.55rem, 1.8vw, 0.72rem);
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      letter-spacing: 0.05em;
    }

    /* ── Main content ───────────────────────────────────────────── */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: clamp(14px, 3vw, 24px) clamp(12px, 3vw, 20px);
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── Card ───────────────────────────────────────────────────── */
    .card {
      background: #ffffff;
      border-radius: 20px;
      border-top: 4px solid #2d6e40;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(45,110,64,0.08);
    }
    .card-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
      margin-bottom: 14px;
    }

    /* ── Status panel ───────────────────────────────────────────── */
    .status-row {
      display: flex; align-items: center; gap: 12px;
    }
    .status-indicator {
      width: 12px; height: 12px; border-radius: 50%;
      flex-shrink: 0;
      background: #d1d5db;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .si-idle     { background: #2d6e40; box-shadow: 0 0 8px rgba(45,110,64,0.5); }
    .si-moving   { background: #f59e0b; box-shadow: 0 0 8px rgba(245,158,11,0.5); }
    .si-arrived  { background: #3b82f6; box-shadow: 0 0 8px rgba(59,130,246,0.5); }
    .si-returning{ background: #8b5cf6; box-shadow: 0 0 8px rgba(139,92,246,0.5); }
    .si-busy     { background: #d1d5db; }

    .status-info {}
    .status-phase {
      font-size: 0.78rem; color: #9ca3af; margin-bottom: 2px;
    }
    .status-label {
      font-size: 1.05rem; font-weight: 700; color: #1a1a2e;
    }

    /* ── Info banner ────────────────────────────────────────────── */
    .info-banner {
      display: none;
      border-radius: 12px;
      padding: 12px 15px;
      font-size: 0.88rem;
      line-height: 1.6;
      margin-top: 14px;
    }
    .info-banner.show { display: block; }
    .info-moving {
      background: #fef3c7;
      border: 1px solid #fcd34d;
      color: #92400e;
    }
    .info-arrived {
      background: #dbeafe;
      border: 1px solid #93c5fd;
      color: #1e40af;
    }
    .info-returning {
      background: #ede9fe;
      border: 1px solid #c4b5fd;
      color: #5b21b6;
    }

    /* ── Section divider ────────────────────────────────────────── */
    .section-divider {
      height: 1px;
      background: #f3f4f6;
      margin: 16px 0;
    }

    /* ── Site grid ──────────────────────────────────────────────── */
    .site-grid-wrap {}
    .site-grid-label {
      font-size: 0.82rem;
      color: #6b7280;
      margin-bottom: 10px;
      font-weight: 500;
    }
    .site-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .site-btn {
      padding: 12px 6px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      background: #f9fafb;
      color: #374151;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .site-btn:active { transform: scale(0.94); }
    .site-btn.selected {
      border-color: #2d6e40;
      background: #f0fdf4;
      color: #1b4332;
      box-shadow: 0 0 0 2px rgba(45,110,64,0.2);
    }
    .site-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ── Confirm dialog ─────────────────────────────────────────── */
    .confirm-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center; justify-content: center;
      z-index: 8000;
      padding: 20px;
    }
    .confirm-overlay.show { display: flex; }
    .confirm-dialog {
      background: #fff;
      border-radius: 24px;
      padding: 32px 24px 24px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 24px 64px rgba(0,0,0,0.22);
      text-align: center;
    }
    .confirm-site-tag {
      display: inline-block;
      background: #f0fdf4;
      border: 1.5px solid #bbf7d0;
      border-radius: 20px;
      padding: 4px 16px;
      font-size: 1rem; font-weight: 800;
      color: #166534;
      margin-bottom: 18px;
    }
    .confirm-title {
      font-size: 1.15rem; font-weight: 700; color: #1a1a2e;
      margin-bottom: 10px; line-height: 1.45;
    }
    .confirm-desc {
      font-size: 0.88rem; color: #6b7280; line-height: 1.65;
      margin-bottom: 24px;
    }
    .confirm-desc strong { color: #ef4444; }
    .confirm-btns {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .btn-cancel {
      padding: 14px;
      background: #f3f4f6; border: none; border-radius: 14px;
      color: #374151; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-cancel:active { background: #e5e7eb; }
    .btn-confirm {
      padding: 14px;
      background: linear-gradient(135deg, #2d6e40 0%, #1b4332 100%);
      border: none; border-radius: 14px;
      color: #fff; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: opacity 0.15s;
      box-shadow: 0 4px 14px rgba(45,110,64,0.3);
    }
    .btn-confirm:active { opacity: 0.85; }

    /* ── Action buttons ─────────────────────────────────────────── */
    .action-btn {
      width: 100%;
      padding: 17px;
      font-size: 1.05rem;
      font-weight: 700;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: all 0.2s;
      display: block;
      text-align: center;
      margin-top: 14px;
    }
    .btn-navigate {
      background: linear-gradient(135deg, #2d6e40 0%, #1b4332 100%);
      color: #ffffff;
      box-shadow: 0 4px 18px rgba(45,110,64,0.3);
    }
    .btn-navigate:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(45,110,64,0.2); }
    .btn-navigate:disabled {
      background: #e5e7eb;
      color: #9ca3af;
      box-shadow: none;
      cursor: not-allowed;
    }
    .btn-complete {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: #ffffff;
      box-shadow: 0 4px 18px rgba(59,130,246,0.3);
    }
    .btn-complete:active { transform: scale(0.97); }

    /* ── Destination tag (shown when moving/arrived) ─────────────── */
    .dest-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f0fdf4;
      border: 1.5px solid #bbf7d0;
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #166534;
      margin-top: 10px;
    }
    .dest-tag-label { font-weight: 400; color: #4b5563; font-size: 0.8rem; }
  </style>
</head>
<body>

<!-- Locked overlay -->
<div class="overlay" id="lockedOverlay">
  <div class="overlay-card locked">
    <div class="overlay-icon">🔒</div>
    <div class="overlay-title">사이트 사용 중</div>
    <div class="overlay-msg">현재 다른 사용자가 이용 중입니다.<br>잠시 후 다시 시도해주세요.</div>
    <button class="retry-btn" onclick="retryConnect()">다시 시도</button>
  </div>
</div>

<!-- Grace period overlay -->
<div class="overlay" id="graceOverlay">
  <div class="overlay-card grace">
    <div class="overlay-icon">⏳</div>
    <div class="overlay-title">잠시 후 연결됩니다</div>
    <div class="overlay-msg">이전 사용자의 재연결 대기 중입니다.</div>
    <div class="grace-count" id="graceCount">60</div>
    <div class="grace-unit">초 후 자동 접속</div>
  </div>
</div>

<!-- Confirm navigate dialog -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-dialog">
    <div class="confirm-site-tag" id="confirmSiteTag">--</div>
    <div class="confirm-title">호출하시겠습니까?</div>
    <div class="confirm-desc">
      목적지를 선택하면<br><strong>취소할 수 없습니다.</strong>
    </div>
    <div class="confirm-btns">
      <button class="btn-cancel" onclick="closeConfirm()">취소</button>
      <button class="btn-confirm" onclick="confirmNavigate()">호출</button>
    </div>
  </div>
</div>

<!-- Header -->
<header class="app-header">
  <div class="header-left">
    <div class="logo-box">
      <img src="/월악산_국립공원_로고.jpg" alt="국립공원공단 로고" />
    </div>
    <div class="header-text">
      <div class="header-label">국립공원공단 · WORAKSAN NATIONAL PARK</div>
      <div class="header-title">월악산 국립공원 배송 로봇</div>
    </div>
  </div>
  <div class="header-badges">
    <div class="wh-wifi">
      <svg id="wifiSvg" width="44" height="44" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path id="wArc3" d="M1.5 8.5C5.1 4.9 10.3 3 12 3s6.9 1.9 10.5 5.5" stroke="#d0d8d0" stroke-width="2" stroke-linecap="round"/>
        <path id="wArc2" d="M4.5 11.5C6.9 9.1 9.7 8 12 8s5.1 1.1 7.5 3.5" stroke="#d0d8d0" stroke-width="2" stroke-linecap="round"/>
        <path id="wArc1" d="M7.5 14.5C8.9 13.1 10.4 12.5 12 12.5s3.1.6 4.5 2" stroke="#d0d8d0" stroke-width="2" stroke-linecap="round"/>
        <circle id="wDot" cx="12" cy="18" r="1.5" fill="#e53935"/>
        <line id="wXline" x1="4" y1="4" x2="20" y2="20" stroke="#e53935" stroke-width="2" stroke-linecap="round" style="display:none"/>
      </svg>
      <span class="wh-wifi-label">WIFI</span>
    </div>
    <div class="battery-badge" id="batteryBadge">
      <div class="batt-icon" id="batteryIcon">
        <div class="batt-fill" id="batteryFill" style="width:0%"></div>
      </div>
      <span id="batteryText">--%</span>
    </div>
  </div>
</header>

<!-- Main content -->
<div class="main-content">

  <!-- Status card -->
  <div class="card">
    <div class="card-title">Robot status</div>
    <div class="status-row">
      <div class="status-indicator" id="statusDot"></div>
      <div class="status-info">
        <div class="status-phase" id="statusPhase">Preparing</div>
        <div class="status-label" id="statusLabel">Connecting...</div>
      </div>
    </div>
    <div class="dest-tag" id="destTag" style="display:none">
      <span class="dest-tag-label">목적지</span>
      <span id="destTagSite">--</span>
    </div>
    <div class="info-banner" id="infoBanner"></div>
  </div>

  <!-- Site selection card (visible when idle) -->
  <div class="card" id="siteCard" style="display:none">
    <div class="card-title">사이트 선택</div>
    <div class="site-grid-label">이용할 캠핑 사이트를 선택하세요</div>
    <div class="site-grid" id="siteGrid"></div>
    <button class="action-btn btn-navigate" id="navigateBtn" disabled onclick="sendNavigate()">
      선택한 사이트로 이동
    </button>
  </div>

  <!-- Usage complete card (visible when arrived) -->
  <div class="card" id="completeCard" style="display:none">
    <div class="card-title">이용 완료</div>
    <div class="site-grid-label">로봇 사용을 마치셨으면 버튼을 눌러주세요.<br>로봇이 거점으로 돌아갑니다.</div>
    <button class="action-btn btn-complete" onclick="sendUsageComplete()">
      이용 완료 · 로봇 복귀
    </button>
  </div>

</div><!-- /main-content -->

<script>
  /* ── State ── */
  let ws = null;
  let isLocked = false;
  let isGrace  = false;
  let graceTimer = null;
  let heartbeatTimer = null;
  let currentPhase = 'unknown';
  let currentState = -1;
  // HH_260721 - Preserve the exact shared service state instead of reducing it to a generic phase.
  let currentServiceStateName = 'PREPARING';
  let selectedSite = null;
  let sites = [];
  let lastDestSite = null;  // remember destination while moving/arrived
  // HH_260803 - Match Robot UI mission admission instead of enabling a site
  // from service state alone while SOC is missing or below the 35% margin.
  let missionBatteryReady = false;
  let minimumBatteryPercentage = 35;
  // HH_260803 - Control safety is an overlay; the service state remains the
  // scenario source underneath it and resumes when the gate clears.
  let safetyHold = false;
  let controlGateState = 'UNKNOWN';

  /* ── WebSocket ── */
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const socket = new WebSocket(proto + '://' + location.host + '/ws');
    ws = socket;

    socket.onopen = () => {
      setConn(true);
      clearInterval(heartbeatTimer);
      // HJ_260804 - Pair the backend's 45 s stale-slot timeout with a small
      // application heartbeat; a healthy but otherwise idle screen stays up.
      heartbeatTimer = setInterval(() => {
        if (socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ action: 'heartbeat' }));
        }
      }, 10000);
    };

    socket.onmessage = (e) => {
      const d = JSON.parse(e.data);

      if (d.locked) {
        socket.close();
        if (d.grace_remaining > 0) {
          isGrace = true;
          startGrace(d.grace_remaining);
        } else {
          isLocked = true;
          document.getElementById('lockedOverlay').classList.add('show');
        }
        return;
      }

      if (Array.isArray(d.sites) && d.sites.length > 0) {
        sites = d.sites;
        buildSiteGrid();
      }
      if (d.battery !== undefined) updateBattery(d.battery);
      if (d.minimum_battery_percentage !== undefined) {
        minimumBatteryPercentage = Number(d.minimum_battery_percentage);
      }
      if (d.mission_battery_ready !== undefined) {
        missionBatteryReady = Boolean(d.mission_battery_ready);
        updateUI();
      }
      if (d.safety_hold !== undefined) {
        safetyHold = Boolean(d.safety_hold);
        controlGateState = String(d.control_gate_state || 'UNKNOWN');
        updateUI();
      }
      if (d.service_state_name !== undefined) {
        currentServiceStateName = String(d.service_state_name || 'PREPARING');
      }
      if (d.phase !== undefined) {
        currentPhase = d.phase;
        if (d.service_state !== undefined) currentState = d.service_state;
        updateUI();
      } else if (d.service_state !== undefined) {
        currentState = d.service_state;
        updateUI();
      }
    };

    socket.onclose = () => {
      if (ws === socket) ws = null;
      clearInterval(heartbeatTimer);
      heartbeatTimer = null;
      setConn(false);
      if (!isLocked && !isGrace) setTimeout(connect, 3000);
    };

    socket.onerror = () => socket.close();
  }

  function startGrace(seconds) {
    clearInterval(graceTimer);
    const overlay = document.getElementById('graceOverlay');
    const countEl = document.getElementById('graceCount');
    let remaining = seconds;
    countEl.textContent = remaining;
    overlay.classList.add('show');

    graceTimer = setInterval(() => {
      remaining--;
      countEl.textContent = remaining;
      if (remaining <= 0) {
        clearInterval(graceTimer);
        overlay.classList.remove('show');
        isGrace = false;
        connect();
      }
    }, 1000);
  }

  function retryConnect() {
    isLocked = false;
    document.getElementById('lockedOverlay').classList.remove('show');
    connect();
  }

  function setConn(on) {
    // 연결 상태를 WiFi 배지 투명도로 표현
    document.getElementById('wifiBadge').style.opacity = on ? '1' : '0.4';
  }

  /* ── Battery ── */
  function updateBattery(pct) {
    const fill  = document.getElementById('batteryFill');
    const text  = document.getElementById('batteryText');
    const color = pct < 20 ? 'rgba(239,68,68,0.9)' : pct < 40 ? 'rgba(245,158,11,0.9)' : 'rgba(255,255,255,0.85)';
    fill.style.width      = pct + '%';
    fill.style.background = color;
    text.textContent      = pct + '%';
  }

  /* ── UI state machine ── */
  // HH_260721 - Keep every visible runtime state English and aligned with AvgServiceState.
  const SERVICE_STATE_LABELS = Object.freeze({
    PREPARING: 'Preparing',
    DROP_ZONE_WAIT: 'Waiting at drop zone',
    MOVING_TO_SITE: 'Moving to site',
    SITE_ARRIVED: 'Arrived at site',
    RETURNING_TO_DROP_ZONE: 'Returning to drop zone',
    GUEST_RECALL_SERVICE: 'Guest recall requested',
    SITE_ENTRY: 'Entering site',
    UNLOAD_WAIT: 'Waiting for unloading',
    RECALL_TO_SITE_ROAD: 'Moving to recall point',
    GUEST_LOADING_WAIT: 'Waiting for loading',
    RETURN_WITH_CARGO: 'Leaving site with cargo',
    DROP_ZONE_PARKING: 'Reverse parking',
    WAITING_FOR_RETURN_REQUEST: 'Waiting for return request',
    WAITING_FOR_CHARGING: 'Waiting for charger connection',
    CHARGING: 'Charging',
    DEPARTING_CHARGER: 'Departing charger',
    DEPARTING_DROP_ZONE: 'Departing drop zone',
    OPERATOR_STOPPED: 'Stopped by operator',
  });

  function updateUI() {
    const dot      = document.getElementById('statusDot');
    const phaseLbl = document.getElementById('statusPhase');
    const stateLbl = document.getElementById('statusLabel');
    const banner   = document.getElementById('infoBanner');
    const destTag  = document.getElementById('destTag');
    const siteCard    = document.getElementById('siteCard');
    const completeCard = document.getElementById('completeCard');

    // reset
    dot.className = 'status-indicator';
    banner.className = 'info-banner';
    banner.textContent = '';
    destTag.style.display = 'none';

    const phase = currentPhase;

    if (safetyHold) {
      dot.classList.add('si-busy');
      phaseLbl.textContent = 'Safety stop';
      stateLbl.textContent = 'The robot is stopped at a route boundary';
      siteCard.style.display = 'none';
      completeCard.style.display = 'none';
      banner.classList.add('show', 'info-returning');
      banner.textContent = 'Automatic bounded recovery is in progress. Please keep clear.';
      return;
    }

    if (phase === 'idle') {
      dot.classList.add('si-idle');
      phaseLbl.textContent = 'Waiting';
      stateLbl.textContent = 'Waiting at drop zone';
      siteCard.style.display = sites.length ? 'block' : 'none';
      completeCard.style.display = 'none';
      setSiteGridEnabled(missionBatteryReady);
      if (!missionBatteryReady) {
        banner.classList.add('show', 'info-returning');
        banner.textContent = 'Charge the robot to ' + minimumBatteryPercentage + '% before dispatch.';
      }
      lastDestSite = null;

    } else if (phase === 'charging') {
      dot.classList.add('si-idle');
      phaseLbl.textContent = 'Charging';
      stateLbl.textContent = 'Charging at drop zone';
      siteCard.style.display = sites.length ? 'block' : 'none';
      completeCard.style.display = 'none';
      setSiteGridEnabled(missionBatteryReady);
      if (!missionBatteryReady) {
        banner.classList.add('show', 'info-returning');
        banner.textContent = 'Charging. Missions resume at ' + minimumBatteryPercentage + '%.';
      }
      lastDestSite = null;

    } else if (phase === 'moving') {
      dot.classList.add('si-moving');
      phaseLbl.textContent = 'Moving';
      stateLbl.textContent = 'Robot is moving';
      siteCard.style.display = 'none';
      completeCard.style.display = 'none';
      banner.classList.add('show', 'info-moving');
      banner.textContent = 'The robot is moving. Please wait.';
      if (lastDestSite) {
        document.getElementById('destTagSite').textContent = lastDestSite;
        destTag.style.display = 'inline-flex';
      }

    } else if (phase === 'arrived') {
      dot.classList.add('si-arrived');
      phaseLbl.textContent = 'Arrived';
      stateLbl.textContent = 'Robot is waiting at the site';
      siteCard.style.display = 'none';
      completeCard.style.display = 'block';
      banner.classList.add('show', 'info-arrived');
      banner.textContent = 'The robot has arrived. Send the return request when ready.';
      if (lastDestSite) {
        document.getElementById('destTagSite').textContent = lastDestSite;
        destTag.style.display = 'inline-flex';
      }

    } else if (phase === 'parking' || phase === 'waiting_for_charging') {
      dot.classList.add('si-returning');
      phaseLbl.textContent = phase === 'parking' ? 'Parking' : 'Waiting for charging';
      stateLbl.textContent = phase === 'parking'
        ? 'Reverse parking at drop zone'
        : 'Waiting for charger connection';
      siteCard.style.display = 'none';
      completeCard.style.display = 'none';
      banner.classList.add('show', 'info-returning');
      banner.textContent = stateLbl.textContent;

    } else if (phase === 'returning' || phase === 'recall') {
      dot.classList.add('si-returning');
      phaseLbl.textContent = phase === 'recall' ? 'Recall requested' : 'Returning';
      stateLbl.textContent = phase === 'recall'
        ? 'The robot was recalled'
        : 'Returning to drop zone';
      siteCard.style.display = 'none';
      completeCard.style.display = 'none';
      banner.classList.add('show', 'info-returning');
      banner.textContent = 'The robot is returning to the drop zone.';

    } else if (phase === 'stopped') {
      dot.classList.add('si-busy');
      phaseLbl.textContent = 'Stopped by operator';
      stateLbl.textContent = 'The current mission was cancelled';
      siteCard.style.display = 'none';
      completeCard.style.display = 'none';
      banner.classList.add('show', 'info-returning');
      banner.textContent = 'Select a new mission from the Robot UI.';

    } else {
      dot.classList.add('si-busy');
      phaseLbl.textContent = 'Processing';
      stateLbl.textContent = 'Waiting for a valid service state';
      siteCard.style.display = 'none';
      completeCard.style.display = 'none';
    }
    phaseLbl.textContent = SERVICE_STATE_LABELS[currentServiceStateName] || phaseLbl.textContent;
  }

  /* ── Site grid ── */
  function buildSiteGrid() {
    const grid = document.getElementById('siteGrid');
    grid.innerHTML = '';
    sites.forEach(site => {
      const btn = document.createElement('button');
      btn.className = 'site-btn';
      btn.textContent = site;
      btn.dataset.site = site;
      btn.onclick = () => selectSite(site);
      grid.appendChild(btn);
    });
  }

  function selectSite(site) {
    if (!isDispatchReady()) return;
    selectedSite = site;
    document.querySelectorAll('.site-btn').forEach(b => {
      b.classList.toggle('selected', b.dataset.site === site);
    });
    document.getElementById('navigateBtn').disabled = false;
    document.getElementById('navigateBtn').textContent = site + ' 사이트로 이동';
  }

  function setSiteGridEnabled(enabled) {
    document.querySelectorAll('.site-btn').forEach(b => {
      b.disabled = !enabled;
    });
    if (!enabled) {
      selectedSite = null;
      document.getElementById('navigateBtn').disabled = true;
      document.getElementById('navigateBtn').textContent = '선택한 사이트로 이동';
    }
  }

  // HH_260721 - Charging is a dispatch-ready state because control owns charger departure.
  function isDispatchReady() {
    return missionBatteryReady && (currentPhase === 'idle' || currentPhase === 'charging');
  }

  /* ── Confirm dialog ── */
  function openConfirm() {
    if (!selectedSite || !isDispatchReady()) return;
    document.getElementById('confirmSiteTag').textContent = selectedSite + ' 사이트';
    document.getElementById('confirmOverlay').classList.add('show');
  }

  function closeConfirm() {
    document.getElementById('confirmOverlay').classList.remove('show');
  }

  function confirmNavigate() {
    closeConfirm();
    if (!selectedSite || !isDispatchReady()) return;
    if (ws && ws.readyState === WebSocket.OPEN) {
      lastDestSite = selectedSite;
      ws.send(JSON.stringify({ action: 'navigate', site: selectedSite }));
    }
  }

  /* ── Actions ── */
  function sendNavigate() {
    openConfirm();
  }

  function sendUsageComplete() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ action: 'usage_complete' }));
    }
  }

  /* ── WiFi (robot UI 동일: navigator.connection 기반) ── */
  function getWifiLevel() {
    if (!navigator.onLine) return 0;
    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if (!conn) return 3;
    const t = conn.effectiveType;
    if (t === '4g') return 3;
    if (t === '3g') return 2;
    return 1;
  }

  function applyWifiLevel(level) {
    const arcColor = (min) => level >= min ? '#2d6e40' : '#d0d8d0';
    document.getElementById('wArc1').setAttribute('stroke', arcColor(1));
    document.getElementById('wArc2').setAttribute('stroke', arcColor(2));
    document.getElementById('wArc3').setAttribute('stroke', arcColor(3));
    document.getElementById('wDot').setAttribute('fill', level > 0 ? '#2d6e40' : '#e53935');
    document.getElementById('wXline').style.display = level === 0 ? '' : 'none';
  }

  applyWifiLevel(getWifiLevel());
  window.addEventListener('online',  () => applyWifiLevel(getWifiLevel()));
  window.addEventListener('offline', () => applyWifiLevel(getWifiLevel()));
  const _wconn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if (_wconn) _wconn.addEventListener('change', () => applyWifiLevel(getWifiLevel()));

  /* ── Init ── */
  connect();
</script>
</body>
