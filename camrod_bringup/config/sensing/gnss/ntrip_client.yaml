# HH_260611: NTRIP parameters for Python ntrip_ros.py used by ublox_gps single/dual modes.
# Server: gnssdata.or.kr:2101, mountpoint CNJU-RTCM32.

/**:
  ros__parameters:
    # ── Server connection ─────────────────────────────────────────────────────
    host: gnssdata.or.kr
    port: 2101
    # mountpoint: "CNJU-RTCM32"
    mountpoint: "JECH-RTCM32"
    username: "hwanhong57@gmail.com"
    password: "gnss"

    # ── Python ntrip_ros.py (ublox_gps single/dual antenna) ───────────────────
    authenticate: true
    rtcm_message_package: rtcm_msgs
    # HH_260327: Accept slightly longer GGA strings to avoid reconnect churn.
    nmea_max_length: 96
    rtcm_topic: /rtcm
    ntrip_version: "None"
    ssl: false
    cert: "None"
    key: "None"
    ca_cert: "None"
    rtcm_frame_id: "gps"
    # HH_260327: Relax timeout/retry cadence for unstable RTCM network periods.
    rtcm_timeout_seconds: 10
    reconnect_attempt_max: 10
    reconnect_attempt_wait_seconds: 8
