# This file is organized as: 1) device and connection, 2) startup and
# dual-antenna options, 3) rates and rover mode, 4) message output,
# 5) moving base RTCM writer node.

# HH_260727 - Keep both physical GNSS ports in this one deployment profile.
# Node-specific wildcard selectors let the same file work under /gnss and
# /sensing/gnss without exposing the rover USB port to the RTCM writer.
/**/ublox_gps_node:
  ros__parameters:
    # =========================================================================
    # 1. DEVICE AND CONNECTION
    # =========================================================================
    # HH_260708 - Use the operator-verified ttyACM port for the field harness.
    # Do not switch GNSS to by-id; USB role checks are done against ttyACM*.
    # HH_261026 - Unit 2 enumerates the other way round: the Lord Microstrain
    # IMU takes ttyACM0 and this receiver lands on ttyACM1, so the shared
    # ttyACM0 path opened the IMU and the rover never produced NAV-PVT. Keep
    # the ttyACM form and carry the index that matches this robot. The index
    # is assigned at enumeration, so re-check it and update this line after
    # any USB change; the receiver's stable identity is
    # usb-u-blox_AG_-_www.u-blox.com_u-blox_GNSS_receiver-if00.
    device: /dev/ttyACM1
    # HH_260807 - This receiver measures at the physical antenna represented by
    # gnss_link. Changing the header does not move raw LLH; the localization
    # adapter remains the sole owner of the heading-rotated lever-arm correction.
    frame_id: gnss_link
    # HH_260722 - Keep this rover-side topic isolated from NTRIP in dual mode.
    # External CORS goes to the Lite moving base through FTDI DN03DF8V
    # (currently /dev/ttyUSB1); only the corrected moving-base stream reaches
    # this receiver through UART2.
    rtcm_topic: rtcm
    debug: 1 # 4 is logging data

    # =========================================================================
    # 2. STARTUP AND DUAL-ANTENNA OPTIONS
    # =========================================================================
    # HH_260330 - Avoid startup abort on some F9P units reporting
    # "Failed to read the GNSS config" during CFG polling.
    # Keep receiver running even if runtime CFG read/write is flaky.
    config_on_startup: false
    # HH_260611 - Keep the base YAML single-antenna safe; launch files enable these for simpleRTK2B Heading.
    dual_antenna: false
    dual_antenna.configure_usb: false
    # HH_260722 - Keep rover USB RTCM disabled in the dual field topology.
    # Launch may turn it on only for the direct-injection diagnostic fallback.
    dual_antenna.usb_rtcm_in: false
    dual_antenna.configure_navigation: false
    # HH_260722 - Apply this filter only to diagnostic ROS/USB RTCM. It cannot
    # separate two complete reference streams, so production leaves USB RTCM off.
    dual_antenna.block_rtcm_ids: [4072]

    # =========================================================================
    # 3. RATES AND ROVER MODE
    # =========================================================================
    # HH_260326 - Increase GNSS fix rate for localization consistency validation.
    # HH_260806 - The custom dual setup applies a CFG-RATE RAM write even with
    # config_on_startup=false, so a receiver-saved profile does not override ROS.
    # HH_260819 - The replacement rover was saved in u-center for 10 Hz
    # (100 ms epochs). This YAML is the single ROS owner of that rate; do not
    # reintroduce a launch-file rate overlay because inline ROS parameters take
    # precedence. nav_rate=1 means one solution per measurement epoch, not 1 Hz.
    # A board/rate change is accepted only after NAV-PVT, RXM-RTCM, and valid
    # NAV-RELPOSNED heading have all been measured on the physical pair.
    rate: 10.0
    nav_rate: 1
    # Rover mode: disable TMODE3 (Survey-In / Base Station mode)
    # - tmode3=1 is for Survey-In (base/reference station)
    # - tmode3=0 is for normal rover operation (vehicle receiver) # Rover mode
    tmode3: 0

    # If you use only USB (ttyACM*), you typically don't need UART settings.
    # Keeping UART blocks can cause unnecessary configuration attempts.
    # uart1:
    #   baudrate: 9600

    # =========================================================================
    # 4. MESSAGE OUTPUT
    # =========================================================================
    # Publish only what we need to reduce CFG-MSG configuration and avoid NACKs.
    # NAV-PVT is the key message for:
    # - lat/lon/height
    # - fix type
    # - RTK status (carrSoln: none/float/fix)
    # - accuracy estimates (hAcc/vAcc)
    publish:
      all: false

      # Keep NMEA ON only if you want quick RTK status via GGA fix quality
      nmea: true

      nav:
        all: false
        pvt: true          # Publish UBX-NAV-PVT (position/velocity/time + RTK state)
        relposned: false   # Enable only for dual-F9P moving-baseline heading
        heading: true      # Publish heading-related output (often COG-based unless moving-baseline is used)
      rxm:
        all: false
        rtcm: true         # publish /rxmrtcm so you can confirm RTCM is being received

    # Optional: disable printing all INF messages to keep logs clean
    inf:
      all: false

# =========================================================================
# 5. MOVING BASE RTCM WRITER
# =========================================================================
/**/moving_base_rtcm_writer:
  ros__parameters:
    # POWER+XBEE FTDI connected to the Lite moving-base UART1. The Quectel
    # modem shares the ttyUSB range and must not receive RTCM, so confirm the
    # index below belongs to the FTDI before starting NTRIP.
    # HH_260819 - The FTDI adapter was replaced (DN03DF8V -> DN05Y9E7). Always
    # rediscover the port after a cable/adapter change; a stale path leaves
    # NTRIP connected while silently delivering no CORS to the Lite.
    # HH_261026 - That replacement was unit 1's; unit 2 still carries the
    # original DN03DF8V, which enumerates as /dev/ttyUSB1 today. This index is
    # NOT stable - plugging the light MCU renumbered every ttyUSB on this
    # robot - so run `ls -l /dev/serial/by-id | grep DN03DF8V` and update this
    # line whenever USB changes, or you land in the silent no-CORS case above.
    # This 460800 value controls only CORS -> Lite UART1. Lite -> rover UART2 is
    # a separate board-saved link and both endpoints must also match 460800 in
    # u-center. Verify RTCM message reception before blaming the GNSS hardware.
    device: /dev/ttyUSB1
    baud: 460800
