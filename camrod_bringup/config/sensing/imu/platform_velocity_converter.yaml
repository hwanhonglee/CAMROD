/sensing/platform_velocity_converter:
  ros__parameters:
    velocity_topic: "/platform/status/velocity"
    # HH_260720 - Convert the hardware-driver ROS message into canonical AvgImu.
    imu_topic: "/sensing/imu/data_ros"
    imu_output_topic: "/sensing/imu/data"
    # HH_260331: Standardize sensing velocity topic naming.
    output_topic: "/sensing/platform_velocity_converter/twist_with_covariance"
    imu_status_topic: "/sensing/imu/status"
    publish_imu_status: false
    require_imu: true
    linear_variance: [0.05, 0.05, 0.1]
    angular_variance: [0.2, 0.2, 0.2]
