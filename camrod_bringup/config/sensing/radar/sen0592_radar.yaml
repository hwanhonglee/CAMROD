/**:
  ros__parameters:
    baud: 115200
    slave_id: 1

    # Polling / communication tuning
    poll_period_s: 0.06
    response_deadline_s: 0.20
    inter_frame_sleep_s: 0.003

    # Range message settings
    min_range_m: 0.02
    max_range_m: 4.50          # global fallback; overridden per-sensor by sensor_max_ranges_m
    field_of_view_rad: 0.26

    # Per-sensor detection angle written to register 0x0208 at startup.
    # Values: 1=15° 2=30° 3=45° 4=60° 5=75°. 0 = skip (sensor retains hardware value).
    # Order: REAR, LEFT2, LEFT1, RIGHT2, RIGHT1, FRONT.
    sensor_angle_config_values: [2, 2, 2, 2, 2, 2]

    # Per-sensor max detection range (m). Order: REAR, LEFT2, LEFT1, RIGHT2, RIGHT1, FRONT.
    sensor_max_ranges_m: [0.50, 0.80, 0.80, 0.80, 0.80, 1.50]
    # Hardware range limit (mm) written to register 0x021F. Same order as above.
    sensor_range_config_mm: [500, 800, 800, 800, 800, 1500]

    # Aggregated sensing message output
    publish_radar_status: false
    radar_status_topic: "status"

    # Sensor mapping
    sensor_names: ["REAR", "LEFT2", "LEFT1", "RIGHT2", "RIGHT1", "FRONT"]
    frame_ids:
      - "radar_rear_link"
      - "radar_left2_link"
      - "radar_left1_link"
      - "radar_right2_link"
      - "radar_right1_link"
      - "radar_front_link"

    # CH9344 multi-port device paths
    ports:
      - "/dev/ttyCH9344USB2"
      - "/dev/ttyCH9344USB3"
      - "/dev/ttyCH9344USB4"
      - "/dev/ttyCH9344USB5"
      - "/dev/ttyCH9344USB6"
      - "/dev/ttyCH9344USB7"

    # topic names (relative to namespace)
    topics:
      - "rear/range"
      - "left2/range"
      - "left1/range"
      - "right2/range"
      - "right1/range"
      - "front/range"
