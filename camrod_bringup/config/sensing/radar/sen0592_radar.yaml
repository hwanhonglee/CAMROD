# HH_260729 - SEN0592 configuration is grouped by where each value acts:
#   1) serial communication, 2) physical sensor registers,
#   3) software acceptance, 4) ROS output, 5) channel wiring.
# All values are STARTUP-ONLY except log_status and publish_radar_status.
/**:
  ros__parameters:
    # =========================================================================
    # 1. SERIAL COMMUNICATION  [STARTUP-ONLY]
    # =========================================================================
    baud: 115200
    slave_id: 1
    poll_period_s: 0.06
    response_deadline_s: 0.20
    inter_frame_sleep_s: 0.003
    # HH_260729 - A disabled channel opens no port, but keeps diagnostics and
    # consumers alive with no-target + per-channel dummy marker heartbeats.
    disabled_channel_dummy_publish_rate_hz: 2.0

    # =========================================================================
    # 2. PHYSICAL SENSOR REGISTERS  [STARTUP-ONLY]
    # =========================================================================
    # false: do not write; read back and verify the levels below.
    # true : read first, write only mismatched registers, then require identical
    #        FC03 readback. Missing FC06 echo alone is not treated as failure.
    # HH_260807 - Apply the requested near-field/wide-angle physical profile.
    hardware_write_on_startup: true

    # 0x0208 is one combined angle/sensitivity level, not independent horizontal
    # and vertical controls. Level 4 is the widest setting (dual-angle model:
    # approximately 65 deg horizontal / 80 deg vertical), so the vertical beam
    # also widens. The downstream 0.10 m stop gate and named self-echo bands
    # remain responsible for rejecting distant/fixed chassis returns.
    hardware_angle_levels: [4, 4, 4, 4, 4, 4, 4]

    # 0x021F range level: 1≈0.5 m, 2≈1.5 m, 3≈2.5 m,
    #                     4≈3.5 m, 5≈5.0 m.
    # HH_260807 - Use the shortest physical range on every channel to reduce
    # distant floor/chassis multipath. Stop distance is applied downstream so
    # raw measurements remain visible for self-echo diagnosis.
    hardware_range_levels: [1, 1, 1, 1, 1, 1, 1]

    # =========================================================================
    # 3. SOFTWARE ACCEPTANCE  [STARTUP-ONLY]
    # =========================================================================
    # false disables exactly one channel: no port open; its range and _ros
    # topics publish max_range+0.001 m with dummy_active=true at the rate above.
    # HH_260807 - Re-enable all seven physical channels for the live radar
    # visualization/audit. No channel uses the disabled-sensor dummy path.
    sensor_enabled: [true, true, true, true, true, true, true]

    software_min_range_m: 0.02
    software_default_max_range_m: 0.50
    # HH_260807 - Preserve the complete level-1 observation window. The
    # independent cost-grid stop_candidate_max_ranges_m policy controls which
    # per-channel measurements can stop motion while raw chassis echoes remain.
    software_max_ranges_m: [0.50, 0.50, 0.50, 0.50, 0.50, 0.50, 0.50]

    # =========================================================================
    # 4. ROS OUTPUT
    # =========================================================================
    # Visualization metadata only; it does not change the physical beam and is
    # not used by radar_cost_grid.
    range_message_field_of_view_rad: 1.134464
    radar_status_topic: "status"
    publish_radar_status: false   # DYNAMIC: aggregate AvgSensingRadar output
    log_status: false             # DYNAMIC: per-port console status rows

    # =========================================================================
    # 5. CHANNEL ORDER AND WIRING  [STARTUP-ONLY]
    # =========================================================================
    # Every list below uses exactly this index order.
    #
    # idx  sensor   port  enabled  angle  HW range  SW max
    #  0   FRONT1   USB0    yes      4       1      0.50 m
    #  1   FRONT2   USB1    yes      4       1      0.50 m
    #  2   LEFT1    USB4    yes      4       1      0.50 m
    #  3   LEFT2    USB5    yes      4       1      0.50 m
    #  4   RIGHT1   USB2    yes      4       1      0.50 m
    #  5   RIGHT2   USB3    yes      4       1      0.50 m
    #  6   REAR     USB6    yes      4       1      0.50 m
    #
    # HH_260702 - LEFT/RIGHT USB numbers reflect the crossed field harness.
    sensor_names: ["FRONT1", "FRONT2", "LEFT1", "LEFT2", "RIGHT1", "RIGHT2", "REAR"]

    frame_ids:
      - "radar_front1_link"
      - "radar_front2_link"
      - "radar_left1_link"
      - "radar_left2_link"
      - "radar_right1_link"
      - "radar_right2_link"
      - "radar_rear_link"

    ports:
      - "/dev/ttyCH9344USB0"
      - "/dev/ttyCH9344USB1"
      - "/dev/ttyCH9344USB4"
      - "/dev/ttyCH9344USB5"
      - "/dev/ttyCH9344USB2"
      - "/dev/ttyCH9344USB3"
      - "/dev/ttyCH9344USB6"

    # Generated CAMROD messages used by cost-grid and diagnostics.
    topics:
      - "front1/range"
      - "front2/range"
      - "left1/range"
      - "left2/range"
      - "right1/range"
      - "right2/range"
      - "rear/range"

    # Standard sensor_msgs/Range mirrors used by RViz/ROS-native tools.
    standard_ros_topics:
      - "front1/range_ros"
      - "front2/range_ros"
      - "left1/range_ros"
      - "left2/range_ros"
      - "right1/range_ros"
      - "right2/range_ros"
      - "rear/range_ros"
