/**:
  ros__parameters:
    baud: 115200
    slave_id: 1

    # Polling / communication tuning
    poll_period_s: 0.06
    response_deadline_s: 0.20
    inter_frame_sleep_s: 0.003

    # Range message settings
    min_range_m: 0.02
    max_range_m: 4.50          # global fallback; overridden per-sensor by sensor_max_ranges_m
    field_of_view_rad: 0.26

    # Per-sensor detection angle written to register 0x0208 at startup.
    # Values: 1=15° 2=30° 3=45° 4=60° 5=75°. 0 = skip (sensor retains hardware value).
    # HH_260611: Current bench test has one SEN0592 connected, so keep this file single-sensor.
    # For the full 6-radar vehicle setup, restore the REAR/LEFT/RIGHT/FRONT arrays from copy_org.
    sensor_angle_config_values: [5]

    # Per-sensor max detection range (m). Single connected radar is treated as FRONT.
    sensor_max_ranges_m: [1.50]
    # Hardware range limit (mm) written to register 0x021F.
    sensor_range_config_mm: [1500]

    # Aggregated sensing message output
    publish_radar_status: false
    radar_status_topic: "status"

    # Sensor mapping
    sensor_names: ["FRONT"]
    frame_ids:
      - "radar_front_link"

    # CH9344 multi-port device paths.
    # HH_260611: Use auto so the node probes whichever /dev/ttyCH9344USB* port currently has the one sensor.
    ports:
      - "auto:/dev/ttyCH9344USB*"

    # topic names (relative to namespace)
    topics:
      - "front/range"
