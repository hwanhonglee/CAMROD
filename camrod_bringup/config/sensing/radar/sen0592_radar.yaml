/**:
  ros__parameters:
    baud: 115200
    slave_id: 1

    # Polling / communication tuning
    poll_period_s: 0.06
    response_deadline_s: 0.20
    inter_frame_sleep_s: 0.003
    # HH_260702 - Normal bringup skips SEN0592 hardware register writes because
    # this harness returns read data reliably but times out on write echoes.
    # Software max_range filtering below still protects cost-grid consumers.
    configure_hardware_on_startup: false

    # Range message settings
    min_range_m: 0.02
    max_range_m: 4.50          # global fallback; overridden per-sensor by sensor_max_ranges_m
    field_of_view_rad: 0.26

    # Per-sensor detection angle written to register 0x0208 at startup.
    # Values: 1=15° 2=30° 3=45° 4=60° 5=75°. 0 = skip (sensor retains hardware value).
    # HH_260629 - Latest vehicle radar profile uses seven sensors:
    # FRONT1, FRONT2, LEFT1, LEFT2, RIGHT1, RIGHT2, REAR.
    sensor_angle_config_values: [1, 1, 1, 1, 1, 1, 1]

    # Per-sensor max detection range (m). Order: FRONT1, FRONT2, LEFT1, LEFT2, RIGHT1, RIGHT2, REAR.
    sensor_max_ranges_m: [1.50, 1.50, 0.80, 0.80, 0.80, 0.80, 0.50]
    # Hardware range limit (mm) written to register 0x021F. Same order as above.
    sensor_range_config_mm: [1500, 1500, 800, 800, 800, 800, 500]

    # Aggregated sensing message output
    publish_radar_status: false
    radar_status_topic: "status"

    # Sensor mapping
    # HH_260702 - Keep standalone sensing launch aligned with full bringup:
    #   name[i] -> frame_ids[i] -> ports[i] -> topics[i].
    #   Current field harness has LEFT and RIGHT branch ports crossed:
    #   USB0, USB1, USB4, USB5, USB2, USB3, USB6.
    sensor_names: ["FRONT1", "FRONT2", "LEFT1", "LEFT2", "RIGHT1", "RIGHT2", "REAR"]
    frame_ids:
      - "radar_front1_link"
      - "radar_front2_link"
      - "radar_left1_link"
      - "radar_left2_link"
      - "radar_right1_link"
      - "radar_right2_link"
      - "radar_rear_link"

    # CH9344 multi-port device paths.
    # HH_260702 - Match the current swapped LEFT/RIGHT field harness while
    # preserving logical topics and TF frames for downstream cost grids.
    ports:
      - "/dev/ttyCH9344USB0"
      - "/dev/ttyCH9344USB1"
      - "/dev/ttyCH9344USB4"
      - "/dev/ttyCH9344USB5"
      - "/dev/ttyCH9344USB2"
      - "/dev/ttyCH9344USB3"
      - "/dev/ttyCH9344USB6"

    # topic names (relative to namespace)
    topics:
      - "front1/range"
      - "front2/range"
      - "left1/range"
      - "left2/range"
      - "right1/range"
      - "right2/range"
      - "rear/range"
