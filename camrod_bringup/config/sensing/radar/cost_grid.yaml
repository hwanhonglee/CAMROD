/sensing/radar/radar_cost_grid:
  ros__parameters:
    output_topic: "/sensing/cost_grid/radar"
    base_frame_id: "robot_base_link"
    output_frame_id: "map"

    # Grid geometry
    resolution: 0.10
    width: 120
    height: 120
    origin_x: -6.0
    origin_y: -6.0

    # Cost model
    free_value: 0
    unknown_value: -1
    # HH_260630: Treat any valid SEN0592 hit inside its per-sensor max range as
    # safety-relevant. Invalid/no-target values are filtered by the radar driver.
    min_cost: 85
    max_cost: 95
    cost_range_min_m: 0.3
    # HH_260625: Ignore stable SEN0592 near-zero self echoes seen outdoors.
    # HH_260716 - A 20 s stationary vehicle sample showed body returns up to
    # 0.253 m (front ~0.17m, side ~0.25m, rear ~0.12m). Treat 0.30 m as the
    # common self-echo dead zone; hits at 0.30 m or farther remain stop inputs.
    ignore_below_range_m: 0.30
    # HH_260703 - Per-sensor overrides are ordered exactly like input_topics.
    # HH_260716 - LEFT2 also produced a repeated 0.70-0.72 m body/multipath
    # return in the stationary full-stack sample. LEFT1 retains normal left-side
    # coverage while LEFT2 uses a 0.75 m dead zone to prevent stop-latch chatter.
    ignore_below_ranges_m: [0.30, 0.30, 0.30, 0.75, 0.30, 0.30, 0.30]
    # HH_260422: Near-field only; per-sensor max_range limits detections before cost mapping.
    cost_range_max_m: 2.0
    obstacle_radius_m: 0.30
    # HH_260703 - radar_cost_grid clears ego before marking live hits, so valid
    # side/rear detections can still become blocking radar costs.
    ego_clear_radius_m: 0.50

    # Runtime
    max_message_age_s: 0.35
    publish_rate_hz: 10.0
    publish_radar_status: false
    radar_status_topic: "/sensing/radar/status"
    # HH_260623 - Match latest 7-channel SEN0592 radar topics.
    input_topics:
      - "/sensing/radar/front1/range"
      - "/sensing/radar/front2/range"
      - "/sensing/radar/left1/range"
      - "/sensing/radar/left2/range"
      - "/sensing/radar/right1/range"
      - "/sensing/radar/right2/range"
      - "/sensing/radar/rear/range"
