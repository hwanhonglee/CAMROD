/sensing/radar/radar_cost_grid:
  ros__parameters:
    output_topic: "/sensing/cost_grid/radar"
    base_frame_id: "robot_base_link"
    output_frame_id: "map"

    # Grid geometry
    resolution: 0.10
    width: 120
    height: 120
    origin_x: -6.0
    origin_y: -6.0

    # Cost model
    free_value: 0
    unknown_value: -1
    min_cost: 35
    max_cost: 95
    cost_range_min_m: 0.3
    # HH_260625: Ignore stable SEN0592 near-zero self echoes seen outdoors
    # (front ~0.10m, side ~0.03m, rear ~0.11m) without masking real >0.15m hits.
    ignore_below_range_m: 0.15
    # HH_260422: Near-field only; per-sensor max_range limits detections before cost mapping.
    cost_range_max_m: 2.0
    obstacle_radius_m: 0.30
    # HH_260422: Reduced from 0.90 so near-field side/rear readings are not cleared by ego disk.
    ego_clear_radius_m: 0.50

    # Runtime
    max_message_age_s: 0.35
    publish_rate_hz: 10.0
    publish_radar_status: false
    radar_status_topic: "/sensing/radar/status"
    # HH_260623 - Match latest 7-channel SEN0592 radar topics.
    input_topics:
      - "/sensing/radar/front1/range"
      - "/sensing/radar/front2/range"
      - "/sensing/radar/left1/range"
      - "/sensing/radar/left2/range"
      - "/sensing/radar/right1/range"
      - "/sensing/radar/right2/range"
      - "/sensing/radar/rear/range"
