# HH_260807 - LidarPreprocessorNode runs at this FQN in both the standalone
# and composed production paths. Keep every key aligned with the C++ node's
# declared parameter schema; launch files override only runtime topic wiring.
/sensing/lidar/lidar_preprocessor:
  ros__parameters:
    input_topic: "vanjee/points_raw"
    output_topic: "filtered_cloud"
    marker_frame_id: "lidar_link"

    # Forward field of view and robot-local crop used before ground segmentation.
    angle_filter_deg: 64.0
    roi_x_min: 0.0
    roi_x_max: 3.0
    roi_y_min: -1.5
    roi_y_max: 1.5
    roi_z_min: -1.0
    roi_z_max: 1.0

    voxel_leaf_size: 0.03
    qos_depth: 2
    # Zero preserves every incoming frame; set a positive value only to cap load.
    max_process_hz: 0.0
