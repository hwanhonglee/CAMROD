# HH_260629: Shared ground segmentation params for camrod_sensing and camrod_bringup.
# The full node FQN is /sensing/lidar/ground_segmentation in both launch paths.
/sensing/lidar/ground_segmentation:
  ros__parameters:
    robot_frame: "lidar_link"
    maxX:  3.0
    minX:  0.0
    maxY:  1.5
    minY: -1.5
    maxZ:  1.0
    minZ: -1.0
    downsample: true
    # HH_260701 - Field profiling showed 0.06 m keeps obstacle detail but
    # holds ground_segmentation near 4-5 Hz on Orin. 0.10 m keeps useful
    # obstacle points while reducing the planning safety-grid latency.
    downsample_resolution: 0.10
    lidar_to_ground: -0.75
    transform_tolerance: 0.1
    cellSizeX: 0.3
    cellSizeY: 0.3
    cellSizeZ: 1.0
    cellSizeZPhase2: 0.1
    slopeThresholdDegrees: 20.0
    groundInlierThreshold: 0.05
    centroidSearchRadius: 1.0
    maxGroundHeightDeviation: 0.05
    use_imu_orientation: false
    show_benchmark: false
    # HH_260702 - Keep RViz-only raw/ground debug clouds off during field runs;
    # /sensing/lidar/points_filtered remains the driving obstacle output.
    publish_debug_clouds: false
