# Cost-stop reproducibility profiles for simulation validation.
#
# Usage idea:
#   ros2 launch camrod_bringup cost_stop_profile.launch.py profile_name:=rear_repro
#
# Notes:
# - `default` mirrors conservative runtime defaults.
# - `rear_repro` is a test-oriented profile that improves REAR stop reproducibility
#   without changing the normal runtime baseline.
profiles:
  default:
    description: "Runtime-like baseline (conservative side/rear thresholds)."
    sim_obstacle_direction: front
    sim_obstacle_offset: 12.0
    sim_obstacle_lateral_offset: 0.0
    planning_cmd_vel_gate_side_cost_threshold: 92
    planning_cmd_vel_gate_rear_cost_threshold: 92
    planning_cmd_vel_gate_rear_lookahead_m: 0.6
    planning_cmd_vel_gate_rear_corridor_width_m: 0.6

  rear_repro:
    description: "Test profile for deterministic rear-stop reproduction."
    sim_obstacle_direction: rear
    sim_obstacle_offset: 0.5
    sim_obstacle_lateral_offset: 0.0
    # Raise side threshold so LEFT/RIGHT does not mask REAR validation.
    planning_cmd_vel_gate_side_cost_threshold: 101
    # Lower + widen rear corridor to trigger rear-stop more consistently.
    planning_cmd_vel_gate_rear_cost_threshold: 70
    planning_cmd_vel_gate_rear_lookahead_m: 1.5
    planning_cmd_vel_gate_rear_corridor_width_m: 1.5

  front_repro:
    description: "Test profile for deterministic front-stop reproduction."
    sim_obstacle_direction: front
    sim_obstacle_offset: 0.8
    sim_obstacle_lateral_offset: 0.0
    planning_cmd_vel_gate_side_cost_threshold: 92
    planning_cmd_vel_gate_rear_cost_threshold: 92
    planning_cmd_vel_gate_rear_lookahead_m: 0.6
    planning_cmd_vel_gate_rear_corridor_width_m: 0.6
