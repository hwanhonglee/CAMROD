# File layout: two parking-controller nodes (reverse, then AprilTag); each
# node's parameters are grouped into numbered sections such as topics,
# setup, maneuver tuning, and timing/rates.
#
# HH_260721 - Keep this package config synchronized with the bringup control mirror.
# HH_260720 - Configure selectable final parking controllers owned by camrod_control.

/parking/reverse_parking_controller:
  ros__parameters:
    # =========================================================================
    # 1. TOPICS
    # =========================================================================
    command_topic: "/control/cmd_vel_raw"
    vehicle_pose_topic: "/localization/pose"
    # HH_260720 - Consume one platform status and one shared parking operation contract.
    platform_status_topic: "/platform/status"
    operation_topic: "/parking/operation"
    status_topic: "/parking/reverse_parking_controller/status"
    path_topic: "/parking/reverse_parking_controller/path_ros"
    drop_zone_goal_topic: "/planning/drop_zone_goal_raw"
    diagnostics_topic: "/system/diagnostics"
    # HH_260721 - Parking publishes operational progress separately from health diagnostics.
    service_state_topic: "/service/state"

    # =========================================================================
    # 2. STATION SETUP
    # =========================================================================
    drop_zones_yaml: ""
    drop_zone_id: "drop_zone"
    use_drop_zone_pose_as_station: true
    station_x_m: 0.0
    station_y_m: 0.0
    station_yaw_deg: 0.0

    # =========================================================================
    # 3. REVERSE MANEUVER TUNING
    # =========================================================================
    # HH_260720 - Match control's contract: map yaw is the reverse travel axis, not body front yaw.
    station_yaw_represents_reverse_axis: true
    automatically_select_reverse_approach_yaw: false

    start_yaw_tolerance_deg: 7.5
    # HH_260807 - Preserve 40% of the 2.0 km/h cruise reference after the gate.
    reverse_speed_mps: 0.444444
    # HH_260818 - From 0.30 m remaining, ramp to this final raw speed.
    final_approach_speed_mps: 0.138889
    slowdown_start_remaining_distance_m: 0.30
    heading_proportional_gain: 0.8
    lateral_proportional_gain: -0.25
    maximum_angular_speed_radps: 0.22
    maximum_reverse_distance_m: 1.5
    reverse_timeout_s: 30.0

    require_station_on_reverse_axis: true
    station_axis_tolerance_m: 0.25

    # =========================================================================
    # 4. CHARGING COMPLETION
    # =========================================================================
    stop_when_charging: true
    # HH_260721 - Complete reverse parking only after normalized CAN confirms charging.
    complete_without_charging: false
    # HH_260813 - The platform now confirms charger contact over 10 s instead of
    # two BMS samples, so the parked wait must outlast that confirmation.
    charging_wait_timeout_s: 45.0

    # =========================================================================
    # 5. TIMING AND RATES
    # =========================================================================
    pose_timeout_s: 2.0
    control_rate_hz: 10.0
    idle_rate_hz: 1.0
    status_rate_hz: 1.0

/parking/apriltag_parking_controller:
  ros__parameters:
    # =========================================================================
    # 1. FRAMES AND TOPICS
    # =========================================================================
    # HH_260720 - Port the Ranger AprilTag controller to canonical CAMROD interfaces.
    # HH_260803 - AprilTag errors are measured from the axle midpoint.
    base_frame_id: "robot_center_link"
    command_topic: "/control/cmd_vel_raw"
    tag_pose_topic: "/perception/apriltag_parking_detector/tag_pose"
    odometry_topic: "/localization/odometry"
    # HH_260720 - Consume one platform status and one shared parking operation contract.
    platform_status_topic: "/platform/status"
    operation_topic: "/parking/operation"
    status_topic: "/parking/apriltag_parking_controller/status"
    diagnostics_topic: "/system/diagnostics"
    # HH_260721 - Parking publishes operational progress separately from health diagnostics.
    service_state_topic: "/service/state"

    # =========================================================================
    # 2. APPROACH AND INSERTION TUNING
    # =========================================================================
    require_charging_for_completion: true
    # HH_260818 - Charging CAN contact immediately stops every active phase.
    stop_when_charging: true

    heading_gain: 0.9 # HH_260824
    lateral_to_heading_gain: 1.5 # HH_260824
    maximum_angular_speed_radps: 1.0
    maximum_approach_angle_rad: 0.5

    # HH_260807 - Preserve the 50% approach and 12.5% insertion ratios.
    reverse_approach_speed_mps: 0.555556
    invert_angular_command_while_reversing: false
    final_insertion_speed_mps: 0.138889

    # HH_260824 - Match the operator UI's camera-frame 3D Tag distance exactly.
    # Slow down from 0.80 m, latch translation off at 0.40 m, then align yaw only.
    # Full bringup loads this package-owned file by default; keep deployment
    # mirrors synchronized so a field edit cannot silently leave 0.60 m active.
    slowdown_start_tag_distance_m: 0.80 # HH_260824
    translation_stop_tag_distance_m: 0.40 # HH_260824
    # Keep combined reverse + steering above Ranger's 0.81033 m spin threshold.
    minimum_approach_turn_radius_m: 0.85
    final_yaw_angular_speed_radps: 0.20

    # HH_260819 - Deprecated compatibility values. Camera-range thresholds above
    # own runtime motion; retain these robot-center values for older overrides.
    slowdown_start_distance_m: 1.443
    slowdown_start_remaining_distance_m: 0.60

    final_heading_tolerance_rad: 0.10 # HH_260824
    final_lateral_tolerance_m: 0.03 # HH_260824
    final_yaw_settle_hold_s: 0.8
    final_yaw_settle_max_rate_degps: 3.0
    final_insertion_start_distance_m: 0.993
    parked_distance_from_tag_m: 1.03 # HH_260824
    tag_timeout_s: 0.5
    odometry_timeout_s: 0.5
    tag_wait_timeout_s: 10.0
    retry_forward_distance_m: 1.0
    maximum_retries: 5

    # =========================================================================
    # 3. POSE FILTERING AND RATES
    # =========================================================================
    pose_filter_gain: 0.3
    control_rate_hz: 30.0
    status_rate_hz: 2.0
    axis_full_trust_distance_m: 0.743
    axis_minimum_trust_distance_m: 4.443
    axis_minimum_filter_weight: 0.05

    # =========================================================================
    # 4. VISUALIZATION AND FRAMES
    # =========================================================================
    publish_visualization: true
    odometry_frame_id: "odom"
