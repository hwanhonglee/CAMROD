# HH_260721 - Keep this package config synchronized with the bringup control mirror.
# HH_260720 - Keep safety-gate policy in one auditable parameter file instead
# of duplicating every field-tuned value as a launch argument.
/**:
  ros__parameters:
    # =========================================================================
    # Command topology
    # =========================================================================
    input_topic: "/control/cmd_vel_raw"
    navigation_input_topic: "/control/nav2_cmd_vel_ros"
    output_topic: "/control/cmd_vel"
    ros_output_topic: "/control/cmd_vel_ros"
    engage_topic: "/planning/engage"
    mission_engage_topic: "/planning/mission_engage"
    mission_request_topic: "/planning/mission_key"
    state_topic: "/control/command_enabled"
    # HH_260728 - Transient-local raw authorization for restart-safe sensing calibration.
    planning_engaged_topic: "/control/planning_engaged"
    status_topic: "/control/cmd_vel_safety_gate/status"
    platform_drive_enable_topic: "/platform/drive_enable"

    # =========================================================================
    # Platform and charging interlocks
    # =========================================================================
    require_platform_drive_enable: true
    platform_safety_source_mode: "platform_status"
    platform_status_topic: "/platform/status"
    platform_status_timeout_s: 0.5
    block_on_platform_status_stale: true
    block_on_charging: true
    # HH_260724 - Charger departure is a mission release, not a full-charge target.
    allow_mission_departure_while_charging: true
    charging_departure_grace_s: 15.0
    charger_departure_mission_prefixes: "camping_site_"
    mission_request_dedup_s: 1.0
    # HH_260724 - Require 35% SOC before a parked/charging robot may start a new campsite mission.
    require_battery_for_mission_departure: true
    minimum_mission_departure_battery_percentage: 0.35
    block_on_platform_error_code: true
    require_can_control_mode: true
    # HH_260724 - Keep an unconditional hard stop at 20% SOC.
    critical_battery_stop_enabled: true
    critical_battery_percentage: 0.20
    additional_estop_topics: "/planning/state_machine/estop"
    dr_timeout_source_mode: "localization_monitor"
    # HH_260721 - Keep the fallback DR timeout topic explicit even when monitor mode is selected.
    dr_timeout_topic: "/localization/dr_timeout"
    allow_on_start: false
    publish_zero_when_blocked: true

    # =========================================================================
    # Localization recovery hold
    # =========================================================================
    enable_gnss_recovery_hold: true
    localization_mode_topic: "/localization/mode"
    gnss_recovery_hold_s: 2.0
    gnss_recovery_min_source_s: 1.5
    gnss_recovery_hold_cooldown_s: 10.0
    gnss_recovery_source_mode_min: 2
    gnss_recovery_target_mode: 0

    # =========================================================================
    # Dynamic cost-grid stop
    # =========================================================================
    enable_cost_stop: true
    cost_grid_topic: "/planning/cost_grid/inflation"
    pose_topic: "/localization/pose"
    odometry_topic: "/localization/fallback/odometry"
    pose_source_preference: "pose_topic"
    enable_pose_raw_fallback: false
    robot_base_frame: "robot_center_link"
    cost_stop_threshold: 85
    cost_stop_lookahead_m: 2.0
    cost_stop_width_m: 1.27
    cost_stop_hold_s: 1.0
    # HH_260728 - Release is evaluated against the source/path/corridor that
    # triggered the stop; a later zero or changed-direction cmd_vel cannot clear it.
    cost_stop_latch_enable: true
    cost_stop_clear_required_s: 2.0
    cost_stop_latch_log_interval_s: 1.0
    cost_grid_stale_stop_enable: true
    cost_grid_stale_timeout_s: 1.0
    cost_grid_stale_log_interval_s: 1.0
    # HH_260721 - List every live source used to distinguish dynamic obstacles from static cost.
    cost_source_debug_enable: true
    cost_source_debug_max_age_s: 1.0
    cost_source_debug_topics:
      # HH_260806 - Match diagnostics to the high-resolution control raster.
      - "/map/cost_grid/lanelet_safety"
      # HH_260807 - Production dynamic cost is radar-only; LiDAR is not merged.
      - "/sensing/cost_grid/radar"
      - "/planning/cost_grid/global_path"
    cost_source_debug_labels: ["lanelet", "radar", "global_path"]
    cost_stop_require_dynamic_source: true
    cost_stop_dynamic_source_labels: "radar"
    # HH_260729 - Diagnostic-only companion to the aggregate radar grid.
    # It adds SENSOR/frame/range/map point/cost to radar stop logs; occupancy
    # grid evaluation remains the sole authority for stopping and releasing.
    radar_obstacle_evidence_topic: "/sensing/radar/obstacle_evidence"
    radar_obstacle_evidence_max_age_s: 0.50
    front_dynamic_stop_use_local_path: true
    front_dynamic_path_width_m: 1.27
    front_dynamic_path_max_start_distance_m: 1.5

    # =========================================================================
    # Static lanelet guard
    # =========================================================================
    lanelet_safety_enable: true
    # HH_260806 - The 0.25 m Nav2 grid visibly inflated a 5 cm margin by up to
    # half a cell. Use the independent 0.05 m local safety raster instead.
    lanelet_safety_grid_topic: "/map/cost_grid/lanelet_safety"
    lanelet_safety_threshold: 85
    lanelet_safety_current_threshold: 85
    # HH_260807 - Cost 100 inside the measured physical body hard-stops ordinary
    # motion. A bounded recovery is admitted only when every 0.05 m-raster sweep
    # sample is non-increasing and its body + planning-footprint endpoint is clear.
    lanelet_safety_body_hard_stop_enable: true
    lanelet_safety_body_hard_stop_threshold: 100
    lanelet_safety_body_front_m: 0.70837
    lanelet_safety_body_rear_m: 0.68323
    lanelet_safety_body_left_m: 0.53505
    lanelet_safety_body_right_m: 0.53495
    # HH_260809 - Match the short front face and tapered fabricated shoulders;
    # all six transitions use a 0.05 m physical fillet. The planning polygon is
    # generated as the same contour offset 0.10 m outward.
    lanelet_safety_tapered_rounded_boundary_enable: true
    lanelet_safety_boundary_front_taper_m: 0.12
    lanelet_safety_boundary_front_shoulder_depth_m: 0.12
    lanelet_safety_boundary_corner_radius_m: 0.05
    lanelet_safety_boundary_corner_samples: 4
    # HH_260803 - Check the complete axle-midpoint planning boundary.
    lanelet_safety_footprint_enable: true
    # HH_260727 - 98 is the soft/rasterized lane edge; 100 is truly off-lane.
    # This preserves whole-body containment without immobilizing narrow mapped lanes.
    lanelet_safety_footprint_threshold: 100
    # HH_260807 - Polygon points are robot_center_link-local; reject map-frame
    # polygons instead of reconstructing geometry from an asynchronous pose.
    robot_planning_boundary_topic: "/platform/robot/planning_boundary"
    # Fallback dimensions match robot_params/Nav2 footprint if the boundary
    # publisher has not produced its transient-local polygon yet.
    # HH_260807 - Add 0.10 m recoverable clearance around the unchanged body.
    lanelet_safety_footprint_front_m: 0.80837
    lanelet_safety_footprint_rear_m: 0.78323
    lanelet_safety_footprint_left_m: 0.63505
    lanelet_safety_footprint_right_m: 0.63495
    lanelet_safety_lookahead_m: 1.0
    lanelet_safety_width_m: 0.8
    lanelet_safety_stop_on_unknown: true
    lanelet_safety_allow_rotation_in_place: true
    lanelet_safety_check_reverse: false
    lanelet_safety_check_lateral: false
    lanelet_safety_min_translation_mps: 0.02
    lanelet_safety_front_use_local_path: true
    lanelet_safety_front_path_max_start_distance_m: 1.5
    lanelet_safety_front_path_width_m: 0.25
    lanelet_safety_front_path_allow_route_reentry: true
    lanelet_safety_current_allow_route_reentry: true
    lanelet_safety_current_route_reentry_max_distance_m: 4.0
    lanelet_safety_current_route_reentry_require_front_cmd: true
    # HH_260729 - Pause Nav2 progress during a route violation and require the
    # saved trigger direction to remain clear before the same mission resumes.
    route_safety_recovery_enable: true
    # Runtime updates outside [0.1, 30.0] s are rejected.
    # HH_260807 - Map-v17 B2 A/B: 1.0 s recontacted in 0.58 s; 1.5 s
    # completed the same RPP goal in 3/3 runs after real recovery motion.
    route_safety_recovery_clear_required_s: 1.5
    # HH_260810 - A snapped manual goal may need repeated projected escape and
    # yaw-fit cycles. Permit at most 50 releases in one contact region; body
    # contact, dynamic obstacles, and platform interlocks remain hard blocks.
    # Runtime updates outside [0, 100] are rejected.
    route_safety_recovery_max_auto_releases: 50
    route_safety_recovery_recontact_window_s: 5.0
    # Reset that regional budget only after signed forward progress carries the
    # robot beyond the original contact. The time window is fallback-only when
    # a historical decision has no valid map pose.
    route_safety_recovery_progress_reset_distance_m: 0.75
    # Runtime updates outside [0.1, 60.0] s are rejected.
    route_safety_recovery_log_interval_s: 1.0
    # HH_260731 - Admit the saved trigger's opposite translation and a pure
    # orthogonal crab candidate. This gate does not generate recovery motion.
    # The projected complete footprint decides which crab side moves away from
    # the boundary; current contact is the only exception and every dynamic
    # obstacle/interlock remains active.
    route_safety_allow_opposite_recovery_command: true
    # Runtime updates must stay in [-1.0, 0.0].
    route_safety_opposite_direction_cosine_max: -0.5
    # The endpoint probe is intentionally bounded to [0.05, 0.5] m.
    route_safety_opposite_recovery_probe_distance_m: 0.25
    # A timer callback cannot turn a previously received localization sample
    # into fresh route-clear evidence; valid runtime range is [0.05, 5.0] s.
    route_safety_recovery_pose_max_age_s: 0.5
    # HH_260803 / TODOLIST 12 - Publish one fully evaluated candidate for the
    # separate bounded owner. Raw speed is capped at 0.10 m/s and still passes
    # the gate again before reaching the platform.
    route_safety_auto_recovery_candidate_enable: true
    route_safety_auto_recovery_candidate_topic: "/control/route_safety_recovery/candidate"
    route_safety_auto_recovery_speed_mps: 0.10
    # HH_260805 - Permit only a projected reverse-yaw stage after straight
    # reverse or before a unique safe crab direction becomes available.
    route_safety_auto_recovery_yaw_rate_radps: 0.10
    # HH_260803 - Lanelet raster is static/route-scoped and slower than the
    # 1 s dynamic obstacle grid; pose freshness remains independently 0.5 s.
    route_safety_lanelet_grid_max_age_s: 12.0
    # =========================================================================
    # Bounded maneuver exceptions keep live LiDAR and radar stops enabled.
    # =========================================================================
    drop_zone_maneuver_controller_status_topic: "/control/drop_zone_maneuver_controller/status"
    drop_zone_maneuver_controller_static_bypass_phases: "EXIT_STRAIGHT,ALIGN_EXIT_YAW"
    # HH_260807 - Permit only the bounded charger-exit controller to cross the
    # off-road service-area boundary; live LiDAR/radar stops remain enabled.
    drop_zone_maneuver_controller_lanelet_bypass_phases: "EXIT_STRAIGHT,ALIGN_EXIT_YAW"
    camping_site_maneuver_controller_status_topic: "/control/camping_site_maneuver_controller/status"
    # HH_260721 - Bypass static lanelet cost during bounded entry-lanelet retrace alignment.
    camping_site_maneuver_controller_static_bypass_phases: "ALIGN_ENTRY_YAW,REVERSE_IN,CRAB_IN,ROTATE_180,ALIGN_RETRACE_YAW,REVERSE_OUT,CRAB_OUT"
    # HH_260806 - Campsite areas lie outside road lanelets. Only these explicit
    # phases bypass lanelet geometry; live LiDAR/radar checks remain enabled.
    camping_site_maneuver_controller_lanelet_bypass_phases: "ALIGN_ENTRY_YAW,REVERSE_IN,CRAB_IN,ROTATE_180,ALIGN_RETRACE_YAW,REVERSE_OUT,CRAB_OUT"
    # HH_260807 - Reverse and AprilTag docking finish in the mapped charger
    # service area outside the road lanelet. Keep this exception phase-bounded;
    # source-specific LiDAR/radar obstacle checks remain active.
    reverse_parking_controller_status_topic: "/parking/reverse_parking_controller/status"
    apriltag_parking_controller_status_topic: "/parking/apriltag_parking_controller/status"
    parking_controller_static_bypass_phases: "REVERSE_APPROACH,WAITING_FOR_TAG,TAG_GUIDED_REVERSE,FINAL_REVERSE_INSERTION,RETRY_FORWARD_EXIT"
    parking_controller_lanelet_bypass_phases: "REVERSE_APPROACH,WAITING_FOR_TAG,TAG_GUIDED_REVERSE,FINAL_REVERSE_INSERTION,RETRY_FORWARD_EXIT"

    # =========================================================================
    # Speed-dependent front corridor
    # =========================================================================
    enable_speed_dependent_lookahead: true
    front_lookahead_min_m: 2.60
    front_lookahead_max_m: 3.5
    front_lookahead_friction: 0.4
    front_reaction_time_s: 0.20
    front_lookahead_margin_m: 0.45

    # =========================================================================
    # Side, rear, crab, reverse, and rotation protection
    # =========================================================================
    enable_side_rear_cost_stop: true
    enable_body_near_dynamic_stop: true
    # HH_260728 - Radar hits already carry a 0.30 m cost disk. A 0.60 m raw
    # forward probe lets a base-centred 1.0 m side return pass straight travel;
    # crab/reverse keeps the separate 1.20 m maneuver envelope below.
    body_near_side_lookahead_m: 0.60
    body_near_rear_lookahead_m: 0.80
    body_near_maneuver_side_lookahead_m: 1.20
    body_near_maneuver_rear_lookahead_m: 0.80
    # HH_260721 - One threshold governs lateral merged and live-source obstacle checks.
    side_cost_threshold: 85
    side_lookahead_m: 1.2
    side_corridor_width_m: 1.69160
    rear_cost_threshold: 85
    rear_lookahead_m: 1.2
    rear_corridor_width_m: 1.27
    lateral_cmd_bypass_static_cost_stop: true
    lateral_cmd_bypass_min_mps: 0.02
    reverse_cmd_bypass_static_cost_stop: true
    reverse_cmd_bypass_min_mps: 0.02
    rotation_cmd_dynamic_obstacle_stop: true
    rotation_cmd_dynamic_obstacle_radius_m: 1.5
    rotation_cmd_dynamic_obstacle_threshold: 85
    enable_unavoidable_stop: true
    unavoidable_lethal_threshold: 90
    unavoidable_cluster_min_cells: 25
    unavoidable_cluster_min_ratio: 0.25

    # =========================================================================
    # Optional yaw zone and normal route-heading guard
    # =========================================================================
    enable_yaw_alignment_zone: false
    yaw_alignment_frame_id: "map"
    yaw_alignment_zones_file: ""
    yaw_alignment_exit_margin_m: 0.3
    enable_route_heading_alignment: true
    route_heading_path_topic: "/planning/local_path"
    route_heading_frame_id: "map"
    route_heading_min_cmd_x_mps: 0.03
    route_heading_lateral_cmd_epsilon_mps: 0.02
    route_heading_lookahead_m: 2.0
    route_heading_error_enter_deg: 75.0
    # HH_260806 - A gross start alignment must finish before forward motion;
    # ordinary curve tracking stays with continuous RPP control.
    route_heading_error_exit_deg: 5.0
    route_heading_angular_kp: 0.8
    route_heading_max_angular_z: 0.35
    route_heading_max_linear_x: 0.0
    route_heading_min_path_points: 2

    # =========================================================================
    # Output shaping and stale-input behavior
    # =========================================================================
    # HH_260807 - Keep standalone control and full bringup on the same 2 km/h
    # profile: the active raw 1.111111 m/s cruise is halved at the final gate.
    speed_scale: 0.5
    input_timeout_s: 0.35
    zero_publish_rate_hz: 10.0
    # HH_260806 - Hold only when an explicit zero-turn/crab owner releases
    # cmd_vel. Normal RotationShim/RPP commands remain continuous.
    maneuver_command_release_hold_s: 0.5
