# Layout: 1) map source/origin, 2) input/output topics, 3) snap search and
# containment, 4) Z handling, 5) lanelet component and routing filters,
# 6) cost-grid component filter, 7) sequential goal queue,
# 8) goal reissue on pose jump, 9) goal reissue after route recovery.
# 2026-01-30 Update map path/origin for lanelet2_maps.osm.
# Default params for lanelet goal snapping.
/planning/goal_snapper:
  ros__parameters:
    # =========================================================================
    # 1. MAP SOURCE AND ORIGIN
    # =========================================================================
    # Launch passes resolved map_path; keep YAML default empty to avoid host-specific hardcoding.
    map_path: ""
    offset_lat: 36.8435737
    offset_lon: 128.0925646
    offset_alt: 0.0

    # =========================================================================
    # 2. INPUT AND OUTPUT TOPICS
    # =========================================================================
    # HH_260730 - UI/mission goals use lane heading. Manual RViz goals use the
    # same vehicle-routable lane-center projection but preserve the clicked yaw.
    input_goal_topic: "/planning/site_goal_pose_ros"
    manual_input_goal_topic: "/goal_pose"
    # HH_260623 - Private input for planning_state_machine auto return goals.
    # It keeps drop-zone station-center poses away from the public campsite site_goal topic.
    auxiliary_input_goal_topic: "/planning/auto_goal_raw"
    # Publish only snapped goal on dedicated topic.
    output_goal_topic: "/planning/goal_pose_snapped"
    # HH_260528: ROS PoseStamped mirror for direct Nav2 consumption.
    output_goal_topic_ros: "/planning/goal_pose_snapped_ros"
    output_goal_source_topic: "/planning/goal_source"
    # HH_260727 - Allow source-specific Nav2 selectors to settle before goal delivery.
    goal_source_settle_delay_s: 0.12

    # =========================================================================
    # 3. SNAP SEARCH AND CONTAINMENT
    # =========================================================================
    # Restore practical search radius for multi-goal operation.
    # 30 m often rejects valid second goals (no new snapped goal => no replanning).
    max_search_radius: 120.0
    require_lanelet_containment: true
    # 2026-02-23: If clicked outside lanelet polygon, still snap to nearest lanelet centerline.
    fallback_uncontained: true

    # =========================================================================
    # 4. Z HANDLING
    # =========================================================================
    # HH_260528 Z behavior:
    # use_map_z=true   -> lanelet projected Z + map_z_offset
    # flatten_to_ground=true -> overwrite to 2D planning ground Z(0) + map_z_offset
    use_map_z: false
    # HH_260623 - Force UI/RViz/site snapped goals onto the same 2D ground plane as map/path markers.
    flatten_to_ground: true
    map_z_offset: 0.0

    # =========================================================================
    # 5. LANELET COMPONENT AND ROUTING FILTERS
    # =========================================================================
    # HH_260707: Avoid a duplicate Lanelet2 RoutingGraph build in goal_snapper.
    # The cost-grid component below remains the reachable-goal filter, while
    # LaneletRoutePlanner remains the authoritative route graph for planning.
    restrict_to_connected_lanelet_component: false
    # false: strict reject until connected component is ready.
    # true : fallback to global nearest centerline when component is unavailable.
    allow_component_fallback_to_global: false
    component_include_lane_changes: true
    component_max_expansion_nodes: 5000
    current_pose_topic: "/planning/lanelet_pose"
    # Empty preserves the common CAMROD behavior: current_pose_topic is also
    # the pose-jump source. Simulator launch profiles may supply raw localization.
    pose_jump_check_topic: ""
    current_lanelet_search_radius: 12.0
    component_update_min_period_s: 0.2
    component_update_min_displacement_m: 0.5
    routing_location: "de"
    routing_participant: "vehicle:car"
    # HH_260727 - Do not snap regulated UI goals to crosswalk/non-vehicle lanelets.
    routable_lanelet_only: true

    # =========================================================================
    # 6. COST-GRID COMPONENT FILTER
    # =========================================================================
    # HH_260617: Snap only to the same traversable OccupancyGrid component
    # as the current pose. This prevents Nav2 from receiving a lanelet-routing
    # goal that is disconnected in the actual costmap raster.
    restrict_to_cost_grid_component: true
    # HH_260625: Startup map cost grid is an unknown placeholder until the first
    # LaneletRoute publishes route IDs; use lanelet-component filtering during that window.
    allow_cost_grid_component_fallback: true
    # HH_260619 - Campsite center goals are off-lane by design. Avoid snapping
    # them to a distant stale component when the nearest real lanelet is close.
    uncontained_global_snap_override_enable: true
    uncontained_global_snap_max_distance_m: 15.0
    uncontained_global_snap_min_improvement_m: 5.0
    cost_grid_topic: "/map/cost_grid/lanelet"
    cost_grid_block_threshold: 100

    # =========================================================================
    # 7. SEQUENTIAL GOAL QUEUE
    # =========================================================================
    # HH_260618: RViz/UI goals are commands, not a waypoint queue. Publish the
    # latest snapped goal immediately so Nav2 preempts older active goals.
    # Enable this only for explicit waypoint smoke tests.
    sequential_goal_release_enable: false
    # HH_260618: If sequential mode is explicitly enabled, keep only the newest
    # pending goal rather than following stale clicks in FIFO order.
    sequential_goal_queue_policy: "replace_pending"
    # HH_260623 - This latch also suppresses active-goal reissues; keep it
    # center-based so a route is not considered reached before robot_center_link
    # reaches the snapped goal.
    sequential_goal_reached_distance_m: 0.25
    sequential_goal_stop_hold_s: 0.5
    sequential_goal_duplicate_xy_eps_m: 0.20
    # HH_260727 - Same-position manual goals with a different arrow direction
    # are distinct commands and must not be swallowed by duplicate filtering.
    sequential_goal_duplicate_yaw_eps_rad: 0.05
    sequential_goal_max_queue_size: 10
    sequential_goal_status_topic: "/planning/navigate_to_pose/_action/status"
    # HH_260618: Release queued waypoints only after Nav2 reports SUCCEEDED, not
    # only after pose-distance arrival, to avoid BT topic-goal preemption.
    sequential_goal_require_nav2_terminal: true

    # =========================================================================
    # 8. GOAL REISSUE ON POSE JUMP
    # =========================================================================
    # HH_260619 - When RViz/manual test pose is teleported while a goal is active,
    # reissue the same snapped goal once so Nav2 rebuilds its FollowPath context
    # from the new pose instead of rotating against the stale action path.
    reissue_active_goal_on_pose_jump: true
    pose_jump_reissue_distance_m: 1.5
    pose_jump_reissue_min_interval_s: 1.0

    # =========================================================================
    # 9. GOAL REISSUE AFTER ROUTE RECOVERY
    # =========================================================================
    # HH_260729 - Reissue a retained goal only when its Nav2 action aborted
    # during an explicit route-safety hold and the gate later becomes enabled.
    reissue_active_goal_after_route_recovery: true
    # CARLA may leave Nav2 EXECUTING while a separate bounded controller owns
    # the recovery. Keep refreshing that active action opt-in so the shared
    # package remains behaviorally equivalent to develop.
    reissue_active_goal_after_route_recovery_when_nav_active: false
    route_recovery_status_topic: "/control/cmd_vel_safety_gate/status"
    route_recovery_reissue_clear_delay_s: 0.5
    route_recovery_reissue_min_interval_s: 2.0
    route_recovery_max_reissues_per_goal: 2
