# 2026-01-30 Update map path/origin for lanelet2_maps.osm.
# Default params for lanelet goal snapping.
/planning/goal_snapper:
  ros__parameters:
    # Launch passes resolved map_path; keep YAML default empty to avoid host-specific hardcoding.
    map_path: ""
    offset_lat: 36.8436194
    offset_lon: 128.0925490
    offset_alt: 0.0
    input_goal_topic: "/goal_pose"
    # Publish only snapped goal on dedicated topic.
    output_goal_topic: "/planning/goal_pose_snapped"
    # HH_260528: ROS PoseStamped mirror for direct Nav2 consumption.
    output_goal_topic_ros: "/planning/goal_pose_snapped_ros"
    # Restore practical search radius for multi-goal operation.
    # 30 m often rejects valid second goals (no new snapped goal => no replanning).
    max_search_radius: 120.0
    require_lanelet_containment: true
    # 2026-02-23: If clicked outside lanelet polygon, still snap to nearest lanelet centerline.
    fallback_uncontained: true
    # HH_260528 Z behavior:
    # use_map_z=true   -> lanelet projected Z + map_z_offset
    # flatten_to_ground=true -> overwrite to map median ground Z + map_z_offset
    use_map_z: false
    flatten_to_ground: false
    map_z_offset: 0.0

    # HH_260528 Restrict snapped goal to lanelet network connected to current pose.
    restrict_to_connected_lanelet_component: true
    # false: strict reject until connected component is ready.
    # true : fallback to global nearest centerline when component is unavailable.
    allow_component_fallback_to_global: false
    component_include_lane_changes: true
    component_max_expansion_nodes: 5000
    current_pose_topic: "/planning/lanelet_pose"
    current_lanelet_search_radius: 12.0
    component_update_min_period_s: 0.2
    component_update_min_displacement_m: 0.5
    routing_location: "de"
    routing_participant: "vehicle:car"
    # HH_260617: Snap only to the same traversable OccupancyGrid component
    # as the current pose. This prevents Nav2 from receiving a lanelet-routing
    # goal that is disconnected in the actual costmap raster.
    restrict_to_cost_grid_component: true
    allow_cost_grid_component_fallback: false
    cost_grid_topic: "/map/cost_grid/lanelet"
    cost_grid_block_threshold: 100

    # HH_260618: RViz/UI goals are commands, not a waypoint queue. Publish the
    # latest snapped goal immediately so Nav2 preempts older active goals.
    # Enable this only for explicit waypoint smoke tests.
    sequential_goal_release_enable: false
    # HH_260618: If sequential mode is explicitly enabled, keep only the newest
    # pending goal rather than following stale clicks in FIFO order.
    sequential_goal_queue_policy: "replace_pending"
    sequential_goal_reached_distance_m: 0.8
    sequential_goal_stop_hold_s: 0.5
    sequential_goal_duplicate_xy_eps_m: 0.20
    sequential_goal_max_queue_size: 10
    sequential_goal_status_topic: "/planning/navigate_to_pose/_action/status"
    # HH_260618: Release queued waypoints only after Nav2 reports SUCCEEDED, not
    # only after pose-distance arrival, to avoid BT topic-goal preemption.
    sequential_goal_require_nav2_terminal: true
