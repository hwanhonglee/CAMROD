# 2026-01-30 Update map path/origin for lanelet2_maps.osm.
# Default params for lanelet centerline snapping.
/planning/centerline_snapper:
  ros__parameters:
    # Launch passes resolved map_path; keep YAML default empty to avoid host-specific hardcoding.
    map_path: ""
    offset_lat: 36.8436194
    offset_lon: 128.0925490
    offset_alt: 0.0
    input_pose_topic: "/localization/pose"
    output_pose_topic: "/planning/lanelet_pose"
    output_pose_cov_topic: "/planning/lanelet_pose_with_covariance"
    # Expand search radius to handle map/pose offsets during sim.
    max_search_radius: 120.0
    longitudinal_stddev: 0.5
    lateral_stddev: 0.3
    yaw_stddev: 0.2
    use_map_z: true
    map_z_offset: 0.0
    flatten_to_ground: false
    # Throttle nearest-centerline projection for CPU stability.
    min_update_period_s: 0.05
    min_input_displacement_m: 0.05
