/planning/planning_state_machine:
  ros__parameters:
    enabled: true
    state_status_topic: "/system/diagnostics_agg"
    pose_topic: "/planning/lanelet_pose"
    # State machine tracks the snapped goal stream, not raw /goal_pose.
    goal_topic: "/planning/goal_pose_snapped"
    # Auto-goals are mirrored to the Nav2-facing topic as well.
    goal_topic_ros: "/planning/goal_pose_snapped_ros"
    state_topic: "/planning/state_machine/state"
    estop_topic: "/planning/state_machine/estop"

    # HH_260528 Scenario contract for UI integration:
    # 0=WAIT_DROP_ZONE, 1=DELIVERY_TO_SITE, 2=RETURN_TO_DROP_ZONE, 3=RECALL_TO_SITE
    scenario_id_topic: "/planning/state_machine/scenario_id"
    # UI/ops command topic. Send std_msgs/Int32 with {0,1,2,3}.
    scenario_command_topic: "/planning/state_machine/scenario_command"

    return_to_drop_zone_topic: "/planning/state_machine/return_to_drop_zone"
    # Recall request published from a camping site.
    # msg.data = camping site name (e.g. "camping_site_3").
    # Triggers recall flow to "<site>_road" keypoint when defined.
    camping_site_recall_topic: "/planning/state_machine/camping_site_recall"
    # Publishes the reason for the current goal (startup / return_request / recall:* / auto_return).
    mission_source_topic: "/planning/state_machine/mission_source"
    return_goal_key: "drop_zone"
    goal_key_topic: "/planning/state_machine/goal_key"
    request_goal_service: "/planning/state_machine/request_goal"
    status_stream_topic: "/status_stream"

    # Launch resolves these to absolute paths at startup; keep empty here to
    # avoid host-specific path hardcoding in the package config.
    keypoints_yaml: ""
    camping_sites_yaml: ""
    startup_goal_key: "drop_zone"
    warn_goal_key: "garage"

    auto_startup_goal: true
    auto_warn_recovery_goal: true
    auto_estop_on_error: true

    # When true: arriving at a camping_site_* key starts a dwell timer; after
    # goal_reached_dwell_s the robot auto-returns to return_goal_key.
    # When false: robot waits until an external return command arrives.
    enable_auto_return_on_site_goal: false
    site_goal_key_prefix: "camping_site_"
    goal_reached_dwell_s: 10.0
    # Distance tolerance for associating a manual goal with a keypoint (auto-return eligibility).
    goal_key_match_distance_m: 1.5

    # HH_260528 Scenario-2 -> Scenario-0 completion gate.
    # false: reaching return_goal_key pose is enough.
    # true : require docking status true as well.
    require_docking_for_idle: false
    docking_status_topic: "/docking/is_charging"

    min_goal_publish_interval_s: 1.0
    goal_reached_distance_m: 0.8
    loop_rate_hz: 5.0
