# Update map path/origin for lanelet2_maps.osm.
# Parameters for planning path-focused lanelet cost grids
# Layout per node: 1) map source and projection, 2) grid geometry,
# 3) cost mode and lanelet masking, 4) path-lanelet matching,
# 5) cost values and gradients, 6) window and input topics,
# 7) path freshness and clearing, 8) rebuild triggers,
# 9) raster thresholds and debug, 10) output and QoS.

# =========================================================================
# GLOBAL PATH COST GRID NODE
# =========================================================================
/planning/lanelet_cost_grid_global_path:
  ros__parameters:
    # =========================================================================
    # 1. MAP SOURCE AND PROJECTION
    # =========================================================================
    # Prefer launch-level override from map_info.yaml/bringup.
    map_path: ""
    map_frame_id: "map"
    offset_lat: 0.0
    offset_lon: 0.0
    offset_alt: 0.0
    # Keep lanelet projector aligned with map loader/snapper nodes.
    projector_type: "local_cartesian"

    # =========================================================================
    # 2. GRID GEOMETRY
    # =========================================================================
    # Align resolution with map lanelet grid to reduce raster/marker mismatch.
    resolution: 0.08
    # Bound helper grid window to reduce CPU spikes from full-map rebuild.
    width: 600
    height: 600
    centerline_half_width: 1.50
    free_value: 0
    lethal_value: 100

    # =========================================================================
    # 3. COST MODE AND LANELET MASKING
    # =========================================================================
    # cost_mode options:
    #   "path"       : (recommended here) low on path strip, high outside path
    #   "lanelet"    : full lanelet polygon cost map
    #   "centerline" : centerline corridor map
    #   "bounds"     : lane boundaries only
    # Path mode = low cost on path, high cost elsewhere.
    cost_mode: "path"
    # High cost outside path strip — robot prefers staying on planned route.
    # outside_value options:
    #   -1  : unknown (→ 0=free; path strip is MORE expensive than off-strip — wrong)
    #   0   : force free outside
    #   80  : soft-lethal outside — off-route expensive, on-route preferred
    #   100 : force lethal outside
    outside_value: 80
    # Render path grid only inside lanelet geometry (no rectangular background).
    # path_use_lanelet_mask options:
    #   true  : paint only lanelet area
    #   false : allow rectangular path window fill
    path_use_lanelet_mask: true
    # Global path grid also restricted to lanelets touched by active global path.
    # path_lanelet_only options:
    #   true  : only lanelets matched by active path
    #   false : all lanelets in map
    # Show only lanelets touched by active route to avoid whole-map red fill.
    path_lanelet_only: true
    # Clamp path strip cells to lanelet polygons to prevent boundary spill.
    path_clip_to_lanelet: true

    # =========================================================================
    # 4. PATH-LANELET MATCHING
    # =========================================================================
    # Keep lanelet matching robust on sparse/curved path updates.
    # Tighten nearest-lanelet fallback so unrelated lanelets are not attached.
    # Tighten nearest-lanelet match distance to reduce boundary spill.
    # Tighten lanelet matching on global route so cost strip
    # stays strictly on the snapped centerline corridor.
    # Slightly relax lanelet matching so new-goal global routes
    # are not dropped at curved/offset endpoints.
    path_lanelet_match_max_dist: 0.45
    # Allow nearest-lanelet fallback as a temporary bridge when
    # exact polygon containment fails on sparse/quantized path samples.
    path_lanelet_allow_nearest_fallback: true
    # Keep sample density balanced for realtime updates.
    # Densify global route sampling to reduce sparse/cut strip cells.
    path_lanelet_sample_step: 0.05

    # =========================================================================
    # 5. COST VALUES AND GRADIENTS
    # =========================================================================
    # Keep global-path layer non-lethal and planner-safe.
    # Values stay in a soft-cost range while preserving near/far contrast.
    # Keep global lanelet base in soft range so centerline
    # preference dominates and red patches are reduced.
    path_lane_base_value: 75
    path_use_pose_distance_gradient: true
    # Keep centerline as the lowest-cost route inside the path strip.
    path_use_lateral_gradient: true
    # Centerline-first tuning:
    # prioritize lateral(centerline) term over pose-distance term.
    path_pose_cost_weight: 0.05
    path_lateral_cost_weight: 0.95
    # Visualization path layer should not add extra heading penalties.
    direction_penalty: 0
    backward_penalty: 0
    # Slightly tighter range so high-cost segment becomes visible sooner.
    gradient_range: 35.0
    grid_yaw: 0.0

    # =========================================================================
    # 6. WINDOW AND INPUT TOPICS
    # =========================================================================
    # HH_260527: window_mode options:
    #   robot_centered: window centered on current pose
    #   path_bbox: window centered on active path bounding box
    #   fixed: fixed-origin window from map_frame origin
    #   map_bbox: use full lanelet map bounds
    window_mode: "robot_centered"
    # Use lanelet-snapped pose for stable in-lane realtime refresh.
    # This prevents temporary off-lane localization jitter from shifting path-cost windows.
    pose_topic: "/planning/lanelet_pose"
    # HH_260619 - Build path guidance from the actual published global route.
    # /planning/plan_smoothed is not a stable ROS topic in the Nav2 BT flow.
    path_topic: "/planning/global_path"
    # Clear/rebuild against snapped goals only.
    goal_topic: "/planning/goal_pose_snapped"

    # =========================================================================
    # 7. PATH FRESHNESS AND CLEARING
    # =========================================================================
    # Clear stale global-path cost immediately when the goal changes.
    goal_fallback_holdoff_s: 0.0
    # Avoid transient empty-route clears between sparse global-path updates.
    # Keep route while planner publishes sparsely (goal-event driven).
    # Too-small timeout caused global marker drop/blink between valid plans.
    primary_path_timeout_s: 6.0
    # Keep last valid global path through transient empty updates.
    # This avoids marker blinking when planner briefly publishes an empty/intermediate path.
    ignore_empty_path: true
    # Do not clear immediately on goal change.
    # Keep previous valid strip until new global path arrives to avoid marker blink.
    clear_path_on_goal: false
    # Robustness-first:
    # strict fresh-path filtering can reject valid replans when goal/path stamps
    # are slightly skewed, causing global-path markers to stop updating.
    drop_stale_path_after_goal: false
    path_goal_stamp_slack_s: 0.20
    # Keep stale-route filter strict enough so goal updates do not reuse
    # previous-route strips that happen to end "near enough" on the same map.
    fresh_path_goal_match_tolerance_m: 4.0
    # Keep last valid global route cost grid until next global path arrives.
    stale_path_timeout_s: 0.0

    # =========================================================================
    # 8. REBUILD TRIGGERS
    # =========================================================================
    # Rebuild global helper primarily on path updates.
    rebuild_on_pose: false
    rebuild_on_path: true
    # Throttle rebuild and disable timer-loop to prevent planner starvation.
    min_rebuild_period_s: 0.15
    rebuild_on_timer: false
    # Keep publisher active through brief planner gaps.
    # When path is temporarily unavailable, publish lane-mask baseline instead of empty grid.
    allow_build_without_path: true

    # =========================================================================
    # 9. RASTER THRESHOLDS AND DEBUG
    # =========================================================================
    # Split inside-cell thresholds:
    # - path strip: relaxed (reduce curve holes)
    # - boundary strip: strict (reduce outward bleed)
    cell_inside_min_hits: 7
    cell_inside_min_hits_path: 6
    cell_inside_min_hits_boundary: 9
    # Disabled by default to reduce CPU/log load during realtime runs.
    # Enable temporarily for raster-debug sessions only.
    debug_coverage_stats: false
    # HH_260625: Keep timing visible when path-cost helpers are explicitly enabled.
    debug_build_timing: true
    debug_coverage_stride: 2
    debug_coverage_min_value: 0

    # =========================================================================
    # 10. OUTPUT AND QOS
    # =========================================================================
    # /planning/global_path publisher is VOLATILE.
    # Keep subscriber durability VOLATILE to avoid QoS mismatch/drop.
    path_qos_transient_local: false
    # HH_260618: Enable the primary publisher for this helper. The shared
    # lanelet_cost_grid_node default disables primary output because the map
    # package normally uses the secondary output; path-cost helpers do not.
    primary_enable: true
    # HH_260618: Lower heartbeat load; path updates still trigger immediate rebuilds.
    republish_period_s: 0.25
    output_topic: "/planning/cost_grid/global_path"

# =========================================================================
# LOCAL PATH COST GRID NODE
# =========================================================================
/planning/lanelet_cost_grid_local_path:
  ros__parameters:
    # =========================================================================
    # 1. MAP SOURCE AND PROJECTION
    # =========================================================================
    # Prefer launch-level override from map_info.yaml/bringup.
    map_path: ""
    map_frame_id: "map"
    offset_lat: 0.0
    offset_lon: 0.0
    offset_alt: 0.0
    # Keep lanelet projector aligned with map loader/snapper nodes.
    projector_type: "local_cartesian"

    # =========================================================================
    # 2. GRID GEOMETRY
    # =========================================================================
    # Align resolution with map lanelet grid to reduce raster/marker mismatch.
    resolution: 0.08
    # Local window size (cells). At 0.08m this is ~20.8m x ~20.8m.
    # Keeps local computation bounded near current vehicle pose.
    width: 220
    height: 220
    centerline_half_width: 1.50
    free_value: 0
    lethal_value: 100

    # =========================================================================
    # 3. COST MODE AND LANELET MASKING
    # =========================================================================
    # cost_mode options:
    #   "path"       : (recommended here) low on path strip, high outside path
    #   "lanelet"    : full lanelet polygon cost map
    #   "centerline" : centerline corridor map
    #   "bounds"     : lane boundaries only
    # Path mode = low cost on path, high cost elsewhere.
    cost_mode: "path"
    # Let path-mode logic control default fill so planners can compute
    # the first path (free until path, lethal after). Use -1 to disable override.
    # outside_value options:
    #   -1  : unknown outside lanelet/path (recommended with lanelet mask)
    #   0   : force free outside
    #   100 : force lethal outside
    outside_value: -1
    # Render path grid only inside lanelet geometry (no rectangular background).
    # path_use_lanelet_mask options:
    #   true  : paint only lanelet area
    #   false : allow rectangular path window fill
    path_use_lanelet_mask: true
    # Local path grid should show only lanelets on the active route.
    # path_lanelet_only options:
    #   true  : only lanelets matched by active path
    #   false : all lanelets in map
    # Show only lanelets touched by active route to avoid whole-map red fill.
    path_lanelet_only: true
    # Clamp path strip cells to lanelet polygons to prevent boundary spill.
    path_clip_to_lanelet: true

    # =========================================================================
    # 4. PATH-LANELET MATCHING
    # =========================================================================
    # Keep lanelet matching robust on sparse/curved path updates.
    # Tighten nearest-lanelet fallback so remote lanelets are not attached.
    # Tighten nearest-lanelet match distance to reduce boundary spill.
    path_lanelet_match_max_dist: 0.35
    # Strict mode: do not attach nearest lanelet when sample is outside polygons.
    path_lanelet_allow_nearest_fallback: false
    # Keep sample density balanced for realtime updates.
    path_lanelet_sample_step: 0.06

    # =========================================================================
    # 5. COST VALUES AND GRADIENTS
    # =========================================================================
    # Keep local-path layer in soft-cost range to avoid start-cell lockups.
    path_lane_base_value: 80
    # Enable pose-distance gradient so local cost changes in realtime.
    path_use_pose_distance_gradient: true
    # Keep centerline as the lowest-cost route inside the path strip.
    path_use_lateral_gradient: true
    # Centerline-first tuning:
    # local path should stay near lane center unless obstacle costs force avoidance.
    path_pose_cost_weight: 0.20
    path_lateral_cost_weight: 0.80
    # Visualization path layer should not add extra heading penalties.
    direction_penalty: 0
    backward_penalty: 0
    # Tighter range on local map to highlight near/far difference quickly.
    gradient_range: 20.0
    grid_yaw: 0.0

    # =========================================================================
    # 6. WINDOW AND INPUT TOPICS
    # =========================================================================
    # HH_260527: window_mode options:
    #   robot_centered: window centered on current pose
    #   path_bbox: window centered on active path bounding box
    #   fixed: fixed-origin window from map_frame origin
    #   map_bbox: use full lanelet map bounds
    # Local window is pose-centered (not path-bbox) to prevent stale far patches.
    window_mode: "robot_centered"
    # Use lanelet-snapped pose for stable in-lane local updates.
    pose_topic: "/planning/lanelet_pose"
    # Canonical local trajectory topic published by controller_server remap.
    path_topic: "/planning/local_path"
    # Keep local path strictly tied to local_path extractor output (no global fallback bleed).
    path_fallback_topic: ""
    # Clear/rebuild against snapped goals only.
    goal_topic: "/planning/goal_pose_snapped"

    # =========================================================================
    # 7. PATH FRESHNESS AND CLEARING
    # =========================================================================
    # Clear stale local-path cost as soon as the local path is replaced.
    goal_fallback_holdoff_s: 0.0
    # Keep local-path cost stable across short extractor gaps.
    # Avoid local-route flicker during short controller/extractor stalls.
    primary_path_timeout_s: 2.5
    # Do not clear local grid for transient empty local-path messages.
    ignore_empty_path: true
    # Switch local strip immediately when goal changes.
    clear_path_on_goal: true
    # Local-path endpoint is near current pose (not goal), so stale-goal
    # geometric rejection must be disabled for local path-cost updates.
    drop_stale_path_after_goal: false
    # Keep only short local hold to prevent flicker.
    stale_path_timeout_s: 0.6

    # =========================================================================
    # 8. REBUILD TRIGGERS
    # =========================================================================
    # Rebuild local cost on pose motion + path updates.
    rebuild_on_pose: true
    rebuild_on_path: true
    # Keep local updates responsive but avoid timer-driven hot loop.
    # Limit local path-cost rebuild rate to reduce costmap starvation.
    min_rebuild_period_s: 0.10
    rebuild_on_timer: false
    # Keep publisher active through short local-path gaps.
    allow_build_without_path: true

    # =========================================================================
    # 9. RASTER THRESHOLDS AND DEBUG
    # =========================================================================
    # Split inside-cell thresholds:
    # - path strip: relaxed (reduce curve holes)
    # - boundary strip: strict (reduce outward bleed)
    cell_inside_min_hits: 7
    cell_inside_min_hits_path: 6
    cell_inside_min_hits_boundary: 9
    # Disabled by default to reduce CPU/log load during realtime runs.
    # Enable temporarily for raster-debug sessions only.
    debug_coverage_stats: false
    # HH_260625: Keep timing visible when path-cost helpers are explicitly enabled.
    debug_build_timing: true
    debug_coverage_stride: 2
    debug_coverage_min_value: 0

    # =========================================================================
    # 10. OUTPUT AND QOS
    # =========================================================================
    path_qos_transient_local: false
    # HH_260618: Enable the primary publisher for this helper. Without this,
    # /planning/cost_grid/local_path has subscribers but no publisher.
    primary_enable: true
    # HH_260618: Reduce local marker/grid heartbeat; pose/path callbacks still refresh immediately.
    republish_period_s: 0.20
    output_topic: "/planning/cost_grid/local_path"
