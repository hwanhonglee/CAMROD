# Nav2 vehicle profile: footprint and vehicle dynamics.
#
# Platform: AgileX Ranger (skid-steer / 4WD off-road mobile robot)
# Ref: https://global.agilex.ai/products/ranger
#
# Vehicle specs (reference — update footprint below when dimensions change):
#
#   --- Geometry ---
#   wheelbase:       0.89 m   front-to-rear axle distance
#                             lf = CG->front axle, lr = CG->rear axle (lf≈lr≈0.445 m if CG centered)
#   track_width:     0.56 m   left-to-right wheel centerline distance
#   tire_radius:     0.13 m   wheel radius (approx 260 mm dia / 2)
#   HH_260803 - measured body envelope relative to robot_center_link:
#   body_front:      0.75837 m  (1.20137 - 0.443)
#   body_rear:       0.73323 m  (0.29023 + 0.443)
#   body_left:       0.53505 m
#   body_right:      0.53495 m
#   planning_margin: 0.10 m each side
#
#   --- Inertia / Mass ---
#   mass:            100.0 kg   vehicle dry weight (rated payload 150 kg, IP55)
#   inertia_yaw:     ~35 kg·m²  yaw moment of inertia (Iz);
#                               resistance to rotation about vertical (Z) axis.
#                               Used in bicycle/lateral-dynamics models.
#                               Rough estimate: Iz ≈ m*(lf²+lr²) ≈ 100*0.4 ≈ 35 kg·m²
#
#   --- Lateral Tire Dynamics (bicycle model reference) ---
#   Cf / Cr:     ~8000 N/rad  front/rear cornering stiffness;
#                             lateral tire force per unit side-slip angle [N/rad].
#                             Higher = stiffer lateral response (less slip per force).
#                             (Skid-steer: coupling is indirect; treat as soft reference.)
#
#   --- Performance Limits ---
#   max_velocity:    1.4 m/s   operational speed cap (hardware max 2.6 m/s)
#   max_accel:       1.5 m/s²  longitudinal acceleration limit
#   max_decel:      -2.0 m/s²  braking decel limit (negative = opposing-motion force)
#   max_jerk:        3.0 m/s³  rate of change of acceleration (smoothness / jerk limit)
#   max_steer_angle: N/A       skid-steer platform; curvature commanded via angular cmd_vel
#
#   --- Aerodynamics (minor at low speed) ---
#   drag_coeff:     0.3    aerodynamic drag coefficient Cd (shape-based air resistance)
#   rolling_resist: 0.015  rolling resistance coefficient Crr (tire deformation energy loss)

# =========================================================================
# 1. CONTROLLER SERVER
# =========================================================================
controller_server:
  ros__parameters:
    RPP:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # HH_260731 - Conservative outdoor boundary-recovery profile shared by
      # manual and UI goals. The final 0.5 gate scale limits 0.4 m/s to 0.20 m/s.
      # HH_260730: Only parameters consumed by the bundled RPP are listed here.
      # The former max/min linear and max angular keys were not read by this
      # plugin; desired_linear_vel and curvature regulation are authoritative.
      desired_linear_vel: 0.4
      max_angular_accel: 0.8
      # HH_260513: Increased lookahead to suppress straight-line oscillation.
      # HH_260801 / TODOLIST 13: At the final 0.20 m/s limit, speed-scaled
      # lookahead is clamped by this floor. Full-bringup straight/curve sweeps
      # selected 1.1 m as the balance between 1.0 m tracking error and 1.2 m
      # steering variation. Keep the 2.0 m cap and 15 Hz pose output unchanged.
      lookahead_dist: 1.1
      min_lookahead_dist: 1.1
      max_lookahead_dist: 2.0
      lookahead_time: 1.8
      # Final default after the command gate: 0.20 rad/s.
      rotate_to_heading_angular_vel: 0.4
      # Align controller TF tolerance with Nav2 server tolerance.
      transform_tolerance: 0.5
      # HH_260527: RPP toggle options (all boolean):
      #   use_velocity_scaled_lookahead_dist: True=scale lookahead by speed, False=fixed lookahead only
      #   use_rotate_to_heading: True=rotate-in-place heading alignment first, False=track with linear+angular together
      #   use_collision_detection: True=controller-level collision check enabled, False=skip internal check
      #   use_regulated_linear_velocity_scaling: True=curve-based linear speed scaling, False=disabled
      #   use_cost_regulated_linear_velocity_scaling: True=costmap-based linear speed scaling, False=disabled
      use_velocity_scaled_lookahead_dist: True
      use_interpolation: True
      # Keep controller in forward-drive mode; global planner is
      # aligned to DUBIN (forward-only) in nav2_base.yaml.
      allow_reversing: False
      # Avoid persistent angular-only cmd_vel output when heading
      # mismatch/jitter is present at path start. Track with linear+angular together.
      use_rotate_to_heading: False
      min_approach_linear_velocity: 0.10
      approach_velocity_scaling_dist: 0.6
      # HH_260618: RPP is now a fallback controller; keep its internal collision
      # check enabled when selected instead of relying only on external cmd_vel gates.
      use_collision_detection: True
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: True
      regulated_linear_scaling_min_radius: 0.9
      # Final curve-regulated minimum after the gate: 0.10 m/s.
      regulated_linear_scaling_min_speed: 0.2
      use_cost_regulated_linear_velocity_scaling: True
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0

    # DWB profile lives in nav2_base.yaml under controller ID "DWB".

# =========================================================================
# 2. LOCAL COSTMAP
# =========================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      # HH_260803 - Same measured body/margin, recentered on the axle midpoint.
      footprint: "[[0.85837, 0.63505], [0.85837, -0.63495], [-0.83323, -0.63495], [-0.83323, 0.63505]]"
      robot_radius: 0.0

# =========================================================================
# 3. GLOBAL COSTMAP
# =========================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      # HH_260803 - Same measured body/margin, recentered on the axle midpoint.
      footprint: "[[0.85837, 0.63505], [0.85837, -0.63495], [-0.83323, -0.63495], [-0.83323, 0.63505]]"
      robot_radius: 0.0
