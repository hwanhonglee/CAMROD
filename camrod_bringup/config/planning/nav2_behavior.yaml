# Nav2 behavior profile: BT and behavior-tree plugin libraries.

bt_navigator:
  ros__parameters:
    # Keep BT transform helpers pinned to lanelet-snapped base frame.
    global_frame: map
    robot_base_frame: robot_base_link
    # Tolerate EKF/TF jitter during full bringup runtime.
    transform_tolerance: 0.5
    # Stabilize repeated goal updates by relaxing BT server/service
    # call timeouts under high runtime load.
    default_server_timeout: 5000
    wait_for_service_timeout: 5000
    # Reduce BT tick pressure (50 Hz -> 20 Hz equivalent).
    # Further reduce tick pressure to limit planner/controller churn
    # when full-stack bringup is CPU-constrained.
    bt_loop_duration: 80
    # Keep planner/controller IDs consistent with selector BT aliases:
    # planner: Smac2D | NavFn, controller: RPP | DWB.
    # Launch rewrites this value to a package-share-resolved XML path.
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    plugin_lib_names:
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_compute_path_to_pose_action_bt_node
      # HH_260513: SmoothPath BT node for post-planner path smoothing.
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      # HH_260619 - Required by <GoalUpdatedController> in the goal-locked BT.
      - nav2_goal_updated_controller_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_controller_selector_bt_node
      - nav2_planner_selector_bt_node
      # Nav2 Humble ships goal_checker_selector BT plugin library name.
      # Using goal_validator_selector causes bt_navigator configure failure.
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_assisted_teleop_action_bt_node

# SimpleSmoother removes NavFn/Smac2D staircase artifacts before FollowPath.
# w_data + w_smooth must sum to < 1.0.
# Higher w_smooth = more bending toward neighbors (smoother but may cut corners).
# Higher w_data  = more fidelity to original path.
smoother_server:
  ros__parameters:
    smoother_plugins: ["SimpleSmoother"]
    SimpleSmoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      w_data: 0.2
      # Raised from 0.3 → 0.5 for stronger staircase removal.
      w_smooth: 0.5
      do_refinement: true

behavior_server:
  ros__parameters:
    # Recovery behaviors use lanelet-snapped base frame.
    global_frame: map
    local_frame: odom
    robot_base_frame: robot_base_link
    # Keep recovery transforms aligned with relaxed BT tolerance.
    transform_tolerance: 0.5
