/planning/local_path_extractor:
  ros__parameters:
    enabled: true
    frame_id: "map"
    # Use Nav2 planner native output as global path source.
    global_path_topic: "/planning/global_path"
    # HH_260527: local_path_source options:
    #   controller_then_slice: prefer controller path, fallback to global path slice
    #   controller_only: use controller path only (publish empty when unavailable)
    #   slice_only: always slice from global path
    # Prefer controller-local trajectory first so local path reflects
    # real-time local costmap/obstacle reactions; fallback to global slice for continuity.
    local_path_source: "controller_then_slice"
    controller_path_topic: "/planning/local_path_controller"
    controller_path_timeout_s: 0.8
    # planner_server /planning/global_path is VOLATILE.
    # Keep subscriber durability VOLATILE for guaranteed matching.
    global_path_qos_transient_local: false
    # Use fused localization pose for controller-plan transform.
    # This prevents heading/sign mismatch between global and local path direction.
    pose_topic: "/localization/pose"
    output_topic: "/planning/local_path"
    # Local path is controller-local plan first; global-slice is fallback for continuity.
    # Balance responsiveness and CPU load.
    # Keep realtime behavior while reducing high-frequency republish load.
    publish_rate_hz: 20.0
    # HH_260513: Publish immediately on new global path so path updates snap
    # to current robot position right after new goal, not at next timer tick.
    publish_on_input_update: true
    # Slice current global path around closest pose.
    lookahead_distance_m: 30.0
    lookbehind_distance_m: 0.5
    min_points: 12
    max_points: 320
    # Keep local path anchored near the previous closest index so
    # looped lanelets do not jump to another branch that happens to be nearby.
    nearest_search_window: 180
    nearest_backtrack_window: 16
    # Keep full reacquire conservative to avoid jumping to nearby parallel branches.
    full_reacquire_distance_m: 4.0
    full_reacquire_heading_deg: 85.0
    # Cut local-path output at discontinuous jumps to avoid
    # straight bridge artifacts when upstream path has transient discontinuity.
    max_segment_jump_m: 3.0
    # Stop local path after route completion (until next global path update).
    stop_after_goal_reached: true
    goal_reached_distance_m: 0.8
    goal_reached_index_margin: 3
    # Relax timeout to tolerate brief TF/pose hiccups under load.
    pose_timeout_s: 2.5
    # Do not emit empty-path on transient invalid frames.
    # Empty publishes were causing local cost-grid marker flicker.
    publish_empty_on_invalid: false
    empty_republish_period_s: 0.3
    # Moving-average window applied to local path XY before publishing to /planning/local_path.
    # Smooths the raw planner output ('/planning/global_path' is unsmoothed planner output;
    # BT's SmoothPath only smooths the internal BT blackboard path used for FollowPath).
    # 0 or 1 disables. Odd values recommended. Raise if NavFn staircase still visible.
    smooth_window: 9
