# Nav2 base profile: framework defaults and common node wiring.

planner_server:
  ros__parameters:
    # HH_260527: use_sim_time options:
    #   True: follow /clock (simulation/replay)
    #   False: use system ROS time (real hardware default)
    use_sim_time: False
    # Further relax planner loop target for full-stack bringup.
    # This reduces planner-loop starvation under heavy CPU load and keeps
    # replanning stable during iterative goal updates.
    # Align expected loop with practical realtime throughput to
    # reduce repeated "planner loop missed rate" warnings under full load.
    # Match practical planner throughput under full real-sensor load.
    expected_planner_frequency: 0.5
    # Prevent planner action hang when costmap current-state is delayed.
    # 0.0 = wait forever (legacy), >0 = timeout seconds.
    # Give global costmap more settle time before timeout warning.
    # Allow extra settle time for layered global costmap current-state.
    # HH_260528: Reduce costmap wait to improve plan response latency.
    # Large timeout (12s) caused slow recoveries after global-costmap clear.
    costmap_wait_timeout_sec: 2.5
    # Runtime-selectable planner IDs (published to /planning/planner_selector):
    # NavFn | Smac2D | ThetaStar | SmacHybrid | SmacLattice
    planner_plugins: ["NavFn", "Smac2D", "ThetaStar", "SmacHybrid", "SmacLattice"]

    NavFn:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # Keep final solve tight; goal_snapper already maps user goal into lanelet.
      tolerance: 0.5
      # HH_260527: use_astar options:
      #   True: A* search (heuristic-guided, usually faster/straighter)
      #   False: Dijkstra-style expansion
      use_astar: True
      # Enforce in-map/in-lane planning.
      # Allowing unknown made free-space shortcuts possible outside designated lanelet region.
      allow_unknown: False

    Smac2D:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      # Enforce in-map/in-lane planning.
      allow_unknown: False
      # Keep final solve tight; goal_snapper already maps user goal into lanelet.
      tolerance: 0.5
      downsample_costmap: False
      downsampling_factor: 1
      use_astar: True
      # Use forward-only motion model for controller compatibility.
      # REEDS_SHEPP reverse segments were causing repeated FollowPath aborts
      # with the current pure-pursuit controller setup.
      motion_model_for_search: "DUBIN"
      # 2026-02-25: Finer heading discretization for smoother corner geometry.
      # Reduce heading-bin density to lower planner CPU without
      # changing topology or plugin structure.
      # HH_260513: Reduce bins 96→32 to cut state-space; enough for lanelet curves.
      angle_quantization_bins: 32
      # HH_260513: Increase limits — lanelet map with inflation_radius 1.5m
      # requires more iterations than urban/open maps.
      max_iterations: 2000000
      max_on_approach_iterations: 1000
      # HH_260528: Cap Smac planning budget for faster failover to NavFn.
      max_planning_time: 1.2

    ThetaStar:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      allow_unknown: False

    SmacHybrid:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      allow_unknown: False
      tolerance: 0.5
      downsample_costmap: False
      downsampling_factor: 1
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 32
      minimum_turning_radius: 0.6
      analytic_expansion_ratio: 3.5
      max_iterations: 2000000
      max_on_approach_iterations: 1000
      # HH_260528: Cap Smac planning budget for faster failover to NavFn.
      max_planning_time: 1.2
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.1
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      smooth_path: True

    SmacLattice:
      plugin: "nav2_smac_planner/SmacPlannerLattice"
      allow_unknown: False
      tolerance: 0.5
      downsample_costmap: False
      downsampling_factor: 1
      minimum_turning_radius: 0.6
      max_iterations: 2000000
      max_on_approach_iterations: 1000
      # HH_260528: Cap Smac planning budget for faster failover to NavFn.
      max_planning_time: 1.2
      lookup_table_size: 20.0
      lattice_filepath: "/opt/ros/humble/share/nav2_smac_planner/sample_primitives/5cm_resolution/1m_turning_radius/ackermann/output.json"
      smooth_path: True

controller_server:
  ros__parameters:
    use_sim_time: False
    # Tune controller loop for real stack load.
    # 40Hz caused repeated "control loop missed rate" in full bringup;
    # 30Hz keeps cmd stream responsive while reducing scheduler starvation.
    controller_frequency: 30.0
    # Allow longer transient control failures while local TF/costmap
    # synchronizes, so cmd_vel stream can recover instead of immediate abort.
    # Increase tolerance to avoid frequent FollowPath abort/recovery
    # loops during transient sensor/costmap jitter.
    failure_tolerance: 20.0
    odom_topic: /localization/odometry/filtered
    # Keep deadband thresholds permissive so low-speed commands are
    # not quantized to zero during startup alignment.
    min_x_velocity_threshold: 0.0001
    min_y_velocity_threshold: 0.0001
    min_theta_velocity_threshold: 0.0001
    # Explicit speed-limit channel for planning namespace users.
    speed_limit_topic: /planning/speed_limit
    # Restore canonical Nav2 checker parameter names.
    # Nav2 controller server reads *_checker_* keys; validator keys are ignored.
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    # Runtime-selectable controller IDs (published to /planning/controller_selector):
    # RPP | DWB | MPPI | Graceful | RotationShim
    controller_plugins: ["RPP", "DWB", "MPPI", "Graceful", "RotationShim"]
    default_controller: RPP

    # Restore Humble plugin class names required by nav2_controller.
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Relax progress checks to avoid false abort during TF/costmap
      # warm-up right after new goal acceptance.
      # Further relax progress thresholds for real-sensor startup
      # where odometry progress can be intermittent.
      required_movement_radius: 0.03
      movement_time_allowance: 120.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.25
      stateful: False

    # DWB controller profile. Runtime selection is done by
    # /planning/controller_selector topic (std_msgs/String: "RPP" or "DWB").
    DWB:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 1.4
      max_vel_y: 0.0
      max_vel_theta: 1.2
      min_speed_xy: 0.0
      max_speed_xy: 1.4
      min_speed_theta: 0.0
      acc_lim_x: 1.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.0
      decel_lim_x: -1.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.0
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 24
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.3
      trans_stopped_velocity: 0.10
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 18.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 24.0
      GoalDist.scale: 18.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

    MPPI:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 1200
      iteration_count: 1
      prune_distance: 2.0
      transform_tolerance: 0.2
      vx_max: 1.4
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 1.2
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      ax_max: 1.5
      ax_min: -1.5
      ay_max: 0.0
      az_max: 3.0
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      regenerate_noises: False
      visualize: False
      critics: [
        "ConstraintCritic",
        "CostCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic",
        "PreferForwardCritic"
      ]
      ConstraintCritic.enabled: True
      CostCritic.enabled: True
      GoalCritic.enabled: True
      GoalAngleCritic.enabled: True
      PathAlignCritic.enabled: True
      PathFollowCritic.enabled: True
      PathAngleCritic.enabled: True
      PreferForwardCritic.enabled: True

    Graceful:
      plugin: "nav2_graceful_controller::GracefulController"
      transform_tolerance: 0.2
      k_phi: 2.0
      k_delta: 1.0
      beta: 0.4
      lambda: 2.0
      v_linear_min: 0.0
      v_linear_max: 1.4
      v_linear_max_initial: 0.8
      v_angular_max: 1.2
      v_angular_max_initial: 1.2
      slowdown_radius: 1.5
      initial_rotation: True
      initial_rotation_min_angle: 0.78
      final_rotation: True
      rotation_scaling_factor: 1.0
      allow_backward: False

    RotationShim:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 1.2
      max_angular_accel: 3.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: True

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      # Use odom for local costmap to reduce map<->odom transform
      # sensitivity in controller loop and improve FollowPath stability.
      global_frame: odom
      # Keep Nav2 base frame aligned with platform/localization TF.
      robot_base_frame: robot_base_link
      # Raise local costmap cycle to improve real-time local-path reaction
      # to multi-layer costs while preserving controller stability at 30Hz.
      update_frequency: 6.0
      publish_frequency: 3.0
      rolling_window: True
      # Coarsen local rolling window grid slightly for stability.
      width: 45
      height: 45
      resolution: 0.10
      # Start from free-space master so controller is not blocked by unknown-only map state.
      track_unknown_space: False
      plugins:
        # combined_cost_layer: reads pre-merged /planning/cost_grid/inflation into master.
        # inflation_layer: Nav2 built-in — spreads lethal cells radially (safety margin).
        - combined_cost_layer
        - inflation_layer

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: map
      # Keep Nav2 base frame aligned with platform/localization TF.
      robot_base_frame: robot_base_link
      # Raise global master refresh so goal updates are reflected faster.
      # Lower global costmap update pressure for planner stability.
      # Lower global costmap refresh pressure to stabilize current-state availability.
      update_frequency: 2.0
      publish_frequency: 1.0
      # Keep planner global costmap centered on robot to prevent
      # startup failures when localization origin drifts from legacy fixed bounds.
      rolling_window: True
      # Match global rolling window to lanelet cost grid source window.
      # Reason: keep planner solve horizon bounded for responsive ComputePath results.
      # 45m window was too small for practical goal distances in
      # map-frame testing, causing repeated "no valid path found".
      # Expand rolling bounds to recover stable global-path generation.
      # enlarge global rolling window margin to reduce
      # near-edge planner aborts on long map-frame goals.
      width: 160
      height: 160
      resolution: 0.10
      # origin_* retained for backward compatibility; ignored in rolling window mode.
      origin_x: -100.0
      origin_y: -50.0
      # HH_260527: Keep unknown as unknown in global master.
      # This prevents implicit free-space shortcuts when a layer does not explicitly
      # write cells (for example outside moving source windows).
      track_unknown_space: True
      # Keep global planner master independent from
      # /planning/cost_grid/global_path guidance layer.
      # Using a path-guidance layer in the same costmap that generates that path
      # creates circular dependence and can produce intermittent no-path failures.
      plugins:
        # Enforce lanelet drivable-space constraints for global planning.
        # Without this layer, Smac can output free-space shortcuts on the wrong side.
        - lanelet_cost_layer_base
        - lidar_cost_layer
        - radar_cost_layer
        - inflation_layer

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    # Keep BT transform helpers aligned with lanelet-snapped base frame.
    robot_base_frame: robot_base_link
    odom_topic: /localization/odometry/filtered
    # Tolerate EKF/TF jitter observed during full bringup load.
    transform_tolerance: 0.5

behavior_server:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    local_frame: odom
    # Keep recovery behaviors aligned with lanelet-snapped base frame.
    robot_base_frame: robot_base_link
    # Match Nav2 TF tolerance across BT/recovery nodes.
    transform_tolerance: 0.5
