# 2026-03-03:
# Global path policy:
# - recompute only when a new snapped goal arrives
# - do not continuously replan on vehicle motion
# - use lanelet-snapped start pose so the global plan begins on the lanelet centerline corridor
/planning/goal_replanner:
  ros__parameters:
    enabled: true
    # Consume snapped goal only.
    goal_topic: "/planning/goal_pose_snapped"
    # Primary selector (recommended):
    # - "lanelet_pose"      : /planning/lanelet_pose as explicit start (best for lane-bound path)
    # - "robot_base_link"   : map->robot_base_link TF as explicit start
    # - "localization_pose" : /localization/pose as explicit start
    # - "start_topic"       : use start_topic value as explicit start
    planning_start_source: "lanelet_pose"
    # Used only when planning_start_source == "start_topic".
    start_topic: "/planning/lanelet_pose"
    # If topic-start is selected but start_topic has no data yet:
    # - true  -> fallback to TF start (map->robot_base_link)
    # - false -> wait until topic start is available
    # HH_260527: Keep start anchored to lanelet snap (disable TF fallback).
    # This prevents occasional free-space diagonal plans when start_topic is stale.
    start_topic_fallback_to_tf: false
    action_name: "/planning/compute_path_to_pose"
    # HH_260527: Smac2D follows lanelet-centered cost gradients more consistently than NavFn.
    planner_id: "Smac2D"
    # HH_260528: If Smac2D cannot solve, retry once with NavFn before reporting failure.
    fallback_planner_id: "NavFn"
    retry_with_fallback_planner: true
    frame_id: "map"
    output_path_topic: "/planning/global_path"
    # Keep avg global path stream always available for
    # local/global path-cost-grid builders (avg_msgs::Path).
    publish_result_path: true
    # Avoid ComputePath contention with NavigateToPose while BT is active.
    pause_when_navigate_active: true
    navigate_status_topic: "/planning/navigate_to_pose/_action/status"
    navigate_inactive_grace_s: 0.8
    # Ignore repeated equivalent goal republishes from upstream relays.
    ignore_duplicate_goal_messages: true
    duplicate_goal_xy_epsilon_m: 0.05
    duplicate_goal_yaw_epsilon_deg: 4.0
    min_request_interval_s: 0.25
    # Event-driven mode is more stable than periodic churn.
    replan_rate_hz: 0.0
    # HH_260528: Keep event-driven replans responsive under no-path cases.
    # This timeout only affects goal_replanner requests (not Nav2 BT actions).
    request_timeout_s: 1.5
    # Prevent retry storm when planner reports ABORTED.
    retry_after_failure_s: 0.8
    # Trigger ComputePath immediately on new goal and on first valid snapped start pose.
    immediate_replan_on_goal: true
    immediate_replan_on_start: true
    # Disable high-rate start-driven replans during active navigation.
    replan_on_start_change: false
    # After goal is reached, pause replanning until a new goal arrives.
    stop_replan_after_goal_reached: true
    goal_reached_distance_m: 0.8
    start_replan_distance: 0.15
    start_replan_yaw_deg: 3.0
    goal_replan_distance: 0.05
