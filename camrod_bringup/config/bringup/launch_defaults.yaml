# Bringup launch defaults. One numbered section per override block:
# runtime, localization, planning, sensing, platform, control, parking,
# perception, system, namespaces, topics, map, voice, sim.
bringup:
  # =========================================================================
  # 1. RUNTIME
  # =========================================================================
  runtime:
    clean_before_launch: true
    # HH_260805 - Let launch stop its own children without a concurrent pkill pass.
    # clean_before_launch still clears stale processes before the next run.
    clean_on_shutdown: false
    sim: false
    # HH_260721 - Enable only when a validator publishes fresh normalized platform status.
    sim_platform_status_enable: false
    rviz: true
    # Stagger module startup to reduce bringup burst load.
    module_launch_gap_s: 1.0
    # HH_260805 - Keep physical-LiDAR CycloneDDS/iceoryx opt-in on Humble. The
    # full graph exceeds iceoryx 2.0.5 static port/history limits, so other
    # processes retain host DDS and component hot paths use intra-process.
    enable_dds_shared_memory: false
    dds_shared_memory_cyclonedds_config: middleware/cyclonedds_shm.xml
    dds_shared_memory_roudi_config: middleware/iceoryx_roudi.toml
    dds_shared_memory_roudi_executable: /opt/ros/humble/bin/iox-roudi
    dds_shared_memory_roudi_log_level: warning

  # =========================================================================
  # 2. LOCALIZATION
  # =========================================================================
  localization:
    enable_adapter: true
    enable_filter: true
    enable_monitor: true
    enable_map_helper: true
    # HH_260721 - Use robot_localization EKF as the single supported filter backend.
    wheel_bridge_enable: true
    # Use platform status odometry as primary source.
    wheel_input_topic: /platform/status/odometry
    # HH_260720 - Wheel input types distinguish generated data from vendor boundaries.
    #   nav_odom: nav_msgs/Odometry external input
    #   avg_odom: avg_msgs/AvgOdometry internal input
    #   twist: avg_msgs/AvgTwistStamped internal input
    # HH_260720 - Platform publishes the generated AvgOdometry internal contract.
    wheel_input_type: avg_odom
    # Keep /rmp401/odom as fallback-only source.
    wheel_fallback_input_topic: /rmp401/odom
    # HH_260720 - The RMP401 fallback remains a standard vendor boundary.
    #   nav_odom: nav_msgs/Odometry external input
    #   avg_odom: avg_msgs/AvgOdometry internal input
    #   twist: avg_msgs/AvgTwistStamped internal input
    wheel_fallback_input_type: nav_odom
    wheel_primary_timeout_s: 0.7
    # HH_260720 - Localization owns generated wheel data and the explicit EKF mirror.
    wheel_output_topic: /localization/input/wheel_odometry
    wheel_nav_output_topic: /localization/input/wheel_odometry_ros

    # Localization launch refactor - explicit override keys per sub-launch.
    adapter_param_file: localization/source/input_adapter.yaml
    filter_ekf_param_file: localization/filter/ekf.yaml
    filter_gnss_reattach_param_file: localization/filter/gnss_reattach.yaml
    filter_pose_selector_param_file: localization/filter/pose_selector.yaml
    monitor_param_file: localization/filter/monitor.yaml
    map_helper_param_file: localization/reference/map_helper.yaml
    map_info_file: __module_default__
    # HH_260623 - Let bringup inject the active camrod_map drop_zones exporter output.
    drop_zones_yaml: __module_default__

  # =========================================================================
  # 3. PLANNING
  # =========================================================================
  planning:
    # ---- Planning core toggles ----
    # HH_260604: Allow GNSS/localization-only bringup tests without requiring Nav2 runtime packages.
    enable_planning: true
    # HH_260805 - Compose the vendored planner/controller in the scoped runtime;
    # vendor servers with private executors remain standalone. Three final
    # full-sim trials reached SYSTEM OK and all six containers exited cleanly.
    use_nav2_container: true
    # HH_260625: Path-cost grids are RViz/guide helpers, not required for Nav2
    # route generation. Keep them off in full bringup to avoid extra OSM loads
    # and raster rebuilds during startup; enable explicitly for cost-grid debug.
    enable_path_cost_grids: false
    # HH_260618: Keep goal_replanner off by default because Nav2 planner_server
    # already publishes /planning/global_path; duplicate publishers make RViz path
    # visualization flicker and can feed stale paths to downstream cost grids.
    enable_goal_replanner: false
    # HH_260805 - Dynamic-obstacle monitoring is separate from goal_replanner.
    # Its fallback preemption is enabled only after the lanelet-grid width gate
    # proves at least 2.50 m of fresh contiguous drivable corridor.
    enable_obstacle_replan_monitor: true
    # HH_260625: Let lifecycle_manager autostart own STARTUP unless localization
    # readiness gating is explicitly enabled. Running the retry node alongside
    # autostart can resend STARTUP while controller_server is still configuring.
    enable_nav2_lifecycle_retry: false
    # false  → nav2_autostart=true: Nav2 activates immediately on bringup.
    #          bt_navigator will start planning as soon as ANY goal arrives (RViz, UI, etc.).
    #          Path follows lanelet centerline, but the control safety gate blocks
    #          actual movement until /control/command_enabled becomes true.
    # true   → nav2_autostart=false: Nav2 waits for localization_ready before activating.
    #          Use true for production runs to prevent premature path planning.
    require_localization_ready: false
    enable_state_machine: true
    enable_progress: true
    # HH_260618: Publish thick global/local trajectory markers for RViz readability.
    enable_path_visualization: true
    # Resolve drop_zone from map-exported semantic area YAML.
    state_machine_keypoints_yaml: map/drop_zones.yaml
    state_machine_camping_sites_yaml: planning/camping_sites.yaml
    # Keep local-path pose topic aligned with standalone localization.launch.py behavior.
    local_path_pose_topic: /localization/pose
    # ---- Nav2 profile selection ----
    # HH_260522: unified controller selector.
    #   rpp: use nav2_vehicle_param_file profile
    #   dwb: use nav2_vehicle_dwb_param_file profile
    controller_profile: rpp
    # By default, use internal config defaults declared by planning launch files.
    nav2_base_param_file: planning/nav2_base.yaml
    nav2_vehicle_param_file: planning/nav2_vehicle.yaml
    nav2_vehicle_dwb_param_file: __module_default__
    nav2_lanelet_param_file: planning/nav2_lanelet_overlay.yaml
    # Use bringup-managed behavior profile so BT plugin list (including SmoothPath)
    # stays consistent with bringup BT XML.
    nav2_behavior_param_file: planning/nav2_behavior.yaml
    # Optional combo override (planner/controller pair-specific tuning).
    # HH_260522: combo choices live in camrod_planning/config/nav2_combo_profiles/*.yaml
    # (example: disabled.yaml, navfn_rpp.yaml, smac2d_rpp.yaml, smachybrid_rpp.yaml, ...).
    # "__module_default__" resolves to camrod_planning/config/nav2_combo_profiles/disabled.yaml.
    nav2_combo_param_file: __module_default__
    # HH_260805 - Construct only the normal LaneletRoute planner and the
    # width-gated SmacLattice fallback. Use `all.yaml` only for planner studies.
    nav2_planner_plugins_param_file: planning/nav2_planner_profiles/production.yaml
    # HH_260805 - Construct only mission RPP and manual-goal RotationShim in production.
    nav2_controller_plugins_param_file: planning/nav2_controller_profiles/production.yaml
    # HH_260528: Selector IDs for PlannerSelector/ControllerSelector.
    # "__auto__" infers planner/controller from nav2_combo_param_file name.
    # Examples:
    # - navfn_rpp.yaml       -> planner=NavFn, controller=RPP
    # - smac2d_dwb.yaml      -> planner=Smac2D, controller=DWB
    # HH_260626: Default to connected lanelet routing. Smac2D/NavFn remain
    # fallback/selectable when the graph route is unavailable.
    nav2_selected_planner: LaneletRoute
    # HH_260625: RPP is the real-bringup default; MPPI remains selectable.
    nav2_selected_controller: RPP

    # ---- Per-planning-node parameter file overrides ----
    path_cost_grids_param_file: planning/path_cost_grids.yaml
    goal_snapper_param_file: planning/goal_snapper.yaml
    centerline_snapper_param_file: planning/centerline_snapper.yaml
    goal_replanner_param_file: planning/goal_replanner.yaml
    obstacle_replan_monitor_param_file: planning/obstacle_replan_monitor.yaml
    local_path_extractor_param_file: planning/local_path_extractor.yaml
    planning_state_machine_param_file: planning/planning_state_machine.yaml

  # =========================================================================
  # 4. SENSING
  # =========================================================================
  sensing:
    # Disable this only when sensing.launch.py is already running separately.
    # This prevents duplicate camera/IMU/LiDAR processes during split-stack tests.
    enable_module: true
    enable_camera: true
    # HH_260528: Per-camera enable flags for dual econ camera setup.
    #   enable_front_camera: true  → start camera_front_publisher_node (GPU VPI pipeline)
    #   enable_rear_camera:  true  → start camera_rear_publisher_node  (CPU OpenCV pipeline)
    enable_front_camera: true
    enable_rear_camera: true
    enable_radar: true
    # HH_260729 - A disabled hardware input still publishes a low-rate, explicit
    # DUMMY/WARN heartbeat on its canonical schema.  This covers front/rear
    # camera, GNSS, IMU, LiDAR, all seven radars, and Ranger CAN feedback.
    # sim:=true forces these off because fake_sensors owns the synthetic topics.
    # Processing/safety switches never publish a fake-success output.
    publish_sensor_dummies_when_disabled: true
    enable_radar_cost_grid: true
    # HH_260702 - Keep radar range details on the topics/checkers; enable this
    # only for bench debugging so field logs stay system-summary focused.
    radar_log_status: false
    # HH_260723 - Keep the compatibility rasterizer alive, but consume only
    # /perception/obstacles. Raw/preprocessed LiDAR cost is temporarily disabled.
    # HH_260805 - The LiDAR cost-grid is optional in production; perception,
    # radar, and inflation remain active without this compatibility rasterizer.
    enable_lidar_cost_grid: false
    # HH_260805 - Preprocess and ground-segment LiDAR through intra-process
    # ownership in one container. The optional transient-local grid component
    # shares that process but retains DDS transport for Humble compatibility.
    use_lidar_processing_container: true
    enable_inflation_cost_grid: true
    enable_lidar_driver: true
    enable_imu: true
    enable_gnss: true
    enable_ntrip: true
    # HH_260723 - Dual-antenna heading remains available without NTRIP: the Lite
    # moving base sends RTCM through XBee to rover UART2, and the Budget rover
    # publishes NAV-PVT plus NAV-RELPOSNED over /dev/ttyACM0.
    # By default, use internal config defaults declared by sensing launch files.
    camera_params_file: sensing/camera/camera_params.yaml
    camera_device_path: /dev/video0
    imu_converter_param_file: sensing/imu/platform_velocity_converter.yaml
    radar_sensor_param_file: sensing/radar/sen0592_radar.yaml
    radar_cost_grid_param_file: sensing/radar/cost_grid.yaml
    lidar_cost_grid_param_file: sensing/lidar/cost_grid.yaml
    inflation_cost_grid_param_file: sensing/inflation_cost_grid.yaml
    # HH_260611: Current rover default is simpleRTK2B Heading through ublox_gps.
    # Set false for the SparkFun ZED-F9P single-antenna profile.
    ublox_dual_antenna: true
    # HH_260727 - Send CORS only to the Lite moving base. Its device and baud
    # are owned by the moving_base_rtcm_writer section of gnss_param_file, so
    # standalone sensing and bringup read their respective synchronized config.
    # Keep
    # rover USB RTCM off so the corrected moving-base stream remains the rover's
    # only reference and absolute RTK plus heading can stay fixed together.
    ublox_dual_forward_ntrip_to_rover: false
    # HH_260722 - Preserve healthy carrier state during normal repeated launches.
    ublox_dual_warm_start_on_startup: false
    gnss_param_file: sensing/gnss/zed_f9p_rover.yaml
    ntrip_param_file: sensing/gnss/ntrip_client.yaml
    # HH_260528: imu_mode → imu_model; cv7_param_file/gq7_param_file → imu_param_file.
    #   imu_model: cv7  → MicroStrain CV7-AHRS (direct node, respawn)
    #   imu_model: gq7  → MicroStrain GQ7 (microstrain_launch.py + optional NTRIP)
    imu_model: cv7
    imu_param_file: __module_default__
    vanjee_config_path: sensing/lidar/vanjee/config.yaml
    ground_seg_param_file: sensing/lidar/ground_seg_params.yaml

  # =========================================================================
  # 5. PLATFORM
  # =========================================================================
  platform:
    # HH_260803 - Shared frame contract forwarded to every motion owner.
    robot_center_frame_id: robot_center_link
    rear_axle_frame_id: robot_base_link
    # By default, use internal config defaults declared by platform launch files.
    # HH_260506: Route sensor_kit TF geometry through bringup config so mount offsets
    # edited in camrod_bringup/config/sensor_kit/robot_params.yaml are applied.
    params_file: sensor_kit/robot_params.yaml
    robot_visualization_param_file: platform/robot_visualization.yaml

    # 260708: Exterior lights — light_controller decides HAZARD/crab/turn/OFF,
    # mcu_serial_bridge streams JSON to the Arduino Nano (headlight relay D10,
    # WS2815 left D5/right D7). Sim keeps the controller but forces the serial
    # bridge off. Details: camrod_platform/docs/lights-design-doc.html
    lights_enable: true
    lights_mcu_bridge_enable: true
    lights_param_file: platform/lights.yaml

    # HH_260720 - Ranger consumes the final /control/cmd_vel_ros boundary and publishes CAN status.
    ranger_driver_enable: true
    ranger_auto_setup_can: true
    ranger_can_bitrate: 500000
    ranger_can_restart_ms: 100
    # Keep platform.launch.py lean and route Ranger params through
    # bringup override profile when using bringup.launch.py.
    ranger_params_file: platform/ranger_driver.yaml

  # =========================================================================
  # 6. CONTROL
  # =========================================================================
  control:
    # HH_260720 - Crab, zero-turn, drop-zone exit, and parking-yaw alignment live here.
    enable_camping_site_maneuver_controller: true
    enable_drop_zone_maneuver_controller: true
    # HH_260803 / TODOLIST 12 - Execute only gate-approved bounded reverse/crab recovery.
    enable_route_safety_recovery_controller: true
    param_file: __module_default__

    # HH_260720 - Navigation and maneuver commands enter camrod_control here.
    cmd_vel_gate_enable: true
    cmd_vel_raw_topic: /control/cmd_vel_raw
    cmd_vel_topic: /control/cmd_vel
    # HH_260720 - Standard ROS commands exist only at Nav2 and Ranger boundaries.
    navigation_cmd_vel_ros_topic: /control/nav2_cmd_vel_ros
    cmd_vel_ros_topic: /control/cmd_vel_ros
    engage_topic: /planning/engage
    mission_engage_topic: /planning/mission_engage
    command_enabled_topic: /control/command_enabled
    # HH_260720 - Operator arming is enforced by cmd_vel_safety_gate_node.
    platform_drive_enable_topic: /platform/drive_enable
    cmd_vel_gate_require_platform_drive_enable: true
    # HH_260720 - Concrete mission requests authorize charger departure.
    cmd_vel_gate_mission_request_topic: /planning/mission_key
    # HH_260720 - Platform e-stop is part of AvgPlatformStatus; list only soft e-stops.
    # State-machine ERROR_STOP is a planning soft-estop and must
    # close Nav2 cmd_vel, not only parking/site maneuver handoff.
    cmd_vel_gate_additional_estop_topics: /planning/state_machine/estop
    # HH_260522: unified source selector for DR-timeout stop trigger.
    #   localization_monitor/topic/enabled/on: subscribe /localization/state/dr_timeout
    #   disabled/off/none: ignore DR-timeout trigger
    cmd_vel_gate_dr_timeout_source_mode: localization_monitor
    cmd_vel_gate_allow_on_start: false

    # After localization mode recovers (DR_ONLY -> NORMAL), keep
    # cmd_vel blocked briefly so pose/TF consumers settle before re-accelerating.
    cmd_vel_gate_enable_gnss_recovery_hold: true
    cmd_vel_gate_localization_mode_topic: /localization/mode
    cmd_vel_gate_gnss_recovery_hold_s: 2.0
    # HH_260707 - Avoid repeated recovery holds from short GNSS/NTRIP flaps.
    cmd_vel_gate_gnss_recovery_min_source_s: 1.5
    cmd_vel_gate_gnss_recovery_hold_cooldown_s: 10.0
    # AvgLocalizationMode enum used in this workspace: NORMAL=0, DR_ONLY=2.
    cmd_vel_gate_gnss_recovery_source_mode_min: 2
    cmd_vel_gate_gnss_recovery_target_mode: 0

    # Cost-based stop uses combined inflation grid (lanelet+LiDAR+Radar+global_path).
    cmd_vel_gate_cost_stop_enable: true
    cmd_vel_gate_cost_grid_topic: /planning/cost_grid/inflation
    # HH_260618: Safety/cmd_vel gates use real localization pose. Do not use
    # /planning/lanelet_pose here: snapped pose can stay on-lane while the robot
    # is physically outside the drivable lanelet/cost corridor.
    cmd_vel_gate_cost_pose_topic: /localization/pose
    # HH_260527: Primary-only selector default; use selected localization odometry.
    cmd_vel_gate_cost_odometry_topic: /localization/odometry
    cmd_vel_gate_robot_base_frame: robot_center_link
    # HH_260522: pose source preference options:
    #   odometry: prefer /localization/odometry candidate first
    #   tf_robot_base: prefer TF(map<-robot_center_link) first
    #   pose_topic: prefer the configured cost pose topic first.
    # HH_260618: Prefer the configured real localization pose for safety checks.
    cmd_vel_gate_pose_source_preference: pose_topic
    cmd_vel_gate_enable_pose_raw_fallback: false
    cmd_vel_gate_cost_threshold: 85
    # Legacy fixed lookahead; used only when enable_speed_dependent_lookahead=false.
    cmd_vel_gate_cost_lookahead_m: 2.0
    # HH_260806 - This legacy dynamic-obstacle corridor remains independent
    # from the physical lanelet body and planning envelopes.
    cmd_vel_gate_cost_width_m: 1.27
    cmd_vel_gate_cost_hold_s: 1.0
    # HH_260703 - Keep dynamic obstacle stops latched until perception/radar report
    # a continuous clear corridor; this prevents field stop/go oscillation.
    # HH_260728 - "Clear" refers to the original trigger source and geometry,
    # never the zero or changed-direction command produced after the stop.
    cmd_vel_gate_cost_stop_latch_enable: true
    cmd_vel_gate_cost_stop_clear_required_s: 2.0
    cmd_vel_gate_cost_stop_latch_log_interval_s: 1.0
    # HH_260703 - If the merged inflation cost grid stalls, cmd_vel must fail
    # closed even before diagnostics/state-machine e-stop catches up.
    cmd_vel_gate_cost_grid_stale_stop_enable: true
    cmd_vel_gate_cost_grid_stale_timeout_s: 1.0
    cmd_vel_gate_cost_grid_stale_log_interval_s: 1.0
    # HH_260622 - The merged inflation grid also carries static lanelet/global
    # path guidance. Only live dynamic sensor sources may block cmd_vel here.
    cmd_vel_gate_cost_stop_require_dynamic_source: true
    cmd_vel_gate_cost_stop_dynamic_source_labels: perception,radar
    # HH_260702 - When Nav2 publishes an avoidance local path, validate that
    # path corridor before blocking on the old body-front obstacle rectangle.
    cmd_vel_gate_front_dynamic_stop_use_local_path: true
    cmd_vel_gate_front_dynamic_path_width_m: 1.27
    cmd_vel_gate_front_dynamic_path_max_start_distance_m: 1.5

    # HH_260618: Raw lanelet hard-stop before inflation ego-clear. This blocks
    # translational cmd_vel when the current/corridor cell is lane-boundary or
    # outside lanelet, while still allowing in-place yaw correction.
    cmd_vel_gate_lanelet_safety_enable: true
    # HH_260806 - Use the 0.05 m local safety raster; Nav2 keeps its 0.25 m grid.
    cmd_vel_gate_lanelet_safety_grid_topic: /map/cost_grid/lanelet_safety
    cmd_vel_gate_lanelet_safety_threshold: 85
    cmd_vel_gate_lanelet_safety_current_threshold: 85
    # HH_260806 - Physical-body cost 100 is non-recoverable; planning margin remains recoverable.
    cmd_vel_gate_lanelet_safety_body_hard_stop_enable: true
    cmd_vel_gate_lanelet_safety_body_hard_stop_threshold: 100
    cmd_vel_gate_lanelet_safety_body_front_m: 0.70837
    cmd_vel_gate_lanelet_safety_body_rear_m: 0.68323
    cmd_vel_gate_lanelet_safety_body_left_m: 0.53505
    cmd_vel_gate_lanelet_safety_body_right_m: 0.53495
    cmd_vel_gate_lanelet_safety_footprint_enable: true
    # HH_260727 - Permit soft boundary cost 98; stop the full footprint at off-lane 100.
    cmd_vel_gate_lanelet_safety_footprint_threshold: 100
    cmd_vel_gate_robot_planning_boundary_topic: /platform/robot/planning_boundary
    # HH_260806 - Fabrication-inclusive body plus retained 0.05 m planning clearance.
    cmd_vel_gate_lanelet_safety_footprint_front_m: 0.75837
    cmd_vel_gate_lanelet_safety_footprint_rear_m: 0.73323
    cmd_vel_gate_lanelet_safety_footprint_left_m: 0.58505
    cmd_vel_gate_lanelet_safety_footprint_right_m: 0.58495
    cmd_vel_gate_lanelet_safety_lookahead_m: 1.0
    cmd_vel_gate_lanelet_safety_width_m: 0.8
    cmd_vel_gate_lanelet_safety_stop_on_unknown: true
    cmd_vel_gate_lanelet_safety_allow_rotation_in_place: true
    # HH_260618: Keep reverse/lateral free for explicit parking/site maneuver
    # phases; those phases need their own mission-state boundary guard.
    cmd_vel_gate_lanelet_safety_check_reverse: false
    cmd_vel_gate_lanelet_safety_check_lateral: false
    cmd_vel_gate_lanelet_safety_min_translation_mps: 0.02
    # HH_260619 - Forward lanelet safety follows the active local path first;
    # fallback remains the raw robot-yaw rectangle when the path is unavailable.
    cmd_vel_gate_lanelet_safety_front_use_local_path: true
    cmd_vel_gate_lanelet_safety_front_path_max_start_distance_m: 1.5
    # HH_260622 - FRONT_PATH uses only the selected route center corridor so
    # merge/branch lanelet boundary pixels do not block valid centerline travel.
    cmd_vel_gate_lanelet_safety_front_path_width_m: 0.25
    # HH_260624 - Allow bounded static FRONT_PATH bypass while re-entering lanelet from site/drop-zone.
    cmd_vel_gate_lanelet_safety_front_path_allow_route_reentry: true
    # HH_260622 - Allow bounded route re-entry when a sim/manual pose starts
    # just outside lanelet but the active local path is already close and valid.
    cmd_vel_gate_lanelet_safety_current_allow_route_reentry: true
    cmd_vel_gate_lanelet_safety_current_route_reentry_max_distance_m: 4.0
    cmd_vel_gate_lanelet_safety_current_route_reentry_require_front_cmd: true
    # HH_260720 - During explicit drop-zone exit, bypass only static lanelet
    # cost for these control phases; dynamic obstacle stops remain active.
    cmd_vel_gate_drop_zone_maneuver_controller_status_topic: /control/drop_zone_maneuver_controller/status
    cmd_vel_gate_drop_zone_maneuver_controller_static_bypass_phases: EXIT_STRAIGHT,ALIGN_EXIT_YAW
    # HH_260720 - Campsite entry/return is control-owned body-frame motion;
    # bypass only static lanelet/global-path cost in these phases.
    cmd_vel_gate_camping_site_maneuver_controller_status_topic: /control/camping_site_maneuver_controller/status
    # HH_260721 - Match the campsite controller's explicit entry-lanelet retrace phase.
    cmd_vel_gate_camping_site_maneuver_controller_static_bypass_phases: ALIGN_ENTRY_YAW,REVERSE_IN,CRAB_IN,ROTATE_180,ALIGN_RETRACE_YAW,REVERSE_OUT,CRAB_OUT
    # HH_260806 - Restrict off-road lanelet bypass to the dedicated campsite state machine.
    cmd_vel_gate_camping_site_maneuver_controller_lanelet_bypass_phases: ALIGN_ENTRY_YAW,REVERSE_IN,CRAB_IN,ROTATE_180,ALIGN_RETRACE_YAW,REVERSE_OUT,CRAB_OUT

    # Speed-dependent front lookahead: lookahead = v²/(2·g·mu) + reaction·v + margin.
    cmd_vel_gate_speed_dependent_lookahead: true
    # HH_260630 - Minimum front dynamic-stop scan covers the front radar mount
    # plus about 1.0m of obstacle clearance ahead of the sensor.
    cmd_vel_gate_front_lookahead_min_m: 2.60
    cmd_vel_gate_front_lookahead_max_m: 3.5
    cmd_vel_gate_front_lookahead_friction: 0.4
    cmd_vel_gate_front_reaction_time_s: 0.20
    cmd_vel_gate_front_lookahead_margin_m: 0.45
    # Side/rear cost-stop samples the same merged grid, but still requires a
    # dynamic source attribution before blocking.
    cmd_vel_gate_side_rear_cost_stop: true
    # HH_260707 - Side/rear dynamic guards include sensor mounting offset plus
    # SEN0592 detection range; shorter center-based windows missed side radar hits.
    cmd_vel_gate_body_near_dynamic_stop: true
    # HH_260728 - With the radar grid's 0.30 m obstacle disk, the 0.60 m raw
    # forward probe excludes a base-centred 1.0 m side return. Maneuvers stay 1.20 m.
    cmd_vel_gate_body_near_side_lookahead_m: 0.60
    cmd_vel_gate_body_near_rear_lookahead_m: 0.80
    # HH_260707 - Crab/reverse still use dynamic-source attribution, so keeping
    # the same physical radar envelope does not re-enable static lanelet stops.
    cmd_vel_gate_body_near_maneuver_side_lookahead_m: 1.20
    cmd_vel_gate_body_near_maneuver_rear_lookahead_m: 0.80
    # HH_260630: Match radar/lidar dynamic stop threshold so side hits are not
    # ignored by a higher side-only threshold.
    cmd_vel_gate_side_cost_threshold: 85
    # HH_260630: Side lidar/radar cells land near 0.9-1.0 m from robot center,
    # so crab-motion stop must look beyond the old 0.8 m window.
    cmd_vel_gate_side_lookahead_m: 1.2
    # HH_260623 - Side scan width covers full body length plus front/rear margins.
    cmd_vel_gate_side_corridor_width_m: 1.69160
    # HH_260630: Match radar/lidar dynamic stop threshold so rear hits are not
    # ignored by a higher rear-only threshold.
    cmd_vel_gate_rear_cost_threshold: 85
    # HH_260630: Rear dynamic cells can land just past 0.9 m after cost-grid
    # discretization and sensor/footprint offsets.
    cmd_vel_gate_rear_lookahead_m: 1.2
    # HH_260623 - Rear scan width covers full body width plus left/right margins.
    cmd_vel_gate_rear_corridor_width_m: 1.27
    # HH_260618: Explicit site-crab lateral parking may cross static
    # lanelet/global-path front/side/rear cost, but LiDAR/Radar dynamic source cost still
    # stops the robot.
    cmd_vel_gate_lateral_cmd_bypass_static_cost_stop: true
    cmd_vel_gate_lateral_cmd_bypass_min_mps: 0.02
    # HH_260618: Reverse campsite parking may cross static lanelet/global-path
    # cost after lanelet-snap arrival; LiDAR/Radar source cost remains active.
    cmd_vel_gate_reverse_cmd_bypass_static_cost_stop: true
    cmd_vel_gate_reverse_cmd_bypass_min_mps: 0.02
    # HH_260721 - side_cost_threshold is the single lateral obstacle threshold.
    # HH_260624 - Static lanelet cost may be bypassed during in-place 180deg
    # site turns, but live LiDAR/Radar cost around the body still stops rotation.
    cmd_vel_gate_rotation_cmd_dynamic_obstacle_stop: true
    cmd_vel_gate_rotation_cmd_dynamic_obstacle_radius_m: 1.5
    cmd_vel_gate_rotation_cmd_dynamic_obstacle_threshold: 85

    # Unavoidable-stop cluster detection for lethal costs (front only).
    cmd_vel_gate_unavoidable_stop_enable: true
    # Fixed from 253 (OccupancyGrid max is 100; 253 never triggers).
    cmd_vel_gate_unavoidable_lethal_threshold: 90
    cmd_vel_gate_unavoidable_cluster_min_cells: 25
    cmd_vel_gate_unavoidable_cluster_min_ratio: 0.25

    # Optional yaw-alignment zone gate at specific map keypoints.
    # Zone coordinates/yaw should come from lanelet2-derived map keypoints.
    cmd_vel_gate_yaw_alignment_enable: false
    cmd_vel_gate_yaw_alignment_frame_id: map
    cmd_vel_gate_yaw_alignment_exit_margin_m: 0.3
    # HH_260720 - Use the control-owned yaw-alignment zone file.
    cmd_vel_gate_yaw_alignment_zones_file: control/yaw_alignment_zones.yaml

    # HH_260706: Route-heading guard uses slower rotation and a longer tangent
    # lookahead to reduce startup left-right oscillation under delayed field data.
    cmd_vel_gate_route_heading_enable: true
    cmd_vel_gate_route_heading_path_topic: /planning/local_path
    cmd_vel_gate_route_heading_frame_id: map
    cmd_vel_gate_route_heading_min_cmd_x_mps: 0.03
    cmd_vel_gate_route_heading_lateral_cmd_epsilon_mps: 0.02
    cmd_vel_gate_route_heading_lookahead_m: 2.0
    cmd_vel_gate_route_heading_error_enter_deg: 75.0
    # HH_260806 - Complete gross start alignment within 5 degrees before drive.
    cmd_vel_gate_route_heading_error_exit_deg: 5.0
    cmd_vel_gate_route_heading_angular_kp: 0.8
    cmd_vel_gate_route_heading_max_angular_z: 0.35
    cmd_vel_gate_route_heading_max_linear_x: 0.0
    cmd_vel_gate_route_heading_min_path_points: 2

    # HH_260720 - Scale output before publishing /control/cmd_vel.
    cmd_vel_gate_speed_scale: 0.5
    # HH_260626: Publish zero if Nav2 raw cmd_vel stops arriving.
    cmd_vel_gate_input_timeout_s: 0.35
    cmd_vel_gate_zero_publish_rate_hz: 10.0
    # HH_260806 - Keep the vehicle stationary only while maneuver/Nav2 ownership changes.
    cmd_vel_gate_maneuver_command_release_hold_s: 0.5

    # HH_260720 - CAN/DBC feedback closes the command gate on stale status, faults, and charging.
    cmd_vel_gate_status_topic: /control/cmd_vel_safety_gate/status
    cmd_vel_gate_platform_safety_source_mode: platform_status
    cmd_vel_gate_platform_status_topic: /platform/status
    cmd_vel_gate_platform_status_timeout_s: 0.5
    cmd_vel_gate_block_on_platform_status_stale: true
    cmd_vel_gate_block_on_charging: true
    # HH_260724 - A new campsite mission gets a bounded charger departure window only above the SOC margin.
    cmd_vel_gate_allow_mission_departure_while_charging: true
    cmd_vel_gate_charging_departure_grace_s: 15.0
    cmd_vel_gate_charger_departure_mission_prefixes: camping_site_
    cmd_vel_gate_mission_request_dedup_s: 1.0
    cmd_vel_gate_require_battery_for_mission_departure: true
    cmd_vel_gate_minimum_mission_departure_battery_percentage: 0.35
    cmd_vel_gate_block_on_platform_error_code: true
    cmd_vel_gate_require_can_control_mode: true
    # HH_260724 - Match camrod_control/config/cmd_vel_safety_gate.yaml critical SOC.
    cmd_vel_gate_critical_battery_stop_enabled: true
    cmd_vel_gate_critical_battery_percentage: 0.20

  # =========================================================================
  # 7. PARKING
  # =========================================================================
  parking:
    # HH_260720 - Select one final parking controller implemented by camrod_control.
    method: reverse
    enable_parking: true
    param_file: __module_default__

  # =========================================================================
  # 8. PERCEPTION
  # =========================================================================
  perception:
    enable_lidar_obstacle: true
    enable_yolo: true
    # HH_260707: Default to the front-camera->YOLO component path after real
    # bringup smoke tests confirmed unchanged public topics and lower DDS load.
    use_camera_yolo_container: true
    # HH_260805 - Active only for physical rear-camera AprilTag parking.
    use_rear_camera_apriltag_container: true
    apriltag_param_file: perception/apriltag_parking_detector.yaml
    # HH_260522: unified perception pipeline selector.
    #   auto: camera if available, fallback to lidar_only
    #   lidar_only: disable camera branches
    #   camera_lidar: require camera branches (auto-fallback to lidar_only if camera missing)
    mode: auto
    # By default, use internal config defaults declared by perception launch files.
    perception_param_file: perception/perception_params.yaml

  # =========================================================================
  # 9. SYSTEM
  # =========================================================================
  system:
    # Enable full camrod_system diagnostics launch by default in bringup.
    # HH_260522: diagnostics profile choices are directory names under:
    #   camrod_bringup/config/system/diagnostics/<profile_name>/
    enable_module_validators: true
    # HH_260805 - Keep the filtered diagnostic chain in one serialized
    # component process; standalone executables remain selectable for field debug.
    use_system_tools_container: true
    # HH_260805 - Compose each checker fault domain in its own serialized scoped
    # container. Standalone checker executables remain selectable for field debug.
    use_checker_components: true
    checker_component_groups: hardware_sensing,localization,autonomy_topics,planning_lifecycle
    # HH_260805 - Retained as a compatibility key; checker containers serialize
    # callbacks to keep teardown deterministic.
    checker_component_threads: 1
    diagnostics_profile: default
    # HH_260630 - __module_default__ selects camrod_system/config/system_checker.yaml
    # in hardware mode and system_checker_sim.yaml when sim:=true.
    system_checker_param_file: __module_default__
    # Set true only when ranger_msgs-dependent platform checker is available.
    enable_platform_checker: false

    # Keep plugin API bridge enabled by default.
    enable_plugin_api: true
    # Lightweight HTTP UI backend for API/state monitoring.
    enable_api_ui: true
    # HH_260706 - Bind operator UI to all interfaces for robot-IP access.
    api_ui_host: 0.0.0.0
    api_ui_port: 8010
    # HH_260803 - Serve the guest workflow with the same scenario backend.
    enable_guest_ui: true
    guest_ui_host: 0.0.0.0
    guest_ui_port: 8012
    # HH_260724 - Surface UI backend battery policy in the top-level bringup config.
    api_ui_require_battery_for_mission_dispatch: true
    api_ui_minimum_mission_dispatch_battery_percent: 35.0
    api_ui_low_battery_return_after_current_mission: true
    api_ui_low_battery_return_threshold_percent: 35.0

    # HH_260805 - Use Chromium by default for touch/IME support and GPU-backed
    # rendering. WebKit remains an explicit low-overhead fallback.
    # Disable for headless bringup or when rendering the UI on another device.
    enable_operator_ui_window: true
    operator_ui_window_engine: chromium
    operator_ui_window_url: http://127.0.0.1:8010
    operator_ui_window_width: 1280
    operator_ui_window_height: 800
    # HJ_260804 - The on-robot display runs as a borderless kiosk. Headless
    # deployment still uses enable_operator_ui_window=false.
    operator_ui_window_fullscreen: true

  # =========================================================================
  # 10. NAMESPACES
  # =========================================================================
  namespaces:
    map: map
    sensing: sensing
    localization: localization
    planning: planning
    control: control
    platform: platform
    parking: parking
    perception: perception
    sensor_kit: sensor_kit
    bringup: bringup
    system: system
    # sensing.launch.py already pushes /sensing namespace.
    # Keep GNSS sub-namespace as `gnss` to avoid duplicated /sensing/sensing/gnss paths.
    gnss: gnss
    voice: voice

  # =========================================================================
  # 11. TOPICS
  # =========================================================================
  topics:
    gnss_rtcm: /sensing/gnss/rtcm

  # =========================================================================
  # 12. MAP
  # =========================================================================
  map:
    # Map origin defaults are loaded from config/map/map_info.yaml.
    # launch_defaults keeps only explicit bringup-level overrides.
    # Keep only explicit map path / yaw override knobs here.
    map_path: ""
    # Point to bringup-local map_info.yaml. The resolved file is forwarded to
    # both map and localization so Lanelet2 and GNSS use one projection origin.
    map_info_file: map/map_info.yaml
    map_param_file: __module_default__
    lanelet_cost_grid_param_file: map/lanelet_cost_grid.yaml
    lanelet_safety_cost_grid_param_file: map/lanelet_safety_cost_grid.yaml
    map_visualization_param_file: map/map_visualization.yaml

  # =========================================================================
  # 13. VOICE
  # =========================================================================
  voice:
    enable_voice: true
    enable_voice_adapter: true

  # =========================================================================
  # 14. SIM
  # =========================================================================
  sim:
    lanelet_id: -1
    # Synthetic obstacle controls for cost-stop scenario tests.
    obstacle_offset: 12.0
    obstacle_height: 0.5
    obstacle_direction: front
    obstacle_lateral_offset: 0.0
