bringup:
  runtime:
    clean_before_launch: true
    sim: false
    rviz: true
    # HH_260327: Stagger module startup to reduce bringup burst load.
    module_launch_gap_sec: 1.0

  localization:
    enable_adapter: true
    enable_filter: true
    enable_monitor: true
    enable_map_helper: true
    # HH_260327: Match standalone localization.launch.py default behavior.
    # Keep bringup baseline on EKF so runtime result is consistent with module-by-module launch.
    use_eskf: false
    filter_type: ekf
    wheel_bridge_enable: true
    # HH_260330: /platform/status/wheel is not published on current platform stack.
    # Use /rmp401/odom(nav_msgs/Odometry) as the default real-sensor wheel source.
    wheel_input_topic: /rmp401/odom
    wheel_input_type: nav_odom
    wheel_output_topic: /platform/wheel/odometry
    wheel_nav_output_topic: /platform/wheel/nav_odometry
    # HH_260326: Temporary ESKF fallback source.
    eskf_force_rmp401_odom: true
    eskf_rmp401_odom_topic: /rmp401/odom
    kimera_bridge_enable: false
    pose_selector_enable: false
    # HH_260407: Localization launch refactor - explicit override keys per sub-launch.
    adapter_param_file: __module_default__
    filter_eskf_param_file: __module_default__
    filter_pose_selector_param_file: __module_default__
    filter_kimera_param_file: __module_default__
    monitor_param_file: __module_default__
    map_helper_param_file: __module_default__
    map_info_file: __module_default__
    drop_zones_yaml: __module_default__
    # HH_260407: legacy keys (fallback only).
    ekf_param_file: __module_default__
    eskf_param_file: __module_default__
    kimera_bridge_param_file: __module_default__
    pose_selector_param_file: __module_default__

  planning:
    enable_path_cost_grids: true
    # HH_260327: Match standalone planning.launch.py defaults.
    enable_goal_replanner: false
    enable_nav2_lifecycle_retry: false
    # HH_260327: Allow Nav2 startup by default even when initial_match_ok is false.
    # This keeps /planning/cmd_vel and path generation available during bringup debugging.
    require_localization_ready: false
    # HH_260326: Keep OFF by default; current state machine requires status_msgs runtime dependency.
    enable_state_machine: false
    # HH_260401: Resolve drop_zone from map-exported semantic area YAML.
    state_machine_keypoints_yaml: map/drop_zones.yaml
    state_machine_camping_sites_yaml: planning/camping_sites.yaml
    # HH_260331: Keep local-path pose topic aligned with standalone localization.launch.py behavior.
    local_path_pose_topic: /localization/pose
    # HH_260331: Prefer controller-local path first so /planning/local_path differs
    # from pure global slicing and reflects local costmap reactions in real time.
    local_path_source: controller_then_slice
    # HH_260331: Require explicit /planning/engage trigger for final /planning/cmd_vel.
    cmd_vel_gate_enable: true
    cmd_vel_raw_topic: /planning/cmd_vel_raw
    cmd_vel_topic: /planning/cmd_vel
    engage_topic: /planning/engage
    engaged_state_topic: /planning/engaged
    cmd_vel_gate_use_estop_topic: true
    cmd_vel_gate_estop_topic: /planning/state_machine/estop
    cmd_vel_gate_allow_on_start: false
    use_dwb_controller: false
    # HH_260331: By default, use internal config defaults declared by planning launch files.
    nav2_base_param_file: __module_default__
    nav2_vehicle_param_file: __module_default__
    nav2_vehicle_dwb_param_file: __module_default__
    nav2_lanelet_param_file: __module_default__
    nav2_behavior_param_file: __module_default__
    path_cost_grids_param_file: __module_default__
    goal_snapper_param_file: __module_default__
    centerline_snapper_param_file: __module_default__
    goal_replanner_param_file: __module_default__
    local_path_extractor_param_file: __module_default__
    planning_state_machine_param_file: __module_default__

  sensing:
    enable_radar: true
    enable_radar_cost_grid: true
    enable_lidar_cost_grid: true
    enable_lidar_driver: true
    enable_imu: true
    enable_gnss: true
    enable_ntrip: true
    # HH_260331: By default, use internal config defaults declared by sensing launch files.
    sensing_param_file: __module_default__
    lidar_preprocess_param_file: __module_default__
    camera_preprocess_param_file: __module_default__
    imu_converter_param_file: __module_default__
    radar_sensor_param_file: __module_default__
    radar_cost_grid_param_file: __module_default__
    lidar_cost_grid_param_file: __module_default__
    gnss_param_file: __module_default__
    ntrip_param_file: __module_default__
    cv7_param_file: __module_default__
    gq7_param_file: __module_default__
    vanjee_config_path: __module_default__

  platform:
    # HH_260331: By default, use internal config defaults declared by platform launch files.
    params_file: __module_default__
    robot_visualization_param_file: __module_default__
    # HH_260331: Real platform defaults to direct planning cmd_vel usage.
    # Keep cmd_vel gate ON in sim mode via bringup.launch.py runtime override.
    cmd_vel_gate_enable: false
    cmd_vel_in_topic: /planning/cmd_vel
    cmd_vel_out_topic: /platform/cmd_vel

  perception:
    enable_lidar_obstacle: true
    # HH_260331: By default, use internal config defaults declared by perception launch files.
    perception_param_file: __module_default__

  system:
    # HH_260331: Enable full camrod_system diagnostics launch by default in bringup.
    enable_module_validators: true
    diagnostics_profile: default
    # Set true only when ranger_msgs-dependent platform checker is available.
    enable_platform_checker: false
    # HH_260327: Keep plugin API bridge enabled by default.
    enable_plugin_api: true
    # HH_260327: Lightweight HTTP UI backend for API/state monitoring.
    enable_api_ui: true
    api_ui_host: 0.0.0.0
    api_ui_port: 8010

  namespaces:
    map: map
    sensing: sensing
    localization: localization
    planning: planning
    platform: platform
    perception: perception
    sensor_kit: sensor_kit
    bringup: bringup
    system: system
    # HH_260326: sensing.launch.py already pushes /sensing namespace.
    # Keep GNSS sub-namespace as `gnss` to avoid duplicated /sensing/sensing/gnss paths.
    gnss: gnss

  topics:
    gnss_navsatfix: /sensing/gnss/ublox_gps_node/fix
    gnss_pose: /sensing/gnss/pose
    gnss_pose_cov: /sensing/gnss/pose_with_covariance
    gnss_rtcm: /sensing/gnss/rtcm

  map:
    # HH_260327: Map origin defaults are loaded from config/map/map_info.yaml.
    # launch_defaults keeps only explicit bringup-level overrides.
    # Keep only explicit map path / yaw override knobs here.
    map_path: ""
    yaw_offset_deg: 0.0
    # HH_260331: By default, use internal config defaults declared by map launch files.
    map_info_file: __module_default__
    map_param_file: __module_default__
    lanelet_cost_grid_param_file: __module_default__
    map_visualization_param_file: __module_default__

  sim:
    lanelet_id: -1
    fake_lanelet_id: -1
