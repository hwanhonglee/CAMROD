bringup:
  runtime:
    clean_before_launch: true
    # Run one more cleanup pass on Ctrl+C shutdown to prevent duplicate nodes.
    clean_on_shutdown: true
    sim: false
    rviz: true
    # Stagger module startup to reduce bringup burst load.
    module_launch_gap_s: 1.0

  localization:
    enable_adapter: true
    enable_filter: true
    enable_monitor: true
    enable_map_helper: true
    # Real-sensor bringup baseline uses ESKF for better robustness under
    # temporary wheel/ranger odometry instability.
    use_eskf: true
    filter_type: eskf
    wheel_bridge_enable: true
    # Use platform status odometry as primary source.
    wheel_input_topic: /platform/status/odometry
    wheel_input_type: nav_odom
    # Keep /rmp401/odom as fallback-only source.
    wheel_fallback_input_topic: /rmp401/odom
    wheel_fallback_input_type: nav_odom
    wheel_primary_timeout_s: 0.7
    # Unified wheel output topic used by EKF/ESKF.
    wheel_output_topic: /platform/status/wheel_odometry
    wheel_nav_output_topic: /platform/wheel/nav_odometry
    # 2026-04-22: Keep explicit-only escape hatch.
    # Set true only when you intentionally want ESKF primary input fixed to /rmp401/odom.
    eskf_force_rmp401_odom: false
    eskf_rmp401_odom_topic: /rmp401/odom
    pose_selector_enable: false
    # Localization launch refactor - explicit override keys per sub-launch.
    adapter_param_file: __module_default__
    filter_eskf_param_file: __module_default__
    filter_pose_selector_param_file: __module_default__
    monitor_param_file: __module_default__
    map_helper_param_file: __module_default__
    map_info_file: __module_default__
    drop_zones_yaml: __module_default__
    # legacy keys (fallback only).
    ekf_param_file: __module_default__
    eskf_param_file: __module_default__
    pose_selector_param_file: __module_default__

  planning:
    enable_path_cost_grids: true
    # Match standalone planning.launch.py defaults.
    enable_goal_replanner: false
    # Recover from intermittent lifecycle startup race on resource-limited targets.
    enable_nav2_lifecycle_retry: true
    # Allow Nav2 startup by default even when initial_match_ok is false.
    # This keeps /planning/cmd_vel and path generation available during bringup debugging.
    require_localization_ready: false
    # Keep OFF by default for conservative bringup. State machine can be enabled per scenario.
    enable_state_machine: false
    enable_progress: true
    # Resolve drop_zone from map-exported semantic area YAML.
    state_machine_keypoints_yaml: map/drop_zones.yaml
    state_machine_camping_sites_yaml: planning/camping_sites.yaml
    # Keep local-path pose topic aligned with standalone localization.launch.py behavior.
    local_path_pose_topic: /localization/pose
    # Prefer controller-local path first so /planning/local_path differs
    # from pure global slicing and reflects local costmap reactions in real time.
    local_path_source: controller_then_slice
    # Require explicit /planning/engage trigger for final /planning/cmd_vel.
    cmd_vel_gate_enable: true
    cmd_vel_raw_topic: /planning/cmd_vel_raw
    cmd_vel_topic: /planning/cmd_vel
    engage_topic: /planning/engage
    engaged_state_topic: /planning/engaged
    cmd_vel_gate_use_estop_topic: true
    # e-stop source is platform CAN->status bridge by default.
    cmd_vel_gate_estop_topic: /platform/status/estop
    cmd_vel_gate_allow_on_start: false
    # After localization mode recovers (DR_ONLY -> NORMAL), keep
    # cmd_vel blocked briefly so pose/TF consumers settle before re-accelerating.
    cmd_vel_gate_enable_gnss_recovery_hold: true
    cmd_vel_gate_localization_mode_topic: /localization/mode
    cmd_vel_gate_gnss_recovery_hold_s: 2.0
    # AvgLocalizationMode enum used in this workspace: NORMAL=0, DR_ONLY=2.
    cmd_vel_gate_gnss_recovery_source_mode_min: 2
    cmd_vel_gate_gnss_recovery_target_mode: 0
    # Cost-based stop uses combined inflation grid (lanelet+LiDAR+Radar+global_path).
    cmd_vel_gate_cost_stop_enable: true
    cmd_vel_gate_cost_grid_topic: /planning/cost_grid/inflation
    cmd_vel_gate_cost_pose_topic: /localization/pose
    # VIO stack is disabled; use localization fallback odometry.
    cmd_vel_gate_cost_odometry_topic: /localization/fallback/odometry
    # Use odometry heading by default for stable cost-stop corridor checks.
    cmd_vel_gate_pose_source_preference: odometry
    cmd_vel_gate_enable_pose_raw_fallback: false
    cmd_vel_gate_cost_threshold: 85
    # Legacy fixed lookahead; used only when enable_speed_dependent_lookahead=false.
    cmd_vel_gate_cost_lookahead_m: 2.0
    cmd_vel_gate_cost_width_m: 1.0
    cmd_vel_gate_cost_hold_s: 1.0
    # Speed-dependent front lookahead: lookahead = v²/(2·g·mu) + reaction·v + margin.
    cmd_vel_gate_speed_dependent_lookahead: true
    cmd_vel_gate_front_lookahead_min_m: 0.4
    cmd_vel_gate_front_lookahead_max_m: 3.0
    cmd_vel_gate_front_lookahead_friction: 0.4
    cmd_vel_gate_front_reaction_time_s: 0.15
    cmd_vel_gate_front_lookahead_margin_m: 0.3
    # Side/rear cost-stop — uses same merged grid as front.
    cmd_vel_gate_side_rear_cost_stop: true
    cmd_vel_gate_side_cost_threshold: 92
    cmd_vel_gate_side_lookahead_m: 0.8
    cmd_vel_gate_side_corridor_width_m: 0.45
    cmd_vel_gate_rear_cost_threshold: 92
    cmd_vel_gate_rear_lookahead_m: 0.6
    cmd_vel_gate_rear_corridor_width_m: 0.6
    # Unavoidable-stop cluster detection for lethal costs (front only).
    cmd_vel_gate_unavoidable_stop_enable: true
    # Fixed from 253 (OccupancyGrid max is 100; 253 never triggers).
    cmd_vel_gate_unavoidable_lethal_threshold: 90
    cmd_vel_gate_unavoidable_cluster_min_cells: 25
    cmd_vel_gate_unavoidable_cluster_min_ratio: 0.25
    # Optional yaw-alignment zone gate at specific map keypoints.
    # Zone coordinates/yaw should come from lanelet2-derived map keypoints.
    cmd_vel_gate_yaw_alignment_enable: false
    cmd_vel_gate_yaw_alignment_frame_id: map
    cmd_vel_gate_yaw_alignment_exit_margin_m: 0.3
    # Keep module default unless bringup-level override is required.
    cmd_vel_gate_yaw_alignment_zones_file: __module_default__
    use_dwb_controller: false
    # By default, use internal config defaults declared by planning launch files.
    nav2_base_param_file: __module_default__
    nav2_vehicle_param_file: __module_default__
    nav2_vehicle_dwb_param_file: __module_default__
    nav2_lanelet_param_file: __module_default__
    nav2_behavior_param_file: __module_default__
    path_cost_grids_param_file: __module_default__
    goal_snapper_param_file: __module_default__
    centerline_snapper_param_file: __module_default__
    goal_replanner_param_file: __module_default__
    local_path_extractor_param_file: __module_default__
    planning_state_machine_param_file: planning/planning_state_machine.yaml

  sensing:
    enable_radar: true
    enable_radar_cost_grid: true
    enable_lidar_cost_grid: true
    enable_inflation_cost_grid: true
    enable_lidar_driver: true
    enable_imu: true
    enable_gnss: true
    enable_ntrip: true
    # By default, use internal config defaults declared by sensing launch files.
    sensing_param_file: __module_default__
    lidar_preprocess_param_file: __module_default__
    camera_preprocess_param_file: __module_default__
    imu_converter_param_file: __module_default__
    radar_sensor_param_file: __module_default__
    radar_cost_grid_param_file: __module_default__
    lidar_cost_grid_param_file: __module_default__
    inflation_cost_grid_param_file: __module_default__
    gnss_param_file: __module_default__
    ntrip_param_file: __module_default__
    cv7_param_file: __module_default__
    gq7_param_file: __module_default__
    vanjee_config_path: __module_default__

  platform:
    # By default, use internal config defaults declared by platform launch files.
    params_file: __module_default__
    robot_visualization_param_file: __module_default__
    # Real platform defaults to direct planning cmd_vel usage.
    # Keep cmd_vel gate ON in sim mode via bringup.launch.py runtime override.
    cmd_vel_gate_enable: false
    cmd_vel_in_topic: /planning/cmd_vel
    cmd_vel_out_topic: /platform/cmd_vel
    # Ranger base node directly publishes /platform/status/*.
    estop_topic: /platform/status/estop
    # Current baseline is no physical ranger CAN platform.
    # Use /rmp401/odom fallback path unless this is explicitly set true.
    ranger_driver_enable: false
    # Keep platform.launch.py lean and route Ranger params through
    # bringup override profile when using bringup.launch.py.
    ranger_params_file: platform/ranger_params.yaml

  perception:
    enable_lidar_obstacle: true
    # By default, use internal config defaults declared by perception launch files.
    perception_param_file: __module_default__

  system:
    # Enable full camrod_system diagnostics launch by default in bringup.
    enable_module_validators: true
    diagnostics_profile: default
    # Set true only when ranger_msgs-dependent platform checker is available.
    enable_platform_checker: false
    # Keep plugin API bridge enabled by default.
    enable_plugin_api: true
    # Lightweight HTTP UI backend for API/state monitoring.
    enable_api_ui: true
    # Bind API UI locally by default; expose externally only when explicitly requested.
    api_ui_host: 127.0.0.1
    api_ui_port: 8010

  namespaces:
    map: map
    sensing: sensing
    localization: localization
    planning: planning
    platform: platform
    perception: perception
    sensor_kit: sensor_kit
    bringup: bringup
    system: system
    # sensing.launch.py already pushes /sensing namespace.
    # Keep GNSS sub-namespace as `gnss` to avoid duplicated /sensing/sensing/gnss paths.
    gnss: gnss

  topics:
    gnss_navsatfix: /sensing/gnss/ublox_gps_node/fix
    gnss_pose: /sensing/gnss/pose
    gnss_pose_cov: /sensing/gnss/pose_with_covariance
    gnss_rtcm: /sensing/gnss/rtcm

  map:
    # Map origin defaults are loaded from config/map/map_info.yaml.
    # launch_defaults keeps only explicit bringup-level overrides.
    # Keep only explicit map path / yaw override knobs here.
    map_path: ""
    yaw_offset_deg: 0.0
    # By default, use internal config defaults declared by map launch files.
    map_info_file: __module_default__
    map_param_file: __module_default__
    lanelet_cost_grid_param_file: __module_default__
    map_visualization_param_file: __module_default__

  sim:
    lanelet_id: -1
    fake_lanelet_id: -1
    # Synthetic obstacle controls for cost-stop scenario tests.
    obstacle_offset: 12.0
    obstacle_height: 0.5
    obstacle_direction: front
    obstacle_lateral_offset: 0.0
