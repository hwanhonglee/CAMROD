/parking/site_maneuver:
  ros__parameters:
    # HH_260617: Parking controllers publish into the existing planning gate chain.
    cmd_vel_topic: "/planning/cmd_vel_raw"
    pose_topic: "/localization/pose"
    # HH_260618: Raw site center comes from RViz/UI on /goal_pose.
    # /planning/goal_pose_snapped_ros is the ROS-native lanelet route goal.
    site_goal_topic: "/goal_pose"
    route_goal_topic: "/planning/goal_pose_snapped_ros"
    lanelet_pose_topic: "/planning/lanelet_pose_ros"
    planning_state_topic: "/planning/state_machine/state"
    adopt_destination_topic: "/parking/site_maneuver/adopt"
    diagnostics_topic: "/system/diagnostics"
    # HH_260622 - Parking phase telemetry is shared with UI/system state.
    amr_service_state_topic: "/AMR_service_state"
    # HH_260622 - RViz path for the rule-based campsite maneuver.
    reverse_path_topic: "/parking/site_maneuver/reverse_path"

    enable_auto_start_from_planning_state: true
    site_mission_key_prefix: "camping_site_"
    use_goal_pair_for_lateral_offset: true
    require_goal_pair_for_auto_start: true
    # HH_260622 - Operational campsite entry keeps the robot body yaw at the
    # lanelet-snap pose, commands wheel-crab lateral motion into the site, then
    # rotates the robot body 180deg only inside the selected campsite.
    site_entry_mode: "crab"
    enable_manual_site_goal_auto_start: true
    manual_site_min_offset_m: 1.0
    camping_sites_yaml: ""
    site_goal_frame_id: "map"
    default_lateral_offset_m: 1.2
    min_lateral_offset_m: 0.2
    # HH_260618: Camping-site center can be ~6 m from the lanelet-snap pose;
    # 3 m clipped the crab entry before reaching the selected site.
    max_lateral_offset_m: 7.0
    # HH_260623 - Start campsite maneuver only after the robot_base_link
    # center is near the lanelet route goal; 0.9 m started parking too early.
    route_goal_reached_distance_m: 0.3
    # HH_260701 - UI may adopt an already-parked campsite after a manual goal.
    adopt_site_arrival_distance_m: 3.0
    # HH_260618: 0 disables time expiry; the pair remains valid until a new
    # site/route goal replaces it, which is safer for long campsite approaches.
    goal_pair_max_age_s: 0.0
    default_lateral_direction: "left"

    crab_speed_mps: 0.18
    entry_position_tolerance_m: 0.15
    return_position_tolerance_m: 0.18
    # HH_260618: Sim/platform low-speed integration can be ~40% of raw parking
    # cmd_vel after gates; use this only for timeout prediction.
    crab_timeout_speed_scale: 0.4
    crab_timeout_margin_s: 8.0
    # HH_260619 - Reverse-out is a curved nonholonomic return to the lanelet
    # snap pose; keep it from timing out while the robot is still converging.
    reverse_return_timeout_margin_s: 45.0
    # HH_260619 - Complete reverse-out by snap-line progress instead of exact
    # Euclidean position, because low-speed reverse ticks can cross the snap pose.
    reverse_return_progress_tolerance_m: 0.45
    reverse_return_lateral_tolerance_m: 0.40
    max_forward_residual_m: 0.8
    rotate_kp: 1.2
    max_angular_speed_radps: 0.35
    rotate_yaw_tolerance_deg: 4.0
    # HH_260624 - Rotate toward the lanelet side after crab entry by campsite index.
    site_rotate_direction_policy: "site_index_lanelet_side"
    right_lanelet_site_indices: [1, 3, 5, 7, 9, 11]
    left_lanelet_site_indices: [2, 4, 6, 8, 10, 12, 13]
    # HH_260622 - Keep reverse mode available for fallback tests, but make it
    # slightly faster than the old 0.12 m/s parking crawl.
    reverse_entry_speed_mps: 0.16
    reverse_entry_yaw_kp: 1.0
    reverse_entry_lateral_kp: -0.25
    reverse_entry_max_angular_speed_radps: 0.25
    # HH_260619 - Use the campsite semantic yaw as the reverse travel axis.
    # The robot body yaw is commanded 180deg opposite to that axis while backing in.
    reverse_entry_use_site_goal_yaw: true
    reverse_entry_site_yaw_mode: "reverse_axis"
    reverse_entry_auto_select_yaw_equivalent: true
    reverse_entry_lateral_tolerance_m: 0.35
    reverse_entry_debug_period_s: 1.0
    unload_wait_s: 5.0
    # HH_260618: Stay parked inside the campsite after unload by default.
    # Return is triggered by /parking/site_maneuver/return or return_service.
    auto_return_after_unload_wait: false
    # HH_260619 - Re-selecting the same campsite while WAIT_RETURN is treated as
    # a fresh mission/test request instead of keeping the old parked state.
    reset_wait_return_on_site_goal: true
    request_return_to_drop_zone_on_done: true
    # HH_260701 - Restore lanelet yaw before campsite crab-out so the return
    # route to drop_zone does not start with another 180-degree turn at the snap pose.
    align_return_yaw_before_crab_out: true
    # HH_260701 - Site maneuver owns /planning/cmd_vel_raw during internal
    # phases; cancel Nav2 so controller_server cannot overwrite crab/reverse commands.
    cancel_nav2_on_site_phase: true
    nav2_cancel_period_s: 0.5
    nav2_cancel_action_topics:
      - /planning/follow_path/_action/cancel_goal
      - /planning/navigate_to_pose/_action/cancel_goal
    # HH_260618: Retry the mission return command until planning acknowledges
    # RETURN_TO_DROP_ZONE/drop_zone; prevents one-shot topic timing loss.
    return_request_retry_period_s: 1.0
    # HH_260618: Low-speed site maneuver control loop reduced to lower CPU.
    control_rate_hz: 10.0
    # HH_260618: Idle parking node wakes at 1 Hz until a maneuver starts.
    idle_tick_rate_hz: 1.0
    # HH_260618: Diagnostics/status are throttled separately from control.
    status_publish_rate_hz: 1.0

/parking/drop_zone_parking:
  ros__parameters:
    # HH_260617: Reverse parking consumes BMS charging state from platform CAN bridge.
    cmd_vel_topic: "/planning/cmd_vel_raw"
    pose_topic: "/localization/pose"
    charging_topic: "/platform/status/is_charging"
    planning_state_topic: "/planning/state_machine/state"
    diagnostics_topic: "/system/diagnostics"
    # HH_260622 - Drop-zone parking publishes post-navigation service state.
    amr_service_state_topic: "/AMR_service_state"
    # HH_260622 - RViz path for the rule-based drop-zone reverse maneuver.
    reverse_path_topic: "/parking/drop_zone/reverse_path"
    # HH_260624 - Straight drop-zone departure handoff before UI campsite route dispatch.
    exit_topic: "/parking/drop_zone/exit"
    exit_done_topic: "/parking/drop_zone/exit_done"
    exit_path_topic: "/parking/drop_zone/exit_path"
    lanelet_pose_topic: "/planning/lanelet_pose_ros"
    # HH_260624 - Selected raw drop-zone pose from planning; synchronizes multi-drop-zone maps.
    drop_zone_goal_raw_topic: "/planning/drop_zone_goal_raw"

    drop_zones_yaml: ""
    drop_zone_id: "drop_zone"
    use_drop_zone_pose_as_station: true
    station_x_m: 0.0
    station_y_m: 0.0
    station_yaw_deg: 0.0

    enable_auto_start_from_planning_state: true
    return_scenario_id: 2
    return_mission_key: "drop_zone"
    # HH_260622 - Drop-zone yaw is the parked robot front yaw. The vehicle body
    # aligns to station/goal yaw first; reverse motion then drives along yaw + pi.
    rear_matches_station_yaw: false
    # HH_260619 - Do not auto-select a 180deg-equivalent yaw at drop-zone;
    # campsite handling is the only parking flow that rotates the body 180deg.
    auto_select_reverse_yaw_to_station: false
    align_yaw_tolerance_deg: 5.0
    align_yaw_kp: 1.2
    align_max_angular_speed_radps: 0.35
    # HH_260624 - Exit straight out of the drop-zone before aligning to lanelet yaw.
    exit_forward_distance_m: 1.2
    exit_speed_mps: 0.16
    # HH_260624 - Allow slow sim/platform velocity scaling to finish the straight drop-zone exit before timeout.
    exit_max_duration_s: 30.0

    # HH_260622 - Slightly faster reverse parking while keeping low-speed rule-based control.
    reverse_speed_mps: 0.16
    reverse_yaw_kp: 0.8
    # HH_260617: Signed lateral gain allows field calibration if reverse steering sign differs.
    reverse_lateral_kp: -0.25
    reverse_max_angular_speed_radps: 0.22
    max_reverse_distance_m: 1.5
    max_reverse_duration_s: 30.0
    require_station_ahead_for_reverse: true
    station_ahead_tolerance_m: 0.25
    stop_on_charging: true
    complete_on_reverse_limit_without_charging: true
    # HH_260618: Low-speed reverse parking control loop reduced to lower CPU.
    control_rate_hz: 10.0
    # HH_260618: Idle parking node wakes at 1 Hz until a maneuver starts.
    idle_tick_rate_hz: 1.0
    # HH_260618: Diagnostics/status are throttled separately from control.
    status_publish_rate_hz: 1.0
