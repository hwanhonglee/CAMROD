# Ranger driver parameters are grouped into numbered sections:
#   1) general driver settings, 2) steering transition,
#   3) platform status and battery, 4) odometry input, 5) e-stop.
/**:
  ros__parameters:
    # =========================================================================
    # 1. GENERAL DRIVER SETTINGS
    # =========================================================================
    # HH_260410: Platform-owned default Ranger driver parameters.
    # bringup may override this file via platform/ranger_driver_file.
    use_sim_time: false                         # Uses ROS simulated time if true.
    port_name: "can0"                           # CAN interface device name used by ranger_base node.
    robot_model: "ranger"                       # Ranger model identifier expected by upstream driver.
    odom_frame: "odom"                          # Parent frame for wheel odometry output.
    # HH_260803 - Ranger Dual-Ackermann integration represents the axle midpoint.
    base_frame: "robot_center_link"             # Child/base frame for wheel odometry output.
    simulated_robot: false                      # Enables internal simulation mode in ranger driver.
    publish_odom_tf: false                      # Publishes odom->base TF directly from ranger driver if true.
    update_rate: 50                             # Driver update and publish loop rate [Hz].

    # =========================================================================
    # 2. STEERING TRANSITION
    # =========================================================================
    # HH_260731 - Conservative outdoor recovery default. 0.25 rad/s turns
    # 0→90 deg in about 6.3 s; the diagnostics UI can still tune it at runtime.
    # HJ_0812 - Steering lag is the dominant phase delay during lateral path
    # re-entry. At 1.0 rad/s a 0.63 rad return angle needs 0.63 s against a
    # 1.40 s tracking time constant (ratio 0.45), which collapses the nominal
    # pure-pursuit damping of 0.707. 1.5 rad/s brings the ratio to 0.30.
    # The diagnostics UI accepts [0.05, 2.0].
    steering_transition_rate_radps: 1.5 # 1.0 / 0.25

    # HH_260729 - A rate-limited steering angle is delayed geometry. Hold
    # translation for large lag and restore full speed only near the new angle,
    # so an old wheel direction cannot carry the robot across the centerline.
    steering_transition_velocity_scale_enabled: true
    steering_transition_full_speed_error_rad: 0.05
    # HJ_0812 - A 0.35 rad threshold fired on every ordinary path re-entry: a
    # 0.3 m lateral offset already needs 0.415 rad. The robot then crawled at
    # 20% while steering and jumped back to full speed with the wheels already
    # committed to the arc, which is the overshoot step itself. 0.7 rad keeps
    # the hold for genuine large-lag transitions only.
    steering_transition_stop_error_rad: 0.7
    steering_transition_min_velocity_scale: 0.2
    # HH_260818 - Preserve the 20% floor for normal Ackermann tracking, but
    # override it to zero only while changing between longitudinal and pure
    # parallel steering. Translation starts within 0.05 rad of the target.
    steering_mode_transition_stationary_enabled: true
    steering_mode_transition_ready_error_rad: 0.05
    # HH_260818 - Ignore tiny lateral residue during normal Nav2 tracking. Site
    # and boundary-recovery crab commands (>=0.10 m/s) remain parallel motion.
    parallel_command_lateral_deadband_mps: 0.02

    # HH_260731 - Wheel velocity is measured, not mathematically exact. Never
    # publish zero covariance: robot_localization treats it as near-perfect and
    # can suppress the IMU yaw-rate during crab transitions.
    odom_linear_velocity_stddev_mps: 0.05
    odom_angular_velocity_stddev_radps: 0.10

    # =========================================================================
    # 3. PLATFORM STATUS AND BATTERY
    # =========================================================================
    publish_platform_status_topics: true        # Enables bridged platform status topic publication.
    status_odom_topic: "/platform/status/odometry"     # Normalized odometry status output topic.
    status_velocity_topic: "/platform/status/velocity" # Normalized velocity status output topic.
    status_wheel_topic: "/platform/status/wheel"       # Wheel-state status output topic.

    # HH_260617: BMS CAN 0x361 is published by ranger_base as /battery_state.
    # HH_260720 - The bridge stores BMS data in the canonical AvgPlatformStatus message.
    battery_state_topic: "/battery_state"              # Raw BatteryState from Ranger BMS CAN 0x361.
    apriltag_parking_status_topic: "/parking/apriltag_parking_controller/status"
    charging_current_threshold_a: 0.3                  # Current above threshold means charging by default.
    charging_current_positive_is_charging: true        # Flip to false if measured BMS current is negative while charging.
    charging_min_consecutive_samples: 2                # Distinct physical 0x361 frames, not 50 Hz cached samples.
    # HH_260813 - Regenerative braking drove current positive for up to 7 s per
    # deceleration, which announced charging while the robot was simply driving.
    charging_confirm_s: 10.0                           # Global rising edge; keep the regen rejection window.
    charging_release_s: 3.0                            # Unplugging is reported quickly.
    # HH_260819 - Only a fresh, healthy AprilTag FINAL_YAW_ALIGNMENT or
    # WAITING_FOR_CHARGING heartbeat can use this shorter confirmation path.
    charging_fast_confirm_s: 1.5                       # Sustained current before docking preemption/CHARGING.
    charging_fast_status_ttl_s: 1.5                    # Fast arm expires if the 2 Hz controller heartbeat stops.
    # HH_260819 - Live can0 measured 0x361 at mean 0.243 s, max 0.401 s
    # over 62 frames. Allow normal jitter/missed frames but never join sparse evidence.
    charging_sample_max_gap_s: 1.0                     # Reset any rising/release dwell after a longer BMS gap.

    status_frame_id: "robot_center_link"       # Frame id used in /platform/status header.
    actuator_state_topic: "/actuator_state"     # Actuator state topic from ranger_base (CAN 0x281/0x271).

    # HH_260428: Comprehensive aggregated DBC status topic (AvgPlatformStatus).
    # Aggregates all CAN fields: vehicle_state/control_mode/error_code/battery_voltage (0x211),
    # motion_mode (0x291), motor_rpm[8] (0x251-0x258), motor_speed[4] (0x281), motor_angle[4] (0x271).
    platform_status_topic: "/platform/status"   # Aggregated AvgPlatformStatus output topic.
    # Safety-critical state changes bypass this steady-state heartbeat limit.
    platform_status_publish_rate_hz: 10.0       # Aggregate status heartbeat rate [Hz].

    # =========================================================================
    # 4. ODOMETRY INPUT
    # =========================================================================
    # HH_260428: Odom input for the platform bridge.
    # odom_topic_name  : primary source — ranger_base /odom (CAN 0x221/0x311/0x312).
    #                    ranger.launch.py hardcodes ranger_base output to /odom.
    # odom_fallback_topic : fallback when primary is absent — RMP401 substitute platform.
    #                       Activated automatically after odom_fallback_timeout_s seconds of silence.
    # To run on Ranger hardware: keep odom_topic_name as /odom (matches ranger_base output).
    # To run with RMP401 only (no ranger_base): set odom_topic_name: /rmp401/odom and
    #   odom_fallback_topic: "" to disable the fallback subscription.
    odom_topic_name: "/odom"                    # Primary odom input (ranger_base output).
    odom_fallback_topic: "/rmp401/odom"         # Fallback odom when primary is silent (RMP401 substitute).
    # HH_260617: Use canonical `_s` suffix for duration parameters.
    odom_fallback_timeout_s: 1.0                # Seconds of primary silence before activating fallback.

    # =========================================================================
    # 5. E-STOP
    # =========================================================================
    estop_on_exception_state: true              # Forces estop=true when driver exception state is detected.
    estop_on_error_code: false                  # Forces estop=true on non-zero driver error codes if enabled.
