# 260708: Exterior light control (headlight relay + WS2815 turn indicators).
# Decision rules and serial protocol: docs/lights-design-doc.html
/platform/light_controller:
  ros__parameters:
    # ---- Inputs ----
    # HH_260720 - Hardware e-stop is carried by the generated platform status.
    platform_status_topic: "/platform/status"
    # State machine mirrors ERROR_STOP onto this soft-estop topic (HH_260701),
    # so hazard covers both hardware estop and planning ERROR_STOP.
    estop_state_machine_topic: "/planning/state_machine/estop"
    headlight_command_topic: "/platform/headlight/command"
    # HH_260720 - Lights observe the admitted control command and maneuver phase.
    camping_site_maneuver_controller_status_topic: "/control/camping_site_maneuver_controller/status"
    cmd_vel_topic: "/control/cmd_vel"
    # HH_260720 - Consume the generated CAMROD global-path mirror.
    global_path_topic: "/planning/global_path_avg"
    pose_topic: "/localization/pose"
    route_turn_segments_topic: "/planning/route_turn_segments"
    # ---- Output ----
    lights_command_topic: "/platform/lights/command"

    # Turn indicator starts this far before a turn_direction lanelet window.
    turn_pre_distance_m: 12.0
    # Crab direction indication needs at least this much commanded lateral speed.
    crab_lateral_threshold_mps: 0.05
    publish_rate_hz: 5.0
    pose_timeout_s: 2.5
    site_status_timeout_s: 3.0
    cmd_vel_timeout_s: 1.0
    # The typed route-turn message length must match the global path within
    # this tolerance; otherwise turn windows are ignored for that cycle
    # (route change propagating — fail dark, never signal from a stale pair).
    route_length_tolerance_m: 1.0

/platform/mcu_serial_bridge:
  ros__parameters:
    lights_command_topic: "/platform/lights/command"
    lights_status_topic: "/platform/lights/status"
    # CH340 (Arduino Nano) must use the stable by-id path: ttyUSB* enumeration
    # order is shared with the SEN0592 radar CH9344 ports (HH_260702 port map).
    serial_port: "/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0"
    serial_baud: 115200
    # PC->MCU frame rate; MCU declares link loss after mcu_timeout_s without
    # frames (must match LINK_TIMEOUT_MS in the Arduino sketch).
    tx_rate_hz: 5.0
    mcu_timeout_s: 1.0
    reconnect_backoff_s: 2.0
