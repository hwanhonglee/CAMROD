# Shared map reference parameters for map/localization/planning modules.
# This file is the single source of truth for map path + origin offsets.
/**:
  ros__parameters:
    # Lanelet2 OSM path.
    # Keep empty by default and let launch resolve via package-share/workspace search.
    # (bringup/map/planning launch files already provide this resolution path.)
    map_path: "../../../lanelet2_maps_(c_track_test).osm"
    map_profile: "copy_c_track"

    # WGS84 origin used by LocalCartesian/UTM projectors.
    # Keep these values aligned with the source map generation reference.

    # 52S-CF60, Park - VMB (map v8, back-calculated from OSM local_x/y vs lat/lon)
    # offset_lat: 36.8436194   # v1 origin
    # offset_lon: 128.0925490
    # offset_alt: 299.425
    # offset_lat: 36.84357266  # incorrect partial average
    # offset_lon: 128.09256443
    # offset_lat: 36.84395344
    # offset_lon: 128.09243413
    # offset_alt: 293.119

    # 52S-CF0, C-track - VMB
    # offset_lat: 36.12491471
    # offset_lon: 126.77473954
    # offset_alt: 84.0

    # 52S-CF0, C-track - VMB
    offset_lat: 36.12491471
    offset_lon: 126.77473954
    offset_alt: 84.0

    # Optional UTM-origin metadata for downstream tools that prefer metric origin fields.
    offset_utm_easting: 0.0
    offset_utm_northing: 0.0
    offset_utm_alt: 84.0

    # Optional map yaw correction (degrees).
    # If enabled, lat/lon->xy conversion can be rotated by this offset.
    yaw_offset_deg: 0.0
    rotate_latlon_xy_by_yaw_offset: true

    # Canonical frame IDs shared by map/localization/planning.
    world_frame_id: "world"
    map_frame_id: "map"
    # HH_260623 - Flatten Lanelet2 marker altitude to the 2D planning ground plane so RViz overlays align with robot/path data.
    align_z_to_ground: true

    # Lane-direction marker styling (RViz visualization only).
    dir_body_scale: 0.55
    dir_head_scale: 0.35
    dir_width_scale: 0.18
    # Number of centerline points skipped between arrow markers.
    dir_stride: 30
    # HH_260625: Publish the GNSS/localization neighborhood first; delay the
    # full RViz marker build so startup planning does not compete with full-map rendering.
    progressive_visualization_enable: true
    progressive_visualization_radius_m: 80.0
    progressive_visualization_full_delay_s: 180.0
    progressive_visualization_pose_topic: "/sensing/gnss/pose"
    # HH_260625: Fallback keeps RViz local-first working when GNSS pose is quiet.
    # Empty local renders are ignored in code, so a startup (0,0) pose cannot lock the map.
    progressive_visualization_fallback_pose_topic: "/localization/pose"
    progressive_visualization_lightweight_local: true
    progressive_visualization_lightweight_full: true
    debug_timing: true

    # 0 keeps one-shot static marker publish; transient_local handles late RViz subscribers.
    visualization_republish_period_s: 0.0
