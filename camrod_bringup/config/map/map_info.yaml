# Shared map reference parameters for map/localization/planning modules.
# This file is the single source of truth for map path + origin offsets.
/**:
  ros__parameters:
    # Lanelet2 OSM path for the active camping-site (park) map.
    # Use an absolute path so bringup/module launches load the same file.
    # c_track backup: "/home/nvidia/camrod_ws/src/lanelet2_maps_(c_track_test_moved).osm" (map_profile: copy_c_track)
    # HH_260713 - OSM geometry (not the shared origin) was moved so B2 aligns
    # with the stationary GNSS mean measured inside B2 at 16:08 KST.
    map_path: "/home/nvidia/camrod_ws/src/lanelet2_maps_(copy_park_moved).osm"
    map_profile: "copy_park_moved"

    # WGS84 origin used by LocalCartesian projectors.
    # Camping-site (park) map origin (from map_projector_info (copy_park).yaml).
    # c_track backup: 36.729291686 / 127.442957302 / 0.0
    offset_lat: 36.8435737
    offset_lon: 128.0925646
    # Field GNSS sample kept for reference; this is not the projector origin.
    #offset_alt: 0.0
    #offset_lat: 36.843619 # 36.843619
    #offset_lon: 128.092549 # 128.092549
    offset_alt: 0.0

    # Optional UTM-origin metadata for downstream tools that prefer metric origin fields.
    # EPSG:32652 coordinates of offset_lat/offset_lon. These are metadata for
    # the optional UTM input path; the active NavSatFix path uses LLH->ECEF->ENU.
    offset_utm_easting: 419093.912713
    offset_utm_northing: 4077903.915218
    offset_utm_alt: 0.0

    # Optional map yaw correction (degrees).
    # If enabled, lat/lon->xy conversion can be rotated by this offset.
    yaw_offset_deg: 0.0
    rotate_latlon_xy_by_yaw_offset: true

    # Canonical frame IDs shared by map/localization/planning.
    world_frame_id: "world"
    map_frame_id: "map"
    # HH_260623 - Flatten Lanelet2 marker altitude to the 2D planning ground plane so RViz overlays align with robot/path data.
    align_z_to_ground: true

    # Lane-direction marker styling (RViz visualization only).
    dir_body_scale: 0.55
    dir_head_scale: 0.35
    dir_width_scale: 0.18
    # Number of centerline points skipped between arrow markers.
    dir_stride: 30
    # HH_260629: Publish a lightweight full-map overview immediately so RViz is
    # never blank; detailed centerline/direction markers are still delayed.
    progressive_visualization_enable: true
    progressive_visualization_radius_m: 120.0
    progressive_visualization_full_delay_s: 0.0
    # HH_260629: Use map-frame localization pose for local-first visualization.
    # Raw GNSS pose can be WGS84/driver-local before map projection and filter
    # every lanelet out of the local marker window.
    progressive_visualization_pose_topic: "/localization/pose"
    progressive_visualization_fallback_pose_topic: ""
    progressive_visualization_lightweight_local: false
    progressive_visualization_lightweight_full: true
    # HH_260707 - Keep expensive full-map direction/id/semantic markers opt-in.
    # The lightweight full map still appears immediately; detailed full markers
    # took ~54 s on full real-sensor bringup and starved planning startup.
    progressive_visualization_publish_detailed_full: false
    progressive_visualization_detailed_full_delay_s: 30.0
    # Keep direction/ID/semantic markers, but skip raw OSM point spheres by default.
    visualization_publish_raw_points: false
    debug_timing: true

    # HH_260629: Republish cached markers so RViz recovers even if it misses the
    # transient-local sample during display reloads or launch restarts.
    visualization_republish_period_s: 5.0
