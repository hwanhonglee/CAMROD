# 2026-01-30 Update map path/origin for lanelet2_maps.osm.
# HH_260112 Align node parameter keys with /map namespace + short names.
/**:
  ros__parameters:
    # Prefer launch-level override (bringup or package launch).
    # Keep empty here if the actual OSM lives outside this package.
    map_path: ""

    # HH_260114 WGS84 origin used as LocalCartesian projector reference.

    # 52S-CF60, Park - VMB
    # offset_lat: 36.8436194
    # offset_lon: 128.0925490
    # offset_alt: 299.425

    # 52S-CF0, C-track - VMB
    # offset_lat: 36.12491471
    # offset_lon: 126.77473954
    # offset_alt: 84.0

    # 52S-CF60, C-track - VMB
    # Degree LLH: 36.7292921, 127.4429577
    # UTM (meter): 52S 360965.99E 4065972.49N
    # MGRS: 52SCF6096565972
    offset_lat: 36.7292921
    offset_lon: 127.4429577
    offset_alt: 84.0

    offset_utm_easting: 360965.99
    offset_utm_northing: 4065972.49
    offset_utm_alt: 84.0

    yaw_offset_deg: 0.0
    rotate_latlon_xy_by_yaw_offset: true

    world_frame_id: "world"
    map_frame_id: "map"

    # HH_260103 arrow scaling knobs (lanelet direction markers)
    dir_body_scale: 0.55
    dir_head_scale: 0.35
    dir_width_scale: 0.18
    dir_stride: 30
