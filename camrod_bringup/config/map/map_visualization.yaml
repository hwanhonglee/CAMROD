/map/nav2_costmap_debug_marker:
  ros__parameters:
    # 2026-03-05: This node visualizes Nav2 master costmap (debug only).
    # Final user-facing combined marker is /map/cost_grid/inflation_markers
    # from marker_array_aggregator_node.
    grid_topic: "/planning/global_costmap/costmap"
    marker_topic: "/map/cost_grid/inflation_nav2_markers"
    marker_scale: 0.1
    # 2026-02-26: Show full safety gradient (low=blue/green, high=red) on drivable area.
    # Unknown cells remain hidden via show_unknown=false.
    min_value: 0
    max_value: 100
    alpha: 0.18
    z_offset: 0.05
    # 2026-02-27: Keep CUBE_LIST cells visually inside lane boundaries.
    cell_scale_ratio: 0.60
    palette: "safety"
    show_unknown: false
    min_publish_period_sec: 0.20
    sample_stride: 2
    republish_period_sec: 0.0

/map/cost_grid_multi_marker:
  ros__parameters:
    # Aggregated marker conversion for lanelet/lidar/radar near-cost grids.
    # Replaces three separate cost_field_marker_node instances.
    grid_topics:
      - "/map/cost_grid/lanelet"
      - "/sensing/lidar/near_cost_grid"
      - "/sensing/radar/near_cost_grid"
    marker_topics:
      - "/map/cost_grid/lanelet_markers"
      - "/map/cost_grid/lidar_markers"
      - "/map/cost_grid/radar_markers"
    marker_scales: [0.08, 0.08, 0.10]
    min_values: [0, 0, 0]
    max_values: [100, 100, 100]
    alphas: [0.12, 0.40, 0.42]
    z_offsets: [0.02, 0.035, 0.04]
    cell_scale_ratios: [0.70, 0.70, 0.70]
    palettes:
      - "pastel_blue_red"
      - "pastel_green_red"
      - "pastel_orange_red"
    show_unknowns: [false, false, false]
    grid_qos_transient_locals: [true, true, true]
    sample_strides: [1, 2, 2]
    min_publish_period_secs: [0.02, 0.03, 0.03]
    republish_period_secs: [0.20, 0.12, 0.12]
    stale_timeout_secs: [0.0, 0.0, 0.0]
    clear_on_empty_grids: [true, true, true]

/map/lanelet_cost_field_visualizer:
  ros__parameters:
    map_frame_id: "map"
    projector_type: "local_cartesian"
    max_draw_distance: 0.0
    percentile_clip: 0.95
    weights.distance: 1.0
    weights.curvature: 0.5
    weights.lane_preference: 0.0
    output_topic: "/map/cost_grid/lanelet_field_markers"
