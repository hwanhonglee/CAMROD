# Layout: 1) body/kinematics, 2) ground offset + base pose, 3) IMU, 4) GNSS, 5) LiDAR, 6) camera, 7) radar mount poses.
/**:
  ros__parameters:
    # =========================================================================
    # 1. ROBOT BODY AND KINEMATICS
    # =========================================================================
    robot:
      wheelbase: 0.886          # Distance between front and rear axle centers [m].
      # HH_260803 - robot_center_link is the front/rear axle midpoint. The legacy
      # robot_base_link remains the rear-axle center for compatibility.
      center_offset_from_rear_axle: 0.443  # wheelbase / 2; rear axle -> robot center [m].
      track_width: 1.07       # Body lateral envelope used until wheel-center track is measured [m].
      length: 1.49160         # Physical vehicle body length: front 0.75837 + rear 0.73323 [m].
      width: 1.07000          # Physical vehicle body width: left 0.53505 + right 0.53495 [m].
      height: 1.09463         # Physical vehicle body height [m].
      # HH_260803 - Same measured body, expressed from robot_center_link.
      # Conversion: center_x = rear_axle_x - 0.443 m.
      body_extents:
        front: 0.75837        # Was 1.20137 m from rear-axle robot_base_link.
        rear: 0.73323         # Was 0.29023 m behind rear-axle robot_base_link.
        left: 0.53505         # Unchanged lateral extent from robot_center_link [m].
        right: 0.53495        # Unchanged lateral extent from robot_center_link [m].
        top_z: 0.94188        # Unchanged top Z from robot_center_link [m].
        bottom_z: -0.15275    # Unchanged bottom Z from robot_center_link [m].
        # HH_260805 - Keep one 0.05 m planning clearance around all four body sides.
        planning_margin: 0.05          # Front/rear planning clearance [m].
        planning_lateral_margin: 0.05  # Left/right planning clearance [m].
      # HH_260623 - Updated from measured wheel radius 152.75 mm.
      wheel_radius: 0.15275   # Effective rolling radius used by kinematic helpers [m].
      encoder_resolution: 2048  # Encoder ticks per wheel revolution.
      drive_type: "ackermann" # Platform drive model identifier consumed by downstream logic.

    # =========================================================================
    # 2. GROUND OFFSET AND BASE POSE
    # =========================================================================
    ground_z_offset: 0.0      # HH_260623 - 2D planning/RViz ground fallback; do not inject the old 5.3 m altitude offset.

    base_pose:
      x: 0.0                  # Initial base position X in map/world frame [m].
      y: 0.0                  # Initial base position Y in map/world frame [m].
      z: 0.0                  # Initial base position Z in map/world frame [m].
      roll: 0.0               # Initial base roll angle [deg].
      pitch: 0.0              # Initial base pitch angle [deg].
      yaw: 0.0                # Initial base yaw angle [deg].

    # =========================================================================
    # 3. IMU MOUNT POSE
    # =========================================================================
    imu:
      # HH_260803 - Was x=1.131 m from the rear axle; physical mount is unchanged.
      x: 0.688                # 1.131 - 0.443, relative to robot_center_link [m].
      y: 0.0                  # IMU mount Y offset from sensor_kit_base_link [m].
      z: 0.756                # IMU mount Z offset from sensor_kit_base_link [m].
      roll: 0.0               # IMU mount roll offset [deg].
      pitch: 0.0              # IMU mount pitch offset [deg].
      # HH_260413: Align IMU frame to robot_center_link heading (mount calibration).
      yaw: 0.0                # IMU mount yaw offset [deg].

    # =========================================================================
    # 4. GNSS ANTENNA MOUNT POSE
    # =========================================================================
    gnss:
      # HH_260805 - Treat the GNSS position solution as robot-center until the
      # physical antenna lever arm is surveyed; pose_verified remains false.
      x: 0.0                  # Temporary robot_center_link assumption [m].
      y: 0.0                  # GNSS antenna Y offset from sensor_kit_base_link [m].
      z: 0.0                  # GNSS antenna Z offset from sensor_kit_base_link [m].
      roll: 0.0               # GNSS antenna roll offset [deg].
      pitch: 0.0              # GNSS antenna pitch offset [deg].
      yaw: 0.0                # GNSS antenna yaw offset [deg].

    # =========================================================================
    # 5. LIDAR MOUNT POSE
    # =========================================================================
    lidar:
      # HH_260803 - Was x=1.20636 m from the rear axle; physical mount is unchanged.
      x: 0.76336              # 1.20636 - 0.443, relative to robot_center_link [m].
      y: 0.0                  # LiDAR mount Y offset from sensor_kit_base_link [m].
      z: 0.59538              # LiDAR mount Z offset from sensor_kit_base_link [m].
      roll: 0.0               # LiDAR mount roll offset [deg].
      pitch: 0.0              # LiDAR mount pitch offset [deg].
      yaw: 0.0                # LiDAR mount yaw offset [deg].

    # =========================================================================
    # 6. CAMERA MOUNT POSES (FRONT + REAR)
    # =========================================================================
    # HH_260528: Dual econ camera mount poses (front + rear), mirroring radar nested structure.
    # Measured from sensor_kit_base_link (coincident with robot_center_link).
    # Body → optical frame rotation is handled inside econ_camera_link xacro macro (RPY=-π/2,0,-π/2).
    camera:
      front:
        # HH_260803 - Was x=1.20637 m from the rear axle; mount is unchanged.
        x: 0.76337            # 1.20637 - 0.443, relative to robot_center_link [m].
        y: 0.0                # Front camera Y offset from sensor_kit_base_link [m].
        z: 0.49568            # Front camera Z offset from sensor_kit_base_link [m].
        roll: 0.0             # Front camera roll offset [deg].
        pitch: 0.0            # Front camera pitch offset [deg].
        yaw: 0.0              # Front camera yaw offset [deg] — facing forward.
      rear:
        # HH_260803 - Was x=-0.17633 m from the rear axle; mount is unchanged.
        x: -0.61933           # -0.17633 - 0.443, relative to robot_center_link [m].
        y: 0.0                # Rear camera Y offset from sensor_kit_base_link [m].
        z: 0.30013            # Rear camera Z offset from sensor_kit_base_link [m].
        roll: 0.0             # Rear camera roll offset [deg].
        pitch: 0.0            # Rear camera pitch offset [deg].
        yaw: 180.0            # Rear camera yaw offset [deg] — facing rear.

    # =========================================================================
    # 7. RADAR MOUNT POSES (7 CHANNELS)
    # =========================================================================
    # HH_260623 - Canonical radar TF keys match camrod_sensing 7-channel radar frame_ids.
    # HH_260803 - X values were shifted by -0.443 m from the rear-axle reference.
    radar:
      front1:
        x: 0.62787            # Was 1.07087 m from rear-axle robot_base_link.
        y: -0.11005           # Front radar #1 Y offset from sensor_kit_base_link [m].
        z: 0.33378            # Front radar #1 Z offset from sensor_kit_base_link [m].
        roll: 0.0             # Front radar #1 roll offset [deg].
        pitch: 0.0            # Front radar #1 pitch offset [deg].
        yaw: 0.0              # Front radar #1 yaw offset [deg].
      front2:
        x: 0.62787            # Was 1.07087 m from rear-axle robot_base_link.
        y: 0.11005            # Front radar #2 Y offset from sensor_kit_base_link [m].
        z: 0.33378            # Front radar #2 Z offset from sensor_kit_base_link [m].
        roll: 0.0             # Front radar #2 roll offset [deg].
        pitch: 0.0            # Front radar #2 pitch offset [deg].
        yaw: 0.0              # Front radar #2 yaw offset [deg].
      left1:
        x: 0.29188            # Was 0.73488 m from rear-axle robot_base_link.
        y: 0.41005            # Left radar #1 Y offset from sensor_kit_base_link [m].
        z: 0.29013            # Left radar #1 Z offset from sensor_kit_base_link [m].
        roll: 0.0             # Left radar #1 roll offset [deg].
        pitch: 0.0            # Left radar #1 pitch offset [deg].
        yaw: 90.0             # Left radar #1 yaw offset [deg].
      left2:
        x: -0.28334           # Was 0.15966 m from rear-axle robot_base_link.
        y: 0.41005            # Left radar #2 Y offset from sensor_kit_base_link [m].
        z: 0.29013            # Left radar #2 Z offset from sensor_kit_base_link [m].
        roll: 0.0             # Left radar #2 roll offset [deg].
        pitch: 0.0            # Left radar #2 pitch offset [deg].
        yaw: 90.0             # Left radar #2 yaw offset [deg].
      right1:
        x: 0.29188            # Was 0.73488 m from rear-axle robot_base_link.
        y: -0.41005           # Right radar #1 Y offset from sensor_kit_base_link [m].
        z: 0.29013            # Right radar #1 Z offset from sensor_kit_base_link [m].
        roll: 0.0             # Right radar #1 roll offset [deg].
        pitch: 0.0            # Right radar #1 pitch offset [deg].
        yaw: -90.0            # Right radar #1 yaw offset [deg].
      right2:
        x: -0.28334           # Was 0.15966 m from rear-axle robot_base_link.
        y: -0.41005           # Right radar #2 Y offset from sensor_kit_base_link [m].
        z: 0.29013            # Right radar #2 Z offset from sensor_kit_base_link [m].
        roll: 0.0             # Right radar #2 roll offset [deg].
        pitch: 0.0            # Right radar #2 pitch offset [deg].
        yaw: -90.0            # Right radar #2 yaw offset [deg].
      rear:
        x: -0.61733           # Was -0.17433 m from rear-axle robot_base_link.
        y: 0.0                # Rear radar Y offset from sensor_kit_base_link [m].
        z: 0.33978            # Rear radar Z offset from sensor_kit_base_link [m].
        roll: 0.0             # Rear radar roll offset [deg].
        pitch: 0.0            # Rear radar pitch offset [deg].
        yaw: 180.0            # Rear radar yaw offset [deg].
