/**:
  ros__parameters:
    # --- Status output ---
    publish_localization_status: false
    localization_status_topic: "/localization/status"

    # --------------------------------------------------------------------------
    # NavSatFix -> Pose / PoseWithCovariance
    # --------------------------------------------------------------------------
    enable_navsat_to_pose: true
    navsat_topic: "/sensing/gnss/ublox_gps_node/fix"
    # HH_260527: Optional metric pose sources (already in meter XY frame).
    # Leave empty when using only NavSatFix.
    utm_pose_topic: ""
    gnss_pose_topic: "/sensing/gnss/pose"
    # HH_260720 - Standard ROS pose mirror for visualization consumers only.
    gnss_pose_ros_topic: "/sensing/gnss/pose_ros"
    gnss_pose_cov_topic: "/sensing/gnss/pose_with_covariance"
    # HH_260720 - Explicit standard-ROS mirror consumed only by robot_localization.
    gnss_pose_cov_ros_topic: "/sensing/gnss/pose_with_covariance_ros"
    map_frame_id: "map"
    # HH_260806 - NavSatFix is referenced to the left antenna at body +Y 0.45 m.
    # Rotate that lever arm with fresh dual-GNSS yaw, then subtract it so every
    # published GNSS pose represents robot_center_link instead of the antenna.
    enable_gnss_lever_arm_correction: true
    gnss_antenna_offset_x_m: 0.0
    gnss_antenna_offset_y_m: 0.45
    gnss_lever_arm_require_fresh_heading: true
    # HH_260807 - During a brief receiver-heading gap, use a time-aligned EKF
    # yaw delta only to rotate the antenna lever arm. Fallback requires a prior
    # valid dual-GNSS anchor, expires after 0.5 s, and never makes GNSS yaw valid.
    enable_gnss_lever_arm_ekf_heading_fallback: true
    gnss_lever_arm_fallback_anchor_max_age_s: 0.5
    gnss_lever_arm_fallback_history_s: 5.0
    gnss_lever_arm_fallback_match_tolerance_s: 0.2
    gnss_lever_arm_fallback_max_ekf_yaw_covariance: 1.0
    publish_gnss_covariance: true
    # HH_260527: navsat_covariance_source options:
    #   navsat: use NavSatFix covariance (with floor clamp)
    #   fixed: use pose_covariance_diagonal fixed values
    navsat_covariance_source: navsat
    # RTK fixed covariance can be much smaller than the vehicle-level error.
    # HH_260806 - Keep the 0.1 m^2 XY floor paired with the current 1.0 m^2
    # initial XY covariance (scalar K_init about 0.91) and the EKF 3-sigma
    # position gate. Do not retune this from the 20 Hz output-rate change alone.
    # HH_260526: tuned 0.04 -> 0.2 -> 0.1; 0.04 was unstable and 0.2 attached slowly.
    gnss_covariance_floor_xy: 0.1
    gnss_covariance_floor_z: 0.25

    # --- Dual-antenna GNSS heading ---
    # HH_260611: Enable dual-antenna GNSS heading from ublox_gps NAV-RELPOSNED.
    # HH_260604: COG heading removed — dual-antenna moving-baseline RTK is the sole heading source.
    enable_gnss_heading: true
    gnss_heading_topic: "/sensing/gnss/navheading"
    gnss_heading_timeout_s: 1.0
    # HH_260625: Live C-track measurement showed GNSS/localization yaw aligned
    # with each other but ~85 deg clockwise from the lanelet heading. Correct
    # only the dual-antenna heading here; keep map XY/yaw offsets unchanged.
    gnss_heading_yaw_offset_deg: -90.0
    gnss_heading_covariance_floor_deg: 1.0
    gnss_heading_max_covariance: 100.0
    gnss_heading_unavailable_covariance: 1000000.0
    hold_last_gnss_heading: true

    # --- Position jump rejection ---
    max_position_jump_m: 8.0
    jump_reject_max_speed_mps: 20.0
    jump_reject_reset_s: 2.0

    # HH_260527: Metric source offsets (subtracted from incoming XY/Z).
    offset_utm_easting: 0.0
    offset_utm_northing: 0.0
    offset_utm_alt: 0.0

    pose_covariance_diagonal: [1.0, 1.0, 1.0, 999.0, 999.0, 1.0]

    # --------------------------------------------------------------------------
    # Odometry -> Pose / PoseWithCovariance
    # --------------------------------------------------------------------------
    enable_odometry_to_pose: true
    # HH_260720 - Convert the EKF standard boundary into generated primary filter topics.
    odom_input_topic: "/localization/primary/odometry_ros"
    odom_output_topic: "/localization/primary/odometry"
    odom_pose_topic: "/localization/primary/pose"
    odom_pose_cov_topic: "/localization/primary/pose_with_covariance"
    # HH_260410: Publish fused localization pose in map frame for map-based planning.
    odom_output_frame_id: "map"

    # --------------------------------------------------------------------------
    # Wheel input -> unified wheel odometry
    # --------------------------------------------------------------------------
    enable_wheel_odometry_bridge: true
    # HH_260410: Primary wheel source is platform status odometry.
    wheel_input_topic: "/platform/status/odometry"
    # HH_260527: wheel_input_type options:
    #   nav_odom: nav_msgs/Odometry input at an external boundary
    #   avg_odom: avg_msgs/AvgOdometry input
    #   twist: avg_msgs/AvgTwistStamped input
    # HH_260720 - Platform publishes the generated AvgOdometry internal contract.
    wheel_input_type: "avg_odom"
    # HH_260410: /rmp401/odom is fallback-only when primary stream is stale/missing.
    wheel_fallback_input_topic: "/rmp401/odom"
    # HH_260527: wheel_fallback_input_type options:
    #   nav_odom: nav_msgs/Odometry input at an external boundary
    #   avg_odom: avg_msgs/AvgOdometry input
    #   twist: avg_msgs/AvgTwistStamped input
    wheel_fallback_input_type: "nav_odom"
    wheel_primary_timeout_s: 0.7
    # HH_260720 - Generated internal wheel stream and explicit robot_localization mirror.
    wheel_output_topic: "/localization/input/wheel_odometry"
    wheel_nav_output_topic: "/localization/input/wheel_odometry_ros"
    wheel_odom_frame_id: "odom"
    # HH_260803 - Normalize hardware and fallback wheel odometry to axle midpoint.
    wheel_base_frame_id: "robot_center_link"
