/**:
  ros__parameters:
    publish_localization_status: false
    localization_status_topic: "/localization/status"

    # --------------------------------------------------------------------------
    # NavSatFix -> Pose / PoseWithCovariance
    # --------------------------------------------------------------------------
    enable_navsat_to_pose: true
    navsat_topic: "/sensing/gnss/ublox_gps_node/fix"
    raw_pose_topic: ""
    utm_pose_topic: ""
    gnss_pose_topic: "/sensing/gnss/pose"
    gnss_pose_cov_topic: "/sensing/gnss/pose_with_covariance"
    map_frame_id: "map"
    publish_gnss_covariance: true
    # HH_260415: Use NavSat covariance but clamp to floor values to reduce ESKF GNSS reject bursts.
    use_navsat_position_covariance: true
    # HH_260415: RTK environment keeps very small covariance; floor is only a numerical guard.
    gnss_covariance_floor_xy: 1.0e-6
    gnss_covariance_floor_z: 1.0e-4

    max_position_jump_m: 8.0
    jump_reject_max_speed_mps: 20.0
    jump_reject_reset_sec: 2.0

    # --------------------------------------------------------------------------
    # Pose -> PoseWithCovariance
    # --------------------------------------------------------------------------
    enable_pose_cov_bridge: true
    pose_cov_input_topic: "/sensing/gnss/pose"
    pose_cov_output_topic: "/sensing/gnss/pose_with_covariance"
    pose_covariance_diagonal: [1.0, 1.0, 1.0, 999.0, 999.0, 1.0]

    # --------------------------------------------------------------------------
    # Odometry -> Pose / PoseWithCovariance
    # --------------------------------------------------------------------------
    enable_odometry_to_pose: true
    odom_input_topic: "/localization/odometry/filtered"
    odom_pose_topic: "/localization/pose"
    odom_pose_cov_topic: "/localization/pose_with_covariance"
    # HH_260410: Publish fused localization pose in map frame for map-based planning.
    odom_output_frame_id: "map"

    # --------------------------------------------------------------------------
    # Wheel input -> unified wheel odometry
    # --------------------------------------------------------------------------
    enable_wheel_odometry_bridge: true
    # HH_260410: Primary wheel source is platform status odometry.
    wheel_input_topic: "/platform/status/odometry"
    wheel_input_type: "nav_odom"
    # HH_260410: /rmp401/odom is fallback-only when primary stream is stale/missing.
    wheel_fallback_input_topic: "/rmp401/odom"
    wheel_fallback_input_type: "nav_odom"
    wheel_primary_timeout_sec: 0.7
    # HH_260410: Unified wheel odometry output consumed by EKF/ESKF.
    wheel_output_topic: "/platform/status/wheel_odometry"
    wheel_nav_output_topic: "/platform/wheel/nav_odometry"
    wheel_odom_frame_id: "odom"
    wheel_base_frame_id: "robot_base_link"
