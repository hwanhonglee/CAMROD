# HH_260630 - Graph readiness manifest for full CAMROD bringup.
# Format: "topic|ros_type|min_publishers"; leave ros_type empty to check graph presence only.
/system/system_checker:
  ros__parameters:
    check_period_s: 1.0
    startup_grace_s: 30.0

    required_modules:
      - map
      - sensing
      - localization
      - perception
      - planning
      - control
      - platform

    # HH_260720 - Exactly one final parking controller from camrod_control must be active.
    required_alternative_groups:
      - final_parking

    final_parking:
      alternatives:
        - reverse_parking_controller
        - apriltag_parking_controller

    # Package: camrod_map
    # Nodes publish lanelet visualization and the lane-boundary cost grid used by planning.
    map:
      required_nodes:
        - /map/lanelet_map_provider
        - /map/lanelet_boundary_cost_grid
      required_topics:
        # lanelet2_map_node -> RViz lanelet/direction/id/semantic markers.
        - "/map/markers|visualization_msgs/msg/MarkerArray|1"
        # lanelet_boundary_cost_grid -> Nav2/cmd_vel lane constraint grid.
        # HH_260720 - Check the generated CAMROD grid contract after the map boundary.
        - "/map/cost_grid/lanelet|avg_msgs/msg/AvgOccupancyGrid|1"

    # Package: camrod_sensing
    # Nodes publish hardware sensor streams plus fused cost grids consumed by localization/planning.
    sensing:
      required_nodes:
        # HH_260729 - Hardware acquisition nodes are intentionally not pinned
        # here.  Each enable_*:=false path publishes the exact same typed input
        # contract plus a dummy_active heartbeat, and the dedicated checker
        # reports that source as DUMMY/WARN.  Requiring a physical driver name
        # would turn a deliberate hardware-free test into a graph error.
        - /sensing/imu/platform_velocity_converter
        - /sensing/lidar/lidar_cost_grid
        - /sensing/radar/radar_cost_grid
        - /sensing/inflation_cost_grid
      required_topics:
        # Real drivers and their mutually-exclusive disabled-hardware dummies
        # publish these common contracts.  Sensor checkers expose source detail.
        - "/sensing/gnss/ublox_gps_node/fix|sensor_msgs/msg/NavSatFix|1"
        - "/sensing/gnss/navheading|sensor_msgs/msg/Imu|1"
        # platform_velocity_converter stays active for either real or stationary
        # dummy data_ros input and owns these generated Avg message contracts.
        - "/sensing/imu/data|avg_msgs/msg/AvgImu|1"
        - "/sensing/platform_velocity_converter/twist_with_covariance|avg_msgs/msg/AvgTwistWithCovarianceStamped|1"
        # A disabled LiDAR emits valid empty clouds rather than fake obstacles.
        - "/sensing/lidar/vanjee/points_raw|sensor_msgs/msg/PointCloud2|1"
        - "/sensing/lidar/points_filtered|sensor_msgs/msg/PointCloud2|1"
        - "/sensing/cost_grid/lidar|avg_msgs/msg/AvgOccupancyGrid|1"
        # HH_260729 - All seven physical SEN0592 channels are active.
        - "/sensing/radar/front1/range|avg_msgs/msg/AvgRange|1"
        - "/sensing/radar/front2/range|avg_msgs/msg/AvgRange|1"
        - "/sensing/radar/left1/range|avg_msgs/msg/AvgRange|1"
        - "/sensing/radar/left2/range|avg_msgs/msg/AvgRange|1"
        - "/sensing/radar/right1/range|avg_msgs/msg/AvgRange|1"
        - "/sensing/radar/right2/range|avg_msgs/msg/AvgRange|1"
        - "/sensing/radar/rear/range|avg_msgs/msg/AvgRange|1"
        - "/sensing/cost_grid/radar|avg_msgs/msg/AvgOccupancyGrid|1"
        # camera.launch.py -> front compressed stream and rear raw stream.
        - "/sensing/camera/econ_front/image_rect/compressed|sensor_msgs/msg/CompressedImage|1"
        - "/sensing/camera/econ_front/camera_info|sensor_msgs/msg/CameraInfo|1"
        - "/sensing/camera/econ_rear/image_raw|sensor_msgs/msg/Image|1"
        - "/sensing/camera/econ_rear/camera_info|sensor_msgs/msg/CameraInfo|1"
        # inflation_cost_grid_node -> merged static/dynamic safety grid.
        - "/planning/cost_grid/inflation|avg_msgs/msg/AvgOccupancyGrid|1"

    # Package: camrod_localization
    # Nodes adapt GNSS/wheel inputs, run the selected filter, select pose, and monitor mode.
    localization:
      required_nodes:
        - /localization/input_adapter
        - /localization/ekf_filter
        - /localization/pose_selector
        - /localization/monitor
        - /localization/map_helper
      required_topics:
        # localization_input_adapter_node -> GNSS pose and wheel odometry bridges.
        # HH_260720 - Localization's internal inputs and selected outputs use generated messages.
        # HH_260729 - GNSS-disabled dummy data is STATUS_NO_FIX and must not
        # produce a localization pose.  Its dedicated sensor/localization
        # checkers report DUMMY/WARN, so graph readiness only requires the wheel
        # bridge and public localization state here.
        - "/localization/input/wheel_odometry|avg_msgs/msg/AvgOdometry|1"
        # robot_localization/camrod selector -> public localization outputs.
        - "/localization/pose|avg_msgs/msg/AvgPoseStamped|1"
        - "/localization/pose_with_covariance|avg_msgs/msg/AvgPoseWithCovarianceStamped|1"
        - "/localization/odometry|avg_msgs/msg/AvgOdometry|1"
        # localization_monitor_node -> mode/state used by cmd_vel gates and UI diagnostics.
        - "/localization/mode|avg_msgs/msg/AvgLocalizationMode|1"
        - "/localization/state|avg_msgs/msg/AvgBool|1"
        - "/localization/state/degraded|avg_msgs/msg/AvgBool|1"
        - "/localization/state/dr_timeout|avg_msgs/msg/AvgBool|1"
        # localization_map_helper_node -> lanelet-aligned pose for planning snap tools.
        - "/localization/centerline_pose|avg_msgs/msg/AvgPoseWithCovarianceStamped|1"

    # Package: camrod_perception
    # LiDAR obstacle detection is the always-on perception backbone; camera fusion is checked by dedicated diagnostics when enabled.
    perception:
      required_nodes:
        - /perception/obstacle_lidar
      required_topics:
        - "/perception/lidar/bboxes|visualization_msgs/msg/MarkerArray|1"

    # Package: camrod_planning
    # Nodes own lanelet snapping, Nav2, local path extraction, and semantic mission state.
    planning:
      required_nodes:
        - /planning/goal_snapper
        - /planning/centerline_snapper
        - /planning/planner_server
        - /planning/controller_server
        - /planning/bt_navigator
        - /planning/behavior_server
        - /planning/smoother_server
        - /planning/lifecycle_manager_planning
        - /planning/local_path_extractor
        - /planning/planning_state_machine
        - /planning/path_visualizer
        - /planning/obstacle_replan_monitor
      required_topics:
        # snapper tools -> map-frame goal and lanelet pose contracts.
        # HH_260720 - Diagnose the internal Avg pose/path topics, not their Nav2/RViz mirrors.
        - "/planning/goal_pose_snapped|avg_msgs/msg/AvgPoseStamped|1"
        - "/planning/lanelet_pose|avg_msgs/msg/AvgPoseStamped|1"
        # local_path_extractor -> stable map-fixed path slice used by RViz and safety gates.
        - "/planning/local_path|avg_msgs/msg/AvgPath|1"
        # planning_state_machine_node -> semantic mission state for parking/UI.
        - "/planning/state_machine/state|avg_msgs/msg/PlanningState|1"
        - "/planning/state_machine/mission_source|avg_msgs/msg/PlanningMissionKey|1"
        - "/planning/state_machine/scenario_id|avg_msgs/msg/PlanningScenario|1"
    # Package: camrod_control
    # HH_260720 - Control owns command gating plus campsite/drop-zone maneuvers.
    control:
      required_nodes:
        - /control/cmd_vel_safety_gate
        - /control/camping_site_maneuver_controller
        - /control/drop_zone_maneuver_controller
      required_topics:
        # HH_260720 - Control owns generated velocity and gate-state contracts.
        - "/control/cmd_vel_raw|avg_msgs/msg/AvgTwist|1"
        - "/control/cmd_vel|avg_msgs/msg/AvgTwist|1"
        - "/control/command_enabled|avg_msgs/msg/AvgBool|1"
        - "/control/cmd_vel_safety_gate/status|avg_msgs/msg/ModuleState|1"
        # HH_260720 - Check the controller's canonical status topic.
        - "/control/camping_site_maneuver_controller/status|avg_msgs/msg/ModuleState|1"
        - "/control/drop_zone_maneuver_controller/status|avg_msgs/msg/ModuleState|1"

    # HH_260720 - camrod_control reverse-parking method.
    reverse_parking_controller:
      required_nodes:
        - /parking/reverse_parking_controller
      required_topics:
        - "/parking/reverse_parking_controller/status|avg_msgs/msg/ModuleState|1"

    # HH_260720 - camrod_control AprilTag parking controller and perception input.
    apriltag_parking_controller:
      required_nodes:
        - /parking/apriltag_parking_controller
        - /perception/apriltag_parking_detector
      required_topics:
        - "/parking/apriltag_parking_controller/status|avg_msgs/msg/ModuleState|1"
        - "/perception/apriltag_parking_detector/tag_pose|avg_msgs/msg/AvgAprilTagPose|1"

    # Package: camrod_platform + ranger_base
    # HH_260720 - Platform bridges hardware state; Ranger consumes /control/cmd_vel directly.
    platform:
      required_nodes:
        # HH_260729 - ranger_driver_enable:=false uses a mutually-exclusive,
        # non-drivable dummy CAN feedback source.  Keep readiness tied to the
        # normalized bridge contract rather than the physical driver name.
        - /ranger_platform_bridge
        - /platform/robot_visualization
      required_topics:
        # ranger_platform_bridge_node -> normalized platform state consumed by localization/planning/system.
        # HH_260720 - Child motion streams are generated; CAN safety/BMS fields live in one status.
        - "/platform/status/odometry|avg_msgs/msg/AvgOdometry|1"
        - "/platform/status/velocity|avg_msgs/msg/AvgTwistStamped|1"
        - "/platform/status/wheel|avg_msgs/msg/AvgTwistStamped|1"
        - "/platform/status|avg_msgs/msg/AvgPlatformStatus|1"
