/system/network_checker:
  ros__parameters:
    # HH_260617: Simulation does not require a physical WiFi interface.
    # Disable all network tasks so /system/status reflects planning/control health,
    # not the developer PC's wlan0 availability.
    interface: "wlan0"
    connection:
      enabled: false
    signal:
      enabled: false
      rssi_warn: -70.0
      rssi_error: -85.0
    quality:
      enabled: false
      drop_rate_warn: 1.0
      drop_rate_error: 5.0
