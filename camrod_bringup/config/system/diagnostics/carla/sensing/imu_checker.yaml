# Actual CARLA IMU actor relayed through the standard ROS sensor boundary.
/system/imu_checker:
  ros__parameters:
    publish_rate_hz: 1.0
    imu_names: ["main"]
    main:
      topic: "/sensing/imu/data"
      expected_hz: 2.0
      hz_warn_ratio: 0.7
      hz_error_ratio: 0.4
      stale_timeout_s: 3.0
      # CARLA's rigid-body contact solver emits non-physical one-sample
      # impulses at wheel/edge contacts.  Disable only magnitude classification
      # so those impulses cannot turn a recoverable ROUTE_SAFETY_HOLD into
      # planning ERROR_STOP.  Topic rate, stale and finite-value checks remain
      # active, and the CARLA collision actor is audited independently.
      accel_magnitude_warn: 0.0
      accel_magnitude_error: 0.0
