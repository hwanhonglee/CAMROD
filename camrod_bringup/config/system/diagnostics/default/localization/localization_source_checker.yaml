localization_source_checker:
  ros__parameters:
    publish_rate_hz: 1.0

    source_topic:    "/localization/pose_source"
    # pose_selector.yaml default label
    primary_source:  "primary_filter"
    fallback_source: "fallback_source"

    stale_timeout_s:      3.0    # 이 시간(초) 이상 메시지 없으면 STALE

    # 폴백 지속 시간 임계값
    fallback_warn_s:  10.0   # 폴백 > 이 값(초) → WARN
    fallback_error_s: 60.0   # 폴백 > 이 값(초) → ERROR

    # 최근 60초 내 소스 전환 횟수 임계값
    switch_warn:  3             # 전환 횟수 > 이 값 → WARN (불안정)
    switch_error: 10            # 전환 횟수 > 이 값 → ERROR (과도한 전환)
