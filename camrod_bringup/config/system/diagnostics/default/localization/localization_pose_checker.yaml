localization_pose_checker:
  ros__parameters:
    publish_rate: 1.0                                    # Diagnostic publish rate (Hz).

    pose_topic: "/localization/pose_with_covariance"     # Input topic monitored by this checker.

    expected_hz: 30.0          # Expected message update rate (Hz).
    hz_warn_ratio: 0.7         # WARN threshold for actual_hz/expected_hz ratio.
    hz_error_ratio: 0.4        # ERROR threshold for actual_hz/expected_hz ratio.
    stale_timeout: 1.0         # Mark STALE when no update is received within this duration (s).

    # Section note: tune thresholds based on expected stream behavior and safety policy.
    # trace = var_x + var_y = cov[0] + cov[7]
    cov_warn_threshold:  1.0   # WARN threshold for XY covariance trace.
    cov_error_threshold: 9.0   # ERROR threshold for XY covariance trace.

    # Section note: tune thresholds based on expected stream behavior and safety policy.
    max_jump_m: 2.0            # Maximum allowed inter-frame position jump before ERROR (m).
