# Localization GNSS Checker 설정 파일
# 로컬라이제이션 레벨: GNSS 데이터가 fusion에 쓸 수 있는 품질인가?

localization_gnss_checker:
  ros__parameters:
    publish_rate_hz: 1.0          # 진단 발행 주기 (Hz)

    # 모니터링할 GNSS 소스 이름 목록
    gnss_names: ["main"]

    main:
      topic: "/sensing/gnss/pose_with_covariance"
      expected_hz: 5.0         # 기대 수신 속도 (Hz)
      hz_warn_ratio: 0.8       # actual_hz / expected_hz 비율이 이 값 미만이면 WARN
      hz_error_ratio: 0.5      # actual_hz / expected_hz 비율이 이 값 미만이면 ERROR
      stale_timeout_s: 2.0       # 이 시간(초) 이상 메시지 없으면 STALE
      cov_warn_threshold: 4.0  # XY 위치 공분산 trace 상한 (WARN) ← σ ≈ 1.4m
      cov_error_threshold: 25.0 # XY 위치 공분산 trace 상한 (ERROR) ← σ ≈ 3.5m
      max_jump_m: 5.0          # 연속 수신 간 최대 위치 점프 거리 (ERROR)
