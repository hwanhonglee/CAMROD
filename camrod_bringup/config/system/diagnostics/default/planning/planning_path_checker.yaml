# Planning path checker configuration.
# Monitors path topics while navigation is active.
# Layout: 1) publish rate, 2) monitored topics, 3) per-path blocks.

planning_path_checker:
  ros__parameters:
    # =========================================================================
    # 1. PUBLISH RATE
    # =========================================================================
    publish_rate_hz: 1.0

    # =========================================================================
    # 2. MONITORED TOPICS
    # =========================================================================
    nav_status_topic: "/planning/navigate_to_pose/_action/status"

    path_names:
      - "global_path"
      - "local_path"

    # =========================================================================
    # 3. PER-PATH BLOCKS
    # =========================================================================
    global_path:
      # HH_260720 - Diagnose the generated path mirror; Nav2 owns the ROS boundary path.
      topic: "/planning/global_path_avg"
      # HH_260702 - Global paths are event-style outputs, not continuous streams.
      # A valid global path can remain unchanged for a whole route; local_path
      # freshness is the runtime control-path health signal.
      stale_timeout_s: 0.0
      min_points_warn: 5
      min_points_error: 2

    local_path:
      topic: "/planning/local_path"
      stale_timeout_s: 2.0
      min_points_warn: 8
      min_points_error: 3
