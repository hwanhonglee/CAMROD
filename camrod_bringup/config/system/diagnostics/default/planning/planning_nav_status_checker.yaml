planning_nav_status_checker:
  ros__parameters:
    publish_rate_hz: 1.0

    nav_status_topic: "/planning/navigate_to_pose/_action/status"

    # HH_260702 - Action status freshness is advisory. Path/state/lifecycle
    # checkers are the motion-health authority, so a quiet status topic must
    # not raise SYSTEM ERROR while the robot is driving normally.
    # 0.0 disables freshness timeout; abort frequency is still checked.
    stale_timeout_s: 0.0
    idle_ok_without_status: true
    terminal_status_stale_ok: true

    # HH_260724 - Site maneuver phases intentionally cancel Nav2; do not raise system WARN for that handoff.
    service_state_topic: "/service/state"
    suppress_abort_during_service_maneuver: true
    # HH_260810 - RETURNING_TO_DROP_ZONE starts with a controller-owned Nav2
    # handoff. Suppress only that transition; later return-route failures remain WARN.
    service_transition_abort_grace_s: 3.0

    abort_warn: 2
    abort_error: 5
