# Radar Checker 설정 파일 (SEN0592 Modbus RTU 레이다 7채널)
#
# 진단 태스크 이름 형식: "radar_checker: /sensor/radar/<NAME>"
# (diagnostic_updater 가 "<node_name>: <task_name>" 으로 자동 생성)
# Layout: 1) publish rate, 2) monitored channels, 3) global dummy marker, 4) per-channel blocks.

radar_checker:
  ros__parameters:
    # =========================================================================
    # 1. PUBLISH RATE
    # =========================================================================
    publish_rate_hz: 1.0          # 진단 발행 주기 (Hz)

    # =========================================================================
    # 2. MONITORED RADAR CHANNELS
    # =========================================================================
    # HH_260729 - All seven physical channels are active. For an explicit
    # field-test isolation, add disabled_radar_names with the sensor names.
    # The empty setting is intentionally omitted because ROS 2 Humble can
    # convert an empty YAML array to an invalid tuple when a node is run
    # directly; the node's declared default is already an empty string array.
    radar_names: ["FRONT1", "FRONT2", "LEFT1", "LEFT2", "RIGHT1", "RIGHT2", "REAR"]

    # =========================================================================
    # 3. GLOBAL DUMMY MARKER
    # =========================================================================
    # HH_260729 - enable_radar:=false uses this global marker and reports all
    # seven channels as WARN "DUMMY DATA". Each sensor block also owns a
    # channel marker for sensor_enabled[i]:=false, so one disabled radar never
    # hides failures from the remaining physical channels. A false/stale
    # marker always restores the normal missing/stale/range diagnosis.
    dummy_active_topic: "/sensing/radar/dummy_active"
    dummy_active_timeout_s: 1.0

    # =========================================================================
    # 4. PER-CHANNEL BLOCKS
    # =========================================================================
    # ── 각 센서 설정 ──────────────────────────────────────────────────────
    #
    # stuck_min_*  : range 가 최솟값 근처에 고착 → 센서 전방 차폐·물리 충격 의심
    #   예) SEN0592 최솟값 0.02 m 근처에서 벗어나지 않으면 전면이 막힌 것
    #
    # stuck_max_*  : range 가 최댓값 근처에 고착 → 센서 무감지·케이블 불량 의심
    #   예) 4.4 m 이상에 고착되면 센서가 아무것도 감지하지 못하는 상태
    #
    # 0.0 = 해당 체크 비활성화

    REAR:
      topic: "/sensing/radar/rear/range"
      location: "rear_center"
      frame_id: "radar_rear_link"
      port: "/dev/ttyCH9344USB6"
      dummy_active_topic: "/sensing/radar/rear/dummy_active"
      dummy_active_timeout_s: 1.0
      expected_hz:         8.0
      hz_warn_ratio:      0.7
      hz_error_ratio:     0.4
      stale_timeout_s:      1.0
      min_range_m:        0.02
      max_range_m:        4.5
      stuck_min_warn_m:   0.05
      stuck_min_error_m:  0.03
      stuck_max_warn_m:   4.4
      stuck_max_error_m:  0.0

    LEFT2:
      topic: "/sensing/radar/left2/range"
      location: "left_rear"
      frame_id: "radar_left2_link"
      port: "/dev/ttyCH9344USB5"
      dummy_active_topic: "/sensing/radar/left2/dummy_active"
      dummy_active_timeout_s: 1.0
      expected_hz:         8.0
      hz_warn_ratio:      0.7
      hz_error_ratio:     0.4
      stale_timeout_s:      1.0
      min_range_m:        0.02
      max_range_m:        4.5
      # HH_260707 - Side radars can see the vehicle body at very short range;
      # keep that visible as WARN only and let cost-grid/gate handle real stops.
      stuck_min_warn_m:   0.05
      stuck_min_error_m:  0.0
      stuck_max_warn_m:   4.4
      stuck_max_error_m:  0.0

    LEFT1:
      topic: "/sensing/radar/left1/range"
      location: "left_front"
      frame_id: "radar_left1_link"
      port: "/dev/ttyCH9344USB4"
      dummy_active_topic: "/sensing/radar/left1/dummy_active"
      dummy_active_timeout_s: 1.0
      expected_hz:         8.0
      hz_warn_ratio:      0.7
      hz_error_ratio:     0.4
      stale_timeout_s:      1.0
      min_range_m:        0.02
      max_range_m:        4.5
      # HH_260707 - Side radars can see the vehicle body at very short range;
      # keep that visible as WARN only and let cost-grid/gate handle real stops.
      stuck_min_warn_m:   0.05
      stuck_min_error_m:  0.0
      stuck_max_warn_m:   4.4
      stuck_max_error_m:  0.0

    RIGHT2:
      topic: "/sensing/radar/right2/range"
      location: "right_rear"
      frame_id: "radar_right2_link"
      port: "/dev/ttyCH9344USB3"
      dummy_active_topic: "/sensing/radar/right2/dummy_active"
      dummy_active_timeout_s: 1.0
      expected_hz:         8.0
      hz_warn_ratio:      0.7
      hz_error_ratio:     0.4
      stale_timeout_s:      1.0
      min_range_m:        0.02
      max_range_m:        4.5
      # HH_260707 - Keep near-body chassis echoes visible as WARN so mounting
      # or self-occlusion issues remain operator-visible during field tests.
      stuck_min_warn_m:   0.05
      stuck_min_error_m:  0.0
      stuck_max_warn_m:   4.4
      stuck_max_error_m:  0.0

    RIGHT1:
      topic: "/sensing/radar/right1/range"
      location: "right_front"
