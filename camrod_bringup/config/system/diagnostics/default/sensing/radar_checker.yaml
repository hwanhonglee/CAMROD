      dummy_active_timeout_s: 1.0
      expected_hz:         8.0
      hz_warn_ratio:      0.7
      hz_error_ratio:     0.4
      stale_timeout_s:      1.0
      min_range_m:        0.02
      max_range_m:        4.5
      stuck_min_warn_m:   0.05
      stuck_min_error_m:  0.0
      stuck_max_warn_m:   4.4
      stuck_max_error_m:  0.0

    FRONT1:
