# HH_260630: IMU checker validates live CV7/GQ7 rate and basic gyro/accel data quality.

imu_checker:
  ros__parameters:
    publish_rate_hz: 1.0          # Diagnostic publish rate (Hz)

    # IMU stream names to monitor.
    imu_names: ["main"]

    main:
      topic: "/sensing/imu/data"
      # HH_260729 - Never label an intentional dummy stream as healthy IMU
      # hardware; fresh true is WARN, while false/stale is fail-visible.
      dummy_active_topic: "/sensing/imu/dummy_active"
      dummy_active_timeout_s: 1.0
      expected_hz: 100.0         # Expected hardware IMU receive rate (Hz)
      hz_warn_ratio: 0.7         # WARN when actual_hz / expected_hz is below this ratio
      hz_error_ratio: 0.4        # ERROR when actual_hz / expected_hz is below this ratio
      stale_timeout_s: 0.5       # Mark stale after this many seconds without a message
      accel_magnitude_warn: 30.0 # WARN when ||a|| exceeds this value (m/s^2); 0 disables
      accel_magnitude_error: 50.0 # ERROR when ||a|| exceeds this value (m/s^2); 0 disables
