cost_grid_checker:
  ros__parameters:
    publish_rate: 1.0

    output_topic:        "/sensing/lidar/near_cost_grid"
    expected_hz:         10.0
    hz_warn_ratio:       0.7     # WARN threshold for actual_hz/expected_hz ratio.
    hz_error_ratio:      0.4     # ERROR threshold for actual_hz/expected_hz ratio.
    stale_timeout:       2.0
    unknown_ratio_warn:  0.9     # WARN threshold for unknown-cell ratio in occupancy grids.
    unknown_ratio_error: 1.0     # ERROR threshold for unknown-cell ratio in occupancy grids.
