cost_grid_checker:
  ros__parameters:
    publish_rate_hz: 1.0

    # HH_260630 - Monitor raw sensor-derived grids and the merged inflation grid.
    grid_names: ["lidar", "radar", "inflation"]

    hz_warn_ratio: 0.7
    hz_error_ratio: 0.4
    stale_timeout_s: 2.0
    # HH_260630 - Sparse sensor cost grids normally keep non-obstacle cells unknown.
    # Treat only a fully unknown grid as an input/TF failure.
    unknown_ratio_warn: 1.0
    unknown_ratio_error: 1.0

    lidar:
      diagnostic_name: "/sensing/cost_grid/lidar"
      output_topic: "/sensing/cost_grid/lidar"
      expected_hz: 10.0
      stale_timeout_s: 2.0

    radar:
      diagnostic_name: "/sensing/cost_grid/radar"
      output_topic: "/sensing/cost_grid/radar"
      expected_hz: 10.0
      stale_timeout_s: 2.0

    inflation:
      diagnostic_name: "/planning/cost_grid/inflation"
      output_topic: "/planning/cost_grid/inflation"
      expected_hz: 6.0
      stale_timeout_s: 2.0
