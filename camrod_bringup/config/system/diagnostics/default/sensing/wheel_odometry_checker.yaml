# Wheel Odometry Checker 설정 파일
# 센서 레벨: 휠 오도메트리가 살아있는가? 속도 데이터 유효성 체크

wheel_odometry_checker:
  ros__parameters:
    publish_rate_hz: 1.0          # 진단 발행 주기 (Hz)

    # 모니터링할 휠 이름 목록
    wheel_names: ["main"]

    main:
      # HH_260410: Unified wheel odometry topic consumed by localization filters.
      topic: "/platform/status/wheel_odometry"
      # HH_260630 - ranger_platform_bridge republishes wheel odometry at the
      # Ranger status cadence observed in full bringup.
      expected_hz: 50.0
      hz_warn_ratio: 0.7         # actual_hz / expected_hz 비율이 이 값 미만이면 WARN
      hz_error_ratio: 0.4        # actual_hz / expected_hz 비율이 이 값 미만이면 ERROR
      stale_timeout_s: 1.0         # 이 시간(초) 이상 메시지 없으면 STALE
      max_speed_warn_ms: 3.0     # |vx| > 이 값 (m/s) → WARN  (0.0 = 비활성화)
      max_speed_error_ms: 5.0    # |vx| > 이 값 (m/s) → ERROR (0.0 = 비활성화)
