# Camera Checker 설정 파일
# HH_260528 - Updated for dual econ cameras.
# HH_260630 - Validate operational camera streams; rear compressed is monitoring-only.
# camera_front_publisher_node publishes image_rect/compressed (NOT image_raw).
# camera_rear_publisher_node publishes image_raw and a rate-limited monitoring compressed stream.

camera_checker:
  ros__parameters:
    publish_rate_hz: 1.0

    camera_names: ["econ_front", "econ_rear"]

    econ_front:
      image_topic: "/sensing/camera/econ_front/image_rect/compressed"
      image_type: "compressed"
      camera_info_topic: "/sensing/camera/econ_front/camera_info"
      # HH_260729 - Cameras are independently switchable, so each source owns
      # its own fresh true dummy heartbeat and explicit degraded WARN.
      dummy_active_topic: "/sensing/camera/econ_front/dummy_active"
      dummy_active_timeout_s: 1.0
      expected_fps: 10.0
      fps_warn_ratio: 0.8
      fps_error_ratio: 0.5
      stale_timeout_s: 3.0
      expected_width: 1920
      expected_height: 1080
      expected_encoding: ""

    econ_rear:
      image_topic: "/sensing/camera/econ_rear/image_raw"
      image_type: "raw"
      camera_info_topic: "/sensing/camera/econ_rear/camera_info"
      dummy_active_topic: "/sensing/camera/econ_rear/dummy_active"
      dummy_active_timeout_s: 1.0
      expected_fps: 10.0
      fps_warn_ratio: 0.8
      fps_error_ratio: 0.5
      stale_timeout_s: 3.0
      expected_width: 1920
      expected_height: 1080
      expected_encoding: "bgr8"
