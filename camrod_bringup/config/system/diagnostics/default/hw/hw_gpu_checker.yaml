# HW / GPU Checker 설정 파일

hw_checker:
  ros__parameters:
    publish_rate_hz: 1.0          # 발행 주기 (Hz)

    cpu:
      enabled: true
      # HH_260702 - Field bringup can run in the mid/high 90% range on Orin.
      # Keep WARN visible, but reserve ERROR for full saturation.
      warn_threshold: 92.0
      error_threshold: 100.0

    memory:
      enabled: true           # 메모리 모니터링 활성화 여부
      warn_threshold: 75.0    # 메모리 사용률 WARN 기준 (%)
      error_threshold: 90.0   # 메모리 사용률 ERROR 기준 (%)

    disk:
      enabled: true           # 디스크 모니터링 활성화 여부
      warn_threshold: 80.0    # 디스크 사용률 WARN 기준 (%)
      error_threshold: 95.0   # 디스크 사용률 ERROR 기준 (%)
      path: "/"               # 감시할 디스크 경로
                              # 컨테이너에서 호스트 디스크를 보려면:
                              #   docker run -v /:/host/rootfs:ro 마운트 후
                              #   path: "/host/rootfs" 로 설정

    cpu_temp:
      enabled: true           # CPU 온도 모니터링 활성화 여부
                              # 센서가 없는 환경(WSL2 등)에서는 false 로 설정
      warn_threshold: 75.0    # CPU 온도 WARN 기준 (°C)
      error_threshold: 90.0   # CPU 온도 ERROR 기준 (°C)

    # ── 컨테이너 환경 설정 ───────────────────────────────────────────────
    # 빈 문자열("")이면 자동 감지 후 /host/proc, /host/sys 를 시도합니다.
    # 환경 변수(HOST_PROC, HOST_SYS, HOST_ROOTFS)가 설정되어 있으면 우선 적용됩니다.
    #
    # Docker 실행 예시:
    #   docker run ... \
    #     -v /proc:/host/proc:ro \
    #     -v /sys:/host/sys:ro   \
    #     -v /:/host/rootfs:ro
    #
    container:
      host_proc_path: ""      # 호스트 /proc 마운트 경로 (예: "/host/proc")
      host_sys_path: ""       # 호스트 /sys 마운트 경로  (예: "/host/sys")
      host_rootfs_path: ""    # 호스트 루트 FS 경로      (예: "/host/rootfs")

gpu_checker:
  ros__parameters:
    publish_rate_hz: 1.0          # 발행 주기 (Hz)

    gpu:
      util_warn_threshold: 85.0   # GPU 사용률 WARN 기준 (%)
      util_error_threshold: 95.0  # GPU 사용률 ERROR 기준 (%)
      mem_warn_threshold: 80.0    # VRAM 사용률 WARN 기준 (%)
      mem_error_threshold: 95.0   # VRAM 사용률 ERROR 기준 (%)
      temp_warn_threshold: 75.0   # 온도 WARN 기준 (°C)
      temp_error_threshold: 85.0  # 온도 ERROR 기준 (°C)

    # ── 컨테이너 환경 설정 ───────────────────────────────────────────────
    # NVIDIA Container Toolkit 사용 시에는 별도 설정 불필요
    # Toolkit 없이 GPU 디바이스만 마운트된 경우 nvidia-smi 경로를 직접 지정
    # 환경 변수 NVIDIA_SMI_PATH 가 설정되어 있으면 우선 적용됩니다.
    #
    container:
      nvidia_smi_path: ""     # nvidia-smi 경로 오버라이드 (예: "/host/usr/bin/nvidia-smi")
