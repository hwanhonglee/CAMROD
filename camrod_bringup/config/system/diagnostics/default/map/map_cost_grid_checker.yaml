map_cost_grid_checker:
  ros__parameters:
    publish_rate_hz: 1.0

    cost_grid_topic: "/map/cost_grid/lanelet"

    # HH_260702 - Lanelet cost-grid builds are event driven and can take
    # several seconds on the Orin under full sensing/perception load.
    expected_hz:    0.2
    hz_warn_ratio:  0.5
    hz_error_ratio: 0.2

    stale_timeout_s: 12.0

    # Unknown(-1) cell ratio thresholds.
    # A high ratio usually means the route is outside map coverage or missing.
    unknown_ratio_warn:  0.8
    unknown_ratio_error: 0.98
