# Perception obstacle checker configuration.
# Layout: 1) publish rate, 2) monitored stream list, 3) per-stream settings.
#
# HH_260702 - Keep these thresholds tolerant under full outdoor load. Detection
# health is reported in diagnostics, while motion blocking is handled by live
# cost grids and the command gates.
#
# Add names to obstacle_names and define a matching section below.
# type: "Detection2DArray" -> vision_msgs/Detection2DArray
# type: "PointCloud2"      -> sensor_msgs/PointCloud2

perception_obstacle_checker:
  ros__parameters:
    # =========================================================================
    # 1. PUBLISH RATE
    # =========================================================================
    publish_rate_hz: 1.0

    # =========================================================================
    # 2. MONITORED OBSTACLE STREAMS
    # =========================================================================
    obstacle_names:
      - "camera_detections"
      - "fused_obstacles"

    # =========================================================================
    # 3. PER-STREAM SETTINGS
    # =========================================================================
    camera_detections:
      topic: "/perception/camera/detections_2d"
      type: "Detection2DArray"
      expected_hz: 5.0
      hz_warn_ratio: 0.5
      hz_error_ratio: 0.2
      stale_timeout_s: 5.0
      min_count: 0
      max_count: 0

    fused_obstacles:
      topic: "/perception/obstacles"
      type: "PointCloud2"
      expected_hz: 3.0
      hz_warn_ratio: 0.5
      hz_error_ratio: 0.2
      stale_timeout_s: 5.0
      min_count: 0
      max_count: 0
