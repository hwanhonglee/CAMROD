perception_obstacle_checker:
  ros__parameters:
    publish_rate: 1.0          # Diagnostic publish rate (Hz).

    obstacle_names:
      - "camera_detections"
      - "fused_obstacles"

    camera_detections:
      topic: "/perception/camera/detections_2d"
      type: "Detection2DArray"
      expected_hz: 10.0        # Expected message update rate (Hz).
      hz_warn_ratio: 0.8       # WARN threshold for actual_hz/expected_hz ratio.
      hz_error_ratio: 0.5      # ERROR threshold for actual_hz/expected_hz ratio.
      stale_timeout: 2.0       # Mark STALE when no update is received within this duration (s).
      min_count: 0             # Parameter note: tune this value for your platform profile.
      max_count: 0             # Parameter note: tune this value for your platform profile.

    fused_obstacles:
      topic: "/perception/obstacles"
      type: "PointCloud2"
      expected_hz: 10.0        # Expected message update rate (Hz).
      hz_warn_ratio: 0.8       # WARN threshold for actual_hz/expected_hz ratio.
      hz_error_ratio: 0.5      # ERROR threshold for actual_hz/expected_hz ratio.
      stale_timeout: 2.0       # Mark STALE when no update is received within this duration (s).
      min_count: 0             # Parameter note: tune this value for your platform profile.
      max_count: 0             # Parameter note: tune this value for your platform profile.
