/**:
  ros__parameters:
    input_topic: "/control/cmd_vel_ros"
    output_topic: "/carla/ego_vehicle/extended_ackermann_cmd"
    status_topic: "/camrod_carla/command_adapter/status"
    base_frame_id: "robot_center_link"

    # Historical Woraksan tuning may opt in to a short-lived route-recovery
    # torque authorization. Keep it disabled in develop-parity mode: a command
    # adapter must not silently add drive authority merely because CARLA is the
    # plant. It never changes normal/manual CRAB authority even when enabled.
    recovery_breakaway_enable: false
    recovery_breakaway_status_topic: "/control/route_safety_recovery_controller/status"
    recovery_breakaway_status_timeout_sec: 0.30
    recovery_breakaway_target_minimum_mps: 0.04
    recovery_breakaway_target_maximum_mps: 0.06

    # Separate fail-closed lease for the CARLA campsite CRAB_OUT yaw recovery.
    # The develop-site wrapper alone enables it. The adapter also requires a
    # fresh healthy campsite status with the exact active-recovery token and a
    # stationary ZERO_TURN/PIVOT command; ordinary rotations remain unmarked.
    rotation_recovery_breakaway_enable: false
    rotation_recovery_breakaway_status_topic: "/control/camping_site_maneuver_controller/status"
    rotation_recovery_breakaway_status_timeout_sec: 0.30

    # Match CAMROD Ranger mode selection exactly at the command boundary.
    lateral_deadband_mps: 0.02
    angular_epsilon_radps: 0.000001
    minimum_turn_radius_m: 0.810330349
    camrod_wheelbase_m: 0.90

    # Accepted CARLA Ranger limits. Pure +/-Y is clipped from 90 to 88 deg.
    max_ackermann_steer_rad: 0.6981
    max_crab_angle_rad: 1.53588974175501
    max_ackermann_speed_mps: 1.4
    max_crab_speed_mps: 1.0
    max_yaw_rate_radps: 0.7853

    # Independent final-boundary watchdog; no non-zero command is replayed.
    input_timeout_sec: 0.35
    watchdog_rate_hz: 50.0
    zero_publish_rate_hz: 10.0
    unsupported_axis_tolerance: 0.000001
