# CARLA site-validation perception overlay.
#
# Keep this file separate from perception_carla.yaml: ordinary `camrod`
# preserves develop's YOLO min_confidence=0.50 and applies only the measured
# camera-to-LiDAR extrinsic.  `camrod-site-geometry` explicitly selects this
# combined overlay for the Woraksan campsite evidence profile.
/perception/obstacle_fusion:
  ros__parameters:
    # Spawn coordinates use raw LiDAR axes; fusion uses the Vanjee effective
    # frame.  See perception_carla.yaml for the measured-frame derivation.
    extrinsic_x: 0.0
    extrinsic_y: 0.00001
    extrinsic_z: -0.09970

# HH_260903 - Bright Woraksan foliage produced false-positive COCO boxes up
# to 0.9233 confidence in an older 56-frame sample; that sample used the
# subsequently discovered 81-label/80-logit mismatch and is not a calibrated
# confidence profile for the corrected decoder.
# HH_261002 - The pinned ONNX/FP16 engine has 80 class logits, whereas the
# shared label file has 81 names (the last is tent).  The site launch supplies
# yolo_coco80.txt through its final yolo_labels_path launch configuration;
# class_label_path here would be overwritten by the later launch parameter.
# HH_261002 - A 0.55 moving B9 trial still classified scenery as bench
# (<=0.742) and parking meter (<=0.709), sometimes passing a false label
# into 3D fusion.  The real CARLA walker measured 0.844-0.900.  Set the
# CARLA-site threshold to 0.80 to separate these observed cohorts; this is
# a scenario-specific empirical filter, not a proven all-scene safety bound.
/perception/yolov9mit:
  ros__parameters:
    min_confidence: 0.80
