# CARLA-only plant geometry mirror. CAMROD v2.2.4 raised the production
# bounded reverse envelope to 5.0 m for the relocated station, so the tuned
# simulator profile must not reintroduce its former 4.2 m override. The normal
# 0.25 m station-axis tolerance remains the only position-success condition.
/parking/reverse_parking_controller:
  ros__parameters:
    maximum_reverse_distance_m: 5.0
