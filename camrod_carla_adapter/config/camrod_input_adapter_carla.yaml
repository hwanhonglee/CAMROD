/**:
  ros__parameters:
    publish_localization_status: false

    # Feed the already metric, map-aligned CARLA truth pose through CAMROD's
    # normal GNSS-pose contract. The raw NavSatFix relay remains observable but
    # is deliberately not fused in this initial profile.
    enable_navsat_to_pose: true
    navsat_topic: "/camrod_carla/unused_navsat"
    utm_pose_topic: "/camrod_carla/metric_pose"
    gnss_pose_topic: "/sensing/gnss/pose"
    gnss_pose_ros_topic: "/sensing/gnss/pose_ros"
    gnss_pose_cov_topic: "/sensing/gnss/pose_with_covariance"
    gnss_pose_cov_ros_topic: "/sensing/gnss/pose_with_covariance_ros"
    map_frame_id: "map"
    publish_gnss_covariance: true
    navsat_covariance_source: "fixed"
    pose_covariance_diagonal: [0.01, 0.01, 0.04, 999.0, 999.0, 0.002741556778]

    enable_gnss_heading: false
    enable_gnss_lever_arm_correction: false
    enable_gnss_lever_arm_ekf_heading_fallback: false
    gnss_antenna_offset_x_m: 0.0
    gnss_antenna_offset_y_m: 0.0
    rotate_latlon_xy_by_yaw_offset: false
    yaw_offset_deg: 0.0
    offset_utm_easting: 0.0
    offset_utm_northing: 0.0
    offset_utm_alt: 0.0
    max_position_jump_m: 8.0
    jump_reject_max_speed_mps: 20.0
    jump_reject_reset_s: 2.0

    enable_odometry_to_pose: true
    odom_input_topic: "/localization/primary/odometry_ros"
    odom_output_topic: "/localization/primary/odometry"
    odom_pose_topic: "/localization/primary/pose"
    odom_pose_cov_topic: "/localization/primary/pose_with_covariance"
    odom_output_frame_id: "map"

    enable_wheel_odometry_bridge: true
    wheel_input_topic: "/platform/status/odometry"
    wheel_input_type: "nav_odom"
    wheel_fallback_input_topic: ""
    wheel_fallback_input_type: "nav_odom"
    wheel_primary_timeout_s: 0.7
    wheel_output_topic: "/localization/input/wheel_odometry"
    wheel_nav_output_topic: "/localization/input/wheel_odometry_ros"
    wheel_odom_frame_id: "odom"
    wheel_base_frame_id: "robot_center_link"
