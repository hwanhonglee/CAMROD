# CARLA-only runtime overlay for constrained roadside returns.
#
# The production vehicle profile intentionally remains forward-only. Woraksan
# B11-B13 do not contain Ranger's 180-degree swept envelope, so the simulator
# composition keeps the outbound body yaw and retraces the inverted Lanelet2
# route in reverse. The CARLA final gate intentionally stays at unity so manual
# and low-speed reverse commands retain torque authority. Therefore ordinary
# forward RPP linear limits are pre-scaled here to the same physical values as
# production RPP behind its 0.5 gate. Only a source-tagged return goal selects
# the separate RPPReverse plugin.
controller_server:
  ros__parameters:
    controller_plugins: ["RPP", "RPPReverse", "RotationShim"]
    RPP:
      # Production-equivalent physical cruise: 1.111111 * 0.5.
      desired_linear_vel: 0.555556
      # Preserve the production final-approach and curvature-floor speeds.
      min_approach_linear_velocity: 0.138889
      regulated_linear_scaling_min_speed: 0.166667
    RPPReverse:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      allow_reversing: true
      use_rotate_to_heading: false
      # HH_260830 - The B12 -> drop-zone reverse route contains a narrow S bend
      # at lanelets 2744/2720.  The inherited 1.5..3.5 m velocity-scaled
      # preview let RPP accelerate to ~0.50 m/s while commanding only
      # ~0.185 rad/s, although the recorded bend requires ~0.82 rad/m.  Keep
      # this CARLA-only profile below the measured 0.226 m/s kinematic bound;
      # production Nav2 values remain in camrod_bringup unchanged.
      desired_linear_vel: 0.20
      max_angular_accel: 0.8
      use_velocity_scaled_lookahead_dist: false
      lookahead_dist: 0.80
      min_lookahead_dist: 0.80
      max_lookahead_dist: 0.80
      lookahead_time: 1.8
      rotate_to_heading_angular_vel: 0.35
      transform_tolerance: 0.5
      use_interpolation: true
      min_approach_linear_velocity: 0.10
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 3.0
      # camrod_carla_full.launch.py applies the CARLA-only unity final-gate
      # scale, so this bounded 0.20 m/s floor reaches the physical adapter
      # unchanged. Ordinary CAMROD keeps its production 0.5 scale.
      regulated_linear_scaling_min_speed: 0.20
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
