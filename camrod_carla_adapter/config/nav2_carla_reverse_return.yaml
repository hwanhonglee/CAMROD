# CARLA-only runtime overlay for constrained roadside returns.
#
# HH_261007 - The current site-geometry profile uses forward road returns and
# disables reverse-goal selection. This overlay still supplies its existing
# forward speed limits; RPPReverse remains available only to historical opt-in
# profiles. Keeping the plugin registered does not select it for road returns.
# Final reverse parking is handled by a separate parking controller.
#
# HH_261007 - Use a 4 km/h nominal road cruise within the requested 3--5 km/h
# operating range. The former 0.555556 m/s pre-scale silently kept this profile
# at 2 km/h even though its final gate already uses unity scale. These values
# are targets, not minimum speeds: curvature, collision and final-approach
# regulation may reduce them. Preserve parking/crab limits and manual 2 m/s.
# Historical reverse opt-in profiles retain their separate slow RPPReverse;
# the current forward-only site profile never selects that controller.
controller_server:
  ros__parameters:
    controller_plugins: ["RPP", "RPPReverse", "RotationShim"]
    RPP:
      # HH_261007 - 1.111111 m/s * 3.6 = 4 km/h, with a unity CARLA gate.
      desired_linear_vel: 1.111111
      # Preserve the production final-approach and curvature-floor speeds.
      min_approach_linear_velocity: 0.138889
      regulated_linear_scaling_min_speed: 0.166667
    RotationShim:
      # Keep every forward Nav2 controller at the same physical cruise limit.
      # The campsite CRAB/ROTATE controller is a separate node, so these
      # road target does not change its unity-gate maneuver commands.
      desired_linear_vel: 1.111111
      min_approach_linear_velocity: 0.138889
      regulated_linear_scaling_min_speed: 0.166667
    RPPReverse:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      allow_reversing: true
      use_rotate_to_heading: false
      # HH_260830 - The B12 -> drop-zone reverse route contains a narrow S bend
      # at lanelets 2744/2720.  The inherited 1.5..3.5 m velocity-scaled
      # preview let RPP accelerate to ~0.50 m/s while commanding only
      # ~0.185 rad/s, although the recorded bend requires ~0.82 rad/m.  Keep
      # this CARLA-only profile below the measured 0.226 m/s kinematic bound;
      # production Nav2 values remain in camrod_bringup unchanged.
      desired_linear_vel: 0.20
      max_angular_accel: 0.8
      use_velocity_scaled_lookahead_dist: false
      lookahead_dist: 0.80
      min_lookahead_dist: 0.80
      max_lookahead_dist: 0.80
      lookahead_time: 1.8
      rotate_to_heading_angular_vel: 0.35
      transform_tolerance: 0.5
      use_interpolation: true
      min_approach_linear_velocity: 0.10
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 3.0
      # camrod_carla_full.launch.py applies the CARLA-only unity final-gate
      # scale, so this bounded 0.20 m/s floor reaches the physical adapter
      # unchanged. Ordinary CAMROD keeps its production 0.5 scale.
      regulated_linear_scaling_min_speed: 0.20
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
