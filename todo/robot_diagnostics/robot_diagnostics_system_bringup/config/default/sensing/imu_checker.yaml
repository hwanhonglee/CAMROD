# IMU Checker 설정 파일
# 센서 레벨: IMU가 살아있는가? gyro/accel 데이터 유효성 체크

imu_checker:
  ros__parameters:
    publish_rate: 1.0          # 진단 발행 주기 (Hz)

    # 모니터링할 IMU 이름 목록
    imu_names: ["main"]

    main:
      topic: "/sensing/imu/data"
      expected_hz: 100.0         # 기대 수신 속도 (Hz)
      hz_warn_ratio: 0.7         # actual_hz / expected_hz 비율이 이 값 미만이면 WARN
      hz_error_ratio: 0.4        # actual_hz / expected_hz 비율이 이 값 미만이면 ERROR
      stale_timeout: 0.5         # 이 시간(초) 이상 메시지 없으면 STALE
      accel_magnitude_warn: 30.0  # ||a|| > 이 값 (m/s²) → WARN  (0.0 = 비활성화)
      accel_magnitude_error: 50.0 # ||a|| > 이 값 (m/s²) → ERROR (0.0 = 비활성화)
