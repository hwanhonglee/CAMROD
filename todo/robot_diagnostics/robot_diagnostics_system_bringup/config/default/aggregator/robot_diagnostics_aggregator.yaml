# ============================================================
# Robot Diagnostics Aggregator 설정
# ============================================================
#
# /diagnostics 토픽의 개별 항목들을 도메인 트리로 집계한다.
#
# 집계 트리 구조
# --------------
# Robot
# ├── Hardware
# │   ├── /hardware/cpu
# │   ├── /hardware/memory
# │   ├── /hardware/disk
# │   ├── /hardware/cpu_temp
# │   └── /hardware/gpu0
# │
# ├── Sensing
# │   ├── Sensing/GNSS       ← /sensor/gnss/main
# │   ├── Sensing/IMU        ← /sensor/imu/main
# │   ├── Sensing/LiDAR      ← /sensor/lidar/main, /sensor/lidar/filtered
# │   ├── Sensing/Radar      ← /sensor/radar/{REAR,LEFT1,LEFT2,RIGHT1,RIGHT2,FRONT}
# │   ├── Sensing/Camera     ← /sensor/camera/front, /sensor/camera/processed
# │   ├── Sensing/Wheel      ← /sensor/wheel/main
# │   ├── Sensing/CostGrid   ← /perception/lidar/cost_grid
# │   └── Sensing/Velocity   ← /sensing/velocity_converter
# │
# ├── Perception
# │   ├── Perception/Detections ← /perception/camera/detections
# │   └── Perception/Obstacles  ← /perception/obstacles
# │
# ├── Localization
# │   ├── Localization/GNSS Quality ← /localization/gnss/main
# │   ├── Localization/Mode         ← /localization/mode
# │   ├── Localization/Pose         ← /localization/pose
# │   ├── Localization/Init         ← /localization/init
# │   ├── Localization/Source       ← /localization/source
# │   └── Localization/Lanelet      ← /localization/lanelet
# │
# ├── Planning
# │   ├── Planning/Path      ← /planning/path/global_path, /planning/path/local_path
# │   ├── Planning/Costmap   ← /planning/global_costmap, /planning/local_costmap
# │   ├── Planning/NavStatus ← /planning/nav_status
# │   └── Planning/Lifecycle ← /planning/lifecycle/planning/{planner_server,
# │                             controller_server, bt_navigator, behavior_server}
# │
# └── Map
#     └── Map/CostGrid ← /map/cost_grid
#
# ============================================================

diagnostic_aggregator:
  ros__parameters:
    path: Robot
    pub_rate: 1.0

    analyzers:

      # ── Hardware ──────────────────────────────────────────────────────
      hardware:
        type: 'diagnostic_aggregator/GenericAnalyzer'
        path: Hardware
        contains: ['/hardware/']

      # ── Hardware: Network (WiFi) ───────────────────────────────────────
      hardware_network:
        type: 'diagnostic_aggregator/GenericAnalyzer'
        path: 'Hardware/Network'
        contains: ['/hardware/network/']

      # ── Sensing: GNSS ─────────────────────────────────────────────────
      sensing_gnss:
        type: 'diagnostic_aggregator/GenericAnalyzer'
        path: 'Sensing/GNSS'
        contains: ['/sensor/gnss/']

      # ── Sensing: IMU ──────────────────────────────────────────────────
      sensing_imu:
        type: 'diagnostic_aggregator/GenericAnalyzer'
        path: 'Sensing/IMU'
        contains: ['/sensor/imu/']

      # ── Sensing: LiDAR ────────────────────────────────────────────────
      sensing_lidar:
        type: 'diagnostic_aggregator/GenericAnalyzer'
        path: 'Sensing/LiDAR'
        contains: ['/sensor/lidar/']

      # ── Sensing: Radar ────────────────────────────────────────────────
      sensing_radar:
        type: 'diagnostic_aggregator/GenericAnalyzer'
        path: 'Sensing/Radar'
        contains: ['/sensor/radar/']

      # ── Sensing: Camera ───────────────────────────────────────────────
      sensing_camera:
        type: 'diagnostic_aggregator/GenericAnalyzer'
        path: 'Sensing/Camera'
        contains: ['/sensor/camera/']

      # ── Sensing: Wheel Odometry ───────────────────────────────────────
      sensing_wheel:
        type: 'diagnostic_aggregator/GenericAnalyzer'
        path: 'Sensing/Wheel'
        contains: ['/sensor/wheel/']

      # ── Sensing: Cost Grid (Perception) ───────────────────────────────
      sensing_cost_grid:
        type: 'diagnostic_aggregator/GenericAnalyzer'
        path: 'Sensing/CostGrid'
        contains: ['/perception/lidar/cost_grid']

      # ── Sensing: Velocity Converter ───────────────────────────────────
      sensing_velocity:
        type: 'diagnostic_aggregator/GenericAnalyzer'
        path: 'Sensing/Velocity'
        contains: ['/sensing/velocity_converter']

      # ── Localization: GNSS 입력 품질 ──────────────────────────────────
      localization_gnss:
        type: 'diagnostic_aggregator/GenericAnalyzer'
        path: 'Localization/GNSS Quality'
        contains: ['/localization/gnss/']

      # ── Localization: 모드·신뢰도 ─────────────────────────────────────
      localization_mode:
        type: 'diagnostic_aggregator/GenericAnalyzer'
        path: 'Localization/Mode'
        contains: ['/localization/mode']

      # ── Localization: 위치 추정 출력 품질 ─────────────────────────────
      localization_pose:
        type: 'diagnostic_aggregator/GenericAnalyzer'
        path: 'Localization/Pose'
        contains: ['/localization/pose']

      # ── Localization: Drop zone 초기화 ────────────────────────────────
      localization_init:
        type: 'diagnostic_aggregator/GenericAnalyzer'
        path: 'Localization/Init'
        contains: ['/localization/init']

      # ── Localization: ESKF / Kimera-VIO 소스 전환 ─────────────────────
      localization_source:
        type: 'diagnostic_aggregator/GenericAnalyzer'
        path: 'Localization/Source'
        contains: ['/localization/source']

      # ── Localization: Lanelet 맵 범위 ─────────────────────────────────
      localization_lanelet:
        type: 'diagnostic_aggregator/GenericAnalyzer'
        path: 'Localization/Lanelet'
        contains: ['/localization/lanelet']

      # ── Perception: 카메라 객체 검출 ──────────────────────────────────
      perception_detections:
        type: 'diagnostic_aggregator/GenericAnalyzer'
        path: 'Perception/Detections'
        contains: ['/perception/obstacles/camera_detections']

      # ── Perception: 장애물 융합 출력 ──────────────────────────────────
      perception_obstacles:
        type: 'diagnostic_aggregator/GenericAnalyzer'
        path: 'Perception/Obstacles'
        contains: ['/perception/obstacles/fused_obstacles']

      # ── Planning: 경로 품질 ───────────────────────────────────────────
      planning_path:
        type: 'diagnostic_aggregator/GenericAnalyzer'
        path: 'Planning/Path'
        contains: ['/planning/path/']

      # ── Planning: Costmap 신선도 ──────────────────────────────────────
      planning_costmap:
        type: 'diagnostic_aggregator/GenericAnalyzer'
        path: 'Planning/Costmap'
        contains: ['/planning/global_costmap', '/planning/local_costmap']

      # ── Planning: Nav2 액션 abort 빈도 ────────────────────────────────
      planning_nav_status:
        type: 'diagnostic_aggregator/GenericAnalyzer'
        path: 'Planning/NavStatus'
        contains: ['/planning/nav_status']

      # ── Planning: Nav2 노드 lifecycle 상태 ────────────────────────────
      planning_lifecycle:
        type: 'diagnostic_aggregator/GenericAnalyzer'
        path: 'Planning/Lifecycle'
        contains: ['/planning/lifecycle/']

      # ── Map: Lanelet 레인 제약 격자 ───────────────────────────────────
      map_cost_grid:
        type: 'diagnostic_aggregator/GenericAnalyzer'
        path: 'Map/CostGrid'
        contains: ['/map/cost_grid']

      # ── Platform: Ranger 섀시 ─────────────────────────────────────────
      platform_ranger:
        type: 'diagnostic_aggregator/GenericAnalyzer'
        path: 'Platform/Ranger'
        contains: ['/platform/ranger/']
