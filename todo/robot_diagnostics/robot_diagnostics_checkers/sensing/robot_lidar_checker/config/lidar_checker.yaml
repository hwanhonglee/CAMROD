# LiDAR Checker 설정 파일

lidar_checker:
  ros__parameters:
    publish_rate: 1.0          # 진단 발행 주기 (Hz)

    # 모니터링할 LiDAR 이름 목록
    # 각 이름은 아래 섹션의 키로 사용됩니다.
    lidar_names: ["main", "filtered"]

    main:
      topic: "/sensing/lidar/points"
      expected_hz: 10.0        # 기대 스캔 속도 (Hz)
      hz_warn_ratio: 0.8       # actual_hz / expected_hz 비율이 이 값 미만이면 WARN
      hz_error_ratio: 0.5      # actual_hz / expected_hz 비율이 이 값 미만이면 ERROR
      stale_timeout: 2.0       # 이 시간(초) 이상 메시지 없으면 STALE
      min_point_count: 100     # 0 = 체크 안 함 (스캔 당 최소 포인트 수)
      max_point_count: 0       # 0 = 체크 안 함 (스캔 당 최대 포인트 수)
      max_nan_ratio: 0.1       # 0.0 = 체크 안 함 (NaN·Inf 포인트 비율 상한)

    filtered:
      topic: "/sensing/lidar/points_filtered"
      expected_hz: 10.0
      hz_warn_ratio: 0.8
      hz_error_ratio: 0.5
      stale_timeout: 2.0
      min_point_count: 50      # 전처리 후 최소 포인트 수
      max_point_count: 0
      max_nan_ratio: 0.0       # 전처리 후 NaN 없어야 함
