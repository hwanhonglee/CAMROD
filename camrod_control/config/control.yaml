# File layout: two maneuver-controller nodes (camping site, then drop zone);
# each node's parameters are grouped into numbered sections:
#   1) topics, 2) setup/geometry, 3) maneuver tuning, 4) timing and rates.
#
# HH_260721 - Keep this package config synchronized with the bringup control mirror.
# HH_260720 - Non-Nav2 motion primitives and drop-zone alignment are owned by camrod_control.

/control/camping_site_maneuver_controller:
  ros__parameters:
    # =========================================================================
    # 1. TOPICS
    # =========================================================================
    cmd_vel_topic: "/control/cmd_vel_raw"
    pose_topic: "/localization/pose"
    # HH_260727 - Camping-site maneuvers consume regulated UI/mission goals only;
    # RViz /goal_pose remains a generic manual Nav2 command.
    site_goal_topic: "/planning/site_goal_pose_ros"
    # HH_260720 - Control consumes generated planning poses; `_ros` mirrors are Nav2/RViz only.
    route_goal_topic: "/planning/goal_pose_snapped"
    lanelet_pose_topic: "/planning/lanelet_pose"
    planning_state_topic: "/planning/state_machine/state"
    # HH_260720 - START/RETURN/CANCEL use one generated operation topic.
    operation_topic: "/control/camping_site_maneuver_controller/operation"
    adopt_destination_topic: "/control/camping_site_maneuver_controller/adopt"
    status_topic: "/control/camping_site_maneuver_controller/status"
    diagnostics_topic: "/system/diagnostics"
    # HH_260721 - Service progress is independent from chassis naming and diagnostic severity.
    service_state_topic: "/service/state"
    reverse_path_topic: "/control/camping_site_maneuver_controller/path_ros"
    # HH_260723 - Block entry into a campsite confirmed occupied by perception.
    campsite_occupancy_topic: "/perception/camping_sites/occupancy"
    # HH_260818 - Keep the current tent-at-destination workflow by default.
    # Set true to mark confirmed semantic tent sites unavailable before entry.
    enable_campsite_occupancy_guard: false

    # =========================================================================
    # 2. SITE ENTRY AND GOAL SELECTION
    # =========================================================================
    enable_auto_start_from_planning_state: true
    site_mission_key_prefix: "camping_site_"
    use_goal_pair_for_lateral_offset: true
    require_goal_pair_for_auto_start: true
    site_entry_mode: "crab"
    camping_sites_yaml: ""
    site_goal_frame_id: "map"
    default_lateral_offset_m: 1.2
    min_lateral_offset_m: 0.2
    max_lateral_offset_m: 7.0
    # HH_260819 - B11-B13 remain immediately beside the narrow road: cap the
    # lateral service offset at 0.30 m and skip the on-site zero-turn.
    roadside_max_lateral_offset_m: 0.30
    # HH_260813 - Planning latches GOAL_REACHED at 0.35 m from whichever of the
    # lanelet snap or the raw pose is closer; stay wider than that so the entry
    # handoff is never rejected for an arrival planning already accepted.
    route_goal_reached_distance_m: 0.6
    adopt_site_arrival_distance_m: 3.0
    # HH_260818 - A reboot within this radius restores WAIT_RETURN instead of
    # repeating CRAB_IN toward an adjacent campsite.
    site_pose_reached_distance_m: 0.60
    goal_pair_max_age_s: 0.0
    default_lateral_direction: "left"

    # =========================================================================
    # 3. MANEUVER TUNING
    # =========================================================================
    # HH_260720 - Preserve all field-tuned campsite control values during the package move.
    # HH_260807 - Preserve 60% of the 2.0 km/h cruise reference after the 0.5 gate.
    crab_speed_mps: 0.666667
    # HH_260819 - The 0.5 command gate yields 0.10 m/s (0.36 km/h) for the
    # constrained B11-B13 roadside entry and exit.
    roadside_crab_speed_mps: 0.20
    entry_position_tolerance_m: 0.15
    # HH_260807 - The narrow B4 lane has limited lateral clearance;
    # finish within 0.04 m of the route snap before handing control back to Nav2.
    return_position_tolerance_m: 0.04
    return_translation_kp: 4.0
    # HH_260824 - Finish pure lateral crab inside 2 cm, hold zero while the
    # wheels settle to 0 deg, then latch one longitudinal correction. At the
    # deployed 1.5 rad/s and 0.05 rad ready error, +/-90 -> 0 needs <=1.014 s.
    # A 10 cm hysteresis absorbs pose noise without repeated mode switching.
    return_lateral_transition_tolerance_m: 0.02
    return_lateral_hysteresis_m: 0.10
    return_steering_settle_s: 1.20
    # HH_260825 - Complete a normal site exit at the live centerline projection,
    # regardless of longitudinal offset from the historical entry snap. Hold
    # zero for steering settlement before LaneletRoute plans from the current XY.
    # If the live projection is stale, the exact-anchor sequence remains fallback.
    enable_live_lanelet_return_handoff: true
    return_lanelet_handoff_distance_m: 0.15
    return_lanelet_handoff_hold_s: 1.20
    crab_timeout_speed_scale: 0.4
    crab_timeout_margin_s: 8.0
    # HH_260818 - CRAB_OUT shares time with bounded lane-boundary recovery.
    # Match that 90 s envelope instead of failing on the shorter entry timeout.
    crab_return_timeout_s: 90.0
    reverse_return_timeout_margin_s: 45.0
    reverse_return_progress_tolerance_m: 0.45
    reverse_return_lateral_tolerance_m: 0.40
    max_forward_residual_m: 0.8
    # HH_260824 - A normal lanelet-yaw correction must either settle or fail
    # closed; never publish angular.z indefinitely on a reachable but stuck yaw.
    entry_yaw_alignment_timeout_s: 15.0

    rotate_kp: 1.2
    max_angular_speed_radps: 0.35
    rotate_yaw_tolerance_deg: 4.0
    # HH_260810 - Hold zero until fresh poses prove the turn has settled.
    rotate_settle_hold_s: 0.8
    rotate_settle_max_rate_degps: 3.0
    # HH_260818 - Derive 180-degree direction from the live crab side. The
    # site-index lists below remain available for legacy map-specific tuning.
    site_rotate_direction_policy: "entry_crab_side"
    right_lanelet_site_indices: [1, 3, 5, 7, 9, 11]
    left_lanelet_site_indices: [2, 4, 6, 8, 10, 12, 13]

    # HH_260807 - Preserve 40% of the cruise reference: 0.80 km/h final.
    reverse_entry_speed_mps: 0.444444
    reverse_entry_yaw_kp: 1.0
    reverse_entry_lateral_kp: -0.25
    reverse_entry_max_angular_speed_radps: 0.25
    reverse_entry_use_site_goal_yaw: true
    reverse_entry_site_yaw_mode: "reverse_axis"
    reverse_entry_auto_select_yaw_equivalent: true
    reverse_entry_lateral_tolerance_m: 0.35
    reverse_entry_debug_period_s: 1.0

    unload_wait_s: 5.0
    auto_return_after_unload_wait: false
    reset_wait_return_on_site_goal: true
    request_return_to_drop_zone_on_done: true
    # HH_260721 - Keep the single 180-degree site turn while crabbing back to the entry lanelet.
    align_retrace_yaw_before_crab_out: true

    cancel_nav2_on_site_phase: true
    nav2_cancel_period_s: 0.5
    nav2_cancel_action_topics:
      - /planning/follow_path/_action/cancel_goal
      - /planning/navigate_to_pose/_action/cancel_goal
    return_request_retry_period_s: 1.0
    return_to_drop_zone_topic: "/planning/state_machine/return_to_drop_zone"

    # =========================================================================
    # 4. TIMING AND RATES
    # =========================================================================
    # HH_260721 - Keep pose freshness behavior visible in the package configuration.
    pose_timeout_s: 2.0
    control_rate_hz: 10.0
    idle_tick_rate_hz: 1.0
    status_publish_rate_hz: 1.0

/control/drop_zone_maneuver_controller:
  ros__parameters:
    # =========================================================================
    # 1. TOPICS
    # =========================================================================
    command_topic: "/control/cmd_vel_raw"
    vehicle_pose_topic: "/localization/pose"
    # HH_260721 - Distinguish charger departure from ordinary drop-zone departure.
    platform_status_topic: "/platform/status"
    planning_state_topic: "/planning/state_machine/state"
    # HH_260720 - Drop-zone control consumes the generated lanelet pose directly.
    lanelet_pose_topic: "/planning/lanelet_pose"
    drop_zone_goal_topic: "/planning/drop_zone_goal_raw"
    # HH_260904 - Preserve the exact perpendicular centerline projection used
    # by Nav2; GOAL_REACHED itself permits a positional tolerance.
    parking_approach_goal_topic: "/planning/goal_pose_snapped"
    # HH_260720 - ALIGN_FOR_PARKING/EXIT/CANCEL use one generated operation topic.
    operation_topic: "/control/drop_zone_maneuver_controller/operation"
    exit_complete_topic: "/control/drop_zone/exit_complete"
    status_topic: "/control/drop_zone_maneuver_controller/status"
    exit_path_topic: "/control/drop_zone_maneuver_controller/exit_path_ros"
    parking_approach_path_topic: "/control/drop_zone_maneuver_controller/parking_approach_path_ros"
    # HH_260720 - Start whichever parking method is selected by the control launch.
    parking_operation_topic: "/parking/operation"
    diagnostics_topic: "/system/diagnostics"
    # HH_260721 - Publish drop-zone departure/parking progress on the shared service topic.
    service_state_topic: "/service/state"

    # =========================================================================
    # 2. STATION AND ALIGNMENT SETUP
    # =========================================================================
    drop_zones_yaml: ""
    drop_zone_id: "drop_zone"
    use_drop_zone_pose_as_station: true
    station_x_m: 0.0
    station_y_m: 0.0
    station_yaw_deg: 0.0
    enable_auto_alignment: true
    return_scenario_id: 2
    return_mission_key: "drop_zone"
    # HH_260720 - The map yaw points from the lanelet snap pose into the drop-zone station.
    station_yaw_represents_reverse_axis: true
    automatically_select_reverse_approach_yaw: false

    # =========================================================================
    # 3. EXIT AND YAW-ALIGNMENT TUNING
    # =========================================================================
    # HH_260720 - Preserve the previous drop-zone yaw-alignment tuning.
    yaw_tolerance_deg: 5.0
    yaw_proportional_gain: 1.2
    maximum_angular_speed_radps: 0.35
    # HH_260810 - Keep the platform stationary before reverse-parking handoff.
    yaw_settle_hold_s: 1.0
    yaw_settle_max_rate_degps: 3.0
    # HH_260904 - Automatic return must first settle within 5 cm of the exact
    # snapped lanelet point. The final gate applies its 0.5 speed scale, so the
    # 0.20 m/s raw cap reaches the platform as at most 0.10 m/s (0.36 km/h).
    require_exact_parking_approach_for_auto: true
    parking_approach_goal_max_station_distance_m: 8.0
    parking_approach_position_tolerance_m: 0.05
    parking_approach_proportional_gain: 0.8
    parking_approach_minimum_speed_mps: 0.06
    parking_approach_maximum_speed_mps: 0.20
    parking_approach_maximum_correction_m: 0.75
    parking_approach_settle_hold_s: 0.5
    parking_approach_timeout_s: 12.0
    # HH_260819 - Production departure ends at one fresh lanelet snap captured
    # at EXIT start. Never declare an off-lane fixed-distance exit successful.
    require_lanelet_exit_target: true
    allow_fixed_distance_fallback: false
    exit_target_min_distance_m: 0.3
    exit_target_max_distance_m: 8.0
    exit_target_min_forward_m: 0.1
    exit_target_max_lateral_m: 1.0
    exit_position_tolerance_m: 0.20
    # Maintenance-only fallback distance; inactive with production policy above.
    exit_distance_m: 1.2
    # HH_260807 - Preserve 40% of the cruise reference: 0.80 km/h final.
    exit_speed_mps: 0.444444
    exit_timeout_s: 30.0

    # =========================================================================
    # 4. TIMING AND RATES
    # =========================================================================
    pose_timeout_s: 2.0
    # Production poses must carry a fresh source stamp. Simulation-only
    # profiles may explicitly opt into receipt-time fallback.
    allow_unstamped_pose_fallback: false
    control_rate_hz: 10.0
    idle_rate_hz: 1.0
    status_rate_hz: 1.0

/control/route_safety_recovery_controller:
  ros__parameters:
    # =========================================================================
    # 1. TOPICS
    # =========================================================================
    gate_status_topic: "/control/cmd_vel_safety_gate/status"
    candidate_topic: "/control/route_safety_recovery/candidate"
    pose_topic: "/localization/pose"
    command_topic: "/control/cmd_vel_raw"
    status_topic: "/control/route_safety_recovery_controller/status"

    # =========================================================================
    # 2. BOUNDED AUTOMATIC ESCAPE
    # =========================================================================
    # HH_260805 / TODOLIST 12 - The safety gate checks every 0.25 m projected
    # full-footprint crab/reverse/reverse-yaw stage and all dynamic sources.
    enabled: true
    maximum_speed_mps: 0.10
    maximum_angular_speed_radps: 0.10
    maximum_yaw_change_deg: 12.0
    maximum_distance_m: 0.40
    # HH_260803 - The safety gate halves raw recovery speed to 0.05 m/s;
    # allow enough time to reach the independent 0.40 m displacement limit.
    maximum_duration_s: 10.0
    # HH_260818 - Restart a bounded projected attempt instead of latching after
    # the first 10 s/0.40 m stage. Every command still traverses the final gate;
    # the complete episode remains capped at 1.50 m and 90 s.
    maximum_attempts: 50
    retry_pause_s: 0.5
    maximum_total_distance_m: 1.50
    maximum_total_duration_s: 90.0
    pose_timeout_s: 0.5
    candidate_timeout_s: 0.75
    status_timeout_s: 1.0
    control_rate_hz: 10.0
